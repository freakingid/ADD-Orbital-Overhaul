  ],

  byId: {},
  // Cumulative counters that survive across games (persisted). Incremented at each event's site.
  lifetime: {
    delivered: 0, deliveryScore: 0, fullChains: 0,
    hunterKills: 0, saucerKills: 0, hitsSurvived: 0,
    perfectWaves: 0, playTime: 0, maxWave: 0,
    maxWaveNoPowerup: 0,            // MAX: best wave reached while powerupsPicked stayed 0 (No Powerups Needed)
    // v3.0 P8 new lifetime counters (SUM unless noted). smallSaucerKills is the all-time total (distinct
    // from the per-game game.stats.smallSaucerKills that Small Ball reads). The four *Events/*Games are
    // per-EVENT / once-per-game tallies for the new event achievements (FORK A-fork-1: per-event).
    smallSaucerKills: 0,           // SUM: small saucers destroyed, all-time (Sharpshooter)
    bestDeliveredGame: 0,          // MAX: most canisters delivered in one game (Salvage King)
    bestDebrisGame: 0,             // MAX: most Debris destroyed in one game (Field Sweeper)
    heavyHaulerEvents: 0,          // SUM: dock visits delivering >=12 canisters (Freight Baron, per-EVENT)
    pacifistTowEvents: 0,          // SUM: hauls whose no-fire delivery streak reached 5 (Zen Master, per-EVENT)
    glassCannonGames: 0,           // SUM: games reaching wave 5 with no Health picked (Daredevil, once/game)
    shieldSurferGames: 0           // SUM: games with 10+ shield deflects (Wave Rider, once/game)
  },
  weekKey: "",                    // "isoYear-isoWeek" of the currently-active week
  activeIds: [],                  // the 5 weekly ids active this week (a slice of WEEKLY)
  weeklyUnlocked: null,           // Set of weekly ids unlocked THIS week (reset when the week rolls over)
  lifetimeUnlocked: null,         // Set of NON-tiered lifetime ids unlocked ever
  lifetimeTiers: null,            // { tieredId: highestTierIdxReached } — the per-id tier state (v3.0 P7)
  _saveAccum: ACH_SAVE_EVERY,     // periodic-save countdown

  // --- ISO 8601 week + week-year from a Date, computed in UTC (Monday-based, no DST ambiguity). ---
  isoWeekYear(date) {
    // Move to the Thursday of this week: the ISO week-year is the year that Thursday falls in.
    const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
    const dayNum = (d.getUTCDay() + 6) % 7;               // Mon=0 … Sun=6
    d.setUTCDate(d.getUTCDate() - dayNum + 3);            // Thursday of the current week
    const isoYear = d.getUTCFullYear();
    const firstThu = new Date(Date.UTC(isoYear, 0, 4));   // Jan 4 is always in ISO week 1
    const firstDayNum = (firstThu.getUTCDay() + 6) % 7;
    firstThu.setUTCDate(firstThu.getUTCDate() - firstDayNum + 3); // Thursday of week 1
    const week = 1 + Math.round((d - firstThu) / (7 * 24 * 3600 * 1000));
    return { year: isoYear, week };
  },
  // Deterministic pool index (F9 formula): (isoYear*52 + isoWeek) mod pool size.
  poolIndex(year, week) { return ((year * 52 + week) % this.WEEKLY.length + this.WEEKLY.length) % this.WEEKLY.length; },
  weekKeyFor(date) { const { year, week } = this.isoWeekYear(date); return year + "-" + week; },
  // The 5 consecutive weekly achievements active for a given date, wrapping around the pool.
  selectWeekly(date) {
    const { year, week } = this.isoWeekYear(date);
    const idx = this.poolIndex(year, week);
    const out = [];
    for (let i = 0; i < ACH_WEEKLY_SHOWN; i++) out.push(this.WEEKLY[(idx + i) % this.WEEKLY.length]);
    return out;
  },
  activeWeekly() { return this.activeIds.map(id => this.byId[id]); },

  isUnlocked(ach) {
    return ach.pool === "weekly" ? this.weeklyUnlocked.has(ach.id) : this.lifetimeUnlocked.has(ach.id);
  },
  // Fraction complete (for the viewer's progress readout), clamped to [0,1].
  fraction(ach) { return Math.max(0, Math.min(1, ach.cur(game.stats, this.lifetime) / ach.goal)); },
  // "cur/goal" progress label (or a per-achievement custom formatter for e.g. play time).
  progressText(ach) {
    if (ach.text) return ach.text(game.stats, this.lifetime);
    const cur = Math.min(Math.floor(ach.cur(game.stats, this.lifetime)), ach.goal);
    return cur + "/" + ach.goal;
  },

  // --- Tiered helpers (v3.0 P7) ---
  // Highest tier index reached for a tiered id (-1 = not even bronze yet).
  tierIndex(ach) { return (ach.id in this.lifetimeTiers) ? this.lifetimeTiers[ach.id] : -1; },
  // The viewer's one-line status for a tiered row: badge + progress to the NEXT tier, e.g.
  // "Gold · 12,431 → 25,000"; "Diamond ✓ MAX" once the top tier is reached; "— · 431 → 1,000" pre-bronze.
  tierStatusText(ach) {
    const val = Math.floor(ach.cur(game.stats, this.lifetime));
    const idx = this.tierIndex(ach);
    const badge = idx < 0 ? "—" : TIER_NAMES[idx];
    if (idx >= ach.tiers.length - 1) return badge + " ✓ MAX";
    return badge + " · " + fmtCommas(val) + " → " + fmtCommas(ach.tiers[idx + 1]);
  },

  // Check every currently-relevant achievement; unlock any whose predicate has newly become true.
  // Safe to call every frame — already-unlocked ones short-circuit.
  evaluate() {
    const s = game.stats, l = this.lifetime;
    // Non-tiered single-goal path (weekly + non-tiered lifetime): unlock once at cur >= goal.
    const checkSingle = (ach, set) => {
      if (set.has(ach.id)) return;
      if (ach.cur(s, l) >= ach.goal) { set.add(ach.id); this.onUnlock(ach); }
    };
    for (const ach of this.activeWeekly()) checkSingle(ach, this.weeklyUnlocked);
    for (const ach of this.LIFETIME) {
      if (!ach.tiers) { checkSingle(ach, this.lifetimeUnlocked); continue; }
      // Tiered path: unlock EVERY newly-crossed tier this pass, ascending (a big jump can cross
      // several at once -> several toasts, bronze-first). Tiers ascend, so the loop stops at the
      // first not-yet-met tier. Persist the highest tier index reached per id.
      const val = ach.cur(s, l);
      let reached = this.tierIndex(ach);
      for (let ti = reached + 1; ti < ach.tiers.length && val >= ach.tiers[ti]; ti++) {
        this.lifetimeTiers[ach.id] = ti;
        this.onUnlock(ach, ti);
      }
    }
  },
  // Silently bring the tier state + non-tiered lifetime unlocks up to what the loaded counters
  // already justify — NO toasts. Called once after load so a returning player's badges are correct
  // without a fanfare storm for progress earned in past sessions; evaluate() then only toasts NEW
  // crossings this session. Idempotent and monotonic (only ever advances a tier, never lowers one).
  deriveLifetime() {
    const s = game.stats, l = this.lifetime;
    for (const ach of this.LIFETIME) {
      if (ach.tiers) {
        const val = ach.cur(s, l);
        let idx = this.tierIndex(ach);
        for (let ti = idx + 1; ti < ach.tiers.length && val >= ach.tiers[ti]; ti++) idx = ti;
        if (idx >= 0) this.lifetimeTiers[ach.id] = idx;
      } else if (ach.cur(s, l) >= ach.goal) {
        this.lifetimeUnlocked.add(ach.id);
      }
    }
  },
  // Unlock notification. A tiered unlock passes its tier index so the toast names the tier
  // ("Recycling Magnate — Gold"); a single-goal unlock omits it. Observe-only: never mutates state.
  onUnlock(ach, tierIdx) {
    const label = (tierIdx === undefined) ? ach.name : ach.name + " — " + TIER_NAMES[tierIdx];
    game.toasts.push({ name: label, life: ACH_TOAST_TIME });
    game.pendingAch.push({ id: ach.id, name: ach.name, desc: ach.desc, tierIdx, pool: ach.pool });
    AudioSys.achievement();
    this.save(); // persist the moment something is earned, so an unlock is never lost
  },

  // Accumulate play time and periodically flush lifetime progress (bounded storage writes).
  tick(dt) {
    this.lifetime.playTime += dt;
    this._saveAccum -= dt;
    if (this._saveAccum <= 0) { this._saveAccum = ACH_SAVE_EVERY; this.save(); }
  },

  // --- Persistence (own key; same guarded pattern as settings — never crash on storage failure). ---
  // CS024 P6d: the ONE choke point for both "the achievement unlock commit" and "the lifetime-stats
  // save" (onUnlock, tick's periodic flush, killShip and the abandon path all funnel through here) —
  // gating it once suppresses every write a debug run (game.debugRun) could otherwise leave behind.
  // In-memory state (lifetime counters, tier progress, toasts) is untouched: only the write is skipped.
  // CS032 P2 (spec §2.7, FORK-F): game.resumedRun ORs in here and changes nothing else. A run that ever
  // loaded a save is barred from persisting achievement or lifetime state for the rest of that run, for
  // the same reason a debug run is, and through this same one choke point — which is exactly why the
  // flag needed no new architecture. Toasts and in-memory unlocks still fire, as they already do on a
  // debug run (a pre-existing, accepted quirk this phase does not change).
  save() {
    if (game.debugRun || game.resumedRun) return;
    const ls = storageOK(); if (!ls) return;
    try {
      const data = {
        lifetime: { ...this.lifetime },
        lifetimeTiers: { ...this.lifetimeTiers },        // { tieredId: highestTierIdx }
        lifetimeUnlocked: [...this.lifetimeUnlocked],     // non-tiered lifetime ids
        weekly: { key: this.weekKey, unlocked: [...this.weeklyUnlocked] }
      };
      ls.setItem(Profiles.keyFor(this.STORAGE_KEY), JSON.stringify(data));   // CS031 P1: per-profile
    } catch (e) { /* quota / privacy mode / disabled — ignore */ }
  },
  // Copy persisted lifetime COUNTERS over the defaults (only known numeric keys — unknown keys and
  // non-numbers ignored). Shared by the v2 load and the v1 migration; both carry raw counters intact.
  loadCounters(data) {
    if (data && data.lifetime) for (const k in this.lifetime)
      if (typeof data.lifetime[k] === "number") this.lifetime[k] = data.lifetime[k];
  },
  // Initialise at startup (or, in tests, with an explicit `now`). Loads persisted state, then sets
  // the active weekly slice for the current calendar week; if the stored week differs from the
  // current one, weekly unlocks reset (fresh challenges) while lifetime progress is retained.
  init(now = new Date()) {
    for (const a of this.WEEKLY)   { a.pool = "weekly";   this.byId[a.id] = a; }
    for (const a of this.LIFETIME) { a.pool = "lifetime"; this.byId[a.id] = a; }
    this.weekKey = this.weekKeyFor(now);
    this.activeIds = this.selectWeekly(now).map(a => a.id);
    this.lifetimeUnlocked = new Set();
    this.weeklyUnlocked = new Set();
    this.lifetimeTiers = {};
    const ls = storageOK();
    if (ls) {
      try {
        const raw = ls.getItem(Profiles.keyFor(this.STORAGE_KEY));   // CS031 P1: per-profile
        if (raw) {
          // --- v2 load: counters + tier state + non-tiered unlocks + (same-week) weekly unlocks ---
          const data = JSON.parse(raw);
          this.loadCounters(data);
          if (data.lifetimeTiers && typeof data.lifetimeTiers === "object")
            for (const id in data.lifetimeTiers) {
              const a = this.byId[id];
              if (a && a.tiers && typeof data.lifetimeTiers[id] === "number")
                // clamp to a valid tier index in case a ladder shrank between builds
                this.lifetimeTiers[id] = Math.max(0, Math.min(a.tiers.length - 1, data.lifetimeTiers[id]));
            }
          if (Array.isArray(data.lifetimeUnlocked))
            for (const id of data.lifetimeUnlocked) if (this.byId[id]) this.lifetimeUnlocked.add(id);
          // Weekly unlocks only carry over within the same calendar week.
          if (data.weekly && data.weekly.key === this.weekKey && Array.isArray(data.weekly.unlocked))
            for (const id of data.weekly.unlocked) if (this.byId[id]) this.weeklyUnlocked.add(id);
        } else {
          // --- Migration (FLAG A-2 / A-2-a): no v2 save yet. If an old v1 save exists, keep its raw
          // lifetime COUNTERS and let tiers + non-tiered unlocks re-derive below. The old v1 unlock
          // SETS (flat lifetime/weekly ids) are intentionally ignored — badges recompute from the
          // counters; the returning player's current-week weekly unlocks may reset once. ---
          // ⛔ CS031 P1 — GATED TO THE LEGACY PROFILE. `afd_achievements_v1` is a MACHINE-WIDE
          // pre-profile blob and is never suffixed. Under per-profile keys "no v2 save yet" is true
          // for EVERY newly created profile, so an ungated fallback hands each new profile the
          // machine's old counters — a returning player's lifetime progress silently cloned onto a
          // stranger. Only p0, whose stores ARE the frozen keys, may claim it. This is invisible on a
          // clean machine; scratchpad/test-cs031-p1.js §E is what keeps it fixed.
          if (Profiles.activeId === PROFILE_LEGACY) {
            const legacy = ls.getItem(this.LEGACY_KEY);
            if (legacy) this.loadCounters(JSON.parse(legacy));
          }
        }
      } catch (e) { /* corrupt / unreadable — start fresh, don't crash */ }
    }
    // Seed tier badges + non-tiered lifetime unlocks silently from whatever counters loaded, so a
    // returning/migrated player sees correct badges immediately and evaluate() only toasts NEW gains.
    this.deriveLifetime();
  }
};

// ---------- High Scores (v3.6 P6) ----------
// Local top-10 table, its own localStorage key. The two other keys — settings' STORAGE_KEY
// ("afd_settings_v1") and Achievements.STORAGE_KEY ("afd_achievements_v2") — are FROZEN and this
// system never reads or writes either; it reuses only the shared guarded storageOK() helper. Each
// record is a WIRE shape a future remote leaderboard can accept verbatim, no migration: `id` is a
// stable client-generated dedupe key, `v` versions the record independently of the store's own `v`,
// and a `playerId`/`name` field is purely additive whenever login lands. Add fields later; never
// rename or repurpose one.
const HighScores = {
  STORAGE_KEY: "afd_scores_v1",
  entries: [],

  // Unique id for a fresh record — the future sync dedupe key. crypto.randomUUID isn't guaranteed
  // (older browsers, non-secure origins), so fall back to a random hex string.
  makeId() {
    if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
    return Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2);
  },
  // Would `score` earn a table slot? entries is kept sorted score-desc and capped at SCORES_MAX, so
  // entries[SCORES_MAX-1] is always the current cutoff once the table is full.
  qualifies(score) {
    if (score <= 0) return false;
    return this.entries.length < SCORES_MAX || score > this.entries[SCORES_MAX - 1].score;
  },
  // Build + insert the wire-shape record for a just-committed run, then persist. Returns the record
  // so the caller can remember its id (the gameover table's fresh-entry highlight).
  add({ initials, score, wave, delivered }) {
    // CS031 P1 (FORK-B a): the table stays ONE shared machine-wide store — `afd_scores_v1` is NOT
    // routed through Profiles.keyFor(). The two stamps below are purely ADDITIVE, exactly the future
    // playerId/name fields this module's header already reserves: append, never rename or repurpose.
    const rec = { v: 1, id: this.makeId(), initials, score, wave, delivered, ts: Date.now(), build: GAME_VERSION,
      profileId: Profiles.activeId, profileName: Profiles.nameOf(Profiles.activeId) };
    this.entries.push(rec);
    this.entries.sort((a, b) => b.score - a.score);
    this.entries.length = Math.min(this.entries.length, SCORES_MAX);
    this.save();
    return rec;
  },

  // --- Persistence (own key; same guarded pattern as Settings/Achievements — never crash on storage
  // failure). ---
  save() {
    const ls = storageOK(); if (!ls) return;
    try { ls.setItem(this.STORAGE_KEY, JSON.stringify({ v: 1, entries: this.entries })); }
    catch (e) { /* quota / privacy mode / disabled — ignore */ }
  },
  load() {
    const ls = storageOK(); if (!ls) return;
    try {
      const raw = ls.getItem(this.STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.entries)) {
        this.entries = data.entries.filter(r => r && typeof r.score === "number" && typeof r.initials === "string");
        this.entries.sort((a, b) => b.score - a.score);
        this.entries.length = Math.min(this.entries.length, SCORES_MAX);
      }
    } catch (e) { /* corrupt / unreadable — start fresh, don't crash */ }
  }
};
HighScores.load();

// Shared dispatcher for BOTH input paths (keyboard's normal branch + gamepad's edge-detected nav)
// driving the initials entry live on "gameover" (game.entry). Deliberately not routed through
// menuInput/menuActive — this isn't a paused menu screen, the field keeps rendering behind it.
function entryInput(action) {
  const e = game.entry;
  if (!e) return;
  if (action === "left")       { e.idx = (e.idx + 2) % 3; AudioSys.ui(false); }
  else if (action === "right") { e.idx = (e.idx + 1) % 3; AudioSys.ui(false); }
  else if (action === "up")    { e.initials[e.idx] = (e.initials[e.idx] + 1) % SCORES_CHARSET.length; AudioSys.ui(false); }
  else if (action === "down")  { e.initials[e.idx] = (e.initials[e.idx] + SCORES_CHARSET.length - 1) % SCORES_CHARSET.length; AudioSys.ui(false); }
  else if (action === "confirm") commitEntry();
}
// Turn the entry's charset indices into the 3-letter record and hand it to HighScores, then clear
// game.entry so the gameover screen falls through to the (now highlighted) table.
function commitEntry() {
  const e = game.entry;
  const initials = e.initials.map(i => SCORES_CHARSET[i]).join("");
  const rec = HighScores.add({ initials, score: game.score, wave: game.wave, delivered: game.stats.delivered });
  game.lastScoreId = rec.id;
  game.entry = null;
  AudioSys.ui(true);
}

// Count of the four drop-powerup types used this game (Powered Up).
function powerTypesUsed(s) {
  return (s.powerUsed.rapid ? 1 : 0) + (s.powerUsed.triple ? 1 : 0) +
         (s.powerUsed.magnet ? 1 : 0) + (s.powerUsed.engine ? 1 : 0);
}

// Apply an unshielded hit: subtract HP, knock the ship away from the hazard, and
// open a hit-stun i-frame window. Self-guarding — shielded, already-stunned, or dead
// hits are ignored, so only one hit lands per stun window even with several overlapping
// hazards in a frame. Lethal damage routes to killShip (game over). Returns whether
// damage was actually applied.
function damageShip(amount, srcX, srcY) {
  const s = game.ship;
  // CS012 P5 auto-shield: a reactive last-resort save at critical hull. When enabled and the hull is at/below
  // the low-health threshold, an incoming hit spends SHIELD_HIT_COST energy to raise the shield and eat the hit
  // for 0 HP instead of taking damage. The knockback+stun below are the SAME as a real hit — the i-frame is the
  // rate-limiter that caps this to ~one save per HIT_STUN_DURATION (same-frame repeats hit the shieldOn early-return
  // just below), and energy recharge (0.12/s) < cost (0.22/save) means it self-exhausts after ~4-5 saves. Guarded by
  // the same conditions the early-return checks so it never fires on a dead/shielded/i-framed ship.
  if (settings.autoShield && !s.dead && !s.shieldOn && s.invuln <= 0 && s.hp <= LOW_HP_THRESHOLD
      && s.energy >= SHIELD_HIT_COST) {
    s.energy = Math.max(0, s.energy - SHIELD_HIT_COST);
    // Knockback away from the hazard — copied verbatim from the real-hit body below so an auto-save shoves clear identically.
    const [kdx, kdy] = shortDelta(srcX, srcY, s.x, s.y); // vector from hazard to ship = away
    const kd = Math.hypot(kdx, kdy);
    const ka = kd > 0.001 ? Math.atan2(kdy, kdx) : rand(0, TAU);
    s.vx = Math.cos(ka) * KNOCKBACK_SPEED;
    s.vy = Math.sin(ka) * KNOCKBACK_SPEED;
    s.invuln = HIT_STUN_DURATION;
    s.autoShieldRegenLock = DEBUG.autoShieldRegenPause; // CS015 P4: now tunable live from the Debug panel (default = AUTO_SHIELD_REGEN_PAUSE)
    s.shieldOn = true;
    // Penalty BYPASSES addScore by design (FLAG-4e / CLAUDE.md scoring exception): auto-save must NOT touch
    // game.nextRepair, so it can never trip the HP-repair milestone. Clamp the score at 0.
    game.score = Math.max(0, game.score - AUTO_SHIELD_SCORE_PENALTY);
    game.floaters.push(new FloatText("-" + AUTO_SHIELD_SCORE_PENALTY, s.x, s.y, COLOR.lowhp));
    return false; // 0 HP dealt — same contract as the shielded early-return
  }
  if (s.dead || s.shieldOn || s.invuln > 0) return false;
  s.hp -= amount;
  if (s.hp <= 0) {
    s.hp = 0;
    killShip();
    return true;
  }
  // Knockback: shove directly away from the hazard so the ship physically separates
  // instead of sitting inside it racking up damage. Set (not add) velocity so a hit
  // always pushes the ship clear regardless of its current momentum.
  const [dx, dy] = shortDelta(srcX, srcY, s.x, s.y); // vector from hazard to ship = away
  const d = Math.hypot(dx, dy);
  const a = d > 0.001 ? Math.atan2(dy, dx) : rand(0, TAU);
  s.vx = Math.cos(a) * KNOCKBACK_SPEED;
  s.vy = Math.sin(a) * KNOCKBACK_SPEED;
  s.invuln = HIT_STUN_DURATION;
  // Achievement stats (F9): a survived hit. Per-wave damage gates the perfect-wave achievements
  // (No Scratches / Perfect Wave); cumulative survived hits -> Iron Hull; dropping below 50% HP
  // ends "Untouchable"'s eligibility for this game.
  game.stats.dmgThisWave++;
  Achievements.lifetime.hitsSurvived++;
  if (s.hp < SHIP_MAX_HP * 0.5) game.stats.everBelowHalf = true;
  for (let i = 0; i < 6; i++) game.particles.push(new Particle(s.x, s.y, "#ff9060"));
  AudioSys.hit();
  // Scoop decays by DAMAGE, not time (v3.3 P3): every SCOOP_HITS_PER_LEVEL non-lethal hits costs one
  // scoop level. scoopHits is a running tally — it is NOT reset by a scoop pickup (FORK-3: no), only
  // when a level is actually lost, and it doesn't accumulate at level 0 (hits there are harmless).
  // A shielded / i-frame hit early-returned above, so it never reaches here.
  if (game.scoopLevel > 0) {
    game.scoopHits++;
    if (game.scoopHits >= DEBUG.scoopHitsPerLevel) {
      game.scoopLevel = Math.max(0, game.scoopLevel - 1);
      game.scoopHits = 0;
      game.floaters.push(new FloatText("SCOOP -1", s.x, s.y - 22, POWERUP_COLOR.scoop));
      AudioSys.scooploss();
      VoiceSys.say("expire_scoop"); // CS010 P9: scoop decays by DAMAGE, not time — Dan reports it here
    }
  }
  return true;
}

function killShip() { // hull destroyed (0 HP): a true, permanent game over — no respawn (F2)
  if (game.ship.dead) return;
  game.ship.dead = true;
  AudioSys.thrust(false);
  AudioSys.lowhp(false); game.lowHpSiren = false;
  game.hpReliefFlash = 0; // CS010 P3: death is not relief — never arm/leave a "you're okay now" exhale on the frame the ship dies
  boom(game.ship.x, game.ship.y, 3, COLOR.ship);
  scatterChain();
  // v3.6 P5: enter the "dying" spectacle instead of freezing straight to "gameover" — updateDeath()
  // keeps the field alive for DEATH_DURATION, then flips state to "gameover". Only this state
  // assignment changed; the boom/scatter/audio teardowns above and the achievement flush below all
  // stay HERE so achievement timing is byte-identical to before.
  game.state = "dying";
  game.deathT = DEATH_DURATION;
  game.shake = DEATH_SHAKE_INIT;
  AudioSys.saucer(false);
  // Achievements (F9): a game just ended — flag it so end-of-game checks (Waste Not) can fire,
  // run a final evaluation, and flush lifetime progress to storage.
  game.stats.gameEnded = true;
  // Daredevil / Wave Rider (lifetime, once-per-game — FLAG A-12-a: these conditions are inherently
  // once-per-game, so per-event ≡ per-game). Read the same per-game state the weekly Glass Cannon /
  // Shield Surfer read, from their monotonic counters, so this can only tally a genuine event.
  if (game.wave >= 5 && game.stats.healthPicked === 0) Achievements.lifetime.glassCannonGames++;
  if (game.stats.deflects >= 10) Achievements.lifetime.shieldSurferGames++;
  Achievements.evaluate();
  Achievements.save();
}

// Shield deflection: bounce object away from ship, cost energy
function shieldDeflect(obj) {
  const a = angleTo(game.ship, obj);
  const sp = Math.hypot(obj.vx, obj.vy) || 80;
  obj.vx = Math.cos(a) * sp * 1.1;
  obj.vy = Math.sin(a) * sp * 1.1;
  if (obj.heading !== undefined) obj.heading = a;
  // push out of overlap
  obj.x = game.ship.x + Math.cos(a) * (SHIELD_RADIUS + obj.radius + 2);
  obj.y = game.ship.y + Math.sin(a) * (SHIELD_RADIUS + obj.radius + 2);
  game.ship.energy = Math.max(0, game.ship.energy - SHIELD_HIT_COST);
  game.stats.deflects++;   // Shield Surfer (F9): a hazard bounced off the shield
  AudioSys.shieldPing();
}

// CS021 P1b: shieldDeflect's MIRROR IMAGE, for a hazard that cannot be pushed. Everything shieldDeflect
// does to the hazard, this does to the SHIP — separate to just outside contact, take the velocity
// change, pay the same SHIELD_HIT_COST, count the same deflect, make the same sound. The hazard is left
// COMPLETELY untouched: an orbiting satellite stays on its rail, which is the whole point of the orbit
// archetype (FORK-CS021-C2 keeps rings intact; knocking one off its rail would be a different game).
//
// The reflection is done in the HAZARD'S OWN FRAME, not the world frame, which is what makes the fast
// ring feel different from the slow ones: subtract the satellite's tangential velocity, reflect the
// APPROACHING part of what's left, then add the satellite's velocity back. Sweep into a satellite
// travelling the other way and you leave much faster than you arrived; ride alongside one and barely
// anything happens. Only the approaching component is reflected — a ship already moving away is not
// yanked backwards.
//
// The FLOOR is applied last and is not optional (see SHIELD_BOUNCE_MIN): reflection alone leaves a
// stationary ship stationary, and a stationary ship in contact is exactly the case this whole function
// exists to fix.
function shieldBounce(obj) {
  // Outward contact normal, hazard -> ship. angleTo is wrap-aware; a ship exactly on the hazard's
  // centre yields atan2(0,0) === 0, i.e. a defined direction rather than a NaN.
  const a  = angleTo(obj, game.ship);
  const nx = Math.cos(a), ny = Math.sin(a);
  // Relative velocity, in the hazard's frame.
  let ux = game.ship.vx - obj.vx, uy = game.ship.vy - obj.vy;
  const un = ux * nx + uy * ny;
  if (un < 0) {                                   // approaching: reflect that component
    ux -= (1 + SHIELD_BOUNCE_RESTITUTION) * un * nx;
    uy -= (1 + SHIELD_BOUNCE_RESTITUTION) * un * ny;
  }
  game.ship.vx = ux + obj.vx;
  game.ship.vy = uy + obj.vy;
  // Guarantee real separation, so one contact costs ONE deflect instead of one per frame.
  const outward = game.ship.vx * nx + game.ship.vy * ny;
  if (outward < SHIELD_BOUNCE_MIN) {
    game.ship.vx += (SHIELD_BOUNCE_MIN - outward) * nx;
    game.ship.vy += (SHIELD_BOUNCE_MIN - outward) * ny;
  }
  // Push the SHIP out of overlap — the mirror of shieldDeflect's own separation step. wrap() is the
  // same helper Ship.update() ends on, so a bounce across the world seam lands the ship exactly where
  // an ordinary crossing would; the tow chain's solver is wrap-aware and needs nothing special.
  game.ship.x = obj.x + nx * (SHIELD_RADIUS + obj.radius + 2);
  game.ship.y = obj.y + ny * (SHIELD_RADIUS + obj.radius + 2);
  wrap(game.ship);
  game.ship.energy = Math.max(0, game.ship.energy - SHIELD_HIT_COST);
  game.stats.deflects++;   // Shield Surfer (F9): same event, same counter, as a deflect
  AudioSys.shieldPing();
}

// CS023 P2 (spec §1.2/§4.4, FORK-CS023-D): shieldBounce's SIBLING, for two SATELLITES rather than a
// satellite and the ship. Same three-step shape and the same three load-bearing properties.
//
// CS024 P1 (spec §4.1, consequence 1): THIS SIMPLIFIED, IT DID NOT MERELY LOSE A BRANCH. CS023 shipped a
// THREE-case dispatch keyed on `!!x.orbitCenter || x instanceof Saucer` — free/free, free/rail and a
// rail/rail NO-OP (Correction C11). With the rails gone `x.orbitCenter` is undefined on every satellite
// in the game, so the predicate REDUCES TO THE SAUCER TEST ALONE and the FIXED/FIXED arm is
// UNREACHABLE AT BOTH CALL SITES: the debris-vs-debris pair walk passes two DebrisSatellites (neither
// fixed) and the UFO-vs-debris pass passes exactly one Saucer as `b` (never two). A branch that can only
// be entered by two Saucers colliding, when nothing ever calls this with two Saucers, is dead code — so
// it is DELETED rather than left standing as a guard.
//
// THE TWO SURVIVING BRANCHES ARE BEHAVIOURALLY BYTE-IDENTICAL, and that is asserted rather than assumed
// (test-cs024-p1.js §C sweeps every size pair x an incoming-velocity grid against a reference
// implementation of the pre-edit three-branch form). Nothing inside either branch is touched:
//   * momentum is conserved exactly at the DEBRIS_MASS 9:3:1 ratios;
//   * tangential components are preserved exactly (the impulse is along the contact normal only);
//   * the DEBRIS_BOUNCE_MIN floor is on the RELATIVE separation speed, applied as equal-and-opposite
//     impulses, so it cannot break momentum the way a per-body world-frame version would;
//   * the overlap push is split in INVERSE proportion to mass, so the heavier body moves less.
// The reduction is in the DISPATCH, not the physics.
//
//   free / free   — a mass-weighted elastic exchange along the contact normal (DEBRIS_MASS, restitution
//                   DEBRIS_BOUNCE_RESTITUTION). Momentum is conserved exactly; at restitution 1.0 so is
//                   kinetic energy, until the floor pays for the contact it exists to end. This is now
//                   the ONLY branch the debris-vs-debris pair walk can ever take.
//   free / saucer — shieldBounce's EXACT shape with the free satellite in the ship's role: reflect its
//                   approaching component IN THE SAUCER'S FRAME, apply the floor, push it out of overlap,
//                   wrap() it. The saucer is left COMPLETELY untouched. It is treated as an immovable
//                   wall (CS023 P3, Paul's resolution) for two reasons that both still hold: it has no
//                   `size`, so DEBRIS_MASS[undefined] would NaN the free/free branch, and it is already
//                   `dead` by the time this runs (destroySaucer(s, false) fires first), so only the
//                   satellite's resulting motion is real.
//
// THE THREE PROPERTIES CARRIED OVER FROM shieldBounce VERBATIM, and why each is load-bearing here too:
//   1. ONLY THE APPROACHING COMPONENT IS REFLECTED. A body already separating is never yanked
//      backwards — without that, a pair that has just been resolved is re-reflected on the next frame
//      and oscillates in contact instead of leaving.
//   2. THE SEPARATION FLOOR IS APPLIED LAST AND IS NOT OPTIONAL. Reflection alone leaves two touching
//      STATIONARY bodies touching, which is exactly the case this exists to fix — see DEBRIS_BOUNCE_MIN.
//   3. EVERY MEASUREMENT IS WRAP-AWARE — angleTo for the normal, dist2 for the distance, wrap() after
//      the push. A pair sitting on exactly the same point yields atan2(0,0) === 0, i.e. a defined
//      direction rather than a NaN — shieldBounce's own documented property.
//
// TWO THINGS shieldBounce NEVER HAS TO ANSWER AND THIS DOES. Both are DERIVED from the mass-weighted
// rule rather than chosen, because with two movable bodies shieldBounce's own form is not even defined:
//   * THE FLOOR IS ON THE RELATIVE SEPARATION SPEED in the free/free case, applied as equal-and-opposite
//     impulses, so momentum survives the floor as well as the reflection. shieldBounce puts its floor on
//     the SHIP's world-frame outward component because its partner is immovable by construction — and
//     the free/SAUCER branch below keeps that world-frame form byte-for-byte, because there the partner
//     genuinely is immovable. Same situation, same arithmetic; different situation, derived arithmetic.
//   * THE OVERLAP PUSH IS SPLIT BY MASS, heavier moving less — the positional statement of the same 9:1
//     ratio. shieldBounce PLACES the ship absolutely at contact distance because the hazard cannot move,
//     and the free/SAUCER branch does exactly that, unchanged. Without a positional push a deep overlap
//     clears at DEBRIS_BOUNCE_MIN x dt = 0.67 px per frame and the pair re-bills for seconds, which is
//     the very re-billing the floor is here to prevent.
function debrisBounce(a, b) {
  // CS024 P1: CS023 P4's drift disarm (`a.drifting = b.drifting = false;`) STOOD HERE, at the very top,
  // before the dispatch — it was two of the four "direction is changed" release conditions. Removed with
  // the drift; there is no longer any per-body latch for a contact to clear.
  //
  // The dispatch is now the Saucer test alone (see the header). It stays SYMMETRIC — both operands are
  // tested and the `f`/`r` roles are selected from the result — even though every live call site passes
  // the satellite first. That is deliberate: the asymmetric form would be over-fitted to today's two
  // callers and would silently mis-handle a future debrisBounce(saucer, satellite).
  const aFixed = a instanceof Saucer, bFixed = b instanceof Saucer;

  if (aFixed !== bFixed) {
    // FREE vs FIXED — CS024 P1: the fixed body is now always a SAUCER, since the rail-borne satellite
    // that used to share this branch no longer exists. shieldBounce's exact shape, with `f` in the ship's
    // role and `r` in the hazard's. Everything below writes to `f`; `r` is never read for anything but
    // its own state. The arithmetic is unchanged — only what can reach it narrowed.
    const f = aFixed ? b : a, r = aFixed ? a : b;
    const ang = angleTo(r, f);                      // outward contact normal, saucer -> free (wrap-aware)
    const nx = Math.cos(ang), ny = Math.sin(ang);
    let ux = f.vx - r.vx, uy = f.vy - r.vy;         // relative velocity, in the SAUCER'S frame
    const un = ux * nx + uy * ny;
    if (un < 0) {                                   // approaching: reflect that component
      // CS023 P4: the live knob, not the constant — DEBUG.debrisBounceRestitution seeds from
      // DEBRIS_BOUNCE_RESTITUTION, so this is byte-identical until the slider is moved.
      ux -= (1 + DEBUG.debrisBounceRestitution) * un * nx;
      uy -= (1 + DEBUG.debrisBounceRestitution) * un * ny;
    }
    f.vx = ux + r.vx;
    f.vy = uy + r.vy;
    const outward = f.vx * nx + f.vy * ny;          // the floor, last and not optional
    if (outward < DEBRIS_BOUNCE_MIN) {
      f.vx += (DEBRIS_BOUNCE_MIN - outward) * nx;
      f.vy += (DEBRIS_BOUNCE_MIN - outward) * ny;
    }
    // Push the FREE body out of overlap. The 2 px is shieldBounce's own separation epsilon, carried over
    // verbatim: the pass tests against radius + radius, so landing at + 2 guarantees the next frame's
    // test fails rather than re-presenting the identical contact.
    f.x = r.x + nx * (r.radius + f.radius + 2);
    f.y = r.y + ny * (r.radius + f.radius + 2);
    wrap(f);
    return;
  }

  // FREE vs FREE — the mass-weighted elastic exchange. `n` points b -> a, i.e. outward for `a`, which is
  // shieldBounce's convention with `a` in the ship's role and `b` in the hazard's.
  const ma = DEBRIS_MASS[a.size], mb = DEBRIS_MASS[b.size];
  const invSum = 1 / ma + 1 / mb;
  const ang = angleTo(b, a);
  const nx = Math.cos(ang), ny = Math.sin(ang);
  const un = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;   // relative normal speed; negative is approaching
  if (un < 0) {
    // The standard normal impulse. Equal and opposite, so momentum is conserved for any mass pair; at
    // restitution 1.0 the kinetic energy change works out to exactly zero, and below 1.0 to exactly
    // -(1 - e^2) * un^2 / (2 * invSum), i.e. strictly negative. Reduces to "swap the normal components"
    // when the two masses are equal.
    const jn = -(1 + DEBUG.debrisBounceRestitution) * un / invSum;   // CS023 P4: the live knob (see above)
    a.vx += (jn / ma) * nx; a.vy += (jn / ma) * ny;
    b.vx -= (jn / mb) * nx; b.vy -= (jn / mb) * ny;
  }
  // The floor, last and not optional — on the RELATIVE separation speed, as another equal-and-opposite
  // impulse pair, so it cannot break momentum the way a per-body world-frame version would.
  const sep = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
  if (sep < DEBRIS_BOUNCE_MIN) {
    const jf = (DEBRIS_BOUNCE_MIN - sep) / invSum;
    a.vx += (jf / ma) * nx; a.vy += (jf / ma) * ny;
    b.vx -= (jf / mb) * nx; b.vy -= (jf / mb) * ny;
  }
  // Push out of overlap, the overlap split by mass so the heavier body moves less. Same 2 px epsilon and
  // the same reason as the saucer branch above; dist2 is wrap-aware, so a pair straddling the seam is
  // separated along the short way round rather than teleported across the world.
  const overlap = (a.radius + b.radius + 2) - Math.sqrt(dist2(a, b));
  if (overlap > 0) {
    const aShare = mb / (ma + mb);
    a.x += nx * overlap * aShare;         a.y += ny * overlap * aShare;
    b.x -= nx * overlap * (1 - aShare);   b.y -= ny * overlap * (1 - aShare);
    wrap(a); wrap(b);
  }
}

// CS024 P1 (spec §1.5/§4.1): THE CS023 P4 INWARD DRIFT STOOD HERE, IN FULL, AND IS REMOVED.
// Two functions: maxOrbitSpeed() — the speed cap, derived by scanning every ring for max(angVel x radius)
// — and updateDebrisDrift(dt), the one-per-frame pass that armed every free satellite outside the target
// radius once the shell's interior was empty and accelerated it back toward the dock. Gone with them: the
// `drifting` latch and all four of its disarm sites, and the DEBRIS_DRIFT_TRIGGER_R / _TARGET_R / _ACCEL
// constants (removed at their declaration, up in the constants block).
//
// WHY IT GOES RATHER THAN BEING RE-DERIVED. Both radii were derived from ring geometry — the trigger WAS
// ring 4's radius and the target ring 3's — and the cap was justified entirely as "nothing arrives faster
// than a satellite already moving on a rail." Neither statement has a referent once the rails are gone,
// and inventing two fresh distances plus a fresh cap would be new design, not a port. The mechanic never
// reached its playtest gate (CS023 was interrupted before P5), so nothing validated in the hands is being
// un-shipped. If "the player should not hunt a large world for the last two satellites" comes back as a
// problem, it comes back as a new design conversation, not as this code restored.

// ---------- Tow chain physics ----------
// Verlet nodes with position-based distance constraints, wrap-aware.
// The ship is the (mostly) kinematic head; nodes trail serpentine behind.
// A taut first link tugs real momentum back into the ship.

function chainAnchor() { // hitch point just behind the ship
  return {
    x: game.ship.x - Math.cos(game.ship.angle) * 12,
    y: game.ship.y - Math.sin(game.ship.angle) * 12
  };
}

// Total towed mass = Sum of node.mass (F5). All Debris-sourced canisters are mass 1.0,
// so for now this equals game.chain.length; lighter (Hunter-sourced) scrap will tow
// more easily once it exists. Drives the thrust/top-speed penalties and the momentum tug.
function chainMass() {
  const m = game.chain.reduce((sum, n) => sum + n.mass, 0);
  // Engine powerup (F6) temporarily lightens the EFFECTIVE towed mass. chainMass() is the single
  // quantity feeding thrustMul/maxSp (Ship.update) and the momentum-tug massFactor (updateChain),
  // so halving it here eases all three at once — "easier to maneuver even when towing garbage."
  // CS024 P6: the multiplier is the LIVE knob (ENGINE_MASS_MULT supplies its def and stays as the
  // documented shipped value — the standing lastStandSpeed/garbageAttractRadius idiom), and it is
  // FLAT while any fuel remains: deliberately NOT scaled by how much fuel is left (spec §3.4).
  return powerActive("engine") ? m * DEBUG.engineMassMult : m;
}

// Ship turn rate (CS010 §10b + §3): the ONE place both Ship.update turn sites read, so they can
// never diverge. Folds in the player's rotation-speed preference (settings.shipTurnScale) AND an
// optional towed-mass turn penalty (CARGO_TURN). At the shipped CARGO_TURN = 0 this is exactly
// SHIP_TURN * scale — cargo does not affect rotation, byte-identical to pre-CS010 turn × the slider.
// CARGO_TURN > 0 makes a heavy chain resist turning (the proposed "inertia" fix; see the constant).
function shipTurnRate() {
  return SHIP_TURN * settings.shipTurnScale / (1 + chainMass() * CARGO_TURN);
}

function wrapNode(n) { // wrap verlet nodes; shift prev pos too so velocity survives
  if (n.x < -60) { n.x += WORLD_W; n.px += WORLD_W; }
  if (n.x > WORLD_W + 60) { n.x -= WORLD_W; n.px -= WORLD_W; }
  if (n.y < -60) { n.y += WORLD_H; n.py += WORLD_H; }
  if (n.y > WORLD_H + 60) { n.y -= WORLD_H; n.py -= WORLD_H; }
}

// Garbage coalescence pass (v3.1 P3). Runs once per frame from update(), AFTER the garbage
// pickup/magnet loop and BEFORE updateChain(dt). O(n²) over ACTIVE pieces; every measurement is

// before it can clump. Relies on the existing end-of-frame dead-filter (no new filter).
//
// CS024 P3 — THIS IS NOW THE ONLY HUNTER PRODUCER IN THE GAME. The ambient spawner is deleted, so the
// old FORK-1 note ("coalesced Hunters are spawned independent of game.hunterTimer") is moot: there is

//      capped at GARBAGE_HARD_MAX. The visit count is n(n-1)/2 — 24,090 pairs at the soft ceiling

//     so a held 12-clump met with 5 free chain slots gives up 5 and survives at 7.

}
// THE QUEUE DRAIN (spec §5). coalesceGarbage()'s pair walk only ever touches clumps that are near each

// died and freed its slot. This is the pass that notices. Called once per frame from update()'s cleanup
// block; converts as MANY as there are slots, because one event can free several at once.
//
// ⛔ CONVERSION HERE IS A REAL BIRTH — noteLargeHunterSpawn(), game.stats.hunterCoalesced++ and
// AudioSys.hunterborn(), exactly as the coalescence branch does. The clump was owed a Hunter; the only
// thing that was ever deferred is WHEN.
//
// ⛔ IT HONOURS THE SWEEP PAUSE, AND THE PHASE PROMPT DID NOT NAME THAT — it is a deliberate call, flagged
// in STATUS.md. CS018 P9 set game.sweepPause specifically because a Super Mega Delivery turns every large
// into mediums, freeing the WHOLE ceiling at once, and fresh larges converting into the fragment swarm is
// exactly what that pause exists to prevent. A drain that ignored it would reintroduce that in a new code
// path. §5's "must be able to convert more than one in a frame" is untouched by this: the slots are still

    // OLDEST BY `age` FIRST, ties broken by array index (strict `>` keeps the earlier index). `age` never
    // resets, not even on a merge, so this is oldest in absolute terms — the same ordering principle the
    // cull uses, for the same reason: the longest-neglected salvage is what the mechanic is about.
    let v = -1;

    a.dead = true;
    noteLargeHunterSpawn();                   // FLAG-i: the 0 -> 1 rule — called BEFORE the push
    game.hunters.push(new HunterSatellite(a.x, a.y, 3));
    game.stats.hunterCoalesced++;
    AudioSys.hunterborn();

    // false for it) while pushing one live size-3 Hunter (so largeHunterCount rises by one).

function coalesceGarbage(dt) {
  const gs = game.garbage;

    const a = gs[i];

    // it cannot merge either. The pair is skipped outright, on BOTH sides. Without this a held clump
    // grows into a 40-piece blob that still converts to exactly one Hunter and wastes 28 pieces. THE
    // CONSEQUENCE IS ACCEPTED AND IS NOT A BUG: loose singles near a held clump sit there rather than
    // merging into it. They are still scoopable, still shootable, and the clump is still the thing the
    // player is meant to deal with.
    if (a.dead || a.coalesceDelay > 0 || saturatedClump(a)) continue;   // survivor must be alive, active, unsaturated
    for (let j = i + 1; j < gs.length; j++) {
      const b = gs[j];
      if (b.dead || b.coalesceDelay > 0 || saturatedClump(b)) continue; // same three conditions on the other side
      const d2 = dist2(a, b);
      if (d2 >= DEBUG.garbageAttractRadius * DEBUG.garbageAttractRadius) continue;
      const [dx, dy] = shortDelta(a.x, a.y, b.x, b.y);     // shortest vector a -> b (wrap-aware)
      if (d2 < GARBAGE_MERGE_DIST * GARBAGE_MERGE_DIST) {

        // masses), its `mass` SUMS, its `pieces` counter adds, and its `radius` derives from pieces.
        // Momentum-conserving (not the old literal vector sum) so a heavy clump barely speeds up when
        // it eats a fast light piece — a wad of junk stays sluggish. (v3.2 P3: garbage no longer decays,
        // so a merge is simply a merge — no Waste-Not bookkeeping here; that stat now tracks coalescence.)
        const ma = a.mass, mb = b.mass, mt = ma + mb;
        a.vx = (ma * a.vx + mb * b.vx) / mt;
        a.vy = (ma * a.vy + mb * b.vy) / mt;
        a.mass = mt;
        a.pieces += b.pieces;
        a.radius = 7 * Math.sqrt(a.pieces);

        // resets") and `a.bonus = a.bonus || b.bonus` (CS017 P5's marker inheritance) BOTH STOOD HERE
        // and are gone with their mechanics. NOTHING REPLACES THE FIRST ONE, and that is deliberate:
        // the survivor keeps its OWN `age`, untouched, because the cull orders by how long a piece has
        // been sitting around and a merge is not a reason to look younger. Resetting age here would be
        // the retired decay clock's rule applied to a governor that wants the opposite answer.
        b.dead = true;

          // PART AND A FUTURE SESSION WILL OTHERWISE RE-DERIVE ITS CONCLUSION. P3 wrote: CS018 P4 had a
          // saturated clump HOLD at the final coalescence stage while the cap was full — shed the
          // overflow, stay 12 pieces, wait for a slot — and that was survivable only because the clump's
          // decay clock kept running, so a held clump eventually aged out on its own. With decay deleted
          // (§1.4) a held clump would sit there forever, permanently occupying pieces the pipeline can
          // never convert and never reclaim; the pipeline stalls. So P3 destroyed the clump instead.
          //
          // ⛔ THAT STALL ARGUMENT IS NOW WRONG, AND HERE IS EXACTLY WHERE IT FAILS: it assumed a held
          // clump has no reclamation path. IT HAS TWO, AND BOTH ARE THE PLAYER'S. A held clump is still
          // garbage, so it can be SCOOPED (partially or wholly — the intake takes Math.min(room, pieces)
          // and leaves the remainder) and it can be SHATTERED with a bullet (shatterClump on any
          // pieces > 1). Neither existed in P3's model of the situation. Scooping a 12-piece clump for a
          // single large payload is the game's own thesis paying out — and is, not incidentally, the
          // removed bonus canister's role arriving emergently instead of by dice roll.
          //
          // The three arms:
          //   1. CAP HAS ROOM                       -> convert. Unchanged path, below.
          //   2. CAP FULL, fewer than heldClumpMax  -> HOLD. Do not convert, do not destroy. Nothing was
          //      born, so nothing is counted: no hunterCoalesced, no noteLargeHunterSpawn(), no
          //      hunterborn(). The clump simply stays on the board, pending, until a slot opens
          //      (drainHeldClumps) or the player takes it apart.
          //   3. CAP FULL AND heldClumpMax ALREADY HELD -> destroy, exactly as P3 does, boom() in the
          //      garbage hue, `awardScore = false` semantics. THIS IS THE ANTI-STALL BACKSTOP, and it is
          //      sized rather than absolute: GARBAGE_SOFT_MAX is 220 and a held clump is 12 pieces, so
          //      unbounded holding would let ~18 clumps consume the entire garbage budget and starve the
          //      field. heldClumpMax is what bounds them, which is also why held clumps can safely be
          //      exempted from the cull itself (see cullGarbage).
          //
          // `awardScore = false` SEMANTICS on arm 3, matching the standing contract (C13) even though no
          // destroy* helper is involved: NO score and NO achievement counters move. Specifically
          // hunterCoalesced is NOT incremented (nothing coalesced) and noteLargeHunterSpawn() is NOT
          // called (there is no 0 -> 1 transition to arm Hunter's Bane on). AudioSys.hunterborn() is
          // likewise not fired — nothing was born; boom()'s own explosion voice is the whole tell.
          if (largeHunterCount() >= largeHunterCap(game.wave)) {
            // `a` is excluded from its own count — see heldClumpCount's comment.
            if (heldClumpCount(a) >= DEBUG.heldClumpMax) {
              a.dead = true;
              boom(a.x, a.y, 1, COLOR.garbage);  // size 1, the shatterClump idiom — the only other garbage-hue boom
            }
            break;   // gone, or now HELD and no longer absorbing — either way stop pairing it against the rest
          }
          // Clump collapses into a new large Hunter core — the game's ONLY Hunter producer since P3.
          // v3.3 P4 (9b, FORK-5): no bornOfScrap tag anymore — this coalesced core drops garbage like
          // any other Hunter. hunterCoalesced still counts the transform (it never read the flag) so the
          // "Waste Not" achievement is untouched.
          a.dead = true;
          noteLargeHunterSpawn();   // FLAG-i: the 0 -> 1 rule, now with this as its ONE choke point
          game.hunters.push(new HunterSatellite(a.x, a.y, 3));
          game.stats.hunterCoalesced++;
          AudioSys.hunterborn();
          break;   // survivor is gone — stop pairing it against the rest
        }
        continue;  // survivor lives on; keep scanning further pieces against it this pass
      }
      // Otherwise: mutual attraction, now MASS-WEIGHTED (v3.2 P1) and gravity-like — each accelerates
      // toward the other in proportion to the OTHER's mass, so a heavy clump is a slow anchor that
      // loose singles fall into. Momentum-conserving (m_a·acc_a == m_b·acc_b). Reduces EXACTLY to the
      // shipped symmetric pull when both masses are 1.0, so GARBAGE_MAGNET_PULL needs no retune.
      const d = Math.sqrt(d2) || 0.0001;
      const ux = (dx / d) * DEBUG.garbageAttractForce * dt, uy = (dy / d) * DEBUG.garbageAttractForce * dt;
      a.vx += ux * b.mass; a.vy += uy * b.mass;
      b.vx -= ux * a.mass; b.vy -= uy * a.mass;
    }
  }
}

// ---------- CS024 P3: the GARBAGE DENSITY CEILING (spec §3.1 / §4.4) ----------
// The governor that replaced the decay clock. Called from update()'s cleanup block, immediately BEFORE
// the dead-filters and therefore AFTER every pass that can mark a piece dead (pickup, shatter,
// coalescence) — placement is load-bearing twice over: it means the excess is measured against pieces
// that are genuinely still in the world, and it means a culled piece is swept by the SAME filter as
// every other death, so the entity-lifecycle contract (dead flag + one end-of-frame filter, never a
// mid-loop splice) holds and no culled piece ever survives a frame to be drawn.
//
// THE CULL IS SILENT — no blink, no particle, no sound. §1.4 deleted the expiry fade on purpose and
// the ceiling is set high enough that a player should never observe a cull at all (Gate A question 3).
//
// FULLY DETERMINISTIC, and that is a requirement rather than a nicety: same inputs, same victims, every
// run. A frame-rate-reactive cull was considered and rejected (see the GARBAGE_SOFT_MAX comment).
//
// THE ORDERING RULE (FLAG-CS024-e, invented here, no precedent in the build): singles before clumps,
// then oldest first. Singles first because a clump is player-relevant progress — it is salvage worth
// more per hook and it is a lineage on its way to becoming a Hunter — while a stray single is the
// cheapest thing on the board to lose. Oldest first because a piece that has been drifting untouched
// the longest is the one the player has most clearly abandoned. `age` never resets, not even on a
// merge, so "oldest" means oldest in absolute terms, not oldest-since-last-event.

  const aSingle = a.pieces === 1, bSingle = b.pieces === 1;

function cullGarbage() {

  // back to the soft ceiling in one pass. Note both knobs are read live and neither is validated

  // field and the ceiling is a density ceiling; they are simply never eligible as victims. What bounds

  const order = [];
  for (let i = 0; i < gs.length; i++) if (!gs[i].dead && !saturatedClump(gs[i])) order.push(i);
  order.sort((i, j) => betterCullVictim(gs[i], gs[j]) ? -1
                     : betterCullVictim(gs[j], gs[i]) ? 1 : i - j);
  // `n` can now exceed the eligible pool (held clumps are excluded above but still counted in `live`),
  // so the drain takes what it can rather than indexing off the end.
  const take = Math.min(n, order.length);
  for (let k = 0; k < take; k++) gs[order[k]].dead = true;
}

// CS025 P2 (spec §2.1/§2.4) — THE REPULSION KICK. Fired ONCE, on the frame the tow chain becomes full
// while the Magnet is active (the rising edge; see game.cargoWasFull at the one call site, in update()'s
// pickup block). Every loose piece within MAGNET_RANGE takes an outward impulse on a randomly-fanned
// vector AND has its coalesceDelay re-armed.
//
// A THIRD INSTANCE OF A SHIPPED IDIOM, NOT A NEW MECHANIC SHAPE: shatterClump() and the partial-scoop
// leftover respill both already do exactly outward-kick-plus-re-armed-delay, and shatterClump's own
// comment states the reason — "a full re-armed coalesceDelay (so the burst disperses before it can start
// re-clumping)". THE RE-ARM IS WHAT ACTUALLY SOLVES THE DEFECT AND THE VELOCITY IS WHAT MAKES IT LEGIBLE:
// conversion happens at exactly one place, the merge branch in coalesceGarbage(), which requires
// `coalesceDelay <= 0` on BOTH sides — so a re-armed piece cannot merge at all, whichever way it drifts.
// Kick alone would leave dispersal to momentum and to luck (which is why kick 0 still re-arms).
//
// EVERY LINE BELOW IS LOAD-BEARING, and each is a place a plausible-looking edit is subtly wrong:
//   · shortDelta, NEVER subtraction — the world is toroidal and this 380 px reach crosses the seam
//     constantly. The direction is SHIP -> PIECE, which is what makes the impulse OUTWARD; reversing the
//     argument order produces a stronger IMPLOSION, i.e. the defect amplified rather than fixed.
//   · `+=`, NEVER `=` — an impulse, not a teleport. Momentum survives (Pillar 2), mirroring the pull's
//     own velocity-nudge form and the respill's `g.vx += ...` directly.
//   · `/ Math.sqrt(g.mass)`, mirroring the pull, which divides its accel by the same sqrt. A mass-1
//     single is unaffected (sqrt(1) = 1); a mass-11 clump is shoved at ~30%. Linear mass would break the
//     "heavy clumps are slow anchors" identity in one direction while the pull preserved it in the other.
//   · THE `d > 1e-4` GUARD IS NOT DEFENSIVE BOILERPLATE — IT IS THE DEFECT'S OWN CASE. A piece sitting
//     exactly on the ship's centre is precisely what this feature exists to deal with, and atan2(0, 0)
//     returns 0, which would push every such piece dead +x in lockstep. A random angle is the honest
//     answer for a piece with no outward direction.
//   · liveLevers, NEVER leverState — every consumer reads liveLevers so the panel's floor/ceil/steps rows
//     are folded in. leverState deliberately has no in-game caller and must not gain one.
//
// SATURATED (HELD) CLUMPS ARE KICKED TOO, DELIBERATELY, AND NEED NO SPECIAL CASE (spec §2.6). Shoving a
// PENDING HUNTER away from the ship is the most valuable thing this burst does. Re-arming a held clump's
// coalesceDelay is INERT — coalesceGarbage()'s pair walk skips it on both sides via saturatedClump(), and
// drainHeldClumps() reads no delay at all — and that is fine: the write is harmless, not a bug, and it
// is recorded here so nobody "fixes" it with a branch.
function magnetPushBurst() {
  for (const g of game.garbage) {
    if (g.dead) continue;
    if (dist2(g, game.ship) >= MAGNET_RANGE * MAGNET_RANGE) continue;
    const [dx, dy] = shortDelta(game.ship.x, game.ship.y, g.x, g.y); // ship -> piece = OUTWARD
    const d = Math.hypot(dx, dy);
    const base = d > 1e-4 ? Math.atan2(dy, dx) : rand(0, TAU);
    const a = base + rand(-1, 1) * DEBUG.magnetPushSpread * Math.PI / 180;  // per-piece HALF-angle fan
    const kick = DEBUG.magnetPushKick / Math.sqrt(g.mass);
    g.vx += Math.cos(a) * kick;
    g.vy += Math.sin(a) * kick;
    g.coalesceDelay = liveLevers(game.wave).coalescePause;
  }
}

function updateChain(dt) {
  const chain = game.chain;
  if (chain.length === 0 || game.ship.dead) return;

  // 1. Integrate: verlet inertia with heavy damping (space trash is sluggish)
  const damp = Math.pow(0.18, dt);
  for (const n of chain) {
    const vx = (n.x - n.px) * damp;
    const vy = (n.y - n.py) * damp;
    n.px = n.x; n.py = n.y;
    n.x += vx; n.y += vy;
    n.spin += n.spinRate * dt;
  }

  // 2. Momentum transfer: pre-constraint stretch of the first link measures
  //    how hard the cargo resisted the ship this frame; tug the ship back.
  const a0 = chainAnchor();
  const [tdx, tdy] = shortDelta(a0.x, a0.y, chain[0].x, chain[0].y);
  const td = Math.hypot(tdx, tdy);
  if (td > CHAIN_LINK) {
    const massFactor = Math.min(1.4, chainMass() * CARGO_MASS);
    const f = CHAIN_TUG * (td - CHAIN_LINK) * massFactor;
    game.ship.vx += (tdx / td) * f * dt;
    game.ship.vy += (tdy / td) * f * dt;
  }

  // 3. Relax distance constraints a few passes so the chain follows serpentine
  //    (CHAIN_ITER passes — bumped 3→4 for the longer B-8 chains; §3.4 stability envelope)
  for (let iter = 0; iter < CHAIN_ITER; iter++) {
    const a = chainAnchor();
    for (let i = 0; i < chain.length; i++) {
      const leader = i === 0 ? a : chain[i - 1];
      const n = chain[i];
      const [dx, dy] = shortDelta(leader.x, leader.y, n.x, n.y);
      const d = Math.hypot(dx, dy) || 0.0001;
      const diff = (d - CHAIN_LINK) / d;
      if (i === 0) {          // anchor is kinematic; node takes full correction
        n.x -= dx * diff; n.y -= dy * diff;
      } else {                // equal-mass nodes share the correction
        n.x -= dx * diff * 0.5; n.y -= dy * diff * 0.5;
        leader.x += dx * diff * 0.5; leader.y += dy * diff * 0.5;
      }
    }
  }
  chain.forEach(wrapNode);
}

// CS019 P1: `src` is the SOURCE of the break — the hostile bullet or the debris/Hunter body that caused
// it — and exists solely so an absorbed break can stamp a persistent source's guardT. It defaults to null
// so a sourceless call (a direct call from a test harness, or any future caller with no persistent
// object behind the hit) keeps exactly the pre-CS019 behaviour: absorb, spend once, stamp nothing. A
// break with no persistent source is a one-shot event and needs no cooldown.
function breakChain(i, src = null) { // node i destroyed; everything aft breaks loose
  const chain = game.chain;
  const hit = chain[i];
  // CS017 P6 — CHAIN GUARD. This function is the single HOSTILE break choke point: both call sites (a
  // hostile bullet vs a node, and a debris/Hunter body vs a node) route through here, and each severs
  // everything aft of node i in ONE call, so one hostile hit is absorbed exactly once no matter how many
  // nodes it would have cut loose. Two separate hits in the same frame are two separate absorptions,
  // which is correct — they are two events, not one.
  //   FORK-CS017-E resolved (a): this covers HOSTILE breaks ONLY. scatterChain() (ship death) is
  //   deliberately NOT guarded — death still scatters the whole load, and stays unambiguously terminal.
  if (powerActive("guard")) {
    // CS024 P6: one charge per intercept, unconditionally — the retired TIME mode was the only reason
    // this was ever gated (there, the clock alone governed and nothing was spent). Clamped at 0.
    game.powerBudget.guard = Math.max(0, game.powerBudget.guard - 1);
    // The tell. Deliberately NOT boom() — that carries AudioSys.explosion() and would sound like the
    // canister died. shieldPing() is the shipped "a hit was blocked" voice (the same one the ship's own
    // shield uses), and the particles are pushed straight in, in the guard hue, so the burst reads as a
    // deflection rather than a detonation. The persistent state tell is the guard-lit chain in drawChain.
    for (let p = 0; p < GUARD_ABSORB_SPARKS; p++) game.particles.push(new Particle(hit.x, hit.y, POWERUP_COLOR.guard));
    game.floaters.push(new FloatText("GUARDED", hit.x, hit.y - 18, POWERUP_COLOR.guard));
    AudioSys.shieldPing();
    VoiceSys.say("chain_guard"); // CS017 P7 — same single choke point: a multi-node hit speaks once
    // CS019 P1: this contact has now been paid for. Stamping the source is what stops it presenting the
    // SAME contact again next frame — nothing was severed here, so a body that was overlapping still is.
    // The scan (not this function) does the skipping; see the hazards-vs-chain pass for why.
    if (src) src.guardT = DEBUG.chainGuardCooldown;
    return; // no node severed, deliveryCount untouched — the load is byte-identical
  }
  boom(hit.x, hit.y, 1, COLOR.garbage);
  for (let j = i + 1; j < chain.length; j++) {
    game.garbage.push(Garbage.fromNode(chain[j]));
  }
  chain.length = i;
  game.deliveryCount = 0;
  releaseDeliveryTicker(); // CS029 P4: a hostile break mid-offload ends the visit too
  VoiceSys.say("chain_broken"); // CS011 P5: choke point only — scatterChain() (ship death) stays silent
}

function scatterChain() { // ship destroyed: whole load breaks loose
  for (const n of game.chain) game.garbage.push(Garbage.fromNode(n));
  game.chain.length = 0;
  game.deliveryCount = 0;
  releaseDeliveryTicker(); // CS029 P4: ship death mid-offload ends the visit too
}

// CS017 P6: `guarded` lights the link up — full alpha instead of 0.7, a wider stroke, a much bigger glow
// blur, and the guard hue. Same glowStroke idiom, same single path, no new geometry and no fill
// (GDD §3.2). Computed ONCE per frame by drawChain and passed down rather than re-read per link.
function drawLink(x1, y1, x2, y2, guarded = false) {
  const [dx, dy] = shortDelta(x1, y1, x2, y2);
  if (Math.hypot(dx, dy) > 120) return; // don't streak across the wrap seam
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 + dx, y1 + dy);
  ctx.globalAlpha = guarded ? 1 : 0.7;
  glowStroke(guarded ? POWERUP_COLOR.guard : COLOR.chain,
    guarded ? GUARD_CHAIN_WIDTH : 1.2, guarded ? GUARD_CHAIN_BLUR : 6);
  ctx.globalAlpha = 1;
}

function drawChain() {
  const chain = game.chain;
  if (!chain.length) return;
  // CS017 P6: while the chain guard is up the whole tow reads "armoured" — links and canisters both
  // take the guard hue and the links glow harder. NOTE the deliberate trade: a guarded node no longer
  // shows its mass tint (COLOR.garbageLight for low-mass Hunter scrap vs COLOR.garbage), because
  // "this load cannot be cut" is the more urgent read and the guard window is short. Reversible
  // look-call — playtest ask, see STATUS.md.
  const guarded = powerActive("guard");
  // Chain nodes trail the ship but can straddle the world seam; map each point to
  // its nearest image relative to the camera so links/canisters render next to the ship.
  const cam = game.camera;
  const img = p => ({
    x: p.x + wrapOffset(p.x, cam.x, WORLD_W),
    y: p.y + wrapOffset(p.y, cam.y, WORLD_H)
  });
  if (!game.ship.dead) {
    const a = img(chainAnchor());
    const c0 = img(chain[0]);
    drawLink(a.x, a.y, c0.x, c0.y, guarded);
  }
  for (let i = 1; i < chain.length; i++) {
    const p = img(chain[i - 1]), q = img(chain[i]);
    drawLink(p.x, p.y, q.x, q.y, guarded);
  }
  for (const n of chain) { const p = img(n); drawCanister(p.x, p.y, n.spin, 1,
    guarded ? POWERUP_COLOR.guard : (n.mass < 1 ? COLOR.garbageLight : COLOR.garbage)); }
}

// ---------- Update ----------
// v3.6 P5: the death spectacle. Runs in place of the normal sim while game.state === "dying", so the
// field doesn't freeze under the GAME OVER text. It keeps the world moving — but takes NO ship input,
// spawns nothing on the timers, runs no pickup pass and no ship/chain collisions. An expanding
// shockwave ring (radius = elapsed × DEATH_SHOCKWAVE_SPEED) is the detonation front: any live
// debris/Hunter it has reached this frame detonates via the real destroy helpers with awardScore=false
// (nearest-first falls out, since nearer bodies are reached first). awardScore=false means no score
// and — post the destroyHunter gating fix — no achievement counters move; achievements were already
// evaluated once, at killShip. At deathT<=0 the spectacle ends and state becomes "gameover" (Phase 6
// hangs the high-score flow off that seam). The tow chain isn't advanced here: killShip's scatterChain()
// already emptied it into free garbage, which IS advanced below.
function updateDeath(dt) {
  AudioSys.thrust(false);   // the ship is gone — make sure a lingering thrust voice never drones on

  // World stays alive: advance every free-moving body and effect (but not the dead ship).
  game.debris.forEach(a => a.update(dt));
  game.hunters.forEach(h => h.update(dt));
  game.saucers.forEach(s => s.update(dt));
  game.garbage.forEach(g => g.update(dt));
  game.particles.forEach(p => p.update(dt));
  game.floaters.forEach(f => f.update(dt));
  game.powerups.forEach(p => p.update(dt));

  // Camera holds on the death point (the dead ship no longer moves).
  game.camera.x = game.ship.x;
  game.camera.y = game.ship.y;

  // Screen shake decays linearly to 0.
  game.shake = Math.max(0, game.shake - DEATH_SHAKE_DECAY * dt);

  // Expanding shockwave = the detonation front. Reuse the real destroy helpers (awardScore=false): the
  // explosion / garbage / split is the spectacle and costs no new code. Wrap-aware distance (dist2).
  const ringR = (DEATH_DURATION - game.deathT) * DEATH_SHOCKWAVE_SPEED;
  const ringR2 = ringR * ringR;
  const center = game.ship;   // death point == the dead ship's frozen position
  for (const a of game.debris)  if (!a.dead && dist2(center, a) <= ringR2) destroyDebris(a, false);
  for (const h of game.hunters) if (!h.dead && dist2(center, h) <= ringR2) destroyHunter(h, false);

  // Cleanup — mirror update()'s filter pass so detonated bodies leave the field. No wave-clear, no
  // heartbeat, no collision passes: those don't run during the death.
  game.debris    = game.debris.filter(a => !a.dead);
  game.hunters   = game.hunters.filter(h => !h.dead);
  game.saucers   = game.saucers.filter(s => !s.dead);
  game.garbage   = game.garbage.filter(g => !g.dead);
  game.particles = game.particles.filter(p => !p.dead);
  game.floaters  = game.floaters.filter(f => !f.dead);
  game.powerups  = game.powerups.filter(p => !p.dead);

  // Advance the death clock; hand off to the frozen GAME OVER screen when it runs out.
  game.deathT -= dt;
  if (game.deathT <= 0) {
    game.deathT = 0;
    game.state = "gameover";
    // v3.6 P6: the "dying" -> "gameover" seam. Arm initials entry iff the run earned a top-10 slot;
    // otherwise the gameover screen goes straight to the (unhighlighted) table.
    // CS024 P6d: a debug run (game.debugRun) never offers initials entry, qualifying score or not —
    // HighScores.add() is only ever reachable through commitEntry(), so gating the entry here is what
    // suppresses that persistence point ("no high-score entry" — the standing suppression contract).
    // CS032 P2 (spec §2.7, FORK-F): !game.resumedRun joins the gate as one more clause, same shape and
    // same contract — a resumed run's final score can never be separated from the score it loaded in
    // with, so it never enters. The HUD's "RESUMED RUN" tag is what stops the absence reading as a bug.
    game.lastScoreId = null;
    game.entry = (!game.debugRun && !game.resumedRun && HighScores.qualifies(game.score)) ? { initials: [0, 0, 0], idx: 0 } : null;
    if (game.entry) resetMenuNav(); // a stick held through the spectacle mustn't fire a phantom first move
    // CS030 P4 (§4.4): the achievement celebration panel opens at this SAME seam. killShip()'s final
    // Achievements.evaluate() ran on the frame the ship died, so by here the bucket is complete —
    // this is a flush, never a filter. The entry arming above is deliberately untouched: with both
    // armed on a qualifying run the entry slots may render under the panel's own opaque backdrop,
    // and it is the INPUT guards (which sit before entry's, in both handlers) that make this "panel
    // first" (FORK-CS030-C). resetMenuNav() for the same held-stick reason as entry's.
    // FORK-CS030-F is OPEN (a P6 gate question): one fanfare on open, routed through the existing
    // AudioSys.achievement() rather than a new sound, so the gate can retune it to per-item or to
    // silent without restructuring anything.
    // CS030 P5: `resume: null` — this panel owes nothing on dismissal. Its twin at level end stamps
    // "wave" and owes the deferred nextWave(); see dismissCelebration(), which reads this field.
    if (game.pendingAch.length) {
      game.celebration = { items: game.pendingAch, scroll: 0, resume: null };
      game.pendingAch = [];
      resetMenuNav();
      AudioSys.achievement();
    }
  }
}

function update(dt) {
  // v3.6 P5: the death spectacle runs its own reduced sim. This branch sits BEFORE the general
  // early-return so "dying" isn't swallowed by the `state !== "playing"` gate below.
  if (game.state === "dying" && !game.paused) {
    updateDeath(dt);
    return;
  }
  // CS030 P5 (§4.4): ⛔ THE CELEBRATION PANEL FREEZES THE FIELD. The term that earns its keep is the
  // LEVEL-END panel, which is up while game.state is STILL "playing" — and the wave-clear window it
  // opens in is live gameplay, not a lull (§0.1: Hunters hunt, saucers shoot, loose garbage drifts,
  // and the player can die in it). Without this the field would keep simulating behind an opaque
  // panel and kill a player who cannot see it coming. At game over the state test already covers the
  // panel, so this term is redundant there — deliberately, so ONE condition covers both call sites.
  // ⛔ NOT game.paused. Setting that would satisfy menuActive() and drag in the whole menu chrome
  // path — music ducking, drawMenu()'s input branch, the pause screen's semantics — and the panel is
  // deliberately not part of the menu system (see drawCelebration()'s header).
  // Everything this early-return already freezes freezes with it, which is the intent: the hull ease,
  // the cargo/relief flashes, game.lowHpPhase, game.waveTime and Achievements.tick() all stop, so the
  // run is genuinely on hold rather than quietly running down behind the panel.
  if (game.state !== "playing" || game.paused || game.celebration) {
    AudioSys.thrust(false);
    return;
  }

  game.ship.update(dt);
  // CS009 P1: eased HUD hull fraction — chases the true value so a hit/heal reads as a drain/fill,
  // not a jump. Lives HERE, not in drawHUD(), because drawHUD() is gated by Capture.hudVisible: an
  // ease running only while drawn would freeze while the HUD is toggled off with H and then snap on
  // re-show. Math.pow(HUD_EASE, dt) is the shipped MAGNET_DAMP idiom — frame-rate independent.
  game.hudHull += (game.ship.hp / SHIP_MAX_HP - game.hudHull) * (1 - Math.pow(HUD_EASE, dt));
  // CS009 P3: linear decay of the CARGO ring's cap-up flash — lives here (not drawHUD()) for the same
  // Capture.hudVisible reason as hudHull above: a decay that only ran while drawn would freeze while
  // hidden and pop back on re-show.
  if (game.cargoFlash > 0) game.cargoFlash = Math.max(0, game.cargoFlash - dt);
  // CS010 P3: linear decay of the low-health relief "exhale" — lives HERE (not drawHUD()) for the same
  // Capture.hudVisible reason as hudHull/cargoFlash above: a decay that only ran while drawn would freeze
  // while the HUD is hidden with H and pop back on re-show.
  if (game.hpReliefFlash > 0) game.hpReliefFlash = Math.max(0, game.hpReliefFlash - dt);
  // Camera tracks the ship's world position every frame (world wraps, so no clamping)
  game.camera.x = game.ship.x;
  game.camera.y = game.ship.y;
  // Low-health alarm (v3.4 P5; CS010 P3): the STATE is a pure per-frame read (no stored flag), but the
  // AUDIO voice is edge-detected off game.lowHpSiren so lowhp(true/false) fires exactly once per
  // transition, not every frame. Driven from this one site; killShip/quitToTitle/openPause each tear the
  // voice down directly since they leave "playing" without passing back through here.
  const lowHp = game.ship.hp <= LOW_HP_THRESHOLD && !game.ship.dead;
  if (lowHp && !game.lowHpSiren) {
    AudioSys.lowhp(true); game.lowHpSiren = true;
    // CS010 P9: Dan announces the crisis on the GENUINE rising edge only. The SIREN latch re-arms on
    // every unpause (openPause/quitToTitle tear it down), so gating the voice on lowHpVoiced — which
    // those menus DON'T touch — is what stops Dan re-announcing "Hull integrity is critical." per unpause.
    if (!game.lowHpVoiced) { VoiceSys.say("health_low"); game.lowHpVoiced = true; }
  }
  else if (!lowHp && game.lowHpSiren) {
    // Falling edge — disengage. Reset the pulse phase, then arm the relief exhale ONLY IF THE SHIP IS
    // ALIVE (CS010 P3, §5, FLAG-CS010-a). THE GUARD IS LOAD-BEARING: `lowHp` also goes false when the
    // ship DIES (the `!dead` term), so this branch is the moment of death too — without `!ship.dead` the
    // hull ring would play a cheerful "you're okay now" pop at the instant the player is killed. (Today
    // killShip zeroes game.lowHpSiren directly and the dying state early-returns before this site, so the
    // edge isn't even reached at death — but that is incidental; guard explicitly.)
    AudioSys.lowhp(false); game.lowHpSiren = false;
    game.lowHpPhase = 0;
    if (!game.ship.dead) {
      game.hpReliefFlash = LOWHP_RELIEF_FLASH;   // relief, not death
      // CS010 P9: Dan's relief line is ADDITIVE to P3's visual exhale (both carry the falling edge —
      // parity with the four onset tells). Guarded on !ship.dead like the flash: death isn't relief.
      VoiceSys.say("health_relief");
    }
    game.lowHpVoiced = false;   // CS010 P9: the crisis is over — re-arm Dan for the NEXT low-HP episode
  }
  // CS010 P9: hull-FULL voice. Edge-detected on hp >= max (matching the HUD's hpMax, not === ) so it
  // fires ONCE per heal-to-full and never every frame while healthy — and, living here in update(),
  // catches healing from ANY source (Health powerup AND addScore()'s repair milestone) for free. The
  // latch starts true at spawn (see startGame) so a fresh full-HP run doesn't blurt "brand new ship".
  const hpFull = game.ship.hp >= SHIP_MAX_HP && !game.ship.dead;
  if (hpFull && !game.hpFullVoice) { VoiceSys.say("health_full"); game.hpFullVoice = true; }
  else if (!hpFull) game.hpFullVoice = false;
  // v3.5 P3: HP-scaled urgency for the pulsed voice — a per-frame call (not edge-detected), safe no-op
  // via lowhpSet's own guards when the state isn't engaged or the voice isn't live. CS010 P3: the SAME t
  // and the SAME lowhpPulseRate(t) also advance game.lowHpPhase, the shared accumulator the critical-hull
  // ring and the corner glow read via Math.sin — so siren, ring and glow are ONE alarm at ONE HP-ramped
  // rate. Integrating the phase (not phase = omega·clock) keeps it CONTINUOUS when the HP-dependent rate
  // changes mid-alarm; mod TAU keeps the accumulator bounded. Living here means it FREEZES while paused —
  // correct and deliberate (openPause tears the siren down; same rationale as hudHull/cargoFlash above).
  if (lowHp) {
    const t = 1 - game.ship.hp / LOW_HP_THRESHOLD;
    AudioSys.lowhpSet(t);
    game.lowHpPhase = (game.lowHpPhase + TAU * lowhpPulseRate(t) * dt) % TAU;
  }
  // Achievements (F9): per-game clock (Speed Recycler's 60s window) + lifetime play time & periodic save
  game.stats.gameTime += dt;
  Achievements.tick(dt);
  // CS017 P1: seconds elapsed in the current wave — inert this phase (P4 wires it to saucer pressure).
  // Lives here, not loop(), so it FREEZES while paused and at the title, same rationale as
  // game.lowHpPhase (CS010 P3): this early-return above already gates on game.state === "playing" && !game.paused.
  game.waveTime += dt;
  game.debris.forEach(a => a.update(dt));
  game.bullets.forEach(b => b.update(dt));
  game.saucers.forEach(s => s.update(dt));
  game.hunters.forEach(h => h.update(dt));
  game.particles.forEach(p => p.update(dt));
  game.floaters.forEach(f => f.update(dt));
  game.caption.life -= dt; // CS011 P2: age Dan's on-screen caption (drawCaption gates on life > 0)
  // CS025 P5: age the level banner alongside it. In the PLAYING body, so it holds through a pause and
  // resumes rather than expiring behind the menu — the same treatment the caption gets, for the same
  // reason. drawLevelBanner() gates on life > 0. Allowed to run negative; nothing reads it below zero.
  game.levelBanner.life -= dt;
  if (game.dock) game.dock.update(dt);

  // CS024 P1: CS023 P4's single `updateDebrisDrift(dt)` call STOOD HERE — after every entity's update(dt)
  // and before every collision pass. Removed with the mechanic; nothing takes its slot, so the entity
  // updates now run straight into the pickup/chain pass.

  // --- Salvage pickup & chain physics ---
  // CS025 P1 (spec §1.3): THE MAGNET'S FULL-CARGO HOLD — THE ONE WRITER OF game.magnetHoldT, and the
  // only place the condition is evaluated. With the chain full the pickup gate below blocks every hook,
  // so an unsuppressed Magnet just drags garbage onto the ship where it loiters and — coalescence being
  // a SEPARATE system that keeps running — fuses into a Hunter at the player's own position.
  //
  // ⛔ DERIVED PER FRAME, NEVER HOOKED AT THE SITES THAT FREE A SLOT. There are five (chain.pop() at the
  // dock, breakChain(), scatterChain(), startGame(), and nextWave()'s `cargoMax = payloadSlots(wave)`,
  // where a level-up GROWS the cap so a full 8-load at L4 becomes a not-full 8-of-10 at L5 with no
  // delivery and no pickup at all). Hooking five sites is five chances to miss one; this read covers all
  // five with one writer and cannot miss one. Same derived-not-stored idiom as saturatedClump().
  const cargoFull = game.chain.length >= game.cargoMax;
  // CS025 P2 (spec §2.1/§2.3): THE REPULSION KICK, ON THE RISING EDGE OF `cargoFull` AND NOWHERE ELSE.
  // Suppressing the pull stops the magnet ADDING to the cloud; it does nothing about the cloud already
  // sitting on the ship at the moment the chain fills, which is the one that converts. This shoves it
  // outward and re-arms its coalescence clock. Called HERE — inside this block and BEFORE the garbage
  // loop below — so the kicked velocities integrate on this frame's own g.update(dt) and the re-armed
  // delays are already in place when coalesceGarbage() runs later in the same frame.
  //
  // ⛔ THE EDGE IS A PLAIN STORED BOOLEAN AND MUST NOT BE INFERRED FROM game.magnetHoldT. The inference
  // is tempting — the timer reads BELOW DEBUG.magnetResumeDelay only on the first full frame, since the
  // line below pins it at the delay thereafter — and it is wrong: dragging the magnetResumeDelay slider
  // UPWARD while parked at full instantly makes the stale hold read "below the delay" again and re-fires
  // the burst, at the playtest gate, in the exact session where that knob is being tuned. The boolean
  // cannot be fooled by a knob edit. It is written ONCE, at the end of this block.
  //
  // The gate is powerActive("magnet"), NOT magnetPulling(): at the rising edge the hold has not been set
  // yet, so the two agree — and the raw predicate says plainly that this is a MAGNET mechanic, not a
