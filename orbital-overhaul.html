<!DOCTYPE html>

<title>ORBITAL OVERHAUL</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: monospace;
  }
  #game-container {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000208;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="game-container"><canvas id="game"></canvas></div>
<script>
"use strict";

/* ============================================================
   ORBITAL OVERHAUL — v3.3
   A vector-style arcade shooter in the spirit of Asteroids Deluxe
   - Energy shield (hold SHIFT) that deflects debris
   - Killer satellite that splits into homing wedge ships
   - Large & small saucers
   v1.1: Radioactive salvage — destroyed debris drops garbage canisters;
   fly over them to hook them into a physics-simulated tow chain, then
   haul the chain into the recycling dock for escalating bonus points.
   Cargo has mass: it cuts thrust/top speed and tugs the ship around.
   v1.2: Larger 3840x2160 wrapping world with a scrolling camera that keeps
   the ship centered; the 1280x720 canvas is now a viewport onto that world.
   v1.3: Discrete lives replaced by a single HP pool (SHIP_MAX_HP). Unshielded
   hits deal source-specific damage, shove the ship away (knockback), and grant
   ~1s of hit-stun i-frames; 0 HP is a permanent game over (no respawn). Score
   milestones now repair the hull instead of granting extra lives.
   v1.4: Asteroids redesigned as Debris Satellites — a broken-satellite silhouette
   with 3-way splits at large/medium (small tier is destroyed). Every tier's
   destruction emits exactly 3 garbage canisters (replacing the old probabilistic
   single drop), so the field carries far more salvage — garbage decay (since
   removed in v3.2 P3) and the wave spawn count were trimmed to compensate at the
   time. Garbage and chain nodes gained a
   `mass` field; chain thrust/top-speed/tug now scale with the chain's total mass
   (sum of node.mass), not its node count.
   v1.5: Global difficulty ramp — difficultyFactor(wave) climbs from ~0 at wave 1
   toward 1 over many waves (RAMP_WAVES is the single knob), and threat parameters
   interpolate floor->ceiling through it via ramp() (CS024 P4: ramp() is gone with the
   last lever on it, and the curve itself — never a difficulty lever after CS018 P4 —
   is renamed musicIntensity()/MUSIC_INTENSITY_WAVES to say what it actually drives).
   Applied to the saucers so early
   waves are calmer: longer gaps between saucers, slower fire, wider small-saucer aim,
   and a rarer (wave-driven, not score-gated) small saucer — all easing to the shipped
   intensity at full difficulty. Hunter/Satellite scaling is deferred to its Phase-5
   redesign.
   v1.6: Killer satellite + homing wedges redesigned into the Hunter Satellite — one diamond
   family with three tiers (3 large / 2 medium / 1 small). The large core drifts passively
   toward the ship (spawn-time aim, no re-aim); shooting it splits it 3-ways into medium then
   small children that actively home, each faster/more agile than the last. Every tier emits
   garbage; the small tier drops a larger burst of LOW-mass (0.5) scrap that tows easily and
   renders in a paler tint. All Hunter speeds/turn rates wire into the v1.5 difficulty ramp
   from the start (gentle wave-1 floor at HUNTER_FLOOR_FRAC of the ceiling, ramping up over
   ~20 waves). Hunter contact damage is 60/45/30 by tier; homers still die on shield contact
   (and split), the core bounces; Hunters still sever the tow chain.
   v1.7: Powerups — five free-floating pickups (each a distinct vector-glow icon). Health spawns
   ambiently on a saucer-like timer and instantly repairs +25 HP (capped); Rapid Fire, Triple Shot,
   Magnet and Engine drop from small-tier Debris/Hunter kills at a per-kill chance and last
   POWERUP_DURATION seconds (drop rule superseded by three deterministic sources, v3.6 P3). Rapid Fire doubles the bullet cap (4->8); Triple Shot fires a 3-bullet
   spread and triples the cap (4->12) — both active uses the higher cap (12), not 24. Magnet pulls
   free garbage toward the ship inside an extended radius (and widens the pickup radius); Engine
   halves the effective towed-mass sum (chainMass) so thrust/top-speed/tug all lighten. Same-type
   pickups refresh the duration (no magnitude stacking); different types stack. A HUD row shows each
   active timed effect with a shield-bar-style remaining-duration bar.
   v1.8: Gamepad support — the input layer now checks either keyboard OR the first connected gamepad
   through a data-driven `bindings` table (one entry per action, listing keyboard keys + gamepad
   buttons/axis), polled once per frame via navigator.getGamepads(). Defaults: D-Pad / Left Stick for
   rotate + thrust (25% deadzone), A to fire, right trigger/bumper for shield (a gap-fill — no shield
   binding was spec'd). Fixed menu/system reads wired now for later phases: A = confirm, B = back
   (reserved for F8's menus), Start = start/pause/unpause (Start toggles pause like P today). Call
   sites are unchanged (still input.left() etc.). Rebinding UI is Phase 8; these are hardcoded defaults.
   v1.9: Pause menu / options / control rebinding — the first nested menu state machine (pause -> root
   -> options -> controls), navigable by keyboard OR gamepad. AudioSys refactored to a gain-routing
   graph (voice -> sfx -> master) so the SFX/Music/Master sliders attenuate real output (Music has no
   source connected — there is no music track). Live rebinding of the five gameplay actions for both
   keyboard and gamepad, Return to Defaults, and localStorage persistence of volumes + custom bindings
   (guarded so a storage failure never crashes).
   v2.0: Achievements — 15 weekly (a calendar-deterministic 5-wide slice active each ISO week) + 12
   lifetime (cumulative across games). The Achievements module OBSERVES stats the game already
   produces (kills by type/tier, dock deliveries, HP thresholds, powerup usage, wave reached,
   damage-free waves, play time) via light hooks at each event site; unlocks pop a non-blocking toast
   and are browsable in a viewer (Pause -> Options -> Achievements). Weekly rotation index =
   (isoYear*52 + isoWeek) % 15; progress + unlock state persist to their own localStorage key. This
   completes the v2.0 feature set (Phases 1-9).
   ============================================================ */

// ---------- Constants ----------
// The world is a large wrapping torus; the viewport is a camera window onto it.
const VIEW_W = 1280, VIEW_H = 720;      // visible viewport = canvas size
// CS022 P1 (spec §4.1, FORK-CS022-B/C): THE TORUS PERIOD IS NO LONGER FIXED. A world "size" counts
// VIEWPORT-SIZED SCREENS OF AREA — size 4 is 2x2 viewports (2560x1440, every build through CS021),
// size 9 is 3x3 (3840x2160, what four rings at CS023's 200 px spacing need). The size is chosen by
// the LEVEL'S ARCHETYPE (worldSizeFor), not by a level-table column and not by a ramp, so game.wave
// stays the ONE difficulty clock. FORK-CS022-B: this is a general seam with two values wired — a
// finer per-level scheme later is a data change, not a re-plumb.
//
// CONSEQUENCE, and the whole reason this block carries a warning: WORLD_W/WORLD_H are `let` now.
// ANY VALUE DERIVED FROM THEM AND CACHED AT MODULE LOAD IS A BUG. STAR_COUNT/`stars` was the only
// one and §4.3 handles it (generated once for WORLD_SIZE_MAX, filtered per world into starsActive).
// Everything else reads them live, inside a function, which is what makes the resize safe.
// CS026 P3 (spec §2.2): THE SMALL EARLY-LEVEL WORLD. Levels 1..DEBUG.earlyWorldLevels (default 5) run
// here; level 6 on runs at WORLD_SIZE_FIELD. 1920x1080 — k = 1.5, so the dimensions are exact integers
// like every other entry in this table. The problem it answers is the TAIL, not the combat: at 2560x1440
// the viewport shows 25% of the world and the farthest a body can be from the ship is 1,469 px, so the
// last two or three smalls of an early level are a search rather than a fight. At 1920x1080 it is 44%
// and 1,101 px.
//
// ⛔ 2.25 IS THE FLOOR OF THIS TABLE AND THAT IS A HARD RENDERING BOUND, NOT A TASTE JUDGEMENT. Do not
// try a smaller size here later without fixing drawEntity() first. Each body is drawn at EXACTLY ONE
// wrapped image, and onScreen()'s reach is VIEW/2 + CULL_MARGIN(100) + radius — so for a large satellite
// (r = 46) the world's HALF-period must clear 786 x 506 or the body clips at the seam instead of
// crossing it. At 1920x1080 the half-period is 960 x 540 and clears both. At 1600x900 (size 1.5625) it
// is 800 x 450: 450 < 506, and bodies clip at the top and bottom seams. At 1280x720 (size 1) they clip
// AND a SPAWN_MAX_DIST spawn lands 80 px from the ship wrap-aware — inside SPAWN_MIN_DIST and inside
// DOCK_RADIUS — so a fully-visible world would need the flat spawn/dock rings scaled too, which is a
// different and much larger change than returning a smaller number.
const WORLD_SIZE_EARLY = 2.25;          // early levels: 1920x1080 — the floor, see above
const WORLD_SIZE_FIELD = 4;             // field levels: 2560x1440 — deliberately UNCHANGED from the
                                        // v3.1 P1 shrink (spec C4: the bigger world was tried and
                                        // rejected, and the spawn/dock rings are flat constants that
                                        // would just leave more dead space in it). CS026 P3: still the
                                        // size every level from 6 on runs at, and still the size
                                        // startGame() boots in — only levels 1-5 moved.
const WORLD_SIZE_ORBIT = 9;             // 3840x2160 — the 3x3 world. CS024 P1: NO LEVEL RUNS AT THIS SIZE
                                        // ANY MORE (worldSizeFor returns WORLD_SIZE_FIELD
                                        // unconditionally now that the orbit archetype is gone), and the
                                        // entry is KEPT ON PURPOSE at Paul's explicit instruction: the
                                        // 9x path stays live and testable for possible future use. THE
                                        // NAME IS NOW HISTORICAL — it records which archetype sized this
                                        // slot, not who uses it. It has one live reader, WORLD_SIZE_MAX
                                        // just below, which is what keeps STAR_COUNT generating the sky
                                        // at the largest table size; resizeWorld() is exercised at this
                                        // size directly by test-cs024-p1.js §E. Do not delete it, and do
                                        // not rename it for tidiness — a rename here is a diff across
                                        // every world-size test for no behavioural gain.
const WORLD_SIZE_MAX = Math.max(WORLD_SIZE_FIELD, WORLD_SIZE_ORBIT); // largest size in the table; the
                                        // starfield is generated once for THIS (§4.3/FLAG-CS022-d).
                                        // CS026 P3: WORLD_SIZE_EARLY is DELIBERATELY not in this
                                        // Math.max, and the expression is untouched. 2.25 is below both
                                        // operands, so adding it could not change the answer — and the
                                        // starfield contract is "generate once at the biggest size,
                                        // filter per world in rebuildStarsActive()", which a SMALLER
                                        // world is already the easy case for (fewer active stars, a
                                        // strict sub-region of the same sky, no new roll).
let WORLD_W = 2560, WORLD_H = 1440;     // simulation space (the wrap boundary). WAS `const` through
                                        // CS021. Boots at the FIELD size and must always equal
                                        // worldDims(WORLD_SIZE_FIELD) — asserted headlessly.
const TAU = Math.PI * 2;

// CS022 P1 (§4.1): a size in viewport-areas -> [width, height]. sqrt because `size` counts AREA, so
// size 4 is a 2x screen linear scale and size 16 a 4x one; both land on exact integers.
function worldDims(size) { const k = Math.sqrt(size); return [VIEW_W * k, VIEW_H * k]; }

// CS022 P1 (FORK-CS022-C): a pure function of the level number, evaluated fresh at every wave boundary
// — never a stored schedule.
//
// CS024 P1 (spec §3.6/§4.1, consequence 3): IT RETURNED WORLD_SIZE_FIELD UNCONDITIONALLY. The archetype
// key went with the orbit levels, so for two changesets every level ran at 2560x1440 and nextWave()'s
// `nextWorldSize !== game.worldSize` compare never fired in normal play.
//
// THE WHOLE SIZE SEAM WAS KEPT LIVE ANYWAY, AND THAT WAS A DELIBERATE INSTRUCTION, NOT AN OVERSIGHT: this
// function, resizeWorld(), applyWorldSize(), worldDims(), the size table, WORLD_SIZE_MAX and
// WORLD_SIZE_ORBIT's slot in that table all stay. Paul's explicit call — the 9x path (3840x2160) is to
// remain available and testable for possible future use, at near-zero cost. Two things kept it from
// rotting into untested dead code: WORLD_SIZE_MAX still reads WORLD_SIZE_ORBIT (so STAR_COUNT is still
// generated at the largest table size and filtered per world, unchanged), and test-cs024-p1.js §E drives
// resizeWorld(WORLD_SIZE_ORBIT) directly against a live field and asserts the same six-step contract
// CS022 P1 shipped. Do not "clean up" any of it on the grounds that nothing calls it.
//
// ⛔ CS026 P3 (spec §2.2): `level` IS LIVE AGAIN, AND SO IS resizeWorld() IN REAL PLAY. CS024 P1's note
// here said the parameter was kept as "the seam a future per-level scheme would re-enter through" — this
// is that scheme, and it is no longer hypothetical. Levels 1..DEBUG.earlyWorldLevels run in the small
// 1920x1080 world; every level after runs in the 2560x1440 field world, exactly as before.
//
// TWO CONSEQUENCES WORTH NAMING AT THE SITE, because both were dormant for two changesets:
//   * resizeWorld() — the six-step carried-entity re-homing pass — now FIRES IN LIVE PLAY, once per run,
//     at the level 5 -> 6 boundary, WITH A FULL FIELD CARRIED ACROSS IT (debris, Hunters, garbage,
//     powerups, particles, floaters, the tow chain). That transition is the one place it runs, and it is
//     what test-cs026-p3.js §E drives for real. Its body is UNCHANGED by this phase — this gave it a
//     caller, not an edit.
//   * The knob is read LIVE, at the wave boundary, never cached. DEBUG.earlyWorldLevels = 0 turns the
//     feature off completely (no level satisfies `level <= 0`, so this returns WORLD_SIZE_FIELD for
//     everything and the build behaves exactly as CS025 shipped) — that is the gate's clean A/B, and it
//     is why the comparison is `<=` against a count of levels rather than a `<` against a boundary.
//
// The registry entry IS the source of truth for the default (5) — no shipped constant backs it, the
// chainGuardIntercepts idiom. This reads DEBUG at CALL time, not at module load, which is what makes
// that legal: DEBUG is populated far below this line and every caller is a wave-boundary caller.
function worldSizeFor(level) {
  return level <= DEBUG.earlyWorldLevels ? WORLD_SIZE_EARLY : WORLD_SIZE_FIELD;
}

const SHIP_TURN = 4.2;          // rad/sec — the design-default turn rate (before the player scale)
// Player rotation-speed preference (CS010 §10b): a multiplier over SHIP_TURN, adjustable on the
// Controls screen and persisted ADDITIVELY in afd_settings_v1. It is a player PREFERENCE, not a
// balance change — SHIP_TURN stays the design default. Deliberately NOT reset by the Controls
// screen's "Return to Defaults" (FLAG-10a — Paul's call: the player returns to 100% manually via
// the slider). Both turn sites read it through shipTurnRate() so they can never diverge.
const SHIP_TURN_SCALE_MIN = 0.5;      // 50%
const SHIP_TURN_SCALE_MAX = 1.5;      // 150%
const SHIP_TURN_SCALE_STEP = 0.10;    // 10% per ◄/► nudge -> 11 positions (0.5 .. 1.5)
const SHIP_TURN_SCALE_DEFAULT = 1.0;  // 100% — design default; a corrupt/out-of-range save clamps here
const SHIP_THRUST = 340;        // px/sec^2
const SHIP_DRAG = 0.35;         // fraction of velocity lost per second
const SHIP_MAX_SPEED = 520;
const SHIP_RADIUS = 13;

const BULLET_SPEED = 620;
const BULLET_LIFE = 1.05;       // seconds
const MAX_BULLETS = 4;
const FIRE_COOLDOWN = 0.20;         // base gun cadence
const RAPID_FIRE_COOLDOWN = 0.09;   // Rapid Fire cadence — genuinely faster, not just a bigger cap (B-6)

const SHIELD_DRAIN = 0.55;      // energy/sec while on
const SHIELD_RECHARGE = 0.12;   // energy/sec while off
const SHIELD_HIT_COST = 0.22;   // energy per deflection
const SHIELD_RADIUS = 26;
// CS021 P1b — THE SHIP BOUNCES OFF A HAZARD IT CANNOT PUSH. shieldDeflect() below shoves the HAZARD
// and never touches the ship, which works for every free-moving body but not for a CS021 orbiting
// satellite: that one's position is re-derived from its orbit angle every frame, so the shove is
// undone before it can separate and the same contact re-presents every frame. Measured on the P1
// build: five deflects in five consecutive frames, the whole shield meter gone in 0.10 s against
// 1.38 s of ordinary SHIELD_DRAIN, and no way to push clear. A body on a rail is effectively
// infinite mass, so the whole exchange goes to the SHIP instead — see shieldBounce().
// ELASTIC, and computed in the SATELLITE'S FRAME so a fast ring genuinely flings you: the approaching
// component of the RELATIVE velocity is reflected, then the satellite's own tangential velocity is
// added back. Restitution 1.0 is literally "reflect incoming speed" — you get back exactly what you
// brought. PLAYTEST KNOB: lower it if a ring reads like a trampoline.
const SHIELD_BOUNCE_RESTITUTION = 1.0;
// PLAYTEST KNOB, px/s. THE SEPARATION FLOOR: the minimum outward speed a bounce always leaves behind.
// A reflection alone does nothing for a ship whose RELATIVE velocity has no approaching component —
// one at rest, one riding alongside, one already moving away — and the overlap push only buys 2 px of
// clearance, so anything that closes those 2 px re-presents the same contact on the next frame.
// MEASURED, not assumed (deflect events over 5 s, meter held full, floor 120 vs floor 0):
//     parked radially, ring 1 ................ 1 vs 1   (the push alone happens to suffice)
//     parked in the satellite's PATH, ring 1 .. 1 vs 2   (it sweeps back into you)
//     parked radially, THRUST HELD into it .... 2 vs 5   (you push yourself back in)
//     parked radially, 12-node tow ............ 1 vs 2   (CARGO_TUG drags you back in)
// So it earns its place in exactly the cases a player creates on purpose. Well under KNOCKBACK_SPEED
// (250): a graze should nudge, not launch — the elastic term is what makes a hard hit hurt.
const SHIELD_BOUNCE_MIN = 120;
const AUTO_SHIELD_SCORE_PENALTY = 500; // PLAYTEST KNOB — score lost per auto-save. Flat (FLAG-4d).
const AUTO_SHIELD_REGEN_PAUSE = 1.0; // sec — passive regen freezes this long after an auto-save. PLAYTEST KNOB (>= HIT_STUN_DURATION guarantees no recharge between i-frame end and next hit).

const DEBRIS_SPEEDS = { 3: 70, 2: 110, 1: 160 };  // base drift speed by size. CS024 P5: the junkSpeed*
                                 // levers now supply this directly at every lever-driven spawn site —
                                 // this table's only surviving reader is DebrisSatellite's own default
                                 // parameter, used solely by the (non-lever-driven) title-screen
                                 // decoration. Its cap is DEBRIS_SPEED_CAP, declared further down.
const DEBRIS_RADII  = { 3: 46, 2: 26, 1: 13 };
const DEBRIS_SCORE  = { 3: 20, 2: 50, 1: 100 };
const DEBRIS_GARBAGE = 4;       // canisters emitted at EVERY tier's destruction (F3). PLAYTEST KNOB:
                                 // 3->4 in v3.4 P1, compensating field supply for the Hunter-side garbage cut (FORK-1(b)).
// CS023 P2 (spec §4.8, FORK-CS023-D) — SATELLITE-vs-SATELLITE COLLISION. Three numbers, all of them
// read by debrisBounce() and by nothing else in the file.
// 9/3/1 IS A FITTED RATIO, CHOSEN SO A SMALL RICOCHETS OFF A LARGE INSTEAD OF SHOVING IT. That 9:1 gap
// between the extreme tiers is the whole of what these numbers are for; debrisBounce() only ever reads
// the RATIO between the two bodies actually in contact, never a total, so the absolute values carry no
// other meaning. Keyed by `size` on the same 3/2/1 tier convention as DEBRIS_RADII / DEBRIS_SCORE /
// DEBRIS_DAMAGE.
// ⛔ CONSERVATION IS A RETIRED PROPERTY (retired by CS026 P2, FORK-CS026-B -> (a)). CS023 P2 derived
// these three numbers from mass being conserved through the 3-way split the game performed at the time:
// a large of 9 became three mediums of 3, a medium of 3 became three smalls of 1, so shattering left the
// board's total mass unchanged. CS026 P2 made the split count a lever (junkSplit — 2 through level 10),
// and under a 2-way split a large of 9 becomes 12, then 4. THE NUMBERS DELIBERATELY DID NOT MOVE:
// nothing in the game reads a total mass, so conservation bought nothing, while retuning to a
// conserving 4/2/1 would have reopened every satellite-vs-satellite bounce — a CS023 mechanic that came
// through its own playtest gate clean — and flattened the ricochet ratio from 9:1 to 4:1. So the
// derivation was retired and the table kept. DO NOT "RESTORE" CONSERVATION by editing these values, and
// do not edit the split to protect them; neither is a bug.
const DEBRIS_MASS = { 3: 9, 2: 3, 1: 1 };
// Restitution of a satellite-vs-satellite bounce. 1.0 mirrors SHIELD_BOUNCE_RESTITUTION and means the
// same thing — the pair gets back exactly the closing speed it brought, so kinetic energy is conserved
// along the contact normal. PLAYTEST KNOB: lower it if the shell reads like a pinball table.
// CS023 P4 DID WHAT P2's NOTE HERE SAID IT WOULD — this is now a LIVE DEBUG SLIDER
// (debrisBounceRestitution). The constant stays the registry entry's `def` and debrisBounce() reads
// DEBUG.debrisBounceRestitution at the site, which is the convention every ORBIT knob already follows:
// moving this constant moves the knob's default with it, and the shipped behaviour is byte-identical
// until the slider is actually touched.
const DEBRIS_BOUNCE_RESTITUTION = 1.0;
// The separation floor, px/s (FLAG-CS023-f) — SHIELD_BOUNCE_MIN's reason exactly, scaled to satellite
// speeds. Reflection alone leaves two touching STATIONARY bodies touching, so without a floor a contact
// re-bills every frame; and CS023 creates that case on purpose, because destroyDebris() births its three
// children at the PARENT'S OWN POSITION and a shattered rail-borne parent hands all three the SAME
// tangent, which would otherwise leave a permanently coincident stack. 40 rather than the ship's 120
// because satellites move at 18-267 px/s where the ship reaches 520.
const DEBRIS_BOUNCE_MIN = 40;

const SAUCER_SCORE = { big: 200, small: 1000 };

// Hunter Satellites (F4) — the reshaped killer-satellite/wedge system: a diamond core that
// drifts passively toward the ship, then splits 3-ways into actively-homing children,
// emitting garbage at every tier.
// CS018 P4 (FLAG-a): every Hunter's TURN RATE is FROZEN at _CEIL × HUNTER_FLOOR_FRAC for the WHOLE
// GAME, at every tier, no exceptions — no difficulty ramp, no cycle, no clock of any kind, and CS024 P5
// does not lever it either (spec §2.4: "All Hunter turn rates stay frozen"). HUNTER_TURN_CEIL is
// therefore a FROZEN VALUE'S DERIVATION, not a target anything climbs toward.
// SPEED SPLITS BY TIER as of CS024 P5. The large core still has no speed lever (spec §2.4 — it does not
// pursue) and keeps this same frozen _CEIL × HUNTER_FLOOR_FRAC derivation, unconditionally. Medium and
// small speed are now the HUNTER chain's two carried levers (hunterSpeedMedium/hunterSpeedSmall, driven
// by the coalescePause lever's wraps) — HUNTER_SPEED_CEIL[2]/[1] below now describe only the RETIRED
// derivation base for those two tiers; the live figures come from leverState(game.wave), not this table.
// Rising Hunter pressure used to be expressed purely as COUNT (the level table's maxLargeHunters column,
// off HUNTER_CAP_STEPS, until CS024 P3 collapsed the whole clock into one flat ceiling, which CS024 P6f
// in turn replaced with largeHunterCap() — see below) — CS024 P5 adds a second axis on top: how fast a
// coalesced Hunter homes.
const HUNTER_RADII      = { 3: 24, 2: 15, 1: 10 };    // collision radius by tier
const HUNTER_SCORE      = { 3: 200, 2: 150, 1: 250 }; // large core / medium / small (small worth most — hardest to hit)
const HUNTER_DAMAGE     = { 3: 60, 2: 45, 1: 30 };    // contact damage — harder than the equivalent Debris tier (F2/F4)
const HUNTER_SPEED_CEIL = { 3: 70, 2: 120, 1: 175 };  // [3] is the LIVE frozen-speed derivation base for the
                                       // large core (still read every construction). [2]/[1] are now read
                                       // only as historical reference — CS024 P5's hunterSpeedMedium/Small
                                       // levers replaced them as medium/small's actual speed source.
const HUNTER_TURN_CEIL  = { 3: 0, 2: 1.6, 1: 2.6 };   // frozen turn-rate DERIVATION base (rad/s); large's is 0, so it never turns (passive drift)
const HUNTER_FLOOR_FRAC = 0.58;   // THE Hunter speed/turn knob: EVERY Hunter, at EVERY level, moves at this × its _CEIL
                                  // (40.6 / 69.6 / 101.5 px/s and 0 / 0.928 / 1.508 rad/s by tier 3/2/1)
const HUNTER_SCATTER    = 0.6;    // sec a freshly-split homer scatters outward before homing engages
// CS024 P6f (spec §2.5): CS024 P3's `const LARGE_HUNTER_MAX = 100` STOOD HERE and is DELETED. Its own
// comment called it "a runaway backstop that play should never reach" — and play never did reach it,
// which is precisely the defect Gate B's playtest found: with the ambient producer gone, NOTHING bounded
// how many independent garbage lineages could march to HUNTER_COALESCE_COUNT at once, each on its own
// clock, so levels 1–3 could accumulate several large Hunters simultaneously. Slowing the coalescePause
// lever cannot fix that — it governs how fast ONE clump forms while nothing limits how many form
// CONCURRENTLY. It is a COUNT problem, so the fix is count-shaped, and it lives in largeHunterCap(wave)
// (declared beside largeHunterCount()): min(ceil(wave / hunterCapLevelsPerStep), hunterCapMax) — 1 large
// Hunter at levels 1–2, one more every two levels, plateauing at 6 from level 11 on.
//   ⛔ IT IS NOT A LEVER AND MUST NEVER BECOME ONE (§2.5's not-a-lever list). No floor/ceil/steps triple,
// no ▼/↳ glyph, no carriesTo, no place in any chain: a ceiling on CONCURRENT THREATS is a stability
// guarantee, not a difficulty axis, and the player should never be able to feel it move. It is a pure
// function of game.wave like everything else, but it lives OUTSIDE the odometer.
//   ⛔ IT IS ALSO NOT A BREAKPOINT TABLE. CS024 P3 deleted HUNTER_CAP_STEPS (11 breakpoints, 0 -> 12) and
// this must not quietly restore that shape — two knobs and one ceil, nothing more.
//   NO CONSTANT REPLACES THE DELETED ONE, deliberately: both knobs are live registry values with no

// CS010 P3: the ONE shared low-health pulse-rate formula (Hz), ramped by HP urgency t = 1 -
// hp/LOW_HP_THRESHOLD (0 at the threshold → 1 near death). Read by BOTH AudioSys.lowhpSet (the siren's
// LFO) AND update()'s game.lowHpPhase accumulator (the critical-hull ring + corner-glow pulse), so the
// audio alarm and the two visual alarms are ONE instrument driven by ONE interpolation — never two that
// can drift. Pure linear interp, deliberately NOT clamped here (callers pass an in-range t; lowhpSet
// clamps first). RATE IS SHARED BY TRIGGER, NOT BY WIDGET: only elements keyed on LOW_HP_THRESHOLD use
// this; cargo-gold and the powerup low-timer keep the flat HUD_PULSE_HZ (a distinct rate is how the ear
// and eye tell a hull alarm apart from a timer running out).

// CS024 P3 (spec §1.4/§3.1/§4.4): LOOSE GARBAGE IS PERMANENT. `Garbage.decay`, GARBAGE_FADE, the
// blink-out render and the `garbageLifetime` knob are all deleted — this reverses v3.3 P4 (9a) and
// CS015 P6 (item 10) and restores the v3.2 P3 rule. A piece now has exactly THREE exits: RECYCLED
// (towed to the dock), CONSUMED INTO A HUNTER (coalescence), or CULLED by the density ceiling below.
// It never ages out.
//
// WHY, and it is load-bearing: this phase also deleted the ambient Hunter producer, so coalescence is
// the ONLY thing that can make a Hunter. A decay clock racing the coalescence clock would mean the
// pipeline almost never fires. Permanence is what makes "neglected debris is the only thing that
// becomes a hunter" true rather than aspirational.
//
// THE PRICE, and the two constants that pay it: nextWave() clears nothing and wave-clear triggers on
// debris-empty alone, so loose canisters now carry across levels with NO natural bound, and
// coalesceGarbage() is an O(n²) pair walk over them. So a DETERMINISTIC two-tier ceiling replaces the
// decay clock as the density governor. Deterministic is the operative word: a frame-rate-reactive cull
// was considered and REJECTED — it would be nondeterministic (breaking the headless suite's
// byte-identical-across-runs discipline), it is a lagging indicator, and it would let unrelated
// background load silently delete the player's salvage. Do not reintroduce one.
// Chain nodes are NEVER culled — they live in game.chain, not game.garbage, and cullGarbage() only ever
// reads the latter. Severed garbage (Garbage.fromNode) routes through the one ctor, so it is permanent
// too; that is intended (§4.4).

// FLAG-CS024-c: a pure guess, and Gate A question 3 is its A/B ("does the cull ever visibly fire?" —
// it should not). Above SOFT, ONE piece is culled per frame — the oldest, preferring a single over a
// clump — so the ceiling is approached as a slow drip the player never sees, not a purge. HARD is a
// backstop for a pathological burst: above it the field drains to SOFT in a single pass. Both are
// debug knobs (garbageSoftMax / garbageHardMax); the cull is SILENT — no blink, no particle, no sound.
const GARBAGE_SOFT_MAX = 220;   // live loose pieces above which one is culled per frame

// ---------- CS024 P4: THE LEVER ODOMETER (PLANNED-FEATURES-CS024 §2) ----------
// The game's ONE difficulty mechanism. It replaces CS018 P1's levelDef()/TIER_STEPS level table
// outright, which had itself replaced CS017's cycle clock. Every scaling quantity is a LEVER:
//
//     { id, floor, ceil, steps, everyNLevels?, carriesTo? }
//
// A lever has `steps` discrete positions: step 0 IS `floor`, step steps-1 IS `ceil`, and the
// positions between are linearly interpolated. A lever WITH `everyNLevels` is a DRIVER — it advances
// one step every N levels off the level number. A lever WITHOUT `everyNLevels` never advances on the
// clock at all; it moves only when something carries into it.
//
// THE CARRY IS THE WHOLE MECHANISM. When a lever passes its top step it RESETS TO STEP 0 and bumps
// every lever in its `carriesTo` array up one step. That is what makes this an odometer rather than a
// bundle of ramps: junkCount sawtooths 3..12 every ten levels, and each reset leaves the satellites
// permanently faster than they were before it. A lever with an EMPTY carriesTo does NOT wrap — it
// PLATEAUS, pinned at `ceil` forever. So a chain ends by saturating; there is no wrap at the end of
// one, and there is NO LEVEL_MAX any more. The ceiling is emergent, and levels beyond it are flat
// because every lever has run out of chain, not because a clamp caught them.
//
// `carriesTo` IS AN ARRAY, AND THAT IS LOAD-BEARING (§2.1). A single-successor odometer is
// multiplicatively deep: junkCount -> speedLarge -> speedMedium -> speedSmall would not move small
// satellite speed until roughly level 96. One junkCount wrap bumping all three at once lets them
// saturate at different levels while staying genuinely independent levers.
//
// ONLY DRIVERS MAY WRAP (CS024 P6b — the FORK-CS025-A amendment, archive/PLANNED-FEATURES-CS025-old.md §1). A lever
// may declare `carriesTo` ONLY IF IT ALSO DECLARES `everyNLevels`. Every CARRIED lever therefore
// plateaus at its ceiling, always, and THERE IS NO SECOND CARRY GENERATION: the graph is exactly one
// driver deep. This is a restriction of the semantics above, not a redesign, and it exists because the
// unrestricted version shipped a visible difficulty REGRESSION — a carried lever that itself declared
// carriesTo wrapped like any other, so ufoFlightSpeedSmall climbed 150 -> 210 px/s by level 25 and then
// RESET TO 150 AT LEVEL 33, a UFO genuinely slower at 33 than at 25 on one of the most legible
// quantities in the game. It also left that chain's second generation moving twice in 64 levels and not
// reaching its ceilings until level 97 — frozen constants wearing lever clothing.
// Under the rule no carried lever can ever return toward its floor, so nothing in the game can get
// EASIER as levels rise except through an explicitly inverted floor/ceil pair, which is a deliberate
// authoring choice rather than an emergent one. The load-time guard below enforces it; leverState's
// two-flat-pass closed form is what it buys. WHAT IS LOST is the ability to express a chain deeper than
// one carry generation (FLAG-CS025-d) — nothing was using it on purpose. A future changeset that wants
// depth must reopen this rule explicitly rather than discovering it still works.
//
// NOTHING MAY VALIDATE, CLAMP, REORDER OR ASSERT floor <= ceil — not here, not in the debug panel,
// not at a call site (§2.3). Several levers are INVERTED: coalescePause 5.0 -> 1.5, ufoAppearFreq
// 25 -> 12, ufoFireFreq* 1.8 -> 0.7/0.6, both ufoDirChange* and ufoAccuracySmall all descend, because
// a shorter delay and a smaller aim error are HARDER. floor > ceil is normal and correct here. This
// prohibition carries forward unchanged from the retired tier tables, where four of seven levers
// descended for exactly the same reason.
//
// FORK-CS024-A: every number below is a PLAYTEST STARTING POINT, not a decision — Gate B exists to

// THE LOAD-TIME STRUCTURAL GUARD — an INVARIANT, not test scaffolding, in exactly the style of the
// SCOOP_WIDTH[0] !== 0 assertion further up. CS024 P6b REPLACED it rather than deleting it: under the
// drivers-only-wrap rule a CYCLE IS UNREACHABLE BY CONSTRUCTION, so the Kahn topological sort that used
// to stand here — and the "the carriesTo graph contains a cycle" throw that came with it — is gone, and
// what took its place is a STRONGER AND CHEAPER LEGALITY CHECK. The three ways the table can be
// malformed all throw HERE, at load, loudly, rather than producing quietly wrong difficulty:
//   - `carriesTo` declared WITHOUT `everyNLevels`     -> throw. THE RULE: only a driver may wrap. This
//     is the check that would have caught the level-33 flight-speed regression at load rather than at
//     playtest, and it is why nothing downstream needs a cycle check or an ordering pass any more.
//   - `carriesTo` names an id no lever declares       -> throw (a typo would otherwise carry nowhere)
//   - two levers share an id                          -> throw (`raw` is keyed by id, so a duplicate
//     would silently make one lever unreachable)
// THE GRAPH IS STILL A DAG, NOT A CHAIN, and nothing here assumes otherwise: a lever may have two
// parents (leverState sums every incoming carry), and a lever that is BOTH a driver and a carry target
// accumulates both — its own clock ticks seed `raw`, its parents add on top.
// Takes the table as an argument so the invariant can be exercised against a deliberately malformed
// table without disturbing the shipped one, and still returns the order leverState walks — but that
// order is now simply the table's own, because with every carrier a driver and every carry target
// terminal there is nothing left to sort.
function buildLeverOrder(table) {
  const byId = {};
  for (const lev of table) {
    if (byId[lev.id] !== undefined) throw new Error('LEVERS: duplicate lever id "' + lev.id + '"');
    byId[lev.id] = lev;
  }
  for (const lev of table) {
    const carries = lev.carriesTo || [];
    if (carries.length && !lev.everyNLevels)
      throw new Error('LEVERS: "' + lev.id + '" declares carriesTo without everyNLevels — only a driver may wrap');
    for (const id of carries)
      if (byId[id] === undefined) throw new Error('LEVERS: "' + lev.id + '".carriesTo names unknown lever "' + id + '"');
  }
  return table;
}
const LEVER_ORDER = buildLeverOrder(LEVERS);

// PURE: a level number in, a plain { leverId: number } map out. Reads NO game state — not game.wave,
// not DEBUG, nothing — so it is callable before startGame() and is this changeset's primary
// headless-test surface, exactly as levelDef() was. Consumers call it AT THE POINT OF USE (the next
// wave's spawn, the next saucer's construction), never per frame and never cached across an event, so
// a debug override lands on the next relevant event instead of retroactively on what is already flying.
//
// CLOSED FORM, NOT A SIMULATION. This is called at spawn sites, so it must never walk levels 1..wave.
// A driver's total advance is floor((wave - 1) / everyNLevels) directly; a carried lever's is the sum
// of its parents' WRAP counts, and a parent's wrap count is itself floor(parentAdvance / parentSteps).
// UNDER THE DRIVERS-ONLY-WRAP RULE THAT PROPAGATION COLLAPSES (CS024 P6b): every carrier is a driver,
// so its advance is its own clock and nothing else, and floor(floor((wave - 1) / everyN) / steps) is
// exactly floor((wave - 1) / (everyN * steps)) — a dependent's carry count off each of its drivers,
// computed DIRECTLY. And every lever a driver carries into is terminal, so a carry can never cascade.
// Two flat passes settle the whole graph: no recursion, no iteration to a fixed point, and no ordering
// requirement at all (the loops walk LEVER_ORDER only because that is the validated table).
// Levels below 1 clamp to zero ticks — startGame() reads a lever before
// the first nextWave(), while game.wave is still 0 — which makes leverState(0) === leverState(1),
// the same answer levelDef(0) gave through stepAt()'s "first breakpoint" rule.
//
// TWO THINGS ABOUT THE INTERPOLATION ARE DELIBERATE, AND BOTH ARE ABOUT FLOATING POINT.
// (1) IT MULTIPLIES BEFORE IT DIVIDES: (ceil - floor) * step / span returns junkCount as an EXACT
//     integer at every step (9 * 4 / 9 === 4), where the algebraically equal (ceil - floor) *
//     (step / span) returns 3.9999999999999996 at step 1. junkCount is a spawn count.
// (2) THE TWO ENDPOINTS ARE RETURNED VERBATIM, not computed: step 0 IS `floor` and step steps-1 IS
//     `ceil`, exactly, because (0.6 - 1.8) * 3 / 3 is 0.5999999999999999 and a lever whose stated
//     ceiling it never quite reaches would be a lie in every test and every debug readout. `step` is
//     already inside [0, steps-1] by construction — the plateau branch pins it and the wrap branch
//     mods it — so this is an exactness rule at the ends, NOT a clamp, and it is certainly not a
//     floor/ceil ordering check: it never compares the two, only the step index against its own span.
//     CS024 P6c: this is exactly what makes A WRAP LAND ON `floor` AT ANY STEP COUNT. `n % steps` is 0
//     on every wrap boundary whatever `steps` is, and step 0 short-circuits to `lev.floor` verbatim
//     rather than interpolating toward it — so a Steps knob dragged to 2 or to 40 still returns the
//     lever to precisely its floor, never to a fraction near it.
//
// THE BARE-CONTEXT RULE (§4.5), inherited verbatim from levelDef: everything this function reads must
// be declared inside this section, because its test slices the source from the banner above to the
// closing brace below and evaluates that slice and nothing else.
//
// CS024 P6c SPLIT THIS IN TWO, AND THE SPLIT IS WHAT MAKES THE FLOOR/CEIL/STEPS KNOBS POSSIBLE. The
// arithmetic now lives in leverValues(table, wave) — the same closed form, taking the table it walks as
// an ARGUMENT — and leverState(wave) is that function applied to the shipped LEVERS. The debug panel's
// three-knobs-per-lever rows (§2.6) hand it an OVERRIDDEN COPY of the table instead (see liveLevers(),
// down beside the registry). That indirection is not decoration: a Steps override changes a driver's
// WRAP PERIOD, which changes how many carries its dependents receive, so it cannot be expressed as a
// post-hoc override of leverState's OUTPUT the way P5's retired flat rows were. It has to go in before
// the derivation runs, and the only way in is the table.
// leverState() ITSELF STAYS PURE and stays the bare-context test surface: it reads no DEBUG, no game
// state, nothing outside this section. liveLevers() — the one function that does read DEBUG — lives
// OUTSIDE the slice, on purpose (§2.6 "purity is not negotiable").
function leverValues(table, wave) {
  const raw = {}, out = {};
  for (const lev of table) raw[lev.id] = lev.everyNLevels ? Math.max(0, Math.floor((wave - 1) / lev.everyNLevels)) : 0;
  // PASS 1 — EVERY CARRY, in one flat sweep. A carrier is a driver (the guard guarantees it), so it
  // wraps once every everyNLevels * steps levels; each of those wraps bumps every id it carries into.
  // Every one of those ids is terminal, so nothing here can cascade and the order of this loop cannot
  // matter. A lever with two parents simply receives both sums.
  for (const lev of table) {
    if (!lev.carriesTo || !lev.carriesTo.length) continue;
    const wraps = Math.max(0, Math.floor((wave - 1) / (lev.everyNLevels * lev.steps)));
    if (wraps > 0) for (const id of lev.carriesTo) raw[id] += wraps;
  }
  // PASS 2 — the value each lever's accumulated advance lands on.
  for (const lev of table) {
    const n = raw[lev.id];
    const carries = lev.carriesTo && lev.carriesTo.length ? lev.carriesTo : null;
    // A lever with somewhere to carry WRAPS — it is a driver, and it sawtooths forever. A lever with
    // nowhere to carry PLATEAUS at its top step, which is now EVERY carried lever in the table. The
    // plateau pins a STEP INDEX — it is not, and must never become, a floor/ceil ordering check.
    const step = carries ? n % lev.steps : (n < lev.steps - 1 ? n : lev.steps - 1);
    const span = lev.steps - 1;
    out[lev.id] = step <= 0 ? lev.floor : step >= span ? lev.ceil : lev.floor + (lev.ceil - lev.floor) * step / span;
  }
  return out;
}
// The shipped odometer: leverValues over the shipped, load-time-validated table. THIS SIGNATURE IS
// LOAD-BEARING — the bare-context slice test finds this exact line and slices from the banner above to
// the brace that closes it, so everything the derivation needs stays above it and everything that reads
// DEBUG stays below. Keep it a one-liner over LEVER_ORDER; give the TABLE to leverValues, never here.
//
// ⛔ IT HAS NO IN-GAME CALLER AS OF CS024 P6c, AND THAT IS NOT VESTIGIAL — DO NOT DELETE IT ON A
// CLEANUP PASS. Every consumer reads liveLevers(), which is this same derivation over the table the
// debug panel may have overridden. leverState is what liveLevers is DEFINED AGAINST: it is the
// odometer's pure statement of the shipped ramp, the bare-context slice three phases of headless tests

const AudioSys = {
  ctx: null, thrustNode: null, thrustGain: null,
  saucerOsc: null, saucerGain: null,
  // Gain routing (F8). vol holds the three slider values (0..1, 1 = unity = pre-F8 loudness);
  // master/sfx/music are the gain nodes built in init(). Volumes persist even before the audio
  // graph exists (no user gesture yet) so loadSettings() can set them and init() apply them.
  vol: { master: 1, sfx: 1, music: 1, voice: 1 }, // CS010 P9: `voice` is Dan's speech bus (VoiceSys)
  master: null, sfx: null, music: null, voice: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();

    // gains. music is wired for a future track — NOTHING is connected to its input yet (there is
    // no music in the game; the slider exists so it's ready), see delivery notes / GDD §2.8.
    this.master = this.ctx.createGain(); this.master.gain.value = this.vol.master; this.master.connect(this.ctx.destination);
    this.sfx    = this.ctx.createGain(); this.sfx.gain.value    = this.vol.sfx;    this.sfx.connect(this.master);
    this.music  = this.ctx.createGain(); this.music.gain.value  = this.vol.music;  this.music.connect(this.master);
    // CS010 P9: Dan's speech bus, mirroring sfx/music. VoiceSys builds its radio chain onto this node.
    this.voice  = this.ctx.createGain(); this.voice.gain.value  = this.vol.voice;  this.voice.connect(this.master);
  },
  // Set a category volume and, if the graph is live, push it to the node immediately (F8 sliders).
  setVol(cat, v) {
    this.vol[cat] = v;
    // CS010 P9: the bus nodes are named by category, so a lookup can't silently misroute a new bus —
    // the old master/sfx/music ternary would have written setVol("voice",…) to the MUSIC gain.
    const node = this[cat];
    if (node) node.gain.value = v;
  },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  now() { return this.ctx ? this.ctx.currentTime : 0; },

  fire() {
    if (!this.ctx) return;
    const t = this.now();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(160, t + 0.12);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g).connect(this.sfx);
    o.start(t); o.stop(t + 0.15);
  },

  explosion(size) { // size 1..3, bigger = deeper/longer
    if (!this.ctx) return;
    const t = this.now();
    const dur = 0.25 + size * 0.15;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.6);
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(900 - size * 180, t);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filt).connect(g).connect(this.sfx);
    src.start(t);
  },

  thrust(on) {
    if (!this.ctx) return;

      const dur = 1;
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const filt = this.ctx.createBiquadFilter();
      filt.type = "lowpass"; filt.frequency.value = 320;
      const g = this.ctx.createGain();
      g.gain.value = 0.10;

      this.thrustNode = src; this.thrustGain = g;
