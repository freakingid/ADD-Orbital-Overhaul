  resetRun(DEBUG.startLevel - 1, DEBUG.startLevel > 1);
  nextWave();
}

// The shared reset — everything a run needs zeroed, and nothing else. It deliberately does NOT call
// nextWave(): the caller does, because resumeFromSave() has restore work to do in between.
// ⛔ THE STANDING CS016 P3 RULE'S SECOND SITE — every "declared in BOTH this literal and ..." note
// in the game object points HERE. A new game.* field goes in the game literal and in this body, never
// in startGame(): a field added there is set for a fresh run and missed by every resumed one.
function resetRun(wave, debugRun) {
  game.state = "playing";
  game.paused = false;
  game.deathT = 0; game.shake = 0;   // v3.6 P5: a fresh run never carries death-spectacle state over
  game.entry = null; game.lastScoreId = null; // v3.6 P6: nor any stale initials-entry/highlight state
  // CS016 P2: screen back to null — in play there is no menu (the title menu belongs to the title).
  // Confirmed correct as-is; the only entry point that now reaches here from a menu is menuTitle's
  // "Start Game", and this reset already clears it.
  // CS016 P3: `modal` is added to BOTH this reset and the game literal, per the standing note that
  // `scroll` was only ever added to the literal (see STATUS.md Known issues) — a new game.menu field
  // that lands in one and not the other is `undefined` for the whole of a run. CS016 P5's `achTab`
  // follows the same rule (achTabIndex() defends against a bad id anyway, but the field should never
  // BE undefined in the first place).
  // CS031 P3: nameBuf/nameCtx/nameErr are here AND in the game literal, same standing rule.
  // CS032 P3: slotMode/slotMsg follow it too.
  game.menu = { screen: null, index: 0, row: 0, col: 0, rebinding: null, modal: null, achTab: ACH_TAB_DEFAULT,
                nameBuf: "", nameCtx: null, nameErr: "", slotMode: null, slotMsg: "" }; // ensure no menu carries in
  DiffLog.rows = []; // CS017 P2: dev log is per-run, never carries into a fresh game
  game.stats = resetGameStats();  // fresh per-game achievement tracking (F9)
  game.toasts = [];               // clear any lingering unlock toasts
  game.pendingAch = [];           // CS030 P1: clear any lingering unflushed unlocks
  game.celebration = null;        // CS030 P1: no panel carries into a fresh game
  game.score = 0;
  // CS024 P6d: STICKY, and set exactly once per run — from the caller's argument, never re-read from
  // DEBUG.startLevel down here (see the knob comment at startGame()'s own call).
  game.debugRun = debugRun;
  // CS032 P2 (spec §2.9): the both-places rule's second site for game.resumedRun. Every run starts
  // eligible; resumeFromSave() flips it true AFTER this reset returns, and nothing ever flips it back.
  game.resumedRun = false;
  game.wave = wave;
  // A fresh run never carries a stale waveTime. nextWave() (called at the end of this function) zeroes
  // it again for level 1, exactly as it does for every other level. (CS018 P4 removed the
  // game.cycle/game.cycleWave resets that used to sit on this line with it.)
  game.waveTime = 0;
  game.nextRepair = REPAIR_MILESTONE;
  game.debris = []; game.bullets = []; game.saucers = [];
  game.hunters = []; game.particles = [];
  game.garbage = []; game.chain = []; game.floaters = [];
  game.powerups = [];
  // CS024 P6: `game.powerFx`'s reset STOOD HERE, deleted with the field itself. powerBudget now carries
  // `engine` too, and this literal must stay in step with the game-object literal above (the standing
  // CS016 P3 rule — a key in only one of the two reads `undefined` for a whole run).
  game.powerBudget = { rapid: 0, triple: 0, magnet: 0, engine: 0, guard: 0 }; // budgets reset with the run (P5; guard CS017 P6; engine CS024 P6)
  game.powerBank = { rapid: 0, triple: 0, magnet: 0, engine: 0, guard: 0 };    // bank-flash state resets with the run (P5)
  game.powerBankAmt = { rapid: 0, triple: 0, magnet: 0, engine: 0, guard: 0 };
  game.magnetHoldT = 0;            // CS025 P1: no magnet-suppression hold carries into a fresh run. A fresh
                                   // run starts with an EMPTY chain, so the first pickup-block frame reads
                                   // not-full and would tick this down anyway — but the field must exist in
                                   // both places (the CS016 P3 rule), and 0 is the honest starting value.
  game.cargoWasFull = false;       // CS025 P2: the rising-edge detector starts DOWN. A fresh run starts with an
                                   // EMPTY chain, so the first pickup-block frame would write false anyway — but
                                   // the field must exist in both places (the CS016 P3 rule), and carrying a
                                   // stale `true` out of a previous run would swallow the first fill's kick.
  game.scoopLevel = 0; game.scoopHits = 0;               // persistent scoop upgrade resets each run (v3.3 P3)
  game.healthTimer = rand(POWERUP_HEALTH_GAP[0], POWERUP_HEALTH_GAP[1]);
  game.sweepPause = 0;             // CS018 P9: no sweep coalescence-pause carries into a fresh run
  game.cargoMax = CARGO_BASE;      // pre-level-1 default; nextWave() below immediately overwrites it via payloadSlots(game.wave) (8 at level 1) — CS018 P5
  game.cargoFlash = 0;             // CS009 P3: no cap-up flash carries into a fresh run
  game.deliveryCount = 0; game.offloadTimer = 0;
  game.deliveryTicker = null;      // CS029 P4: no ticker carries into a fresh run
  game.comboGrace = 0;             // CS020 P1b: no one-effort grace carries into a fresh run
  // CS022 P1: a fresh run always starts in the FIELD-sized world, and this line MUST precede
  // `new Ship()` below — Ship.reset() reads WORLD_W/2 and WORLD_H/2 directly, so a run started after
  // dying on an orbit level would otherwise spawn at the stale 5120x2880 world's centre and then be
  // sitting outside the 2560x1440 one. It also re-sets game.worldSize (the CS016 P3 both-places rule)
  // and rebuilds the active starfield. applyWorldSize MOVES NOTHING — there is nothing to move here:
  // every entity array was emptied a few lines above.
  applyWorldSize(WORLD_SIZE_FIELD);
  game.ship = new Ship();
  game.hudHull = game.ship.hp / SHIP_MAX_HP;   // CS009 P1: no drain animation on a fresh run
  game.camera = { x: game.ship.x, y: game.ship.y };
  game.saucerTimer = ufoAppearInterval(); // CS018 P6: first saucer waits one jittered appearance interval. game.wave is still 0 here (pre-nextWave()), which leverState() answers as level 1 — the same pre-wave-1 reading levelDef(0) gave through stepAt()
  // CS024 P3: `game.hunterTimer = rand(14, 22);` STOOD HERE (the ambient producer's first-spawn seed).
  game.lowHpSiren = false; AudioSys.lowhp(false); // fresh run never carries the siren over (v3.4 P5)
  game.lowHpPhase = 0;      // CS010 P3: the pulse accumulator starts a fresh run at 0
  game.hpReliefFlash = 0;   // CS010 P3: no stale relief exhale carries into a fresh run
  // CS010 P9: Dan's latches. lowHpVoiced false (not yet at low HP); hpFullVoice TRUE (spawns full — no
  // "brand new ship" at wave start); powerVoiced all false. reset() clears any in-flight line + cooldown.
  game.lowHpVoiced = false;
  game.hpFullVoice = true;
  game.powerVoiced = { rapid: false, triple: false, magnet: false, engine: false, guard: false };
  game.caption = { text: "", life: 0, dur: 0 }; // CS011 P2: no stale caption carries into a fresh run
  // CS025 P5: same for the level banner. ⛔ ORDER IS LOAD-BEARING — this clear must stay ABOVE the
  // nextWave() call below, which is what SETS the level-1 banner. Moving it after would blank the banner
  // of the level the player is about to start, and the bug would only show on level 1.
  game.levelBanner = { text: "", life: 0 };
  VoiceSys.reset();
}

// ---------- Resuming a run from a save slot (CS032 P2; spec §1.3, FORK-A, FORK-F) ----------
// The restore half of CS032, and the sibling of startGame() above. `entry` is one slot's contents as
// SaveSlots.read() hands it back — a plain object parsed straight out of localStorage, so it is
// untrusted data, not a value this code produced. The order below is the whole phase:
//
//   1. resetRun()  — identical to a fresh run, from the ONE shared list.
//   2. overwrite   — the save-moment values (FORK-A), on top of the fresh state.
//   3. resumedRun  — forced true, unconditionally, every call.
//   4. nextWave()  — announces the level and builds the field, exactly as a fresh run does.
//
// ⛔ INVARIANT — STEP 2 PRECEDES STEP 4 (spec §2.6). nextWave() reads game.stats.powerupsPicked to gate
// Achievements.lifetime.maxWaveNoPowerup. Restore the stats after it and that gate reads a fresh-zeroed
// counter and credits the resumed level to a MAX counter that never earned it. Step 3 stops that from
// ever reaching disk, but it would still fire a same-session toast the player did not earn.
//
// ⛔ INVARIANT — game.hudHull FOLLOWS THE RESTORED HP. resetRun() set it from a full-HP ship; leaving it
// there and dropping hp to 30 plays a phantom drain animation over the resumed run's first half-second.
//
// ⛔ THE WAVE COMES FROM THE ENTRY, NEVER FROM DEBUG.startLevel — it is passed into resetRun() rather
// than assigned after it, for the same reason startGame() passes its own: the reset seeds
// game.saucerTimer from the level it is about to play. Same value, one line earlier than the spec's
// step list, and no reader in between.
//
// ⛔ NOTHING IS CLEARED FROM THE SLOT (FORK-D). This function does not touch SaveSlots at all.
//
// KNOWN-VALUE-ELSE-DEFAULT, per the standing save-data rule: a slot is persisted JSON that a corrupt
// write, a hand edit, or a future `kind` could have left with a missing or wrong-typed field, and an
// undefined landing in game.score poisons the run's arithmetic forever. Every field falls back to the
// value resetRun() just installed, which is by definition the honest fresh-run default.
function resumeFromSave(entry) {
  const e = entry && typeof entry === "object" ? entry : {};
  const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);

  // ---- 1. Fresh-run state, through the SAME reset startGame() uses ----
  resetRun(num(e.wave, 1) - 1, e.debugRun === true);

  // ---- 2. The save-moment values, on top ----
  game.score      = num(e.score, game.score);
  game.nextRepair = num(e.nextRepair, game.nextRepair);
  game.scoopLevel = num(e.scoopLevel, game.scoopLevel);
  game.scoopHits  = num(e.scoopHits, game.scoopHits);
  // HP is set on the Ship resetRun() just constructed. Clamped into [1, SHIP_MAX_HP]: a slot is only
  // ever written mid-play so a real one is always in range, but a value outside it would resume either
  // an unkillable ship or an already-dead one that no damage path is holding the death for.
  game.ship.hp = Math.max(1, Math.min(SHIP_MAX_HP, num(e.hp, game.ship.hp)));
  game.hudHull = game.ship.hp / SHIP_MAX_HP;   // ⛔ the invariant above — no phantom drain on frame 1
  const pb = e.powerBudget && typeof e.powerBudget === "object" ? e.powerBudget : {};
  for (const k in game.powerBudget) game.powerBudget[k] = num(pb[k], game.powerBudget[k]);
  // stats: known keys only, type-matched, over the defaults resetGameStats() just installed — the
  // Achievements.loadCounters() idiom. Copied field by field rather than assigned wholesale so the run
  // can never end up ALIASING the slot object it resumed from (the mirror of buildSaveEntry()'s own
  // copy rule): a live run writing through into a slot is exactly the bug that rule exists to stop.
  const st = e.stats && typeof e.stats === "object" ? e.stats : {};
  for (const k in game.stats) {
    if (k === "powerUsed") continue;                                  // nested — its own loop below
    if (typeof st[k] === typeof game.stats[k]) game.stats[k] = st[k];
  }
  const pu = st.powerUsed && typeof st.powerUsed === "object" ? st.powerUsed : {};
  for (const k in game.stats.powerUsed)
    if (typeof pu[k] === "boolean") game.stats.powerUsed[k] = pu[k];

  // ---- 3. ⛔ UNCONDITIONAL. Every call, every entry, no exceptions ----
  // This is the flag that makes FORK-A's save-moment values safe to ship: the run that just loaded can
  // no longer reach the high-score table or persist an achievement/lifetime write, so score banked
  // before the load cannot be replayed into a record. There is no "earn it back" path, by design.
  game.resumedRun = true;

  // ---- 4. The level the player saved on ----
  // Its voice line and banner fire normally: the player wants to know where they landed.
  nextWave();
}

// ---------- CS024 P1: THE ORBIT-LEVEL LAYOUT SECTION IS GONE (PLANNED-FEATURES-CS024 §1.1/§4.1) ----------
// THIRTEEN FUNCTIONS STOOD HERE and are removed outright with the archetype: generateOrbitLayout,
// placeOrbitRing, nearestOrbitDist, spawnSafeOrbitLayout, orbitTangent, orbitSyncVelocity, orbitGapMult,
// orbitRadiusStepFor, orbitEffectiveCount, activeRingsFor, orbitEffectiveGapMult, spawnOrbitWave and
// rerollOrbitStartAngles — the ring generator, its spawn-safety reroll, the rail-tangent pair the split
// site and the motion mode read, the two occurrence-scaled curves, the geometry clamp, the ring ramp and
// the debug reroll. Their whole subject (rails, rings, occurrences) no longer exists.
//
// TWO OF THEM HAD READERS OUTSIDE THIS SECTION, and neither is left dangling. orbitTangent() fed
// destroyDebris()'s split handoff — a shattered orbiting parent handed its three children its
// instantaneous rail tangent as vx/vy — and orbitEffectiveCount()/orbitRadiusStepFor() fed
// maxOrbitSpeed(), the inward drift's speed cap. Both consumers are removed at their own sites this
// phase, so nothing replaces either function: the code each one guarded became unreachable the moment
// no body could carry orbit state.

// CS022 P3 (spec §4.6): the FIELD SCATTER, extracted VERBATIM out of nextWave()'s field branch so both
// archetypes can call it — a field level spawns its own junkCount this way, and an orbit level spawned
// the PREVIOUS level's junkCount on top of its rings (spec §1.4, FORK-CS022-F; both the archetype and
// the level table it read are gone now, CS024 P1/P4, and this is the only spawn path). The body is a
// pure extraction: `git diff -w` on the field branch reads as an indent change, and test-cs022-p3.js
// §E pins that against the pre-P3 commit rather than trusting the eye. Ship-relative and wrap-aware, so
// it is correct at either world size without knowing which one it is running in.
// `n` ARRIVES ALREADY ROUNDED (CS024 P6c) — nextWave() is the one lever-driven caller and rounds the
// junkCount lever there, at the point of use, so the count it logs is the count that spawns. This loop
// deliberately does not round defensively: a second rounding site is a second place for the two to
// disagree, which is exactly the bug the P6c note at nextWave() describes.
function spawnFieldSatellites(n, speed) {
  for (let i = 0; i < n; i++) {
    // spawn in a ring around the ship's current world position so the wave is
    // reachable (min distance keeps it off the ship, max keeps it from being
    // stranded on the far side of the big world)
    const a = rand(0, TAU);
    const d = rand(SPAWN_MIN_DIST, SPAWN_MAX_DIST);
    const p = wrapPos({ x: game.ship.x + Math.cos(a) * d, y: game.ship.y + Math.sin(a) * d });
    game.debris.push(new DebrisSatellite(p.x, p.y, 3, speed));
  }
}

function nextWave() {
  game.wave++;
  // CS018 P4: the cycle-clock derivation that used to sit here is gone — game.wave is the ONE
  // difficulty clock, and leverState(game.wave) reads it directly (levelDef did before CS024 P4). FLAG-k: waveTime's value is captured
  // BEFORE it is zeroed so logDifficultySnapshot can record how long the level just finished took;
  // reading it after the reset would only ever log 0.
  const prevLevelSecs = game.waveTime;
  game.waveTime  = 0;
  VoiceSys.sayLevel(game.wave); // CS011 P4 — announces Level 1 too (VoiceSys.reset() ran just above in startGame)
  // CS025 P5 (gate Q6) — the VISUAL half of the level announcement, and the half that cannot be lost.
  // Same string sayLevel() speaks, but set unconditionally: no AudioSys.ctx guard (this is a render field,
  // and gating it on audio would hide the banner for a player who has not yet produced a user gesture),
  // no captions setting, no voice gate. Level 1 gets one too, for the same reason sayLevel() does.
  // CS026 P5: reads DEBUG.levelBannerTime, not the constant — drawLevelBanner() derives elapsed by
  // subtracting from this SAME value, so both sites must read the same source (see the registry comment).
  game.levelBanner = { text: "Level " + game.wave, life: DEBUG.levelBannerTime };
  // v3.4 P7: intensity recomputed ONLY on wave change, never per-frame — keeps updateMusic()'s
  // per-frame path clean. Runs at wave 1 too (startGame calls nextWave()), so a fresh run starts
  // pinned to musicIntensity(1) === 0 (foundation layer only) before any track has even loaded.
  // CS024 P4: the callee is renamed, not rewritten — same curve, same 0 at wave 1 (spec §1.6).
  MusicSys.setIntensity(musicIntensity(game.wave));
  // CS018 P5 / FORK-CS018-B: payload capacity is GRANTED by level, not earned by deliveries. Set on
  // every level including level 1 (startGame calls nextWave()), so a fresh run starts at 8 slots.
  // CS024 P4: was levelDef(game.wave).payloadSlots — the column moved out of the retired level table
  // into its own fixed curve, deliberately OUTSIDE the odometer (§2.5). Same numbers, same site.
  game.cargoMax = payloadSlots(game.wave);
  game.stats.dmgThisWave = 0; // fresh damage-free window for the new wave (F9 perfect-wave tracking)
  Achievements.lifetime.maxWave = Math.max(Achievements.lifetime.maxWave, game.wave); // Century Club / Master of the Field
  // No Powerups Needed (MAX): best wave reached while still powerup-free this game. Frozen for the
  // rest of the game the moment a powerup is picked (powerupsPicked > 0), so it records the deepest
  // wave the player reached before ever touching a powerup. (FLAG A-1-b — a MAX counter, not a sum.)
  if (game.stats.powerupsPicked === 0)
    Achievements.lifetime.maxWaveNoPowerup = Math.max(Achievements.lifetime.maxWaveNoPowerup, game.wave);
  // CS022 P1 (§4.1/§4.2): the torus period is a function of the level's ARCHETYPE, so it can change at
  // every wave boundary — up at every 3rd level and back down at the level after, 42 times in a
  // 63-level run. THIS SITE IS THE ONLY CORRECT ONE and both halves of that are load-bearing: it must
  // run AFTER game.wave++ (worldSizeFor reads the NEW level) and BEFORE `new Dock()` on the next line
  // (dock placement is ship-relative and wrap-aware, so it needs both the new period and the
  // re-centred ship). Only a real change resizes — a field level following a field level moves nothing.
  const nextWorldSize = worldSizeFor(game.wave);
  if (nextWorldSize !== game.worldSize) resizeWorld(nextWorldSize);
  game.dock = new Dock(); // recycling dock relocates each wave
  // F3 first-pass balance: trimmed from min(4+wave, 11) to offset the ~8x higher garbage
  // volume from guaranteed 3-per-tier drops. (CS024 P3 restores the v3.2 P3 rule: garbage no longer
  // decays, so density is held by coalescence + shatter-to-harvest + the cullGarbage() ceiling.)
  // CS024 P5 (spec §2.4/§4.5): was FROZEN_JUNK_COUNT for one phase (CS024 P4, TRAP 2). Now reads the
  // JUNK chain's driver — liveLevers(game.wave).junkCount — at the point of use, its own sawtooth (3..12
  // over ten levels, then a wrap that bumps all three junkSpeed* levers permanently) replacing the
  // retired JUNK_CYCLE table. No count clamp here either way: the old in-cycle/hard-max debris clamps
  // (deleted, CS024 P2) were never applied at this site, and the lever is bounded by construction — its
  // ceiling IS its top step.
  //
  // ⛔ junkCount IS THE ONE INTEGER-VALUED LEVER, AND THIS IS WHERE IT IS ROUNDED (CS024 P6c, spec §2.6).
  // Every other lever is a speed, an interval, a multiplier or an angle — all continuous, all fine
  // fractional. This one is a COUNT OF SATELLITES, and until P6c nothing had to round it: at the shipped
  // 3/12/10 the interpolation lands on a whole number at every step. THE STEPS KNOB BREAKS THAT — 3/12/7
  // interpolates to 3, 4.5, 6, 7.5, 9, 10.5, 12, and `for (let i = 0; i < 4.5; i++)` would silently
  // spawn five satellites while the panel and the difficulty log both said four and a half.
  // ROUND, NOT FLOOR, AND THE CHOICE IS DELIBERATE. Math.round is the NEAREST achievable count to the
  // authored curve (off by at most half a satellite, where flooring is off by up to a whole one), it
  // returns both authored endpoints EXACTLY whenever they are whole (as all three JUNK-chain endpoints
  // are), and it stays monotonic, so a step up can never spawn fewer. Flooring would instead shave every
  // interior step of every retune downward — a systematic bias that would make mid-ramp levels quietly
  // easier than the number on the slider, and would make the difficulty log lie by a full satellite in
  // the same direction every time. Rounding HERE rather than inside spawnFieldSatellites() is what keeps
  // logDifficultySnapshot's junkCount column honest: it is handed this same local, so the log records
  // what actually spawned.
  const lv = liveLevers(game.wave);
  const count = Math.round(lv.junkCount);
  const speed = lv.junkSpeedLarge;
  // CS024 P1 (spec §4.1, consequence 3): THE ARCHETYPE BRANCH IS GONE. CS021 P1 put a two-way switch
  // here — "field" scattered junkCount satellites, "orbit" laid concentric rings around the dock and
  // (from CS022 P3) added the previous level's junkCount as scatter on top. spawnFieldSatellites() is now
  // the ONLY spawn path and is called unconditionally, with the lever's own junkCount, on every level.
  // That also retires FLAG-CS022-g: `count` is once again both what the odometer says AND what the
  // level actually spawns, so logDifficultySnapshot()'s junkCount column can no longer disagree with the
  // field in front of the player.
  spawnFieldSatellites(count, speed);
  // CS024 P3 (spec §1.2/§4.2): CS017 P5's BONUS-CANISTER SPAWN BLOCK STOOD HERE — one bonusSpawnChance()
  // roll per wave that pushed a pre-linked 6-piece `Garbage` into the field on the same ring-around-the
  // -ship rule as the debris above. Removed outright. nextWave() now spawns satellites and nothing else,
  // and — the other half of this phase — IT STILL CLEARS NOTHING: loose garbage carries across the level
  // boundary and, with decay gone, does so permanently. That is what makes the density ceiling in
  // cullGarbage() necessary rather than defensive.
  logDifficultySnapshot(count, speed, prevLevelSecs); // CS017 P2: dev-only, one row per level (see DiffLog above)
}

function addScore(pts) {
  game.score += pts;
  // Score milestones repair the hull instead of granting an extra life (F2).
  if (game.score >= game.nextRepair) {
    game.nextRepair += REPAIR_MILESTONE;
    if (game.ship.hp < SHIP_MAX_HP) {
      game.ship.hp = Math.min(SHIP_MAX_HP, game.ship.hp + REPAIR_AMOUNT);
    } else {
      game.score += REPAIR_FULL_BONUS; // already at full HP: cash the milestone in as points
    }
    AudioSys.shieldPing();
  }
}

function boom(x, y, size, color) {
  const n = 6 + size * 6;
  for (let i = 0; i < n; i++) game.particles.push(new Particle(x, y, color));
  AudioSys.explosion(size);
}

function destroyDebris(a, awardScore = true) {
  a.dead = true;
  if (awardScore) {
    addScore(DEBRIS_SCORE[a.size]); game.stats.debrisKills++; // Satellite Buster (player kills only)
    // Field Sweeper (lifetime MAX): best Debris destroyed in one game — debrisKills climbs within a run.
    Achievements.lifetime.bestDebrisGame = Math.max(Achievements.lifetime.bestDebrisGame, game.stats.debrisKills);
  }
  boom(a.x, a.y, a.size, COLOR.debris);
  // Every tier's destruction — including the final small-tier kill — emits exactly
  // DEBRIS_GARBAGE canisters (F3), each with an outward kick so they fan out instead
  // of stacking. All are mass 1.0 by the Garbage default.
  for (let i = 0; i < DEBRIS_GARBAGE; i++) {
    const spread = rand(0, TAU), kick = rand(20, 55);
    game.garbage.push(new Garbage(a.x, a.y,
      a.vx * 0.25 + Math.cos(spread) * kick,
      a.vy * 0.25 + Math.sin(spread) * kick));
  }
  // Large -> N mediums, medium -> N smalls, small -> destroyed. N is the junkSplit lever (CS026 P2):
  // 2 through level 10, 3 from level 11 on, forever. (F3 shipped this as a hardcoded 3-way split.)
  if (a.size > 1) {
    // CS024 P5 (spec §4.5): the SECOND debris-speed site — a split child must move like a freshly-spawned
    // piece of THIS wave, at the CHILD'S OWN size lever (a large splitting to medium reads junkSpeedMedium,
    // a medium splitting to small reads junkSpeedSmall; junkSpeedMul()'s shared-ratio derivation is gone,
    // CS024 P5 deletion). Reads liveLevers(game.wave) at the point of use like every other consumer.
    const lv = liveLevers(game.wave);
    const speed = a.size - 1 === 2 ? lv.junkSpeedMedium : lv.junkSpeedSmall;
    // CS024 P1: CS021 P1's rail handoff (FORK-CS021-C2 -> (i)) STOOD HERE — a shattered ORBITING parent
    // handed its three children its instantaneous orbital tangent as vx/vy. `tangent` was null for every
    // field-level parent, so that conditional never fired off an orbit level; removing it leaves the
    // shipped scatter path exactly as it has always been, and every child now simply takes the fresh
    // random velocity its own constructor rolls.
    // CS026 P2 (spec §1, FORK-CS026-A -> (b)): the child count is the junkSplit lever, read off the SAME
    // liveLevers(game.wave) call the speed above already resolved — one call, at the point of use, so a
    // panel override moves the split on the very next kill exactly as it moves the speed. liveLevers,
    // NEVER leverState: the panel must be able to move it.
    // ⛔ Math.round, NOT Math.floor, for junkCount's reason at nextWave(): it returns both authored
    // endpoints exactly, it is the nearest achievable count to the authored curve, and flooring would
    // shave every interior step of every future retune downward.
    const children = Math.round(lv.junkSplit);
    // CS028 P1 (spec §3): IDENTITY CROSSES THE SPLIT. Every child inherits `a.craft`, so a large and
    // the mediums it shatters into are the same spacecraft — they were one object a moment ago. (At
    // the medium -> small step the constructor ignores both args: the small tier draws generic scrap.)
    // FORK-CS028-A — the piece index is a ROTATING OFFSET rolled once per kill, not the bare loop
    // index. junkSplit is 2 through level 10, so `piece = i` would show pieces 0 and 1 for the first
    // ten levels and never piece 2 until level 11 — a third of the art unseen for a third of a typical
    // run. The offset keeps a kill's children distinct (consecutive indices, mod 3 in the ctor) while
    // making WHICH pieces you see a per-kill roll. ⚠ Best guess, open at the CS028 gate (§5 q1): a
    // swap to the bare `i` is one line, if piece 2 should instead read as a late-game reveal.
    const pieceOffset = Math.floor(rand(0, 3));
    for (let i = 0; i < children; i++) {
      game.debris.push(new DebrisSatellite(a.x, a.y, a.size - 1, speed, a.craft, pieceOffset + i));
    }
  }
}

// Destroy one Hunter Satellite: score + boom + garbage, then split — or, at the small tier,
// a larger burst of LOW-mass scrap and no children. Parallels destroyDebris (F3); the garbage
// fan-out mirrors that pattern. Called both when shot and when a homer dies on the shield.
function destroyHunter(h, awardScore = true) {
  h.dead = true;
  if (awardScore) {
    addScore(HUNTER_SCORE[h.size]);
    // Achievement stats (F9): every Hunter death (bullet OR shield-kill) is a player kill. Lineage
    // count -> Hunter's Bane (a full 13-member line from one spawn); large cores -> Diamond Cutter;
    // all tiers -> Ghost Protocol (lifetime).
    // v3.6 P5: these counters are now gated on `awardScore` (mirroring destroyDebris, which already
    // gated its debrisKills/bestDebrisGame the same way) so the "dying"-state chain detonations —
    // the ONLY caller that ever passes awardScore=false — move NO score AND NO achievement counters.
    // Both real gameplay callers (player bullet, shield-kill) pass true, so their behaviour is
    // unchanged; before this, awardScore=false would have leaked lifetime hunterKills on every death.
    game.stats.hunterLineageKills++;
    if (game.stats.hunterLineageKills >= ACH_LINEAGE_FULL) game.stats.hunterLineComplete = true;
    if (h.size === 3) game.stats.largeHunterKills++;
    Achievements.lifetime.hunterKills++;
  }
  boom(h.x, h.y, h.size, COLOR.satellite);
  // v3.3 P4 (9b, reverses v3.2 P3's FORK-B/B1): EVERY Hunter drops garbage at its tier counts,
  // regardless of origin. This reopens the 12-in/66-out amplifier a coalesced lineage represents —
  // deliberately: 9a's single-decay is now the governor holding the field, not emission suppression.
  if (h.size === 1) {
    // Final tier: an easy-to-tow bonus pile of low-mass canisters (mass 0.5, paler tint).
    for (let i = 0; i < HUNTER_GARBAGE[h.size]; i++) {
      const spread = rand(0, TAU), kick = rand(30, 70);
      game.garbage.push(new Garbage(h.x, h.y,
        h.vx * 0.25 + Math.cos(spread) * kick,
        h.vy * 0.25 + Math.sin(spread) * kick,
        HUNTER_SMALL_MASS));
    }
  } else {
    // Large/medium: normal-mass canisters (tiered), then a 3-way split into actively-homing children.
    for (let i = 0; i < HUNTER_GARBAGE[h.size]; i++) {
      const spread = rand(0, TAU), kick = rand(20, 55);
      game.garbage.push(new Garbage(h.x, h.y,
        h.vx * 0.25 + Math.cos(spread) * kick,
        h.vy * 0.25 + Math.sin(spread) * kick));
    }
    // ⛔ THREE, HARDCODED, AND IT STAYS THAT WAY — DO NOT "FINISH THE JOB" STARTED IN destroyDebris().
    // CS026 P2 made the DEBRIS split a lever (junkSplit: 2 through level 10, 3 after). This loop reads
    // almost identically and sits forty lines below it, which is exactly why this note is here. A Hunter
    // lineage is 1 + 3 + 9 = 13 bodies, and ACH_LINEAGE_FULL is that 13: Hunter's Bane requires killing a
    // whole line from one spawn. A 2-way Hunter split makes a lineage SEVEN bodies and the achievement
    // STRUCTURALLY UNREACHABLE — an unwinnable achievement, not a difficulty tweak. If a future changeset
    // genuinely wants a Hunter split lever, ACH_LINEAGE_FULL has to be derived from it in the same edit.
    for (let i = 0; i < 3; i++) {
      const scatterAngle = (i / 3) * TAU + rand(-0.3, 0.3);
      game.hunters.push(new HunterSatellite(h.x, h.y, h.size - 1, scatterAngle));
    }
    // v3.6 P3 (Source 2): the large core — not its medium/small children — always drops one
    // powerup on its own velocity, as if spitting out its cargo along its spawn-time drift.
    if (h.size === 3) dropPowerup(h.x, h.y, h.vx, h.vy);
  }
}

// Destroy a Saucer: score + achievement counters + boom + sound, then always drop one powerup
// on the saucer's own velocity (v3.6 P3, Source 1 — every UFO, large or small). The single choke
// point for both saucer-kill sites (player bullet, shield body contact), which were previously
// copy-pasted.
// CS023 P3 (C13 / FORK-CS023-E/F): `awardScore` gates addScore + BOTH achievement counters and NOTHING
// else — dropPowerup stays unconditional, mirroring destroyDebris/destroyHunter's existing contract
// exactly (a satellite-killed UFO still drops its powerup). The two pre-existing callers pass nothing,
// so they default to true and are byte-unchanged.
function destroySaucer(s, awardScore = true) {
  s.dead = true;
  if (awardScore) {
    addScore(SAUCER_SCORE[s.small ? "small" : "big"]);
    Achievements.lifetime.saucerKills++;                 // Saucer Hunter (F9)
    if (s.small) { game.stats.smallSaucerKills++; Achievements.lifetime.smallSaucerKills++; } // Small Ball (F9) + Sharpshooter (lifetime, P8)
  }
  boom(s.x, s.y, 2, COLOR.saucer);
  AudioSys.saucer(false);
  dropPowerup(s.x, s.y, s.vx, s.vy);
}

// Shatter a garbage clump (v3.2 P2): the tool that reopens what Phase 1 made un-hookable. One
// player bullet on a pieces>1 clump destroys it and emits exactly `pieces` fresh single canisters,
// each carrying an even split of the clump's mass, a full re-armed coalesceDelay (so the burst
// disperses before it can start re-clumping), and an outward kick that inherits a fraction of the
// clump's own drift — same fan-out shape as destroyDebris/destroyHunter. No score: the reward is
// the hookable canisters themselves.
// CS024 P3: CS017 P5's note here — that the emitted pieces are FRESH Garbage and so deliberately do
// NOT inherit a bonus marker — retires with the bonus canister. The pieces are still fresh Garbage,
// which now means each child starts at age 0 and is permanent, so shattering a long-lived clump
// genuinely resets that salvage's standing with the density cull.
function shatterClump(g) {
  g.dead = true;
  const pieceMass = g.mass / g.pieces;
  for (let i = 0; i < g.pieces; i++) {
    const spread = rand(0, TAU), kick = rand(GARBAGE_SHATTER_KICK[0], GARBAGE_SHATTER_KICK[1]);
    game.garbage.push(new Garbage(g.x, g.y,
      g.vx * 0.25 + Math.cos(spread) * kick,
      g.vy * 0.25 + Math.sin(spread) * kick,
      pieceMass));
  }
  boom(g.x, g.y, 1, COLOR.garbage);
}

// ---------- Powerups (F6) ----------
// CS024 P6 (spec §1.7/§3.4): powerMode(type) and powerDuration(type) STOOD HERE. TIMED EXPIRY IS GONE
// — with it go the mode switch (there is only one mode now), the duration table, and the three player
// settings that chose between them. Nothing is "always time-based" any more: Engine, the one type that
// never had a count form, is fuel measured in seconds of forward thrust.
//
// How much budget one pickup grants — the SINGLE source of grant size (spec §4.7), and the only place
// that decides it. The three original types read the frozen POWERUP_BUDGET table; Chain Guard and
// Engine read their live debug knobs instead, so a panel retune takes effect on the next pickup
// without a reload. NOTHING may read POWERUP_BUDGET directly — those two aren't in it, and would bank
// `undefined` and NaN their own budget. THREE call sites: applyPowerup's bank badge, applyPowerup's
// `+=`, and the HUD ring's DENOMINATOR (which used to read powerDuration(type) — miss that one and
// every ring renders permanently over-full, the same trap in its new clothes).
function powerBudgetAmount(type) {
  if (type === "guard")  return DEBUG.chainGuardIntercepts;
  if (type === "engine") return DEBUG.engineBurnSeconds;
  return POWERUP_BUDGET[type];
}
// Is an effect currently ACTIVE? One rule for every type now: budget remains. Every call site (fire
// block, maxBullets, chainMass, magnet pull, breakChain's guard, the expiry-voice latch, the HUD)
// reads through this one predicate — which is what makes "did an effect end?" a single question with
// a single answer, rather than the two-mode question the deleted powerMode() used to arbitrate.
function powerActive(type) {
  return game.powerBudget[type] > 0;
}
// CS025 P1 (spec §1.2/§1.4) — IS THE MAGNET'S ATTRACTION CURRENTLY PULLING? A pure read: no dt, no
// writes, no side effects. Answers a NARROWER question than powerActive("magnet"), and the gap between
// the two is the whole feature: the powerup is still active (budget remains, the HUD row is lit, the
// expire_magnet latch is unmoved) while the tow chain is full, but its ATTRACTION is off, and stays off
// for DEBUG.magnetResumeDelay seconds after a cargo slot opens.
//
// ⛔ THIS IS NOT A DROP-IN REPLACEMENT FOR powerActive("magnet"), AND THE TWO MUST NOT BE TIDIED BACK
// INTO ONE NAME. Exactly two consumers move to this predicate — the attraction force and the widened
// MAGNET_PICKUP_MULT pickup circle, which come back together or not at all. The two BUDGET SPEND sites
// keep reading powerActive("magnet") raw, because during the resume window the base GARBAGE_PICKUP
// circle is still live: a piece drifting into it is genuinely hooked, and billing that hook against
// this suppressed predicate would make it FREE — turning "the magnet is inactive while full" into "the
// magnet gains free uses whenever you fill up". See the split at the pickup block in update().
//
// A FUNCTION, not a local const in update(), because Ship.draw() reads the same answer for the scoop
// energy tell (CS025 P3) and runs in draw(), which cannot see a local in update().
function magnetPulling() {
  return powerActive("magnet") && game.magnetHoldT <= 0;
}

// The Scoop capture BOX (v3.3 P3, spec §8) — an oriented "mouth" on the ship's facing axis. Rotate the
// wrap-aware ship->garbage delta into ship-local space (project onto the facing axis and its normal) and
// test the box: |lateral| <= SCOOP_WIDTH[lvl]/2 AND -SHIP_RADIUS <= forward <= SCOOP_DEPTH[lvl]. At
// scoopLevel 0 the box is empty (width/depth 0), so pickup falls back to exactly the base circle.
function inScoopBox(g) {
  const lvl = game.scoopLevel;
  if (lvl <= 0) return false;
  const s = game.ship;
  const [dx, dy] = shortDelta(s.x, s.y, g.x, g.y); // vector ship -> garbage (wrap-aware)
  const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
  const forward =  dx * ca + dy * sa;  // along the ship's facing axis
  const lateral = -dx * sa + dy * ca;  // perpendicular
  return Math.abs(lateral) <= SCOOP_WIDTH[lvl] / 2 && forward >= -SHIP_RADIUS && forward <= SCOOP_DEPTH[lvl];
}

// Effective player-bullet cap. Triple Shot wins over Rapid Fire when both are active because its
// cap (12) is the higher of the two — the spec's "use the higher cap, don't multiply to 24".
function maxBullets() {
  if (powerActive("triple")) return TRIPLE_MAX_BULLETS; // 12 (also the Rapid+Triple combined cap)
  if (powerActive("rapid"))  return RAPID_MAX_BULLETS;  // 8
  return MAX_BULLETS;                                    // 4
}

// v3.6 P3: unconditionally roll a random weapon/utility powerup and launch it on the given
// vector. No chance gate here — the three emitters (destroySaucer, destroyHunter's large core,
// the recycle hub) each decide WHEN to call this; this only decides WHAT drops. Health is NOT in
// this pool — it spawns ambiently via spawnHealthPowerup.
function dropPowerup(x, y, vx = 0, vy = 0) {
  // weighted roll over POWERUP_DROP_WEIGHTS (favors the shot powerups), NOT a flat pick over
  // POWERUP_DROP_TYPES — the two structures are deliberately separate (Scoop drops but isn't a budgeted effect).
  // CS017 P6: "guard" is CONDITIONAL — it only enters the roll while the player is towing at least
  // DEBUG.chainGuardMinTow nodes (dropping a chain guard at an empty chain is a wasted pickup). An
  // ineligible key is skipped in BOTH the total and the walk, so the surviving weights RENORMALISE
  // rather than leaving a dead slot that would silently drop nothing. Below the threshold this reduces
  // to exactly the pre-P6 table (total 10, same walk order, one Math.random() call) — byte-identical.
  const eligible = k => k !== "guard" || game.chain.length >= DEBUG.chainGuardMinTow;
  let total = 0;
  for (const k in POWERUP_DROP_WEIGHTS) if (eligible(k)) total += POWERUP_DROP_WEIGHTS[k];
  let r = Math.random() * total, type;
  for (const k in POWERUP_DROP_WEIGHTS) { if (!eligible(k)) continue; r -= POWERUP_DROP_WEIGHTS[k]; if (r < 0) { type = k; break; } }
  game.powerups.push(new Powerup(x, y, type, vx, vy));
}

// Ambient Health powerup — floats into the field in a reachable ring around the ship, one at a
// time (its decay bounds coexistence), on a saucer-like cadence.
function spawnHealthPowerup() {
  const a = rand(0, TAU), d = rand(POWERUP_HEALTH_MIN_DIST, POWERUP_HEALTH_MAX_DIST);
  const p = wrapPos({ x: game.ship.x + Math.cos(a) * d, y: game.ship.y + Math.sin(a) * d });
  game.powerups.push(new Powerup(p.x, p.y, "health"));
}

// CS018 P9: the SUPER MEGA DELIVERY (PLANNED-FEATURES-CS018.md §4.2 + FLAG-g; source doc §7.3/§7.3.1)
// — the distinct event a full-cap 24-piece dock visit triggers, NOT a fifth reward tier. Three parts.
// PART 1, the guaranteed set: ONE of each droppable type launches from the dock. A guaranteed floor,
// not six weighted rolls, so it bypasses dropPowerup() entirely: no POWERUP_DROP_WEIGHTS roll, and no
// DEBUG.chainGuardMinTow gate — the chain is EMPTY at this instant (the 24th pop just cleared it), so
// the gate would ALWAYS exclude guard; FORK-CS018-C bypasses it deliberately. The set derives from
// POWERUP_DROP_WEIGHTS' keys (the drop table) so a future droppable type joins automatically — it is
// NOT POWERUP_DROP_TYPES, the timed-effect list, which excludes Scoop (see the constants block).
// PART 2, the sweep — SNAPSHOT SEMANTICS (§7.3.1, the changeset's flagged most-likely bug): every
// hunter piece alive AT THE TRIGGER INSTANT takes exactly one hit and pays exactly one powerup;
// fragments created BY the sweep do neither, because they are not in the snapshot. The snapshot is an
// explicit filtered copy — NOT Array.forEach's fixed-visited-range guarantee, and NOT for...of over
// game.hunters (the shield-ring site's idiom, which WOULD visit the children destroyHunter appends
// mid-iteration and cascade the whole board to nothing in one frame — exactly the board-clear this
// design must avoid).
// PART 3: the sweep pauses coalescence for DEBUG.sweepCoalescePause sec — see the coalesceGarbage(dt)
// call site in update() for what "paused" means and why.
// This is NOT a board clear: N larges become 3N mediums, total threat does not fall, so there is no
// farming incentive and no cooldown. SILENT this phase — the dock_24 Dan line is P10's (voice-lab-
// gated); no new floater either (the Maxed Out "MAX HAUL" at the same instant already marks it).
function superMegaDelivery() {
  const setTypes = Object.keys(POWERUP_DROP_WEIGHTS);  // rapid, triple, scoop, magnet, engine, guard
  for (const type of setTypes) {
    const a = rand(0, TAU);  // fresh random vector per powerup — the reward tiers' launch idiom
    game.powerups.push(new Powerup(game.dock.x, game.dock.y, type,
      Math.cos(a) * DOCK_POWERUP_SPEED, Math.sin(a) * DOCK_POWERUP_SPEED));
  }

  const snap = game.hunters.filter(h => !h.dead);  // THE SNAPSHOT — iterate this, never game.hunters
  // SWEEP_POWERUP_CAP bookkeeping: the ceiling counts the guaranteed set plus every per-piece payout.
  // A swept LARGE pays its one powerup from INSIDE destroyHunter (the v3.6 P3 large-core drop) — which
  // is also why the sweep spawns nothing extra for size 3 (FLAG-g: two powerups for one piece would
  // make the ceiling a lie). Those interior drops can't be stopped once destroyHunter is called, so
  // their count is RESERVED out of the budget up front and the medium/small payouts spend what's left.
  // Under largeHunterCap() (CS024 P6f; the level-table cap it used to read topped out at 12, and this one
  // plateaus at 6) the reservation never exhausts the budget in any reachable state.
  const pool = setTypes.concat("health");  // sweep rolls ADD Health (ambient-only everywhere else)
  let budget = SWEEP_POWERUP_CAP - setTypes.length - snap.filter(h => h.size === 3).length;
  for (const h of snap) {
    destroyHunter(h, true);      // one hit, resolved exactly as a player shot: score + achievement
                                 // counters credited (awardScore gates both), normal split + scatter
    if (h.size === 3) continue;  // FLAG-g: this piece's one powerup just dropped inside destroyHunter
    if (budget-- > 0) {
      // FLAT pick over the 7-type pool, rolled independently per piece (source §7.3: "one randomly-
      // chosen powerup... a scattered mix") — not the weighted dropPowerup roll, and guard is in the
      // pool ungated for the same chain-is-empty reason as the guaranteed set above. Normal
      // POWERUP_DECAY float lifetime (no special casing), launched on the piece's own drift — the
      // same idiom as destroyHunter's large-core drop.
      const type = pool[Math.floor(Math.random() * pool.length)];
      game.powerups.push(new Powerup(h.x, h.y, type, h.vx, h.vy));
    }
  }

  game.sweepPause = DEBUG.sweepCoalescePause;  // PART 3 — consumed at the coalesceGarbage call site

  // CS018 P10: the SMD's own line, fired from the event itself — NOT a fifth VoiceSys.dockDelivery
  // tier. dockDelivery still fires separately on the pop that empties the chain (a different moment,
  // untouched — its 5/10/15/20 chain would try dock_20 for a 24-piece visit) but claims the channel
  // AFTER this call, so the shared cooldown/priority gate drops it in dock_24's favor, same as any two
  // same-priority lines landing back to back.
  VoiceSys.say("dock_24");
}

// Collect a powerup. Health is instant (repair, capped). The five budgeted effects BANK — a same-type
// pickup ADDS budget rather than refreshing (v3.6 P4); magnitude never stacks (no double fire
// rate). Different types run independently. A floater confirms the grab.
// CS024 P6 (spec §4.7): the three-way scoop / health / TIMED / count branch collapses to THREE arms —
// scoop, health, budget. Banking is preserved for EVERY type, including Engine, which enters the
// banking rule for the first time (it was timed-only before): a second Engine pickup with fuel left
// adds a second tankful and arms the same HUD bank badge as any other type.
function applyPowerup(type) {
  if (type === "scoop") {
    // Scoop is a PERSISTENT, non-timed upgrade (v3.3 P3) — it lives on game.scoopLevel, NOT in
    // powerBudget. Each pickup adds a level; at the cap it pays a small score bonus instead,
    // mirroring the full-HP Health-milestone pattern. It still counts as a powerup pick (FLAG A-8:
    // this freezes the maxWaveNoPowerup achievement — accepted, it IS a powerup), but it does NOT
    // feed powerUsed[] (that gates "Powered Up", the four original drop types only).
    if (game.scoopLevel < SCOOP_MAX_LEVEL) {
      game.scoopLevel++;
      game.floaters.push(new FloatText("SCOOP +1", game.ship.x, game.ship.y - 22, POWERUP_COLOR.scoop));
    } else {
      addScore(SCOOP_MAX_BONUS);
      game.floaters.push(new FloatText("SCOOP MAX", game.ship.x, game.ship.y - 22, POWERUP_COLOR.scoop));
    }
    game.stats.powerupsPicked++;
    AudioSys.powerup();
    VoiceSys.say("collect_scoop"); // CS010 P9: scoop is the early-return branch — hook the line HERE
    return;
  }
  if (type === "health") {
    game.ship.hp = Math.min(SHIP_MAX_HP, game.ship.hp + POWERUP_HEALTH_AMOUNT);
  } else {
    // CS009 P5: check BEFORE the += — this is what distinguishes a bank (effect already running) from
    // a fresh pickup (it wasn't). A fresh pickup arms no badge.
    if (powerActive(type)) {
      game.powerBank[type] = HUD_BANK_FLASH;
      game.powerBankAmt[type] = powerBudgetAmount(type); // never POWERUP_BUDGET directly — guard/engine aren't in it
    }
    game.powerBudget[type] += powerBudgetAmount(type); // BANKS (v3.6 P4, reverses the old refresh rule) —
                                                      // same-type pickups ADD budget; magnitude still never stacks
  }
  // Achievement stats (F9): any pickup counts for "No Powerups Needed"; Health picks gate "Glass
  // Cannon"; the four drop types feed "Powered Up" (use all four).
  game.stats.powerupsPicked++;
  if (type === "health") game.stats.healthPicked++;
  else game.stats.powerUsed[type] = true;
  game.floaters.push(new FloatText(POWERUP_LABEL[type], game.ship.x, game.ship.y - 22, POWERUP_COLOR[type]));
  AudioSys.powerup();
  // CS010 P9: the four announcing types announce their pickup (Health has no collect line — it speaks via the
  // hull-full latch instead). A same-type BANK re-pickup re-fires collect_<type>; the §11e cooldown drops
  // the second line if it lands inside the window (a decided, acceptable behavior — see STATUS.md).
  // CS017 P6: "guard" is excluded too. Chain Guard's ONLY voice event is the chain_guard INTERCEPT line
  // (added in P7, once Paul's lab-verified phon exists) — it has no collect_ line by design, so this
  // never builds a "collect_guard" event string. say() would no-op on the missing key anyway; the
  // explicit gate is what makes "this phase ships silent" a property of the code, not an accident of data.
  if (type !== "health" && type !== "guard") VoiceSys.say("collect_" + type);
}

    { id: "long_haul",         name: "The Long Haul",     desc: "Deliver 12+ canisters in one dock visit, 10 times.",  goal: 10,    cur: (s, l) => l.fullChains },
    // CS012 P3 (FORK-CS012-B a): placeholder id/name/desc — Paul to finalize before ship.
    { id: "max_haul",          name: "Maxed Out",         desc: "Deliver a full 24-canister chain in one dock visit.", goal: 1,     cur: s => s.maxChainVisit ? 1 : 0 },
