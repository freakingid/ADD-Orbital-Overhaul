// VoiceSys — Dan's speech. A SEPARATE module alongside AudioSys/MusicSys (NOT folded into AudioSys, a
// flat bag of one-shots): it owns a small sequencer + a radio-processing chain that feeds AudioSys.voice
// (the volume bus). Every entry point no-ops when AudioSys.ctx is null (the headless-safe guard idiom).
const VoiceSys = {
  voiceBus: null, dry: null, rIn: null, rLP: null, rShaper: null, rComp: null, rGain: null,
  ringCarrier: null, ringMult: null, ringWet: null, ringDry: null, ringOut: null, // CS011 ring-mod stage
  staticGain: null, noiseBuf: null,
  cur: null,               // the currently-playing utterance's source handles, or null
  busyUntil: -Infinity,    // AudioSys-clock time the current utterance ends; also the cooldown anchor.
                           // -Infinity = "nothing has ever played" so the FIRST line (and any line in the
                           // AudioContext's first VOICE_COOLDOWN seconds) isn't swallowed by a phantom gap.
  curPriority: -Infinity,  // priority of the line occupying the channel (for pre-emption)
  queue: [],               // CS025 P4: {event,line,p} waiting criticals — FIFO, VOICE_QUEUE_MAX deep, deduped by event

  // Build the noise bed + radio chain once the audio graph exists (first user gesture). Idempotent;
  // no-ops until AudioSys.init() has created AudioSys.voice. Mirrors MusicSys.ensureGraph().
  ensure() {
    if (this.voiceBus || !AudioSys.ctx || !AudioSys.voice) return;
    const ctx = AudioSys.ctx;
    const n = ctx.sampleRate * 2, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
    // voice bus -> ring-modulation stage (CS011) -> dry / radio fan-out. The ring stage sits BETWEEN the
    // bus and the dry+radio split so a robot voice (ring on) and a plain one (ring off) share one graph.
    this.voiceBus = ctx.createGain();
    // ring mod: out = signal * carrier (carrier drives a 0-baseline gain, i.e. multiply), mixed with dry.
    // Ring off (applyRing → wet 0 / dry 1) makes ringOut a transparent pass-through of voiceBus, so a
    // non-ring style behaves exactly as the pre-CS011 direct voiceBus->{dry,rIn} fan-out did.
    this.ringCarrier = ctx.createOscillator(); this.ringCarrier.type = "sine";
    this.ringMult = ctx.createGain(); this.ringMult.gain.value = 0; this.ringCarrier.connect(this.ringMult.gain);
    this.voiceBus.connect(this.ringMult);
    this.ringWet = ctx.createGain(); this.ringDry = ctx.createGain();
    this.ringMult.connect(this.ringWet); this.voiceBus.connect(this.ringDry);
    this.ringOut = ctx.createGain(); this.ringWet.connect(this.ringOut); this.ringDry.connect(this.ringOut);
    this.ringCarrier.start();
    // fan-out now taps ringOut (not voiceBus): dry path / radio path — both land on AudioSys.voice
    this.dry = ctx.createGain(); this.ringOut.connect(this.dry); this.dry.connect(AudioSys.voice);
    this.rIn = ctx.createBiquadFilter(); this.rIn.type = "highpass";
    this.rLP = ctx.createBiquadFilter(); this.rLP.type = "lowpass";
    this.rShaper = ctx.createWaveShaper();
    this.rComp = ctx.createDynamicsCompressor();
    this.rComp.threshold.value = -28; this.rComp.ratio.value = 8;
    this.rComp.attack.value = 0.003; this.rComp.release.value = 0.12;
    this.rGain = ctx.createGain();
    this.ringOut.connect(this.rIn); this.rIn.connect(this.rLP); this.rLP.connect(this.rShaper);
    this.rShaper.connect(this.rComp); this.rComp.connect(this.rGain); this.rGain.connect(AudioSys.voice);
    // squelch-gated static bed, colored through the same radio chain (feeds rIn DIRECTLY, not via the ring)
    const st = ctx.createBufferSource(); st.buffer = this.noiseBuf; st.loop = true;
    const sf = ctx.createBiquadFilter(); sf.type = "bandpass"; sf.frequency.value = 1700; sf.Q.value = 0.4;
    this.staticGain = ctx.createGain(); this.staticGain.gain.value = 0;
    st.connect(sf); sf.connect(this.staticGain); this.staticGain.connect(this.rIn);
    st.start();
    this.applyRadio();
    this.applyRing();
  },

  applyRadio() {
    if (!AudioSys.ctx || !this.rIn) return;
    const R = VOICE_PARAMS.radio;
    this.rIn.frequency.value = R.hp;
    this.rLP.frequency.value = R.lp;
    const k = Math.max(1.001, R.drive), N = 1024, curve = new Float32Array(N), th = Math.tanh(k);
    for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; curve[i] = Math.tanh(k * x) / th; }
    this.rShaper.curve = curve;
    this.dry.gain.value = R.on ? 0 : 1;
    this.rGain.gain.value = R.on ? 1.4 : 0;
  },

  // CS011: apply the current style's ring-modulation settings to the ring stage built in ensure(). Off
  // styles set wet 0 / dry 1 (transparent). freq is set unconditionally — the carrier always runs, so it
  // must never receive undefined (every VOICE_STYLES entry carries a full ring:{on,freq,mix}).
  applyRing() {
    if (!AudioSys.ctx || !this.ringOut) return;
    const R = VOICE_PARAMS.ring;
    this.ringCarrier.frequency.value = R.freq;
    this.ringWet.gain.value = R.on ? R.mix : 0;
    this.ringDry.gain.value = R.on ? (1 - R.mix) : 1;
  },

  // CS011: switch Dan's voice to a VOICE_STYLES entry (re-points the live VOICE_PARAMS) and re-apply the
  // radio + ring graph. "off" is NOT a style: it never reassigns VOICE_PARAMS (buildUtterance and the
  // graph must always have a valid full object), because silencing is handled by voiceEnabled()/say()
  // gating, not by tearing down the params. An unknown id is ignored (params/graph left as they are).
  setStyle(id) {
    if (id === "off") return;
    if (VOICE_STYLES[id]) VOICE_PARAMS = VOICE_STYLES[id];
    this.applyRadio();
    this.applyRing();
  },

  // Stop the current utterance immediately (pre-emption / reset). Ramps the static bed down.
  _stop() {
    if (this.cur) {
      for (const s of this.cur.sources) { try { s.onended = null; s.stop(); } catch (e) {} }
      try { this.cur.utterG.disconnect(); } catch (e) {}
      this.cur = null;
    }
    if (AudioSys.ctx && this.staticGain) {
      const now = AudioSys.ctx.currentTime, g = this.staticGain.gain;
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(0, now + 0.05);
    }
  },

  // Fresh run: silence Dan and clear the cooldown/priority so a new game never inherits a stale gate.
  // CS025 P4: also empties the critical queue. This is the ONLY teardown site the queue needs, and
  // deliberately so — quitToTitle() and killShip() get NOTHING, because update()'s drain is called from
  // the very end of the PLAYING body: it never runs while paused, during the "dying" spectacle, or on a
  // menu, so a stranded entry cannot speak, and startGame() (which calls reset()) clears it before the
  // next run can drain. Adding teardown to those sites would be dead code pretending to be a guard.
  reset() { this._stop(); this.busyUntil = -Infinity; this.curPriority = -Infinity; this.queue.length = 0; },

  // Speak a random alternative for `event`, subject to §11e cooldown/priority. Returns the chosen line
  // (or null if dropped/unavailable). Selection is a plain random pick; the gate + caption + scheduling
  // all live in _emit, so an event maps to a line here and the channel logic is shared with any future
  // direct caller (e.g. CS011's coming sayLevel()).
  say(event) {
    const lines = VOICE_LINES[event];
    if (!lines || !lines.length) return null;
    const line = lines[(Math.random() * lines.length) | 0];
    // CS025 P4: the event is passed through so _emit can consult VOICE_CRITICAL. The line is picked HERE,
    // at TRIGGER time — a queued critical carries the alternative that was rolled when it happened, not
    // one re-rolled at drain time. One less thing to be inconsistent about.
    return this._emit(line, VOICE_PRIORITY[event] || 1, event);
  },

  // CS011 P4: announce the wave number. Speaks natural words via levelPhon(); the caption (shown
  // by _emit) shows the numeral ("Level 23") since it's built from `line.text`, not `line.phon`.
  // CS025 P5 (gate Q6): now passes the "level" event, which is what makes it CRITICAL — nextWave() is a
  // crowded instant and this line was routinely losing the gate outright. Passing the event is the whole
  // of the change: _emit consults VOICE_CRITICAL by event, so the queue and the VOICE_STILL_TRUE.level
  // re-validation both come along for free. (CS025 P4 deliberately passed nothing here; that is reversed.)
  // ⛔ The `text` FORMAT is load-bearing in two places outside this function — VOICE_STILL_TRUE.level
  // compares against "Level " + game.wave, and the banner in nextWave() shows the same string. Change the
  // format here and both follow, or the predicate silently discards every queued level call.
  sayLevel(n) {
    return this._emit({ text: "Level " + n, phon: levelPhon(n) }, VOICE_PRIORITY.level, "level");
  },

  // The voice CHANNEL (CS011 P2): run the §11e cooldown/priority gate for one already-chosen `line` at
  // priority `p`, and for a line that PASSES, show its caption (if settings.captions) and speak it (if a
  // voice style is selected). Captions and audio are INDEPENDENT outputs that SHARE this one gate, so a
  // caption obeys the same drop-not-queue rule as the audio — a superseded/in-cooldown line is dropped,
  // never shown late. The gate arithmetic (busyUntil/curPriority + VOICE_COOLDOWN) is BYTE-IDENTICAL to
  // the pre-split say(): buildUtterance moved up here from _schedule (so a captions-only run can read
  // utt.dur without building an audio graph), and busyUntil/curPriority advance whenever a line passes —
  // even in captions-only mode (voice OFF) — so the channel stays consistent. Returns the line, or null
  // if dropped / no ctx. NOTE: gates on the global voiceEnabled() helper (not a VoiceSys method).
  // CS025 P4 narrows the drop-not-queue rule stated above: the ONE gate is unchanged in shape, but a
  // VOICE_CRITICAL event that loses it is now PARKED (see _enqueue/update) instead of discarded. The
  // captions/audio invariant is untouched by that — both outputs still hang off this single gate, so a
  // queued line captions when it finally PASSES here (at drain), and a line discarded by
  // VOICE_STILL_TRUE never reaches this function at all and so is never captioned late.
  _emit(line, p, event = null) {
    if (!AudioSys.ctx) return null;
    this.ensure();
    const now = AudioSys.now();
    const critical = !!(event && VOICE_CRITICAL[event]);   // CS025 P4 — see VOICE_CRITICAL
    if (now < this.busyUntil) {              // a line is on the channel right now
      if (p <= this.curPriority) {
        if (critical) this._enqueue(event, line, p);  // CS025 P4: a critical WAITS instead of dropping
        return null;                          // equal/lower → not spoken now
      }
      // higher → fall through: _schedule() stops the current line and takes the channel.
      // CS025 P4: PRE-EMPTION IS UNCHANGED, AND THAT IS DELIBERATE, NOT AN OVERSIGHT. health_low (3)
      // still cuts off anything at priority <= 2 exactly as before — making criticals "always wait"
      // would have made the single most urgent line in the game SLOWER than it is today. The queue is
      // purely ADDITIVE: it catches lines that would have been dropped, and changes nothing that speaks.
    } else if (now < this.busyUntil + VOICE_COOLDOWN) {
      // inside the post-line cooldown gap. CS025 P4: this branch used to be PRIORITY-BLIND — it ate even
      // health_low at priority 3, which is the second, easier-to-miss half of the defect this phase fixes.
      // A critical falls through and speaks immediately, so a queued one fires the moment the blocking
      // line ends with no 1.2 s tail; VOICE_COOLDOWN stays an anti-chatter rule for everything else.
      if (!critical) return null;
    }
    const utt = buildUtterance(line.phon, VOICE_PARAMS);
    if (settings.captions) this.showCaption(line.text, utt.dur);
    if (voiceEnabled()) this._schedule(utt);
    this.curPriority = p;
    this.busyUntil = now + 0.10 + utt.dur;   // t0 = now + 0.10 (see _schedule); + utterance length
    return line;
  },

  // CS025 P4 — park a critical line that could not take the channel. FIFO, deduped by event (a second
  // health_low while one already waits is the SAME crisis, not two), capped at VOICE_QUEUE_MAX. With
  // three critical events and dedupe the cap is STRUCTURALLY UNREACHABLE today — it is not dead code but
  // a guard for the day a fourth critical event is added without anyone thinking about queue depth.
  // CS025 P5 narrows the dedupe from IGNORE-the-newcomer to REPLACE-in-place, keeping FIFO position.
  // ⛔ THIS IS A CORRECTNESS FIX FOR `level`, NOT A TIDY-UP. Ignoring the newcomer is harmless for the
  // three CS025 P4 events (a second health_low IS the same crisis, and the two entries differ only in
  // which random alternative was rolled), but it is wrong the moment an event's line carries DATA: a
  // parked "Level 4" that is still waiting when the player clears into level 5 would swallow the "Level 5"
  // trigger as a duplicate, and would then fail its own VOICE_STILL_TRUE re-validation and be discarded —
  // so NEITHER level would be announced. Replacing means the queue always holds the CURRENT truth for an
  // event. Depth behaviour is unchanged (a duplicate still never grows the queue), which is what keeps
  // the cap a structural guard.
  _enqueue(event, line, p) {
    const at = this.queue.findIndex(q => q.event === event);
    if (at >= 0) { this.queue[at] = { event, line, p }; return; }   // newest wins; FIFO slot kept
    if (this.queue.length >= VOICE_QUEUE_MAX) return;
    this.queue.push({ event, line, p });
  },

  // CS025 P4 — the drain. VoiceSys had no per-frame tick before this and needs one: nothing calls _emit
  // when the channel is idle, so a queued line would otherwise never fire. Called from the very END of
  // update()'s playing body, after every pass that can say().
  //   * NO dt PARAMETER, and that is a CONSEQUENCE of choosing re-validation over a TTL, not an
  //     oversight: a TTL would tick on the GAME clock while busyUntil lives on the AUDIO clock
  //     (ctx.currentTime, which does not pause) — a mismatch that would expire queued lines during a long
  //     pause. Re-validation removes the hazard instead of managing it. DO NOT ADD A TTL "as well".
  //   * ONE drain per frame: the first line advances busyUntil past now, so a second is pointless.
  //   * The `now < busyUntil` guard MAKES _emit's BUSY BRANCH UNREACHABLE FROM HERE, which is what
  //     guarantees a drained line can never re-queue itself. This is the one shape here that could loop.
  //   * A line whose condition has gone false is discarded SILENTLY — no audio, no caption, gate untouched.
  update() {
    if (!AudioSys.ctx || !this.queue.length) return;
    if (AudioSys.now() < this.busyUntil) return;   // still speaking — wait
    const q = this.queue.shift();
    const still = VOICE_STILL_TRUE[q.event];
    // CS025 P5: the entry is passed to the predicate. The three CS025 P4 predicates take no parameter and
    // ignore it, so this is a no-op for them; VOICE_STILL_TRUE.level needs it (see that table).
    if (still && !still(q)) return;                // stale — discard, never speak late
    this._emit(q.line, q.p, q.event);
  },

  // Overwrite (never queue) the on-screen caption with `text`, timed to utterance length `dur`. life =
  // the audio's 0.10 s t0 lead + the speech + CAPTION_LINGER; drawCaption() renders it, fading over the
  // last CAPTION_FADE seconds. Reassigns game.caption wholesale so a superseding line replaces the old.
  showCaption(text, dur) { game.caption = { text, dur, life: 0.10 + dur + CAPTION_LINGER }; },

  // Recycle-at-dock tiers (§11f / FORK-5 b): map pieces-delivered-this-visit to a line. 1–4 says nothing.
  dockDelivery(n) {
    const ev = n >= 20 ? "dock_20" : n >= 15 ? "dock_15" : n >= 10 ? "dock_10" : n >= 5 ? "dock_5" : null;
    if (ev) return this.say(ev);
    return null;
  },

  // The render scheduler — PORT-ME BLOCK A, verbatim from the lab's VL.speak(), retargeted onto
  // AudioSys.ctx / AudioSys.voice (via this.voiceBus). Schedules a PRE-BUILT utterance (`utt`) as a Web
  // Audio graph and returns it. buildUtterance() now runs one level up in _emit() (CS011 P2 — the ONLY
  // line lifted out of this block, so a captions-only run can read utt.dur without building any audio).
  // Do not re-tune here — tune in the lab, re-port.
  _schedule(utt) {
    this.ensure();
    if (!AudioSys.ctx) return null;
    const ctx = AudioSys.ctx;
    if (ctx.state === "suspended") ctx.resume();
    this._stop();
    if (!utt.segs.length) return utt;
    const t0 = ctx.currentTime + 0.10;

    // glottal source — custom pulse (richness = spectral tilt) or a native wave
    const osc = ctx.createOscillator();
    if (VOICE_PARAMS.srcType === "pulse") {
      const NH = 48, re = new Float32Array(NH + 1), im = new Float32Array(NH + 1);
      for (let h = 1; h <= NH; h++) im[h] = 1 / Math.pow(h, VOICE_PARAMS.richness);
      osc.setPeriodicWave(ctx.createPeriodicWave(re, im));
    } else osc.type = VOICE_PARAMS.srcType;
    const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 5.1;
    const lfoG = ctx.createGain(); lfoG.gain.value = VOICE_PARAMS.wobble;
    lfo.connect(lfoG); lfoG.connect(osc.frequency);

    const vGain = ctx.createGain(); vGain.gain.value = 0;      // voicing envelope
    const srcMix = ctx.createGain();
    osc.connect(vGain); vGain.connect(srcMix);
    const aspSrc = ctx.createBufferSource(); aspSrc.buffer = this.noiseBuf; aspSrc.loop = true;
    const aspG = ctx.createGain(); aspG.gain.value = 0;        // aspiration/breath -> formants
    aspSrc.connect(aspG); aspG.connect(srcMix);

    // parallel formant bank: F1 direct, F2-F4 via hiBus (nasal murmur damps the highs)
    const utterG = ctx.createGain();
    const hiBus = ctx.createGain(); hiBus.connect(utterG);
    const FQ = [7, 10, 12, 14], FG = [0.9, 1.0, 0.7, 0.32], filts = [];
    for (let i = 0; i < 4; i++) {
      const f = ctx.createBiquadFilter(); f.type = "bandpass";
      f.Q.value = FQ[i] / VOICE_PARAMS.bwScale;
      const g = ctx.createGain(); g.gain.value = FG[i];
      srcMix.connect(f); f.connect(g); g.connect(i === 0 ? utterG : hiBus);
      filts.push(f);
    }
    filts[3].frequency.value = 3300;                            // fixed F4, naturalness only

    // frication path — bypasses the formant bank (Klatt parallel path)
    const fricSrc = ctx.createBufferSource(); fricSrc.buffer = this.noiseBuf; fricSrc.loop = true;
    const fricF = ctx.createBiquadFilter(); fricF.type = "bandpass";
    const fricG = ctx.createGain(); fricG.gain.value = 0;
    fricSrc.connect(fricF); fricF.connect(fricG); fricG.connect(utterG);
    utterG.connect(this.voiceBus);

    // ---- schedule: formants ramp THROUGH targets (pin previous, then ramp — the b/d/g cue)
    const prevF = [null, null, null];
    let prevAmp = 0, prevDamp = 1, prevBreath = 0;
    for (const s of utt.segs) {
      const at = t0 + s.t0;
      if (s.F) {
        const tr = Math.min(s.trans || 0.05, Math.max(0.015, s.dur * 0.6));
        for (let i = 0; i < 3; i++) {
          const p = filts[i].frequency;
          if (prevF[i] === null) p.setValueAtTime(s.F[i], at);
          else { p.setValueAtTime(prevF[i], at); p.linearRampToValueAtTime(s.F[i], at + tr); }
          prevF[i] = s.F[i];
          if (s.F2nd) {           // diphthong: hold, then glide to the second target
            p.setValueAtTime(s.F[i], at + s.dur * 0.45);
            p.linearRampToValueAtTime(s.F2nd[i], at + s.dur);
            prevF[i] = s.F2nd[i];
          }
        }
      }
      const vAt = at + (s.voiceDelay || 0);
      vGain.gain.setValueAtTime(prevAmp, vAt);
      vGain.gain.linearRampToValueAtTime(s.amp, vAt + 0.016);
      prevAmp = s.amp;
      const damp = s.hiDamp == null ? 1 : s.hiDamp;
      if (damp !== prevDamp) {
        hiBus.gain.setValueAtTime(prevDamp, at);
        hiBus.gain.linearRampToValueAtTime(damp, at + 0.02);
        prevDamp = damp;
      }
      const breath = s.amp > 0.3 ? VOICE_PARAMS.breath * 0.4 : 0;   // breathiness rides voicing
      if (breath !== prevBreath) {
        aspG.gain.setValueAtTime(prevBreath, vAt);
        aspG.gain.linearRampToValueAtTime(breath, vAt + 0.02);
        prevBreath = breath;
      }
    }
    const tEnd = t0 + utt.dur;
    vGain.gain.setValueAtTime(prevAmp, tEnd - 0.06);
    vGain.gain.linearRampToValueAtTime(0, tEnd);

    // aspiration events (HH, voiceless-stop VOT) — override the breath baseline
    for (const a of utt.asps) {
      const at = t0 + a.t;
      aspG.gain.setValueAtTime(a.g, at);
      aspG.gain.linearRampToValueAtTime(0.001, at + a.dur);
    }
    // frication: typed noise — instant-attack exponential-decay bursts, shaped fricatives
    for (const fr of utt.frics) {
      const at = t0 + fr.t;
      fricF.frequency.setValueAtTime(fr.cf, at);
      fricF.Q.setValueAtTime(fr.q, at);
      if (fr.burst) {
        fricG.gain.setValueAtTime(fr.g, at);
        fricG.gain.exponentialRampToValueAtTime(0.0001, at + fr.dur);
        fricG.gain.setValueAtTime(0, at + fr.dur + 0.001);
      } else {
        fricG.gain.setValueAtTime(0, at);
        fricG.gain.linearRampToValueAtTime(fr.g, at + 0.015);
        fricG.gain.setValueAtTime(fr.g, at + Math.max(0.02, fr.dur - 0.02));
        fricG.gain.linearRampToValueAtTime(0, at + fr.dur);
      }
    }
    // pitch contour
    const fp = osc.frequency;
    fp.setValueAtTime(utt.pitch[0][1], t0 + utt.pitch[0][0]);
    for (let i = 1; i < utt.pitch.length; i++)
      fp.linearRampToValueAtTime(utt.pitch[i][1], t0 + utt.pitch[i][0]);

    // utterance master envelope (belt-and-braces declick)
    utterG.gain.setValueAtTime(0, ctx.currentTime);
    utterG.gain.setValueAtTime(1, t0 - 0.02);
    utterG.gain.setValueAtTime(1, tEnd + 0.02);
    utterG.gain.linearRampToValueAtTime(0, tEnd + 0.12);

    // radio squelch: static bed keys up just before the voice, clicks off after
    if (VOICE_PARAMS.radio.on) {
      const g = this.staticGain.gain, lvl = VOICE_PARAMS.radio.static;
      g.cancelScheduledValues(ctx.currentTime);
      g.setValueAtTime(0, ctx.currentTime);
      g.setValueAtTime(lvl * 6, t0 - 0.07);
      g.linearRampToValueAtTime(lvl, t0 - 0.03);
      g.setValueAtTime(lvl, tEnd + 0.05);
      g.setValueAtTime(lvl * 5, tEnd + 0.07);
      g.linearRampToValueAtTime(0, tEnd + 0.11);
    }

    const sources = [osc, lfo, aspSrc, fricSrc];
    for (const s of sources) s.start(ctx.currentTime);
    for (const s of sources) s.stop(tEnd + 0.3);
    osc.onended = () => { if (this.cur && this.cur.osc === osc) this.cur = null; };
    this.cur = { sources, utterG, osc };
    return utt;
  },
};

// ---------- Input ----------
// One input layer serves both keyboard and gamepad. Everything downstream only ever calls
// input.left()/right()/thrust()/fire()/shield() — it never reads keys{} or the gamepad directly,
// so the two input methods stay swappable and Phase 8's rebinding UI has a single table to edit.

const keys = {};

// W3C "Standard Gamepad" button/axis layout (developer.mozilla.org/en-US/docs/Web/API/Gamepad).
// These are the physical hardware indices, not tunable balance — they name the binding table below.
const GP = {
  A: 0, B: 1, X: 2, Y: 3,          // face buttons
  LB: 4, RB: 5, LT: 6, RT: 7,      // shoulders / triggers
  BACK: 8, START: 9,               // center buttons
  LS: 10, RS: 11,                  // stick presses
  DPAD_UP: 12, DPAD_DOWN: 13, DPAD_LEFT: 14, DPAD_RIGHT: 15,
  AXIS_LX: 0, AXIS_LY: 1, AXIS_RX: 2, AXIS_RY: 3   // analog axis indices
};

// Human-readable names for the Controls screen (F8) — button index -> label.
const GP_NAME = {
  0: "A", 1: "B", 2: "X", 3: "Y", 4: "LB", 5: "RB", 6: "LT", 7: "RT",
  8: "Back", 9: "Start", 10: "L-Stick", 11: "R-Stick",
  12: "D-Pad ↑", 13: "D-Pad ↓", 14: "D-Pad ←", 15: "D-Pad →"
};

// The binding table — the single source of truth for what triggers each action, as DATA (not
// per-action logic) so Phase 8 can render/rebind it directly. Each action lists the keyboard keys
// (lowercased, matching the keys{} map), the gamepad buttons, and optionally one analog axis
// (dir < 0 = negative half past the deadzone, dir > 0 = positive half). `fixed:true` marks the
// menu/system actions that F7 spec'd as non-rebindable (A confirm / B back / Start pause).
const bindings = {
  // Gameplay actions (held-state, polled every frame). Rebindable in Phase 8.
  left:    { label: "Rotate CCW", fixed: false, keys: ["arrowleft", "a"],  buttons: [GP.DPAD_LEFT],  axis: { index: GP.AXIS_LX, dir: -1 } },
  right:   { label: "Rotate CW",  fixed: false, keys: ["arrowright", "d"], buttons: [GP.DPAD_RIGHT], axis: { index: GP.AXIS_LX, dir: +1 } },
  thrust:  { label: "Thrust",     fixed: false, keys: ["arrowup", "w"],    buttons: [GP.DPAD_UP],    axis: { index: GP.AXIS_LY, dir: -1 } },
  fire:    { label: "Fire",       fixed: false, keys: [" "],               buttons: [GP.A] },
  shield:  { label: "Shield",     fixed: false, keys: ["shift"],           buttons: [GP.RT, GP.RB] }, // gap-fill: no controller shield was spec'd (see notes)
  // Menu / system actions (edge-triggered). Fixed per F7 — not exposed to rebinding.
  confirm: { label: "Confirm",    fixed: true,  keys: ["enter"],           buttons: [GP.A] },
  // back is context-aware (v3.0 P4): inside a menu it backs out; on title/gameover with no menu, B
  // opens OPTIONS directly (keyboard equivalent is "o", handled inline). ESC is shared with pause below.
  back:    { label: "Back",       fixed: true,  keys: ["escape"],          buttons: [GP.B] },
  // pause is ESC (P retired, v3.0 P4 FLAG P4-a): ESC pauses during play; inside a menu the keydown
  // handler resolves confirm->back->pause in order, so ESC there means "back" (back matches first).
  pause:   { label: "Pause",      fixed: true,  keys: ["escape"],          buttons: [GP.START] }
};

// The rebindable actions (the fixed:false gameplay ones) and a pristine snapshot of their shipped
// defaults, captured BEFORE any saved settings are applied (loadSettings runs later). The Controls
// screen's "Return to Defaults" (F8) restores exactly this. Keep the snapshot deep — mutating a
// binding must never reach back into it.
const REBINDABLE = Object.keys(bindings).filter(n => !bindings[n].fixed); // left/right/thrust/fire/shield
const DEFAULT_BINDINGS = {};
for (const n of REBINDABLE) {
  const b = bindings[n];
  DEFAULT_BINDINGS[n] = {
    keys: b.keys.slice(),
    buttons: (b.buttons || []).slice(),
    axis: b.axis ? { index: b.axis.index, dir: b.axis.dir } : null
  };
}

// Snapshot of the first connected gamepad, refreshed once per frame by pollGamepad() (main loop,
// before update()). buttons/axes are the current frame; prevButtons is last frame, for edge detection.
const gamepad = { connected: false, buttons: [], axes: [], prevButtons: [] };

function pollGamepad() {
  const pads = (navigator.getGamepads && navigator.getGamepads()) || [];
  let pad = null;
  for (const p of pads) { if (p) { pad = p; break; } }   // first connected only; ignore the rest (F7)
  gamepad.prevButtons = gamepad.buttons;                 // keep last frame's booleans for edge detection
  if (!pad) { gamepad.connected = false; gamepad.buttons = []; gamepad.axes = []; return; }
  gamepad.connected = true;
  // GamepadButton objects expose .pressed; some environments hand back raw numbers — support both.
  gamepad.buttons = pad.buttons.map(b => (b && typeof b === "object") ? b.pressed : b > 0.5);
  gamepad.axes = pad.axes.slice();
}

// --- Binding resolution (shared by held-state predicates and edge-triggered menu reads) ---
function kbActive(b) {              // any bound keyboard key currently down?
  for (const k of b.keys) if (keys[k]) return true;
  return false;
}
function gpActive(b) {              // any bound gamepad button held, or the bound axis past its deadzone?
  if (!gamepad.connected) return false;
  if (b.buttons) for (const i of b.buttons) if (gamepad.buttons[i]) return true;
  if (b.axis) {
    const v = gamepad.axes[b.axis.index];
    if (v !== undefined && (b.axis.dir < 0 ? v < -GP_DEADZONE : v > GP_DEADZONE)) return true;
  }
  return false;
}
function actionHeld(name) {         // held-state: keyboard OR gamepad, for the gameplay predicates
  const b = bindings[name];
  return kbActive(b) || gpActive(b);
}
function gpPressed(b) {             // gamepad edge: a bound button newly pressed THIS frame (not held)
  if (!gamepad.connected || !b.buttons) return false;
  for (const i of b.buttons) if (gamepad.buttons[i] && !gamepad.prevButtons[i]) return true;
  return false;
}

// The predicate object the rest of the game reads — call signature unchanged from before F7.
const input = {
  left:   () => actionHeld("left"),
  right:  () => actionHeld("right"),
  thrust: () => actionHeld("thrust"),
  fire:   () => actionHeld("fire"),
  shield: () => actionHeld("shield")
};

// Keyboard events. Three input CONTEXTS, checked in priority order so they never fight (F8):
//   (1) rebind capture  — the pressed key IS the new binding (or Esc cancels). Consumed entirely.
//   (2) menu open       — keys drive menu navigation only, never the ship.
//   (3) normal play      — recorded into keys{} for input.*(), plus the confirm/pause edges.
// Crucially, (1) and (2) return WITHOUT writing keys{}, so a menu keypress (or a captured rebind)
// can never leak through into ship rotation/thrust.
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  AudioSys.init(); AudioSys.resume();

  // CS015 P4: hidden Debug Options secret code — consulted before the three context branches below, but
  // ONLY on the Title screen or a paused live game (never mid-play, gameover, a rebind capture, or
  // initials entry), so its keystrokes can't collide with those exclusive input modes. The backtick ARMS
  // a capture window and is consumed (return); each later single-char key accretes into DebugCode.buf
  // (raw e.key, so case + shifted symbols like G/3/$ survive; multi-char keys — Shift/Arrow*/Enter/Esc —
  // are dropped). When the buffer's tail matches DEBUG_CODE the panel opens (openDebug from title, else
  // gotoScreen off the paused root). Non-backtick code chars fall through INERT — none are nav/confirm/
  // pause/O keys — so nothing is visible until the code lands. The window self-expires on inactivity in
  // loop(). Backtick keys are NOT preventDefault'd.
  if (!game.menu.rebinding && !game.entry && (game.state === "title" || (game.paused && game.state === "playing"))) {
    if (e.key === "`") {
      DebugCode.armed = true; DebugCode.buf = ""; DebugCode.last = performance.now();
      AudioSys.secretArm();
      return;
    } else if (DebugCode.armed && !e.repeat) {
      DebugCode.last = performance.now();
      if (e.key.length === 1) { // single-char keys only — modifiers/arrows/Enter/Esc have multi-char e.key
        DebugCode.buf = (DebugCode.buf + e.key).slice(-DEBUG_CODE.length);
        if (DebugCode.buf.endsWith(DEBUG_CODE)) {
          DebugCode.armed = false; DebugCode.buf = "";
          enterDebug();   // CS018 P2: was `game.state === "title" ? openDebug() : gotoScreen("debug")` inline
        }
      }
    }
  }

  // CS018 P2: raw capture for the debug panel's direct numeric entry. menuDebug() only ever sees ABSTRACT
  // actions, so digits (plus "." / "-" / Backspace) have to be taken here. Gated hard: only on the debug
  // screen, only with a VALUE row selected, and only while the secret-code window is NOT armed — the code
  // itself contains a digit ("EvilG3niu$"), so a live capture window keeps first claim on keystrokes and this
  // hook stands down until it lapses (the block above self-expires on idle in loop()). It sits AFTER that
  // block for the same reason. ENTER/ESC are deliberately NOT handled here: they stay on the abstract layer
  // as confirm/back, so gamepad A/B commit and cancel identically. Consumed (preventDefault + return) so
  // Backspace can't navigate the browser back and a digit can't reach branch (2)/(3).
  if (game.menu.screen === "debug" && !DebugCode.armed && !game.menu.rebinding && !game.entry && !e.repeat &&
      debugSelectedVar() && (DEBUG_ENTRY_CHARS.test(e.key) || e.key === "Backspace")) {
    e.preventDefault();
    debugEntryKey(e.key);
    return;
  }

  // CS031 P3: raw capture for the name-entry screen — the second consumer of the hook above, and modelled
  // on it exactly. menuNameEntry() only ever sees ABSTRACT actions, so letters, digits, space and
  // Backspace have to be taken here. Same gating and the same reason: only on that screen, and only while
  // the secret-code window is NOT armed — DEBUG_CODE contains letters and a digit, so a live capture
  // window keeps first claim on keystrokes and this hook stands down until it lapses. It sits AFTER that
  // block for exactly that reason. `!game.menu.modal` has no counterpart above (the debug hook is
  // accidentally covered there — an open dialog leaves the cursor on a non-value row, so its
  // debugSelectedVar() gate is already false); this screen has no such accident, and raw typing must not
  // reach the buffer behind a dialog P4 hangs over it. ENTER/ESC are deliberately NOT handled here: they
  // stay on the abstract layer as confirm/back, so gamepad A/B commit and cancel identically.
  // ⛔ Consumed (preventDefault + return) so Backspace can't navigate the browser back and a character
  // can't reach branch (2)/(3).
  // ⛔ Consequence, deliberate: on this screen WASD is text, not navigation, and "p" is text, not pause.
  // A text field that swallowed w/a/s/d as movement could not spell a name; the arrows and the whole pad
  // still navigate, and ESC still backs out.
  if (game.menu.screen === "nameentry" && !DebugCode.armed && !game.menu.rebinding && !game.menu.modal &&
      !game.entry && !e.repeat && (e.key.length === 1 || e.key === "Backspace")) {
    e.preventDefault();
    nameEntryKey(e.key);
    return;
  }

  // CS024 P1: CS021 P3's "r" START-ANGLE REROLL KEYBIND (FLAG-CS021-c) STOOD HERE — a raw debug-screen
  // capture that rerolled the live orbit layout's ring start angles. Removed with the layout it acted on.
  // "r" is now inert on the debug screen and reaches the ordinary handlers below, as it did pre-CS021.
  // Nothing else in the file captures a bare letter key on the debug screen, so this removal cannot
  // un-shadow a second binding.

  // (1) Rebind capture — exclusive; the key never reaches gameplay or nav.
  if (game.menu.rebinding) {
    e.preventDefault();
    if (game.menu.rebinding.device === "key") captureKeyRebind(k);
    else if (k === "escape") { game.menu.rebinding = null; AudioSys.ui(false); } // Esc cancels a pad-capture
    return;
  }

  // (2) A menu is open — route to menu navigation, do NOT record gameplay keys.
  if (menuActive()) {
    e.preventDefault();
    // Browser key auto-repeat (~30/sec while held) would otherwise spam menu actions — e.g. spin
    // the 3-value Music Track row back to its start and re-enter setState() nearly every frame,
    // restarting the crossfade ramp and pinning the music near-silent. Matches the gamepad path
    // (handleGamepadMenu -> menuNavEdges()), which is already strictly edge-detected.
    if (e.repeat) return;
    handleMenuKey(k);
    return;
  }

  // (3) Normal play/title/gameover keyboard input.
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[k] = true;

  // CS030 P4 (FORK-CS030-C): the achievement celebration panel owns input while it is up. This guard
  // sits IMMEDIATELY BEFORE the initials-entry block below, and that placement IS what "panel first"
  // means — both are armed at the same "dying"->"gameover" seam, and the panel's opaque backdrop
  // covers entry's slots, so nothing about entry's arming or draw needed touching. The `return` is
  // load-bearing for exactly the reason the entry block's is: without it the confirm that just
  // dismissed the panel would fall straight through into entryInput() or startGame() in the SAME
  // keypress. ESC resolves as "dismiss" here rather than "pause" because this returns before the
  // openPause() guard below — the same confirm->back->pause order handleMenuKey() already uses.
  // Mirrored in handleGamepadMenu(), at the matching position; the two share celebrationScroll() /
  // dismissCelebration() so they cannot drift.
  if (game.celebration) {
    if (!e.repeat) {
      if (k === "arrowup" || k === "w") celebrationScroll(-1);
      else if (k === "arrowdown" || k === "s") celebrationScroll(1);
      else if (bindings.confirm.keys.includes(k) || bindings.back.keys.includes(k)) dismissCelebration();
    }
    return;
  }

  // v3.6 P6: high-score initials entry (live only on "gameover", armed at the "dying"->"gameover"
  // seam) intercepts nav/confirm here — and returns, so a confirm that just committed the entry
  // (clearing game.entry) can't fall through to the startGame() check below in the SAME keypress.
  // e.repeat guard matches the v3.5 P1 menu-nav fix (a held key must not spin the letter).
  if (game.entry) {
    if (!e.repeat) {
      if (k === "arrowup" || k === "w") entryInput("up");
      else if (k === "arrowdown" || k === "s") entryInput("down");
      else if (k === "arrowleft" || k === "a") entryInput("left");
      else if (k === "arrowright" || k === "d") entryInput("right");
      else if (bindings.confirm.keys.includes(k)) entryInput("confirm");
    }
    return;
  }

  // THE LOAD-BEARING GUARD (v3.6 P6, §10): without `&& !game.entry`, confirm would restart the run
  // instead of committing the initials — belt-and-suspenders alongside the early return above, in
  // case entry-handling is ever restructured.
  //
  // CS016 P2: these three lines are now unreachable at the TITLE — the title menu satisfies
  // menuActive(), so branch (2) intercepts and routes to menuTitle (which handles confirm/"o"/ESC/Start
  // itself). They are STILL REQUIRED at GAMEOVER, which has no menu open until the player opens one
  // (game.menu.screen stays null, game.paused false), so the `game.state === "title"` operands are
  // deliberately left in place rather than trimmed: gameover -> pause -> Quit to Title and boot both
  // arrive at the title with a menu armed, but nothing guarantees a future state won't reach the title
  // with a null screen, and the fallback costs nothing.
  if (bindings.confirm.keys.includes(k) && (game.state === "title" || game.state === "gameover") && !game.entry) startGame();
  if (bindings.pause.keys.includes(k) && (game.state === "playing" || game.state === "gameover") && !game.entry) openPause();
  // "O" opens OPTIONS directly from title/gameover (v3.0 P4 replaced the old P->options path; CS012 P4
  // FORK-CS012-C → a replaced the Options/Achievements system-menu root with Options itself). No game to
  // pause here — openPause() routes to the Options screen off game.state.
  // Guarded off during initials entry so O can't pop the menu mid-entry.
  // CS016 P2: the title case now goes through handleMenuKey's "o" -> menuInput("options") -> menuTitle
  // instead (see there); this line still serves gameover.
  if (k === "o" && (game.state === "title" || game.state === "gameover") && !game.entry) openPause();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// Gamepad menu/system dispatcher, mirroring the keydown handler's three contexts. Called once per
// frame from the main loop right after pollGamepad(). Same priority order:
//   (1) rebind capture (pad) — the first newly-pressed button becomes the binding; nothing else.
//   (2) menu open            — D-Pad / L-Stick nav, A confirm, B back, Start resume.
//   (3) normal play          — Start starts/pauses, A confirms on title/gameover (never mid-play).
function handleGamepadMenu() {
  // (1) Capturing a binding: exclusive. A pad-capture eats the next button; a key-capture ignores
  // the pad entirely (so it can't navigate the menu while the player is picking a keyboard key).
  if (game.menu.rebinding) {
    if (game.menu.rebinding.device === "pad") {
      const btn = firstPressedButton();
      if (btn !== -1) capturePadRebind(btn);
    }
    return;
  }

  const pressedStart   = gpPressed(bindings.pause);
  const pressedConfirm = gpPressed(bindings.confirm);
  const pressedBack    = gpPressed(bindings.back);
  if (pressedStart || pressedConfirm || pressedBack) { AudioSys.init(); AudioSys.resume(); } // best-effort audio unlock

  // (2) A menu is open — everything routes to menu navigation.
  if (menuActive()) {
    const nav = menuNavEdges();
    if (nav.up)    menuInput("up");
    if (nav.down)  menuInput("down");
    if (nav.left)  menuInput("left");
    if (nav.right) menuInput("right");
    if (pressedConfirm) menuInput("confirm");
    if (pressedBack)    menuInput("back");
    if (pressedStart)   menuInput("pause");   // Start fully resumes from any menu screen
    return;
  }

  // (2.4) CS030 P4: the celebration panel — the MANDATORY mirror of the keydown guard. Without this
  // half a controller player blows straight through the panel with Start and never sees it. It sits
  // BEFORE the initials-entry block below for the same reason its keyboard twin does: both are armed
  // at the same seam, and "panel first" (FORK-CS030-C) is delivered by input priority, so entry must
  // not be reachable until the panel is dismissed. Edge-detected throughout (menuNavEdges is strictly
  // edge-detected, gpPressed already excludes held-button repeats), so a held stick can't spin the
  // scroll. Start is SWALLOWED, not acted on — same convention as the entry block below, and it is
  // what stops Start reaching the startGame() chain at (3). Scroll/dismiss go through the same two
  // functions the keyboard path calls.
  if (game.celebration) {
    const nav = menuNavEdges();
    if (nav.up)   celebrationScroll(-1);
    if (nav.down) celebrationScroll(1);
    if (pressedConfirm || pressedBack) dismissCelebration();
    return;
  }

  // (2.5) v3.6 P6: high-score initials entry — same edge-detected latch as real menu nav
  // (menuNavEdges is already strictly edge-detected; gpPressed(confirm) already excludes held-button
  // repeats), so a held stick/button can't spin the letter or double-commit. Swallows Start/B too —
  // nothing should interrupt entry — mirroring the keyboard path's early guard on "o".
  if (game.entry) {
    const nav = menuNavEdges();
    if (nav.up)    entryInput("up");
    if (nav.down)  entryInput("down");
    if (nav.left)  entryInput("left");
    if (nav.right) entryInput("right");
    if (pressedConfirm) entryInput("confirm");
    return;
  }

  // (3) Not in a menu: session/system inputs, keyed on state. The else-if chain guarantees a single
  // frame can't both open a menu AND start a game (FLAG P4-b); priority Start > B > A.
  //   Start = session toggle : title/gameover -> start a game ; playing -> open pause (resume is the
  //           menu-branch case above).
  //   B     = context-aware  : title/gameover with no menu -> open OPTIONS directly (mirrors ESC/O).
  //   A     = confirm        : title/gameover -> start a game (never mid-play, where A is fire).
  //
  // CS016 P2: all three are now unreachable at the TITLE — the title menu satisfies menuActive(), so
  // branch (2) above catches Start/A/B first and routes them to menuTitle, which reproduces every one
  // of these behaviours deliberately (Start -> startGame, A -> confirm the focused row, B -> Options).
  // They remain LIVE and REQUIRED at gameover, which has no menu open until the player opens one.
  const onTitleOrOver = game.state === "title" || game.state === "gameover";
  if (pressedStart) {
    if (game.state === "playing") openPause();
    else startGame();
  } else if (pressedBack && onTitleOrOver) {
    openPause();
  } else if (pressedConfirm && onTitleOrOver) {
    startGame();
  }
}

// Directional menu nav from the gamepad: D-Pad or Left Stick, edge-detected against a latch so a
// held direction moves the cursor once (not every frame). Only consulted while a menu is open.
const menuNav = { up: false, down: false, left: false, right: false };
function menuDirState() {
  const b = gamepad.buttons, ax = gamepad.axes, dz = GP_DEADZONE;
  return {
    up:    !!b[GP.DPAD_UP]    || (ax[GP.AXIS_LY] < -dz),
    down:  !!b[GP.DPAD_DOWN]  || (ax[GP.AXIS_LY] >  dz),
    left:  !!b[GP.DPAD_LEFT]  || (ax[GP.AXIS_LX] < -dz),
    right: !!b[GP.DPAD_RIGHT] || (ax[GP.AXIS_LX] >  dz)
  };
}
function menuNavEdges() {
  const now = menuDirState();
  const edges = {
    up:    now.up    && !menuNav.up,
    down:  now.down  && !menuNav.down,
    left:  now.left  && !menuNav.left,
    right: now.right && !menuNav.right
  };
  Object.assign(menuNav, now);
  return edges;
}
// Prime the latch to the CURRENT direction state so a direction held at the moment a menu opens
// doesn't fire a phantom first move.
function resetMenuNav() { Object.assign(menuNav, menuDirState()); }
// First gamepad button that went down THIS frame (for pad rebind capture); -1 if none.
function firstPressedButton() {
  const cur = gamepad.buttons, prev = gamepad.prevButtons;
  for (let i = 0; i < cur.length; i++) if (cur[i] && !prev[i]) return i;
  return -1;
}

// ---------- Menu state machine, Options & Rebinding (F8) ----------
// The game's first nested menu: playing --(pause)--> menu:root (Continue/Options/Quit) -->
// menu:options (SFX/Music/Master sliders + Controls) --> menu:controls (rebind + Return to Defaults).
// game.menu.screen names the current screen (null = no menu). CS016 P1/P2: game.paused is no longer a
// synonym for "a menu is open" — that is menuActive(), i.e. `paused || screen !== null`. The TITLE menu
// (screen "titlemenu") owns input with game.paused FALSE, because there is no sim to freeze there;
// every OTHER screen is an overlay opened via openPause()/openDebug(), which do set game.paused.
// Both keyboard (keydown -> handleMenuKey) and gamepad (handleGamepadMenu) funnel discrete actions
// into menuInput(action); the rendering lives near draw() (drawMenu, plus drawTitleMenu for the
// chrome-less title root). Gameplay stays frozen the whole time (update() early-returns on paused, and
// on state !== "playing" for the title), so menu input can never move the ship.

// The root ("PAUSED"/"MENU") screen is context-aware. CS012 P4 (FORK-CS012-C → a) retired the
// separate system-menu root (the old MENU_ROOT_SYS = ["Options","Achievements","Back"]): from
// title, O/Start/B open OPTIONS directly (openPause routes there off game.state), so title has no
// root layout at all. CS013 P1 (FORK-CS013-A → a) restores a root for gameover — a session-end state
// with its own session verbs (Play Again / Quit to Title) — distinct from the paused-mid-game root
// (Continue / Quit). rootItems() picks the layout off game.state; update() skips the sim outside
// "playing", so game.paused is safe in any state.
// CS032 P4: "Save" is LIVE — it opens the "slots" screen in save mode (menuRoot's confirm chain, and
// drawRootMenu with no forced-dim ternary left in it). The label and its position are CS016 P4's and
// are deliberately unchanged; what went away is the unavailable-row idiom this row used to DEMONSTRATE
// while save-game was unimplemented. The idiom itself is unchanged and still has live consumers — see
// menuProfiles' "Add Profile" cap, which is now its canonical example.
// CS016 P4's other half stands: MENU_ROOT_OVER is deliberately given NO "Save" — there is no run in
// progress at gameover for a save to apply to.
const MENU_ROOT_PLAY = ["Continue", "Save", "Options", "Quit"];     // paused mid-game
const MENU_ROOT_OVER = ["Play Again", "Options", "Quit to Title"];  // gameover (CS013 P1)
// CS016 P2 (§1): the TITLE screen's own root menu — the third root layout, and the only one that is
// not an overlay. It lives at game.menu.screen === "titlemenu" with game.paused staying FALSE (the
// sim was never running at the title), which is exactly the concept split CS016 P1 opened up.
// Achievements/High Scores are reachable ONLY from here as of this phase (single-parent IA,
// FORK-CS016-A) — they are deliberately no longer under Options, and so no longer reachable mid-run
// or at gameover. Cursor defaults to "Start Game" on every entry, so ENTER / A still starts a run
// immediately (the existing muscle memory survives).
// CS031 P5 (FORK-CS031-H → c): "Profile" is second — the row IS the current profile's name display
// (drawTitleMenu renders it "Profile: NAME") and the way into the "profiles" screen (FORK-CS031-I:
// title-only, never added to MENU_ROOT_PLAY / MENU_ROOT_OVER). Every consumer below resolves this
// array by LABEL via indexOf, never a hardcoded index, so the insertion needed no other edit.
// CS032 P4: "Load Saved Game" sits SECOND, beside "Start Game" — the two are both "start a run" verbs
// and everything from "Profile" down is configuration. It is the unavailable-row idiom's newest
// consumer: present, focusable, COLOR.dim and inert whenever the ACTIVE profile has zero occupied
// slots (spec §4.3). Kept PRESENT rather than hidden so MENU_TITLE.length — and therefore
// titleMenuLayout()'s derived geometry below — never varies with save state; a row that came and went
// would shift the whole block vertically. Both halves (drawTitleMenu's colour, menuTitle's confirm)
// ask SaveSlots.count() fresh and never cache it: a profile switch or a profile delete changes it.
const MENU_TITLE = ["Start Game", "Load Saved Game", "Profile", "Achievements", "High Scores", "Options"];
// Title-menu layout (FORK-CS016-B → b: chrome-less, drawn straight onto the title art — no backdrop
// dim, no menuPanel box). The rows sit in the band the two removed keyboard-legend lines vacated,
// between "O V E R H A U L" (baseline VIEW_H/2 - 60) above and "BEWARE THE HUNTER SATELLITE"
// (baseline VIEW_H/2 + 120) below.
// CS031 P5 (FORK-CS031-G → b): Y and STEP are DERIVED from MENU_TITLE.length via titleMenuLayout(n),
// not fixed literals — a 5th row (Profile, CS031 P5) no longer fits the old fixed arithmetic (it
// would land 14px below the flavour line), and CS032 P4's 6th ("Load Saved Game", now shipped) is
// worse still. titleMenuLayout is a pure function of n, mirroring drawRootMenu's own height-derivation
// precedent (L9694, "h DERIVED from items.length"), so the block recentres itself as rows are added —
// and so scratchpad/test-cs031-p5.js could assert the arithmetic at N=5 and N=6 a changeset before
// N=6 was real. Step shrinks below its TITLE_MENU_STEP_MAX only once the row count would otherwise
// overflow the band; until then the block is centered with TITLE_MENU_MARGIN px of clearance on both
// sides. All four constants below (TOP/BOTTOM implicitly via VIEW_H, MARGIN, STEP_MAX) are PLAYTEST
// KNOBS — see STATUS.md for what they evaluate to at N=4/5/6.
const TITLE_MENU_TOP      = VIEW_H / 2 - 60;   // "O V E R H A U L" baseline — never cross above this
const TITLE_MENU_BOTTOM   = VIEW_H / 2 + 120;  // flavour-line baseline — never cross below this
const TITLE_MENU_MARGIN   = 24;                // clearance kept from each boundary — PLAYTEST KNOB
const TITLE_MENU_STEP_MAX = 38;                // row spacing when the band has room — PLAYTEST KNOB
function titleMenuLayout(n) {
  const band = (TITLE_MENU_BOTTOM - TITLE_MENU_MARGIN) - (TITLE_MENU_TOP + TITLE_MENU_MARGIN);
  const step = n > 1 ? Math.min(TITLE_MENU_STEP_MAX, band / (n - 1)) : TITLE_MENU_STEP_MAX;
  const y = TITLE_MENU_TOP + TITLE_MENU_MARGIN + (band - (n - 1) * step) / 2;
  return { y, step };
}
const TITLE_MENU_LAYOUT = titleMenuLayout(MENU_TITLE.length);
const TITLE_MENU_Y      = TITLE_MENU_LAYOUT.y;      // first row baseline (324 at N=6, VIEW_H 720)
const TITLE_MENU_STEP   = TITLE_MENU_LAYOUT.step;   // px between row baselines (26.4 at N=6, was 33 at N=5)
const TITLE_MENU_SIZE   = 24;                // row text size, matching drawRootMenu's rows
const TITLE_MENU_HINT_Y = VIEW_H / 2 + 170;  // control-hint baseline, below the flavour line (530)
// Routed through drawMenuHint() (the CS013 P2 shared-footer helper), not a fresh drawText literal.
const TITLE_MENU_HINT   = "↑↓ move    ENTER / A select    ESC / B options";
const MENU_HINT_SIZE = 16;  // CS013 P2: control-hint footer text size (drawMenuHint) — playtest knob
// CS029 P2 (§3.2): game-over's ONLY on-screen affordance — no visible menu sits above it like every

// ---------- Debug Options (CS015 P4) — a hidden, data-driven tuning panel ----------
// Reached only by a secret keystroke sequence (see DebugCode + the keydown listener); never listed in
// any menu. DEBUG_VARS is the single source of truth (FLAG-CS015-h): one registry entry drives the
// panel render, the adjust handler, AND persistence generically, so adding/removing a knob in a later
// changeset is one registry edit + repointing its consumer — the same "tracks/lines are DATA" idiom
// used elsewhere. Each entry's `def` derives from the shipped gameplay const (in display units) so
// there is ONE source of truth for the default; `toNative` converts a display value (what the panel
// shows/persists) into the native unit the consumer reads (identity when absent). P4 shipped exactly
// one entry (item 5); P5 (items 7, 11, 12) adds four more entries only — no panel/persistence code
// changes; P6 does the same.
//
// CS018 P2 (FLAG-j): the registry is also the panel's ROW ORDER, and an entry may now be a non-selectable
// SECTION HEADER — `{ header: "GARBAGE" }` — instead of a value. A header has no `id`/`def`, so every loop
// over VALUES goes through DEBUG_ENTRIES (below), never DEBUG_VARS directly; up/down skip headers so one can
// never become the selection. Headers are pure grouping: they carry no state and nothing persists for them.
// CS018 P3/P6/P7: the old "SAUCER PRESSURE" header and its three pressure knobs (saucerGapPressure,
// saucerPressureSecs, saucerAimPressure) were retired and replaced by JUNK / UFO MOVEMENT / UFO WEAPONS
// / GLOBAL. CS024 P4 then retired those first three in turn with the 21 tier knobs beneath them. THE
// RULE THAT KILLED ALL FOUR IS THE SAME ONE, and it still binds: A HEADER LEFT WITH NO ENTRIES UNDER IT
// RENDERS AS A STRAY LABEL, so a header dies with its last knob rather than being left standing empty.
// CS024 P5 reintroduces JUNK, HUNTER and UFO with a knob per LEVER (§5) — a different shape from the
// retired tier trios, one entry per QUANTITY rather than three per quantity. CS024 P6c then REPLACES
// that one row per lever with THREE (below): a lever is not a value, so it could never be one knob.
//
// ---- CS024 P6c: THREE ROWS PER LEVER — floor, ceiling, step count (spec §2.6) ----
// P5's single row per lever, when touched, PINNED that lever to a flat constant at every level: useful
// for isolating one quantity's feel, useless for tuning a ramp, and Gate B's entire job is tuning
// ramps. It could not move a ramp's floor, its ceiling or its period, and — because its min/max came
// from Math.min/max of the shipped pair — it could not move an endpoint PAST its partner either, which
// on the seven INVERTED levers meant a ceiling could never be raised above where it already sat.
//
// So each lever now emits THREE registry entries — `<leverId>Floor`, `<leverId>Ceil`, `<leverId>Steps`
// (54 rows over 18 levers as of CS026 P2's junkSplit; 51 over 17 when P6c wrote this) — and leverKnob()
// returns them as an ARRAY, spread into DEBUG_VARS below.
// Moving any of the three re-derives that lever's WHOLE ramp immediately, at every level, because
// liveLevers() folds all three straight back into the table leverValues() walks. THE FLAT PIN IS
// SUBSUMED, NOT LOST: setting Floor equal to Ceil pins the lever to a constant at every level, which is
// exactly what the retired row did. There is deliberately no fourth row for it.
//
// `def` IS THE SHIPPED TABLE VALUE, and P5's `def: null` "auto" sentinel is retired with the flat rows.
// A lever's VALUE varies per level, so it had no single honest default; a lever's floor, ceiling and
// step count are plain constants that do. That keeps the untouched-panel guarantee sharper than the
// sentinel did — an untouched registry reproduces LEVERS field for field, so liveLevers() === leverState
// at every level — and it retires both null special-cases the sentinel needed (menuDebug's nudge base
// and drawDebug's "auto" string), which went with it.
//
// ⛔ THE RANGES SPAN BOTH DIRECTIONS, AND NOTHING HERE ORDERS THE PAIR. Floor and Ceil share one range,
// widened by a full span on each side of the shipped pair (clamped at 0 below, since every levered
// quantity is a non-negative count/speed/interval/angle), so EITHER endpoint can be dragged past the
// other. That is required, not tolerated: seven levers ship with floor > ceil because a shorter delay
// and a smaller aim error are HARDER, and the standing rule (§2.3, and the LEVERS banner) forbids any
// floor/ceil ordering assertion or clamp — in the panel exactly as in the table. Math.min/max appear
// here ONLY to find the shipped pair's extent for that widening; neither is ever written back.
//
// `step` — the ◄/► increment on the Floor/Ceil rows — is exactly ONE odometer step of the shipped
// curve, so a press moves the endpoint by the same increment leverState would move the real value.
// Steps is an INTEGER knob with a MIN OF 2: `steps: 1` leaves a zero-width span and `steps: 0` is
// meaningless, and both are refused at the row's own `min` rather than by a runtime clamp anywhere
// downstream. Its `clampShown` (the CS021 P3 hook) rounds a TYPED entry to a whole number — arrows
// already land on integers, given step 1 off an integer default.
//
// ⛔ THE LABEL CARRIES THE CHAIN, AND IT IS DERIVED FROM `LEVERS`, NEVER HAND-TYPED. 51 flat rows is a
// wall; a retune needs to know what a slider will knock on to. A section maps 1:1 to a chain, and
// within it `everyNLevels` decides DRIVER ("▼ ", unindented — everything indented below it moves when
// this one wraps) from DEPENDENT ("  ↳ "), while floor > ceil decides INVERTED (" (inv)" — so a Floor
// numerically above its Ceil reads as correct rather than as a bug). Both come off the table right
// here, so a future table edit cannot silently desync the panel from the mechanism. Non-lever knobs
// (smallUfoChance, lastStandSpeed, the GARBAGE/CHAIN GUARD/POWERUPS/GLOBAL rows) belong to no chain and
// get NEITHER glyph NOR indent — that is why they are plain literals and not leverKnob() calls.
//
// LABEL WIDTH IS A REAL CONSTRAINT (see DEBUG_VALUE_X): the label column is ~32 monospace characters at
// 18px before it reaches the selected row's ◄ chevron, and drawDebug neither wraps nor truncates. The
// glyphs, the indent and " (inv)" cost up to 18 of those characters, so the BASE labels were shortened
// to fit rather than the markers dropped. The UFO levers dropped their "UFO " prefix (their section
// header already says it, and Flight/Shot/Fire/Zig/Aim/Appear are unique panel-wide); JUNK and HUNTER
// kept theirs, because both sections have a "speed md"/"speed sm" pair and the prefix is the only
// thing telling those apart when the header has scrolled off the top of the window. The size token is
// bare (lg/md/sm, no parentheses) for the same two-character reason — uniformly, across all 17.
function leverKnob(id, label, unit) {
  const lev = LEVERS.find(l => l.id === id);
  const lo = Math.min(lev.floor, lev.ceil), hi = Math.max(lev.floor, lev.ceil), span = hi - lo;
  const r2 = v => Math.round(v * 100) / 100;                       // 2dp, so 0.7 - 1.1 reads 0 and not -0.4000000000000001
  const min = r2(Math.max(0, lo - span)), max = r2(hi + span);     // a full span of headroom EITHER SIDE of the shipped pair
  const step = r2(span / (lev.steps - 1));                         // one odometer step of the shipped curve
  const name = (lev.everyNLevels ? "▼ " : "  ↳ ") + label + (lev.floor > lev.ceil ? " (inv)" : "");
  return [
    { id: id + "Floor", label: name + " · floor", unit, def: lev.floor, min, max, step },
    { id: id + "Ceil",  label: name + " · ceil",  unit, def: lev.ceil,  min, max, step },
    { id: id + "Steps", label: name + " · steps", unit: "", def: lev.steps, min: 2, max: 40, step: 1,
      clampShown: v => Math.round(v) },
  ];
}

// CS018 P2: the registry's VALUE entries, with the section headers filtered out. Every loop that wants
// "each knob" (the startup seed below, loadSettings' per-entry validation) goes through this — a header has
// no `id`/`def`/`min`/`max`, so iterating DEBUG_VARS directly would seed `debugShown[undefined]`.
const DEBUG_ENTRIES = DEBUG_VARS.filter(v => !v.header);
// CS018 P2: the panel's ROW MODEL, derived from the registry — never a hardcoded count or offset. Each
// registry entry becomes one row (a header row or a value row carrying its entry), and the two trailing rows
// (the CS017 P2 "Dump difficulty log" action and Back) are APPENDED HERE rather than special-cased in the
// handler and the renderer. That's what keeps them reachable at any registry size: they scroll with
// everything else, and both menuDebug and drawDebug read row `kind` instead of comparing against
// DEBUG_VARS.length. `game.menu.index` indexes THIS array, not DEBUG_VARS.
const DEBUG_ROWS = [
  ...DEBUG_VARS.map(v => v.header ? { kind: "header", label: v.header } : { kind: "var", label: v.label, e: v }),
  { kind: "action", label: "Dump difficulty log" },
  // CS024 P6e (spec §2/§4): two more action rows, same kind as Dump — no value, no chevrons, fired by
  // the normal confirm input, dispatched by label in menuDebug's existing action branch.
  { kind: "action", label: "Reset all debug knobs to defaults" },
  { kind: "action", label: "Reset saved scores" },
  { kind: "back",   label: "Back" },
];
// CS018 P2: the panel's transient VIEW state — the scroll window's top row and the pending numeric-entry
// buffer (`null` = not typing; a string = the digits typed so far, not yet committed). Module-level beside
// DebugCode rather than fields on game.menu ON PURPOSE: game.menu is written from two literals (its own and
// resetRun()'s), and a field added to only one of them reads `undefined` for a whole run — see the
// standing note at resetRun(). This state belongs to one hidden screen with exactly one entry point
// (enterDebug), which is the single place it resets.
const DebugPanel = { scroll: 0, entry: null };
const DEBUG = {};        // native-unit live values — what consumers read (e.g. seconds for the regen lock)
const debugShown = {};   // display-unit values — what the panel shows and what persists in afd_settings_v1.debug
// CS021 P3: `clampShown` is the one new registry hook this phase adds, alongside `toNative` — an entry
// may collapse the requested display value to an achievable one BEFORE it is stored, so `debugShown`
// (what's shown AND what's persisted) can never disagree with what actually gets used. Every entry
// without one is unaffected: `e.clampShown` is undefined, so `shown` passes through unchanged,
// byte-identical to the pre-P3 function. Its first user, `orbitCount` (FLAG-CS021-a), went with the
// orbit levels in CS024 P1; its users now are CS024 P6c's 17 `<leverId>Steps` rows, which round a TYPED
// entry to a whole number so the slider, the save file and the ramp the game actually derives can never
// show three different step counts.
// CS024 P6e: `overridesOn()` reads the toggle's OWN shown value — debugShown, not DEBUG, so it answers
// correctly even mid-derivation. `debugNative(e, shown, on)` is the one ON/OFF rule: ON reads the
// value handed in (debugShown[id], the edited request); OFF reads e.def (the registry default),
// ignoring the edit WITHOUT discarding it — debugShown itself is never touched by the on/off state.
function overridesOn() { return debugShown[DEBUG_OVERRIDE_ID] !== 0; }
function debugNative(e, shown, on) {
  const src = on ? shown : e.def;
  return e.toNative ? e.toNative(src) : src;
}
function applyDebug(id, shown) {
  const e = DEBUG_ENTRIES.find(v => v.id === id);
  const clamped = e.clampShown ? e.clampShown(shown) : shown;
  debugShown[id] = clamped;
  // CS024 P6e: writing the toggle itself re-derives EVERY row at once (rebuildDebug) rather than just
  // its own DEBUG entry — the on/off state under all ~70 other rows just changed. No special-casing
  // for what the toggle IS (still a plain DEBUG_ENTRIES row, still resettable by `r`/Reset All) — only
  // for what writing it must trigger downstream.
  if (id === DEBUG_OVERRIDE_ID) { rebuildDebug(); return; }
  DEBUG[id] = debugNative(e, clamped, overridesOn());
}
// CS024 P6e: the full re-derivation, called ONLY when the toggle flips (applyDebug, above) — every other
// edit (◄►, typed entry, `r`, Reset All) goes through applyDebug's single-field write, which applies the
// identical on/off rule to just the one id it touched.
function rebuildDebug() {
  const on = overridesOn();
  for (const e of DEBUG_ENTRIES)
    DEBUG[e.id] = e.id === DEBUG_OVERRIDE_ID ? debugShown[e.id] : debugNative(e, debugShown[e.id], on);
}
// CS024 P6e: extracted from the module-level seed loop so "reset every row" has exactly one
// implementation — the seed below and the panel's Reset All action row both call this, so they cannot
// drift apart the way two copies of the same loop eventually do.
function resetAllDebug() {
  for (const v of DEBUG_ENTRIES) applyDebug(v.id, v.def);
}
resetAllDebug();   // seed both maps from the registry defaults

// ---------- CS024 P6c: liveLevers() — the registry folded back into the odometer (spec §2.6) ----------
// THE ONE IMPURE FACE OF THE ODOMETER, and the reason it sits HERE rather than up in the odometer
// section: it reads DEBUG, and leverState()'s bare-context slice must not. Consumers call liveLevers()
// at their own point of use exactly as they called leverState() before — next wave's spawn, next
// saucer's construction, next canister's ctor — never per frame and never cached across an event.
//
// leverTable() is the shipped LEVERS with each lever's three OVERRIDABLE fields swapped for the
// registry's current values. Nothing else is overridable: `id`, `everyNLevels` and `carriesTo` are
// STRUCTURE, validated once at load by buildLeverOrder(), and no slider may reshape the graph — which
// is also why the copy needs no re-validation. `?? lev.floor` is a belt-and-braces fallback, not a
// sentinel: every one of the 54 rows seeds from LEVERS at load, so the ?? only ever fires if a knob is
// missing entirely, and when it does the shipped table wins.
//
// WHY THE WHOLE TABLE AND NOT A PER-VALUE OVERRIDE (the P5 shape this replaces): a Steps override
// changes a DRIVER'S WRAP PERIOD, and a driver's wrap period is how many carries every dependent under
// it receives. That is a change to the derivation's INPUT, so it cannot be applied to its OUTPUT after
// the fact. Rebuilding the table is the only place it fits — and it is cheap (18 small objects), which
// is why there is deliberately no cache here to go stale behind a slider.
function leverTable() {
  return LEVERS.map(lev => ({
    ...lev,
    floor: DEBUG[lev.id + "Floor"] ?? lev.floor,
    ceil:  DEBUG[lev.id + "Ceil"]  ?? lev.ceil,
    steps: DEBUG[lev.id + "Steps"] ?? lev.steps,
  }));
}
function liveLevers(wave) {
  return leverValues(leverTable(), wave);
}

// inactivity — timed in loop() (which runs every frame), NOT update() (paused/title-gated, exactly the
// states the code is armed in). The code's characters are deliberately none of the nav/confirm/pause/O
// keys, so every keystroke stays inert on the title/pause screens until the full code lands (item 4.3).

const DEBUG_CODE_IDLE_MS = 4000;
const DebugCode = { armed: false, buf: "", last: 0 };

// One snapshot row per nextWave() call, kept only in memory (never touches localStorage) and exported by
// hand from the DEBUG_CODE-gated debug panel below. DIFFLOG_FIELDS is the single source of truth for both
// the row shape (logDifficultySnapshot) and the CSV column order (difficultyLogCSV).
// CS018 P4 CHANGED THE FIELD LIST — deliberately, and it supersedes CS017 P2's "the field list is frozen"
// rule, which was written when the cycle clock was the thing being observed. Four columns described
// machinery that no longer exists (`cycle`, `cycleWave`, `hunterSpeedFrac`, `hunterTurnFrac`: the clock is
// retired and Hunter speed/turn are now frozen constants, so those two would log a fixed 0.58 forever).
// They are replaced by what the level table actually decides. Later phases may repoint the expressions
// feeding a column; changing the LIST itself needs a reason as concrete as this one.
const DIFFLOG_MAX = 2000; // cap so a long dev session can't grow the buffer without bound; drops oldest
const DiffLog = { rows: [] };
const DIFFLOG_FIELDS = [
  "t", "level", "score", "prevLevelSecs",
  "junkCount", "junkSpeedLarge", "junkSpeedMedium", "junkSpeedSmall", "junkSplit",
  "maxLargeHunters", "hunterCount", "coalescePause", "hunterSpeedMedium", "hunterSpeedSmall",
  "ufoAppearFreq", "ufoFlightSpeedBig", "ufoFlightSpeedSmall",
  "ufoDirChangeBig", "ufoDirChangeSmall", "ufoFireFreqBig", "ufoFireFreqSmall",
  "ufoAccuracySmall", "ufoShotSpeedBig", "ufoShotSpeedSmall",
  "saucerAimErr", "saucerGapMin", "saucerGapMax",
  "chainLen", "cargoMax", "scoopLevel",
];
// CS024 P5 (spec §4.5): REPOINTED OFF the retired levelDef fields, ONTO leverState — the list itself
// changes too (P4 deliberately left that decision open). `phase`/`rel` are DROPPED, not just nulled:
// they named positions inside CS018's 21-level three-phase structure, which the odometer has no
// equivalent of, so a column that always logs an empty cell serves nobody. The seven old tier-name
// columns are gone with them; the JUNK/HUNTER/UFO lever ids replace them one-for-one (17 total),
// keeping DIFFLOG_FIELDS a straight mirror of the LEVERS table plus the handful of non-lever context
// columns (maxLargeHunters, hunterCount, saucerAimErr/GapMin/Max, chainLen, cargoMax, scoopLevel).
//
// Snapshots read every lever from the SAME expressions the live sites use — never a re-derived formula.
// junkCount/junkSpeedLarge are passed in verbatim from nextWave()'s own `count`/`speed` locals (the
// exact, DEBUG-override-resolved values that level's DebrisSatellite spawns just used) — every other
// lever column re-applies the identical `liveLevers(game.wave).<id>` expression its own consumer uses,
// which is what keeps this an honest mirror rather than a second source of truth. CS024 P6c: the column
// reads liveLevers, NOT leverState — a floor/ceil/steps slider must move the log exactly as it moves the
// game, or a Gate B retune would be tuned against numbers the CSV never saw. CS024 P6f: maxLargeHunters
// is a PER-LEVEL number again — it calls the same largeHunterCap(game.wave) the conversion branch and the
// queue drain call, so a hunterCapMax / hunterCapLevelsPerStep retune moves the log exactly as it moves
// the game. It is still NOT a lever; it simply stopped being a constant.
// saucerAimErr mirrors the exact ufoAccuracyRad() call at the saucer aim site. saucerGapMin/Max
// log the jittered-interval bounds around the resolved appearance centre — the same "where the actual
// sampled timer can land" meaning this pair has always had.
function logDifficultySnapshot(junkCount, junkSpeedLarge, prevLevelSecs) {
  const lv = liveLevers(game.wave);
  const appearCenter = lv.ufoAppearFreq;
  const appearJitter = FREQ_JITTER;
  DiffLog.rows.push({
    t: performance.now(),
    level: game.wave,
    score: game.score,
    prevLevelSecs,
    junkCount,
    junkSpeedLarge,
    junkSpeedMedium: lv.junkSpeedMedium,
    junkSpeedSmall: lv.junkSpeedSmall,
    // CS026 P2: the split count, re-applying the identical liveLevers(...).junkSplit expression
    // destroyDebris() reads. Logged UNROUNDED, like every other lever column — the log records the
    // odometer's value, and the consumer's Math.round is the consumer's business (junkCount is the one
    // exception, and only because nextWave() hands its already-rounded local in verbatim).
    junkSplit: lv.junkSplit,
    maxLargeHunters: largeHunterCap(game.wave), // CS024 P6f: per-level again (P3's flat constant is gone)
    hunterCount: game.hunters.length, // FLAG-CS017-g: seeds the future music-intensity changeset
    coalescePause: lv.coalescePause,
    hunterSpeedMedium: lv.hunterSpeedMedium,
    hunterSpeedSmall: lv.hunterSpeedSmall,
    ufoAppearFreq: appearCenter,
    ufoFlightSpeedBig: lv.ufoFlightSpeedBig,
    ufoFlightSpeedSmall: lv.ufoFlightSpeedSmall,
    ufoDirChangeBig: lv.ufoDirChangeBig,
    ufoDirChangeSmall: lv.ufoDirChangeSmall,
    ufoFireFreqBig: lv.ufoFireFreqBig,
    ufoFireFreqSmall: lv.ufoFireFreqSmall,
    ufoAccuracySmall: lv.ufoAccuracySmall,
    ufoShotSpeedBig: lv.ufoShotSpeedBig,
    ufoShotSpeedSmall: lv.ufoShotSpeedSmall,
    saucerAimErr: ufoAccuracyRad(),
    saucerGapMin: appearCenter * (1 - appearJitter),
    saucerGapMax: appearCenter * (1 + appearJitter),
    chainLen: game.chain.length,
    cargoMax: game.cargoMax,
    scoopLevel: game.scoopLevel,
  });
  if (DiffLog.rows.length > DIFFLOG_MAX) DiffLog.rows.shift(); // drop oldest, keep the cap
}
// CSV column order matches DIFFLOG_FIELDS exactly; one header line + one line per row.
function difficultyLogCSV() {
  const lines = [DIFFLOG_FIELDS.join(",")];
  for (const row of DiffLog.rows) lines.push(DIFFLOG_FIELDS.map(f => row[f]).join(","));
  return lines.join("\n");
}
// "Dump difficulty log" debug-panel action (item 5). Builds the CSV, triggers a Blob download, then
// clears the buffer — clear only on a successful dump. An empty buffer does nothing but the negative
// blip (no download). The download path is wrapped so a headless/no-DOM environment (or a test stub
// missing Blob/URL/click) can never throw; the run still counts as a successful dump.
function dumpDifficultyLog() {
  if (!DiffLog.rows.length) { AudioSys.ui(false); return; }
  const csv = difficultyLogCSV();
  try {
    const blob = new Blob([csv], { type: "text/csv" });
    const ts = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `orbital-difficulty-${ts}.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) { /* headless/no-DOM: download silently unavailable, buffer still clears below */ }
  DiffLog.rows = [];
  AudioSys.ui(true);
}

// CS011: Dan speaks only when a real voice style is selected. voiceStyle "off" mutes him without disturbing
// VOICE_PARAMS (which keeps the last real style so the acoustic engine always has a valid full object).
function voiceEnabled() { return settings.voiceStyle !== "off"; }

// Music-track picker. Internal values drive gameplay-track selection; the labels are what the Options
// row shows. Cycled left/right like a Difficulty toggle. Ordered calm -> hot (v3.5).
const MUSIC_TRACK_VALUES = ["zen", "derelict", "drift", "warehouse"];
const MUSIC_TRACK_LABELS = { zen: "Zen", derelict: "Derelict", drift: "Drift", warehouse: "Warehouse" };

// CS011 P3: display labels for the Voice-style picker, parallel to VOICE_STYLE_VALUES.
const VOICE_STYLE_LABELS = { off: "Off", comms: "Comms", comms_f: "Comms ♀", flat: "Monotone", flat_f: "Monotone ♀", vintage: "Computer", vintage_f: "Computer ♀" };

// CS016 P1: split from a bare `game.paused` so "a menu owns input" (this) and "the sim is frozen"
// (game.paused) can diverge — the title menu is input-owning but never pauses (update() already
// early-returns on game.state !== "playing").
// CS016 P2 resolves FLAG-CS016-l: the second operand was `=== "titlemenu"`, which only covered the
// title's ROOT screen. gotoScreen("achievements"|"highscores") from the title menu sets
// game.menu.screen to THAT name while game.paused stays false, so the old check read false again the
// instant either screen was reached — killing Up/Down/Back on them and letting Confirm fall through
// to the title's startGame() shortcut (Enter on the High Scores table would silently start a run).
// `!== null` is the invariant that actually holds: game.menu.screen is non-null iff some menu screen
// owns input, and it covers every present and future title-descendant screen without an OR chain.
// The `game.paused ||` term is kept as belt-and-braces (a paused-with-null-screen state is
// unreachable today — openPause/openDebug set both, closePause/quitToTitle clear both together).
function menuActive() { return game.paused || game.menu.screen !== null; }

// --- Open / close / quit ---
function openPause() {
  game.paused = true;
  // CS012 P4 (FORK-CS012-C → a): paused mid-game opens the root menu; from title, O/Start/B open
  // OPTIONS directly (no separate system-menu root) — openPause routes off game.state. CS013 P1
  // (FORK-CS013-A → a): gameover is a session-end state with real session verbs (Play Again/Quit to
  // Title), so it now ALSO opens the root — a context-aware one, see rootItems(). Title alone has no
  // session verbs and keeps going straight to Options.
  game.menu.screen = (game.state === "playing" || game.state === "gameover") ? "root" : "options"; game.menu.index = 0; game.menu.row = 0; game.menu.col = 0;
  game.menu.rebinding = null; game.menu.modal = null;   // CS016 P3: modal mirrors rebinding at every menu-state reset
  resetMenuNav();          // don't let a direction held at pause-time fire a phantom move
  AudioSys.thrust(false);  // kill the thrust loop immediately (update() would too, next frame)
  AudioSys.lowhp(false); game.lowHpSiren = false; // same — the siren must not drone through a pause menu
  game.hpReliefFlash = 0; // CS010 P3: a stale relief exhale must not survive a pause (the siren latch is torn down directly here, bypassing the falling-edge branch)
  AudioSys.ui(true);
}
function closePause() {
  // CS016 P2: at the TITLE there is no "no menu" state to close back to — the title menu IS the
  // title's base UI, not an overlay. Every remaining route here from a title-context screen (the
  // `pause` action on any Options sub-screen, debugReturn() out of the hidden panel) must therefore
  // land on "titlemenu", or the title would render with no cursor and menuActive() would read false,
  // leaving the whole screen dead to input. menuOptions' Back branches call returnToTitleMenu()
  // directly (they're the designed path); this delegation is the catch-all for the rest.
  if (game.state === "title") { returnToTitleMenu(); return; }
  game.paused = false;
  game.menu.screen = null; game.menu.rebinding = null; game.menu.modal = null;
  game.menu.index = 0; game.menu.row = 0; game.menu.col = 0;
  AudioSys.ui(false);
}
// CS016 P2 (§2): the title menu's re-entry point, used by every Back/close that lands on the title.
// It also CLEARS game.paused — openPause() sets it true so Options keeps its dimmed-panel chrome even
// when opened from the title, and that flag must not survive back onto the paused-free title menu.
// Cursor lands on "Options" (where the player just was); label lookup, never a hardcoded index.
function returnToTitleMenu() {
  game.paused = false;
  game.menu.screen = "titlemenu";
  game.menu.index = MENU_TITLE.indexOf("Options");
  game.menu.row = 0; game.menu.col = 0; game.menu.scroll = 0;
  game.menu.modal = null;  // CS016 P3: a clear site the P3 plan could not name — this helper post-dates it
  AudioSys.ui(false);
}
function quitToTitle() {
  game.paused = false;
