  // CS016 P2: the title is a navigable menu now, so quitting to it must ARM that menu, not close all
  // menus (screen = null would leave the title cursor-less and dead to input). Cursor resets to
  // "Start Game" (index 0) rather than inheriting the root's — a stale index 2 ("Quit") would land on
  // "High Scores" here.
  game.menu.screen = "titlemenu"; game.menu.rebinding = null; game.menu.modal = null;
  game.menu.index = 0; game.menu.row = 0; game.menu.col = 0; game.menu.scroll = 0;
  game.state = "title";
  AudioSys.thrust(false); AudioSys.saucer(false); // stop any continuous voices
  AudioSys.lowhp(false); game.lowHpSiren = false;
  game.hpReliefFlash = 0; // CS010 P3: no stale relief exhale survives a quit-to-title
  game.caption.life = 0;  // CS011 P2: no stale voice caption lingers into the title
  Achievements.save();  // persist lifetime progress earned during the abandoned game (F9)
  AudioSys.ui(false);
}
function gotoScreen(s, index) {
  game.menu.screen = s;
  game.menu.index = index || 0; game.menu.row = 0; game.menu.col = 0; game.menu.scroll = 0;
  game.menu.modal = null;  // CS016 P3: a dialog belongs to the screen that raised it and never survives a screen change
  game.menu.achTab = ACH_TAB_DEFAULT;  // CS016 P5: sits beside the scroll reset — re-entry is always Weekly, unscrolled
  game.menu.slotMsg = "";  // CS032 P3: same reasoning as achTab — a stale write-failure banner must not survive a screen change
  AudioSys.ui(true);
}
// CS015 P4: open the hidden Debug Options panel straight from the Title screen (where there is no root
// menu to route through). Sibling of openPause — sets game.paused so update() freezes and menuActive()
// reads true; from a paused live game the secret-code path uses gotoScreen("debug") instead (the game is
// already paused). Not listed in any menu; reachable only by the secret code.
function openDebug() {
  game.paused = true;
  game.menu.screen = "debug"; game.menu.index = 0; game.menu.row = 0; game.menu.col = 0;
  game.menu.rebinding = null; game.menu.modal = null;
  resetMenuNav();          // a direction held while typing the code must not fire a phantom first move
  AudioSys.ui(true);
}
// CS018 P2: the ONE entry point into the hidden panel — both secret-code routes (title and paused game) come
// through here, so the panel's view state resets and the cursor lands on the first SELECTABLE row in a single
// place. Row 0 is a section header now, so neither openDebug's nor gotoScreen's `index = 0` is a valid cursor
// on its own; debugFirstRow() is applied after whichever route ran. openDebug keeps its own job (the
// paused-from-title chrome) untouched.
function enterDebug() {
  DebugPanel.scroll = 0; DebugPanel.entry = null;
  if (game.state === "title") openDebug(); else gotoScreen("debug");
  game.menu.index = debugFirstRow();
}

// --- CS016 P3: modal confirmation dialogs ---
// The build's first modal. State is ONE nullable field on game.menu, mirroring `rebinding`: a mode
// that owns menu input while it is non-null. `onConfirm` is a plain closure, so a consumer wires a
// dialog with one call and no per-screen state.
//
// index 1 (CANCEL) IS THE SAFETY PROPERTY, not a default worth "tidying" to 0. Every consumer here is
// destructive, and ENTER is the same key that opened the dialog — with index 0 a double-tap of ENTER
// (or a held key that got past the e.repeat guard) would wipe a run or a rebind set with no
// deliberate act. The player must move the cursor to destroy something.
function openModal(text, confirmLabel, onConfirm, cancelLabel = MODAL_CANCEL_LABEL) {
  game.menu.modal = { text, confirmLabel, cancelLabel, index: 1, onConfirm };
  AudioSys.ui(true);
}
// The exclusive handler. Two rows only, so every direction is the same toggle — up/down is the
// natural gesture for a vertical list, left/right costs nothing and stops a stick nudge reading as
// dead input. No per-screen handler knows modals exist; menuInput's guard keeps them all unreached.
function menuModal(a) {
  const md = game.menu.modal;
  if (a === "up" || a === "down" || a === "left" || a === "right") { md.index = 1 - md.index; AudioSys.ui(false); }
  else if (a === "confirm") {
    if (md.index === 0) {
      // Capture, then CLEAR BEFORE INVOKING: onConfirm is free to navigate (quitToTitle re-arms the
      // title menu, gotoScreen changes screen), and a teardown running after it would clobber the
      // state the callback just set — or, worse, resurrect a dialog it had already dismissed.
      const run = md.onConfirm;
      game.menu.modal = null;
      if (run) run();
      AudioSys.ui(true);
    } else { game.menu.modal = null; AudioSys.ui(false); } // ENTER on CANCEL is a dismissal, so the back tone
  }
  // `pause` is treated as cancel, NOT passed through: it must never close the whole menu out from
  // under an open confirmation (closePause() from here would leave the dialog's question unanswered
  // and the player back in the game with no idea which way it went).
  else if (a === "back" || a === "pause") { game.menu.modal = null; AudioSys.ui(false); }
}

// --- Keyboard -> menu action mapping (arrows + WASD nav; Enter/Esc/P via the binding table) ---
function handleMenuKey(k) {
  if (k === "arrowup" || k === "w") menuInput("up");
  else if (k === "arrowdown" || k === "s") menuInput("down");
  else if (k === "arrowleft" || k === "a") menuInput("left");
  else if (k === "arrowright" || k === "d") menuInput("right");
  else if (bindings.confirm.keys.includes(k)) menuInput("confirm"); // Enter
  else if (bindings.back.keys.includes(k)) menuInput("back");       // Esc
  else if (bindings.pause.keys.includes(k)) menuInput("pause");     // P
  // CS016 P2: "o" as a menu-level action. The title now satisfies menuActive(), so branch (2) of the
  // keydown listener swallows every key before the old title-only `if (k === "o") openPause()` in
  // branch (3) can see it — that shortcut (existing muscle memory, FLAG-CS016-e) would have gone inert.
  // Mapping it here keeps the one-action-vocabulary architecture: only menuTitle acts on "options";
  // every other screen handler is an if/else-if chain over known actions, so it's an inert no-op there.
  else if (k === "o") menuInput("options");
  // CS024 P6e (spec §1): "r" resets the debug panel's selected row. Same shape as "o" above — mapped
  // globally here, acted on only by menuDebug (every other screen's if/else-if chain has no "reset"
  // branch and ignores it, same as "o" is inert everywhere but menuTitle). Confirmed free by the P6e
  // phase prompt's own grep instruction: CS024 P1 removed the only other raw "r" capture on this screen
  // (the orbit start-angle reroll), and the debug numeric-entry hook only ever claims DEBUG_ENTRY_CHARS
  // ([-.0-9]) + Backspace, never a bare letter.
  else if (k === "r") menuInput("reset");
}

// --- The dispatcher: one entry point, both input methods feed it ---
function menuInput(action) {
  if (game.menu.rebinding) return; // capture mode owns all input; ignore stray nav
  // CS016 P3: the second exclusive mode, and it stays SECOND on purpose. Rebinding is a live hardware
  // capture — the very next keypress is data, not navigation — so it must out-rank everything,
  // including an open dialog. (The two are mutually exclusive in practice: you cannot reach a modal's
  // opener while capturing, nor a rebind row while a modal is up. The order is the guarantee, not the
  // observed behaviour.) Placed BEFORE the screen switch so no per-screen handler sees the action.
  if (game.menu.modal) { menuModal(action); return; }
  switch (game.menu.screen) {
    case "titlemenu":    menuTitle(action); break;   // CS016 P2: the title screen's own root
    case "root":         menuRoot(action); break;
    case "options":      menuOptions(action); break;
    case "sound":        menuSound(action); break;
    case "controls":     menuControls(action); break;
    case "difficulty":   menuDifficulty(action); break;
    case "achievements": menuAchievements(action); break;
    case "highscores":   menuHighScores(action); break;
    case "nameentry":    menuNameEntry(action); break;  // CS031 P3: the profile name grid
    case "profiles":     menuProfiles(action); break;   // CS031 P4: the roster screen
    case "slots":        menuSlots(action); break;      // CS032 P3: the save/load slots screen
    case "debug":        menuDebug(action); break;   // CS015 P4: hidden, secret-code-only
  }
}

// CS016 P2 (§1): the TITLE screen's root menu. Follows the menuRoot template exactly — dispatch by
// LABEL, never by index, so reordering MENU_TITLE can't silently shift a branch out from under itself.
//
// Three actions do more than the plan's first sketch, each to avoid a silent regression that only
// exists because the title now satisfies menuActive() and so shadows keydown branch (3) /
// handleGamepadMenu branch (3), which used to handle these at the title:
//   "options" — keyboard "o" (see handleMenuKey). Was branch (3)'s `k === "o"` title shortcut.
//   "back"    — ESC (keyboard) AND B (gamepad) both normalize to "back". B on the title already
//               opened Options (handleGamepadMenu branch (3), `pressedBack && onTitleOrOver`), so
//               leaving "back" inert here would REGRESS the pad. Making it open Options preserves that
//               and simultaneously delivers §7 / FLAG-CS016-e's "ESC opens Options from the title"
//               (ESC was inert at the title before — it resolves to "back", and branch (3) only had a
//               pause handler gated on state === "playing"). There is nothing to back OUT to from a
//               root, so the action was free.
//   "pause"   — gamepad Start (keyboard has no distinct pause key: both back and pause bind ESC, and
//               handleMenuKey resolves back first). Start on the title already STARTED A GAME
//               (branch (3), `pressedStart` -> startGame() outside "playing"); routed through here so
//               it still does, with no state-sniffing special case bolted onto the pad dispatcher.
function menuTitle(a) {
  const m = game.menu, N = MENU_TITLE.length;
  if (a === "up")   { m.index = (m.index + N - 1) % N; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % N; AudioSys.ui(false); }
  else if (a === "confirm") {
    const label = MENU_TITLE[m.index];
    if (label === "Start Game")        startGame();
    // CS032 P4 (spec §4.3): the "slots" screen's LOAD entry point, and the second half of this row's
    // unavailable-row idiom — the count is asked HERE, at confirm time, exactly as drawTitleMenu asks
    // it at draw time. Never cached: a profile switch or a profile delete changes the answer, and a
    // cached "there is something to load" would send the player to three inert rows. The early return
    // is silent (no gotoScreen, so no AudioSys.ui blip), which is what makes the row read as inert
    // rather than broken — menuProfiles' "Add Profile" cap does the same thing the same way.
    else if (label === "Load Saved Game") {
      if (SaveSlots.count() === 0) return;
      game.menu.slotMode = "load";   // set BEFORE gotoScreen — the screen reads it on its first draw
      gotoScreen("slots");
    }
    // CS031 P5 (FORK-CS031-H → c / FORK-CS031-I): the "profiles" screen's ONE entry point. gotoScreen
    // resets index/row/col/scroll, so the roster cursor always starts fresh, and menuProfiles'/
    // closePause's own "back lands on titlemenu" precedent brings the player straight back here.
    else if (label === "Profile")      gotoScreen("profiles");
    else if (label === "Achievements") gotoScreen("achievements");
    else if (label === "High Scores")  gotoScreen("highscores");
    // openPause() (not gotoScreen) on purpose: it sets game.paused, which is what keeps Options and
    // its sub-screens on their existing dimmed-panel drawMenu() chrome when opened from the title.
    else if (label === "Options")      openPause();
  }
  else if (a === "back" || a === "options") openPause();   // ESC / B / "o" -> Options shortcut
  else if (a === "pause") startGame();                     // gamepad Start -> start a run
}

function menuRoot(a) {
  const m = game.menu, items = rootItems(), N = items.length;
  if (a === "up")   { m.index = (m.index + N - 1) % N; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % N; AudioSys.ui(false); }
  else if (a === "confirm") {
    // CS013 P1: the root is context-aware (see rootItems()) — paused mid-game gives
    // Continue/Options/Quit, gameover gives Play Again/Options/Quit to Title. Dispatch by label
    // (menuOptions precedent) so the two layouts share one handler without an index branch.
    const label = items[m.index];
    if (label === "Continue")          closePause();
    // CS032 P4: "Save" is live — the "slots" screen's SAVE entry point, and the row's only caller
    // (spec §0.2: Save is reachable from the paused root and nowhere else, which is why menuSlots'
    // Back can derive its destination from slotMode alone). MENU_ROOT_OVER carries no "Save" row, so
    // this branch can never fire at gameover even though both roots share this one handler.
    else if (label === "Save")         { game.menu.slotMode = "save"; gotoScreen("slots"); }
    else if (label === "Play Again")   startGame();
    else if (label === "Options")      gotoScreen("options");
    // CS016 P3: the two Quit rows split here, and label dispatch already tells them apart with no
    // game.state sniffing. Mid-run "Quit" throws away a live run, so it is confirmed. Gameover's
    // "Quit to Title" is deliberately NOT — the run is already over and there is nothing left to
    // destroy, so a dialog there would be pure friction on the most-pressed row of that screen.
    else if (label === "Quit")         openModal("Quit to title? Progress in this run will be lost.", "QUIT", quitToTitle);
    else if (label === "Quit to Title") quitToTitle();
  }
  else if (a === "back" || a === "pause") closePause();
}

// Dispatch by LABEL (the menuRoot precedent), not by hardcoded index, so a new row is additive and
// no index-fragile branch has to shift. CS010 P4 (§8b/§9/§10a): now a pure nav list — the volume
// sliders + Music Track moved to "sound" (below), and "High Scores" (§8b) was nested in here.
function menuOptions(a) {
  const m = game.menu, N = MENU_OPTIONS.length, label = MENU_OPTIONS[m.index];
  if (a === "up")   { m.index = (m.index + N - 1) % N; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % N; AudioSys.ui(false); }
  else if (a === "confirm") {
    if (label === "Sound / Music") gotoScreen("sound"); // CS010 P4 §9
    else if (label === "Controls") gotoScreen("controls");
    // CS016 P2 (§2): the "Achievements" and "High Scores" rows are GONE from MENU_OPTIONS — the title
    // menu is now their sole parent, so there are no dispatch branches for them here either.
    else if (label === "Difficulty") gotoScreen("difficulty"); // Difficulty screen (v3.0 P5)
    // CS012 P4 / CS013 P1: Back is context-aware — paused mid-game OR gameover (both have a root)
    // return to it (cursor on Options). CS016 P2: from the title the `else` no longer closes the
    // overlay entirely — the title has a menu of its own to return to, with game.paused cleared.
    else if (label === "Back") { if (game.state === "playing" || game.state === "gameover") gotoScreen("root", rootItems().indexOf("Options")); else returnToTitleMenu(); }
  }
  else if (a === "back") { if (game.state === "playing" || game.state === "gameover") gotoScreen("root", rootItems().indexOf("Options")); else returnToTitleMenu(); }
  else if (a === "pause") closePause();
}

// Sound / Music sub-screen (CS010 P4, §9): the three volume sliders + Music Track cycler, relocated
// off Options — a relocation, not a redesign, so it's the SAME control style. Follows the
// menuDifficulty/menuOptions label-dispatch template exactly; VOL_LABELS/VOL_CATS stay a paired
// lookup (not tied to any row's position on THIS screen either).
function menuSound(a) {
  const m = game.menu, N = SOUND_ROWS.length, label = SOUND_ROWS[m.index];
  if (a === "up")   { m.index = (m.index + N - 1) % N; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % N; AudioSys.ui(false); }
  else if (a === "left" || a === "right") {
    const vi = VOL_LABELS.indexOf(label);
    if (vi >= 0) { // a volume slider
      const cat = VOL_CATS[vi];
      AudioSys.setVol(cat, clamp01(AudioSys.vol[cat] + (a === "right" ? VOL_STEP : -VOL_STEP)));
      saveSettings();
      AudioSys.ui(false);
    } else if (label === "Music Track") { // cycle the gameplay-track selection (same idiom as Difficulty toggles)
      const idx = MUSIC_TRACK_VALUES.indexOf(settings.musicTrack), n = MUSIC_TRACK_VALUES.length;
      settings.musicTrack = MUSIC_TRACK_VALUES[(idx + (a === "right" ? 1 : -1) + n) % n];
      saveSettings();
      AudioSys.ui(false);
    } else if (label === "Voice") { // cycle Dan's voice style (same idiom as Music Track)
      const idx = VOICE_STYLE_VALUES.indexOf(settings.voiceStyle), n = VOICE_STYLE_VALUES.length;
      settings.voiceStyle = VOICE_STYLE_VALUES[(idx + (a === "right" ? 1 : -1) + n) % n];
      VoiceSys.setStyle(settings.voiceStyle);
      saveSettings();
      AudioSys.ui(false);
    } else if (label === "Captions") { // toggle on-screen captions
      settings.captions = !settings.captions;
      saveSettings();
      AudioSys.ui(false);
    }
  }
  else if (a === "confirm") {
    if (label === "Back") gotoScreen("options", MENU_OPTIONS.indexOf("Sound / Music"));
  }
  else if (a === "back") gotoScreen("options", MENU_OPTIONS.indexOf("Sound / Music"));
  else if (a === "pause") closePause();
}

// Achievements viewer (F9): a read-only list — no rows to select, so nav only scrolls/switches tab
// and any of confirm/back/pause exits (cursor left on the "Achievements" row of its parent screen).
function menuAchievements(a) {
  if (a === "pause") closePause();
  // CS016 P5: left/right switch tabs. These two actions were UNUSED on this screen (it handled only
  // up/down/confirm/back/pause), so there was no input to displace. WRAPPING, not clamping: with
  // exactly two tabs either direction always lands on the other one — a player who taps ◄ on the
  // Weekly tab gets Lifetime rather than a dead key — and setAchTab's modulo keeps that a carousel
  // if a third tab is ever added.
  else if (a === "left")  setAchTab(achTabIndex() - 1);
  else if (a === "right") setAchTab(achTabIndex() + 1);
  // CS013 P3: up/down drive the continuous vertical scroll (FLAG-2c) — the viewer has no row
  // selection to conflict with. Keyboard and gamepad d-pad/L-stick both normalize to "up"/"down"
  // through menuInput, so this covers both inputs uniformly. Clamped against the SAME achMaxScroll()
  // drawAchievements() renders with, so input and render never disagree about the scroll ceiling.
  else if (a === "up")   game.menu.scroll = Math.max(0, game.menu.scroll - ACH_SCROLL_STEP);
  else if (a === "down") game.menu.scroll = Math.min(achMaxScroll(), game.menu.scroll + ACH_SCROLL_STEP);
  // CS012 P4: Achievements has exactly ONE parent, so Back is a hardcoded destination with the cursor
  // restored to its own row — no achReturn tracker. CS016 P2 (§2, FORK-CS016-A) repoints that single
  // parent from Options to the TITLE MENU; still one parent, still no return-context machinery, only
  // the screen it names changed. Accepted cost: the viewer is now unreachable mid-run and at gameover
  // (unlock toasts during play remain the in-run feedback).
  else if (a === "confirm" || a === "back") gotoScreen("titlemenu", MENU_TITLE.indexOf("Achievements"));
}

// High Scores viewer: read-only top-10 table. One entry point -> one back-destination, no
// return-context tracker (like Achievements). CS016 P2 (§2, FORK-CS016-A) moves that one parent from
// Options (where CS010 P4 §8b nested it specifically to be reachable from pause) to the TITLE MENU —
// a deliberate reversal, signed off: the gameover screen already renders the top-10 table inline with
// the fresh entry highlighted, which covers the end-of-run case this gives up.
function menuHighScores(a) {
  if (a === "pause") closePause();
  else if (a === "confirm" || a === "back") gotoScreen("titlemenu", MENU_TITLE.indexOf("High Scores"));
}

// Difficulty screen (v3.0 P5, B-4/B-5): left/right toggle rows + Back. Structured to grow with future
// difficulty knobs (FLAG B-4-c): add a row here + a case in the switch and the renderer picks it up.
// CS024 P6 (spec §3.7): FOUR VALUE ROWS DOWN TO ONE. "shot", "magnet" and "chainguard" all picked
// between a timed and a counted expiry mode; timed expiry no longer exists, so all three rows are
// deleted along with the settings fields behind them. THE SCREEN IS KEPT (resolved, spec §3.7) rather
// than folding Auto-shield onto Options — it is the one place a player-facing difficulty choice lives,
// and the next such choice should land here rather than re-creating the screen.
const DIFFICULTY_ROWS = ["autoshield", "back"];
// CS016 P4 (§5): a live run's rules can't change mid-run — retroactively flipping auto-shield would
// corrupt the meaning of that run's score and achievement progress. Keyed on
// game.state === "playing" specifically (NOT game.paused, which the title also carries as of CS016 P2;
// NOT gameover, where the run is already over and changing settings for the next one is harmless).
// The value row stays focusable (so the player can still READ it) and renders COLOR.dim — the
// shared unavailable-row idiom (see menuProfiles' "Add Profile" cap below); "back" is unaffected.
const DIFFICULTY_LOCK_HELP = "Difficulty can't be changed during a run.";
function menuDifficulty(a) {
  const m = game.menu, N = DIFFICULTY_ROWS.length;
  const row = DIFFICULTY_ROWS[m.index];
  const locked = game.state === "playing" && row !== "back";
  if (a === "up")   { m.index = (m.index + N - 1) % N; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % N; AudioSys.ui(false); }
  else if ((a === "left" || a === "right") && !locked) {
    if (row === "autoshield") { settings.autoShield = a === "right"; saveSettings(); AudioSys.ui(false); }
  }
  else if (a === "confirm") {
    if (row === "back") gotoScreen("options", MENU_OPTIONS.indexOf("Difficulty"));
  }
  else if (a === "back") gotoScreen("options", MENU_OPTIONS.indexOf("Difficulty"));
  else if (a === "pause") closePause();
}

// --- CS018 P2: the debug panel's row model, scroll window and direct numeric entry ---
// Every index below is DERIVED from DEBUG_ROWS (which is itself derived from the registry). There is no
// literal row count, no "dumpRow = N" offset and no assumption that m.index maps onto DEBUG_VARS — that
// mapping is exactly what section headers break, and it is what CS015 P5's "derive the index" lesson was
// about in the first place. The registry can grow to 32 entries with headers interleaved and none of this
// needs an edit.
function debugFirstRow() { return DEBUG_ROWS.findIndex(r => r.kind !== "header"); }
// The registry entry under the cursor, or null when the cursor is on a header / Dump / Back. The one place
// "is a value row selected?" is answered — the keydown numeric-entry gate, the ◄► step and the renderer all
// ask through it.
function debugSelectedVar() {
  const r = DEBUG_ROWS[game.menu.index];
  return r && r.kind === "var" ? r.e : null;
}
// The next SELECTABLE row in `dir`, wrapping. Headers are skipped entirely (FLAG-j) so one can never become
// the selection — including on the wrap from the last row back to the first, and vice versa. Walks at most
// one full lap, so an all-headers registry (impossible: Dump and Back are always appended) returns `from`.
function debugStep(from, dir) {
  const n = DEBUG_ROWS.length;
  for (let k = 1; k <= n; k++) {
    const i = ((from + dir * k) % n + n) % n;
    if (DEBUG_ROWS[i].kind !== "header") return i;
  }
  return from;
}
// The scroll window's top row. RECOMPUTED from the selection on every nav press and every draw rather than
// nudged incrementally, so the window can never drift out of sync with the cursor: the selected row is
// always inside [top, top + DEBUG_ROWS_VISIBLE), scrolling both directions and across the last→first wrap.
function debugScrollTop() {
  const max = Math.max(0, DEBUG_ROWS.length - DEBUG_ROWS_VISIBLE);
  const i = game.menu.index;
  let t = Math.max(0, Math.min(max, DebugPanel.scroll));
  if (i < t) t = i;                                              // scrolled past the cursor going up
  else if (i >= t + DEBUG_ROWS_VISIBLE) t = i - DEBUG_ROWS_VISIBLE + 1;   // ...or going down
  // Pull a section header into view with the row it labels: without this, arriving on the first value under
  // a header leaves that header one row above the window and the value reads as uncategorised.
  if (t > 0 && i === t && DEBUG_ROWS[t - 1].kind === "header") t--;
  DebugPanel.scroll = Math.max(0, Math.min(max, t));
  return DebugPanel.scroll;
}

// Direct numeric entry. menuDebug() is fed ABSTRACT actions (up/down/left/right/confirm/back), so the digits
// themselves are captured raw in the keydown listener and funnelled into debugEntryKey; commit and cancel
// stay on the abstract layer (menuDebug's confirm/back) so gamepad A/B behave exactly like ENTER/ESC.
const DEBUG_ENTRY_CHARS = /^[-.0-9]$/;
function debugEntryActive() { return DebugPanel.entry !== null; }
function debugEntryKey(key) {
  const e = debugSelectedVar();
  if (!e) return;                          // nothing typeable under the cursor (header / Dump / Back)
  const cur = DebugPanel.entry === null ? "" : DebugPanel.entry;
  let b = cur;
  if (key === "Backspace") b = cur.slice(0, -1);
  else if (key === "-") b = cur.startsWith("-") ? cur.slice(1) : "-" + cur;  // sign TOGGLE, usable mid-number
  else if (key === ".") { if (!cur.includes(".")) b = cur + "."; }           // at most one decimal point
  else b = cur + key;
  if (b.length > DEBUG_ENTRY_MAXLEN) return;   // drop the keystroke rather than truncate someone's number
  DebugPanel.entry = b;
  AudioSys.ui(false);
}
// Commits through the SAME applyDebug + saveSettings path as ◄► stepping — one write path, one persistence
// path, display units into afd_settings_v1.debug exactly as before. Clamped to the entry's own [min,max].
// Deliberately does NOT snap to `step` (a typed value is an exact request, which is the point of typing it)
// and deliberately performs NO cross-field comparison: CS018 ships four levers whose values DECREASE as
// difficulty rises, so any low <= normal <= high check here would reject valid configuration.
function debugEntryCommit() {
  const e = debugSelectedVar(), raw = DebugPanel.entry;
  DebugPanel.entry = null;
  if (!e || raw === null) return;
  const n = parseFloat(raw);
  if (!Number.isFinite(n)) { AudioSys.ui(false); return; }   // "", "-", "." — nothing typed; treat as cancel
  applyDebug(e.id, Math.max(e.min, Math.min(e.max, n)));
  saveSettings();
  AudioSys.ui(true);
}
function debugEntryCancel() { DebugPanel.entry = null; AudioSys.ui(false); }

// Hidden Debug Options panel handler (CS015 P4). Generic over DEBUG_ROWS: header rows (skipped by up/down),
// value rows, then a trailing "Dump difficulty log" ACTION row (CS017 P2 — no value, no chevrons, left/right
// is a no-op on it same as Back), then Back. up/down move the cursor; left/right adjust the focused var by
// its step (clamped [min,max]) then applyDebug + persist immediately; confirm on the dump row triggers
// dumpDifficultyLog(), confirm on Back — or back anywhere — returns to context. Reached only by the secret
// code (see the keydown listener), so there is no "Debug" menu row to restore the cursor to on return:
// debugReturn mirrors menuOptions' routing and lands on the always-present Options row when a root exists.
// Adding a debug var later touches nothing here — the registry drives the rows.
function menuDebug(a) {
  const m = game.menu;
  // CS018 P2: a pending numeric entry OWNS the row. left/right must not step (a stray nudge would silently
  // discard the digits and change the value anyway) and back must not leave the screen — ESC / B cancel the
  // entry instead, which IS the "Escape cancels" contract. `pause` is treated as a leave too, for the same
  // reason. up/down abandon the entry, since a half-typed value belongs to the row it was typed on.
  if (debugEntryActive()) {
    if (a === "confirm") { debugEntryCommit(); return; }
    if (a === "back" || a === "pause") { debugEntryCancel(); return; }
    if (a === "left" || a === "right") return;
    // CS024 P6e (spec §1): `r` must not fight the entry buffer — inert while a numeric entry is pending,
    // same treatment as left/right above (a stray reset must not silently discard mid-typed digits).
    if (a === "reset") return;
    if (a === "up" || a === "down") debugEntryCancel();
  }
  if (a === "up" || a === "down") {
    m.index = debugStep(m.index, a === "up" ? -1 : 1);
    debugScrollTop();
    AudioSys.ui(false);
  }
  else if (a === "left" || a === "right") {
    const e = debugSelectedVar();   // null on a header / the dump action / Back — left/right is a no-op there
    if (e) {
      // CS024 P6c: P5's null "auto" base STOOD HERE — a lever knob's debugShown started null, so the
      // nudge had to source its base from leverState(game.wave)[e.id] instead. The three-knobs-per-lever
      // rebuild retires the sentinel: every row, lever or not, now seeds from a real constant (a floor,
      // a ceiling, a step count), so every base is simply the shown value and this is one branch again.
      const next = Math.max(e.min, Math.min(e.max, debugShown[e.id] + (a === "right" ? e.step : -e.step)));
      applyDebug(e.id, next);
      saveSettings();
      AudioSys.ui(false);
    }
  }
  else if (a === "confirm") {
    const r = DEBUG_ROWS[m.index];
    // CS024 P6e: dispatched by label, same idiom as the sound/options screens' label-dispatch — one
    // action row per branch, no index arithmetic. Both new rows go through openModal, same as Controls'
    // "Reset all controls to defaults?" precedent, so a stray confirm cannot fire either irreversible
    // action without a second deliberate press.
    if (r && r.kind === "action") {
      if (r.label === "Dump difficulty log") dumpDifficultyLog();
      else if (r.label === "Reset all debug knobs to defaults")
        openModal("Reset all debug knobs to defaults?", "RESET", () => { resetAllDebug(); saveSettings(); });
      else if (r.label === "Reset saved scores")
        openModal("Erase every saved score? This cannot be undone.", "ERASE", resetHighScores);
    }
    else if (r && r.kind === "back") debugReturn();
  }
  else if (a === "back") debugReturn();
  else if (a === "pause") closePause();
  // CS024 P6e (spec §1): reset the SELECTED row to its registry default — one uniform rule, `e.def`,
  // no special-casing for a lever row, a toNative row or a clampShown row (applyDebug already applies
  // clampShown/toNative identically regardless of how the value arrived). Inert while typing (a stray
  // "r" mid-entry must not fight the entry buffer) and inert on a header/action/Back row (debugSelectedVar
  // is null there, same guard left/right already uses).
  else if (a === "reset") {
    const e = debugSelectedVar();
    if (e) { applyDebug(e.id, e.def); saveSettings(); AudioSys.ui(true); }
  }
}
// CS024 P6e (spec §4): clears BOTH the in-memory table and the persisted key (through HighScores.save(),
// the same guarded write path every other store uses — never a raw removeItem) so the browsable table and
// qualifies() cannot answer from stale data before a reload. Scores ONLY — afd_achievements_v2 is a
// separate key/store and this function never touches it. Also drops any stale gameover-table highlight,
// since the id it points at no longer exists in entries.
function resetHighScores() {
  HighScores.entries = [];
  HighScores.save();
  game.lastScoreId = null;
}
function debugReturn() {
  if (game.state === "playing" || game.state === "gameover") gotoScreen("root", rootItems().indexOf("Options"));
  else closePause();
}

function menuControls(a) {
  const m = game.menu;
  const ACTIONS = REBINDABLE;               // one row per rebindable action, col 0 = kb, col 1 = pad
  // Row order: [rebindable actions...], Ship Rotation slider (§10b), Return to Defaults, Back. Derive
  // the three trailing indices from ACTIONS.length so inserting the slider row can't desync them (nor
  // can adding/removing a rebindable action later). drawControlsMenu derives them the same way.
  const turnRow = ACTIONS.length;
  const defaultsRow = ACTIONS.length + 1, backRow = ACTIONS.length + 2;
  const ROWS = ACTIONS.length + 3;          // + Ship Rotation + Return to Defaults + Back
  if (a === "up")   { m.row = (m.row + ROWS - 1) % ROWS; AudioSys.ui(false); }
  else if (a === "down") { m.row = (m.row + 1) % ROWS; AudioSys.ui(false); }
  else if (a === "left" || a === "right") {
    if (m.row < ACTIONS.length) { m.col = 1 - m.col; AudioSys.ui(false); }                          // toggle kb/pad column
    else if (m.row === turnRow) { adjustShipTurnScale(a === "right" ? 1 : -1); AudioSys.ui(false); } // §10b rotation slider
  }
  else if (a === "confirm") {
    if (m.row < ACTIONS.length) startRebind(ACTIONS[m.row], m.col === 0 ? "key" : "pad");
    // turnRow has no confirm action — it's a ◄/► slider (Paul: rotation returns to default manually).
    // CS016 P3: was an immediate `returnToDefaults(); AudioSys.ui(true);`. Now gated behind a
    // confirmation — this row silently discards every rebind the player has made, and it sits one
    // step from the Back row. returnToDefaults() itself is untouched; openModal plays the blip.
    else if (m.row === defaultsRow) openModal("Reset all controls to defaults?", "RESET", returnToDefaults);
    else if (m.row === backRow) gotoScreen("options", MENU_OPTIONS.indexOf("Controls")); // back to Options, cursor on "Controls"
  }
  else if (a === "back") gotoScreen("options", MENU_OPTIONS.indexOf("Controls"));
  else if (a === "pause") closePause();
}

// --- Live rebinding capture ---
// startRebind arms capture for (action, device); the next key (keydown) or button (handleGamepadMenu)
// is written into the binding. The captured input is consumed by those handlers BEFORE keys{} or
// nav, so it can never leak into ship control.
function startRebind(action, device) {
  game.menu.rebinding = { action, device };
  AudioSys.ui(true);
}
function captureKeyRebind(k) {
  if (k === "escape") { game.menu.rebinding = null; AudioSys.ui(false); return; } // cancel
  const action = game.menu.rebinding.action;
  bindings[action].keys = [k];   // replace with the single chosen key
  game.menu.rebinding = null;
  saveSettings();
  AudioSys.ui(true);
}
function capturePadRebind(btn) {
  const action = game.menu.rebinding.action;
  bindings[action].buttons = [btn]; // chosen button replaces the button set...
  bindings[action].axis = null;     // ...and drops the analog axis so the shown binding matches reality
  game.menu.rebinding = null;
  saveSettings();
  AudioSys.ui(true);
}
// CS031 P2: the binding reset itself, FACTORED OUT of returnToDefaults() below so a profile switch can
// reuse it without the saveSettings() that follows it there. ⛔ Profiles.activate() must reset the
// runtime while writing NOTHING — mid-switch a save lands on whichever key activeId names at that
// instant, corrupting either the profile being left or the one being entered (spec §4.3). Deep copy:
// `.slice()` and a fresh axis object, so mutating a binding can never reach back into the snapshot.
function restoreDefaultBindings() {
  for (const name of REBINDABLE) {
    const d = DEFAULT_BINDINGS[name];
    bindings[name].keys = d.keys.slice();
    bindings[name].buttons = d.buttons.slice();
    bindings[name].axis = d.axis ? { index: d.axis.index, dir: d.axis.dir } : null;
  }
}
// Controls-screen "Return to Defaults": resets rebindable key/pad bindings ONLY.
// FLAG-10a (CS010 §10b): this deliberately does NOT reset settings.shipTurnScale — Paul asked that the
// rotation-speed slider return to 100% MANUALLY, not via this button. Do NOT "fix" it to also reset
// shipTurnScale; that would reverse an explicit design call. (Counter-intuitive because the slider row
// lives on this same screen, hence this comment.)
function returnToDefaults() {
  restoreDefaultBindings();
  saveSettings();
}

// CS010 §10b: nudge the rotation-speed preference by one 10% step (dir = +1 for ►, -1 for ◄), clamp to
// [MIN, MAX], snap to the 0.10 grid to kill float accumulation, then persist. Held ◄/► only nudges once
// — the menu-open keydown branch early-returns on e.repeat (v3.5 P1 guard) and the gamepad path is
// edge-detected, so this can never spin.
function adjustShipTurnScale(dir) {
  const stepped = Math.round((settings.shipTurnScale + dir * SHIP_TURN_SCALE_STEP) * 10) / 10;
  settings.shipTurnScale = Math.max(SHIP_TURN_SCALE_MIN, Math.min(SHIP_TURN_SCALE_MAX, stepped));
  saveSettings();
}

// ---------- Player Profiles (CS031 P1) ----------
// A roster of named players layered OVER the existing stores rather than beside them. The active
// profile picks the key every per-profile store reads and writes, through the one keyFor() below.
//
// ⛔ THE LEGACY PROFILE'S STORES *ARE* THE FROZEN KEYS. "p0" gets `afd_settings_v1` verbatim; every
//    other profile gets `afd_settings_v1:pN`. Nothing is copied, moved or rewritten when a returning
//    player is migrated — their data simply stays exactly where it has always been, which is what
//    keeps the frozen-key invariant true rather than merely honoured.
// ⛔ THE ROSTER IS AN EXPLICIT KEY. localStorage is NEVER enumerated — no key(i), no .length, no
//    Object.keys. The origin is shared with anything else served from the same path, and the
//    headless harness's stub has no enumeration at all.
// ⛔ init() RUNS AT BOOT, ABOVE loadSettings(), AND MUST NOT TOUCH `Achievements` — that module is
//    defined ~2500 lines below and reading it from here is a TDZ throw. It needs only storageOK(),
//    which is a hoisted function declaration and so is callable from above its own definition.
// Roster ops (add / remove / rename) are roster-only: no settings write, no achievement touch, no
// switch. The runtime switch — flush, reset to shipped defaults, reload — is activate(), CS031 P2.
const PROFILES_KEY     = "afd_profiles_v1";   // NEW key, owned by CS031 — not one of the three frozen ones
const PROFILE_LEGACY   = "p0";                // the id whose stores ARE the frozen keys
const PROFILE_MAX      = 8;                   // roster cap
const PROFILE_NAME_MAX = 12;                  // characters, measured after trimming
// The pre-profile stores init() probes to tell a returning player from an empty install. LITERALS on
// purpose: Achievements.STORAGE_KEY is unreachable from here (TDZ, above), and both strings are
// frozen by rule, so a literal cannot drift out of step with the symbol it duplicates.
const PROFILE_LEGACY_PROBE = ["afd_settings_v1", "afd_achievements_v2"];

// CS031 P2 — PRISTINE SNAPSHOTS of the two shipped-default tables activate() restores. Same idiom, and
// the same reason, as DEFAULT_BINDINGS (L2828): capture the literal's own values ONCE, before anything
// has applied a player's save over them, so the reset has a source of truth to read rather than a
// retyped constant that drifts. ⛔ THEIR PLACEMENT IS THE INVARIANT: below every literal they copy
// (AudioSys L1176, settings L3275) and ABOVE loadSettings()'s boot call below — the first thing in the
// build that writes either. Nothing between those points mutates them. test-cs031-p2.js §B pins that
// non-vacuously, by seeding a store and checking these still hold the shipped values.
// Every field in both is a primitive, so the spread IS a deep copy.
const SETTINGS_DEFAULTS  = { ...settings };
const AUDIO_VOL_DEFAULTS = { ...AudioSys.vol };

const Profiles = {
  activeId: PROFILE_LEGACY,   // ⛔ defaults to the legacy id, so a build that never loads a roster keys
                              // every store exactly where every pre-profile build did
  roster: [],                 // [{ id, name, created }] — an OBJECT per entry, so CS032 can add fields
  lastUsed: "",               // the id to re-activate at the next boot ("" = none recorded)
  seq: 0,                     // next numeric suffix to mint. Monotonic on purpose: a removed profile's
                              // id is never handed out again, because its stores are not cleared with it
  firstBoot: false,           // set ONLY on a genuinely empty install — the title screen routes off it

  // The one key router. Every per-profile store asks through this and nothing else.
  keyFor(base) { return this.activeId === PROFILE_LEGACY ? base : base + ":" + this.activeId; },

  byId(id) { return this.roster.find(p => p.id === id) || null; },
  nameOf(id) { const p = this.byId(id); return p ? p.name : ""; },

  // Trim + cap. Returns "" for anything unusable, which is what every caller tests.
  cleanName(name) { return typeof name === "string" ? name.trim().slice(0, PROFILE_NAME_MAX) : ""; },
  // Trimmed and case-insensitive (spec §4.5). `exceptId` lets rename() ignore the profile it is renaming.
  nameTaken(name, exceptId) {
    const n = this.cleanName(name).toLowerCase();
    if (!n) return false;
    return this.roster.some(p => p.id !== exceptId && p.name.toLowerCase() === n);
  },

  // --- Roster ops. They persist the roster and NOTHING else. ---
  // Returns the new entry, or null if the name is empty/duplicate or the roster is full.
  add(name) {
    const n = this.cleanName(name);
    if (!n || this.roster.length >= PROFILE_MAX || this.nameTaken(n)) return null;
    const p = { id: "p" + this.seq, name: n, created: Date.now() };
    this.seq++;
    this.roster.push(p);
    this.save();
    return p;
  },
  // ⛔ Refuses the LAST profile: an empty roster after first boot is the state that produces a dead
  // title screen. Removing the ACTIVE profile is allowed and leaves activeId naming a gone id — the
  // caller must activate() another in the same act (spec §4.5).
  remove(id) {
    if (this.roster.length <= 1) return false;
    const i = this.roster.findIndex(p => p.id === id);
    if (i < 0) return false;
    this.roster.splice(i, 1);
    if (this.lastUsed === id) this.lastUsed = "";
    this.save();
    return true;
  },
  rename(id, name) {
    const p = this.byId(id);
    const n = this.cleanName(name);
    if (!p || !n || this.nameTaken(n, id)) return false;
    p.name = n;
    this.save();
    return true;
  },

  // --- Persistence (own key; the same guarded idiom as saveSettings — never crash on storage failure). ---
  save() {
    const ls = storageOK(); if (!ls) return;
    try {
      ls.setItem(PROFILES_KEY, JSON.stringify({ v: 1, lastUsed: this.lastUsed, seq: this.seq,
        profiles: this.roster.map(p => ({ id: p.id, name: p.name, created: p.created })) }));
    } catch (e) { /* quota / privacy mode / disabled — ignore */ }
  },
  // known-value-else-default on every field. Returns TRUE only when a usable, non-empty roster came
  // back; absent, unreadable, corrupt and empty all answer false and leave the roster empty, which is
  // the single signal init() branches on.
  load() {
    this.roster = []; this.lastUsed = ""; this.seq = 0;
    const ls = storageOK(); if (!ls) return false;
    try {
      const raw = ls.getItem(PROFILES_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.profiles)) return false;
      const list = [], seen = new Set();
      for (const p of data.profiles) {
        if (list.length >= PROFILE_MAX) break;
        if (!p || typeof p.id !== "string" || !p.id || seen.has(p.id)) continue;
        const name = this.cleanName(p.name);
        if (!name) continue;
        seen.add(p.id);
        list.push({ id: p.id, name, created: typeof p.created === "number" ? p.created : 0 });
      }
      // seq never drops BELOW what the roster already uses, however the stored value was edited.
      let seq = 0;
      for (const p of list) { const m = /^p(\d+)$/.exec(p.id); if (m) seq = Math.max(seq, Number(m[1]) + 1); }
      if (Number.isFinite(data.seq) && data.seq > seq) seq = Math.floor(data.seq);
      this.roster = list;
      this.lastUsed = typeof data.lastUsed === "string" ? data.lastUsed : "";
      this.seq = seq;
      return list.length > 0;
    } catch (e) {
      this.roster = []; this.lastUsed = ""; this.seq = 0;   // corrupt / unreadable — no roster, don't crash
      return false;
    }
  },
  // Boot, called ONCE immediately above loadSettings() — the first thing that asks keyFor().
  init() {
    this.firstBoot = false;
    if (this.load()) {
      this.activeId = this.byId(this.lastUsed) ? this.lastUsed : this.roster[0].id;
      this.lastUsed = this.activeId;
      return;
    }
    // No usable roster. A machine already holding pre-profile save data gets ONE profile minted over
    // it — ⛔ the blobs themselves are NOT copied, moved or rewritten; p0's stores ARE those keys.
    const ls = storageOK();
    let legacy = false;
    if (ls) {
      try { for (const k of PROFILE_LEGACY_PROBE) if (ls.getItem(k) !== null) legacy = true; }
      catch (e) { legacy = false; }
    }
    this.activeId = PROFILE_LEGACY;
    if (legacy) {
      this.roster = [{ id: PROFILE_LEGACY, name: "PLAYER 1", created: Date.now() }];
      this.seq = 1;
      this.lastUsed = PROFILE_LEGACY;
      this.save();
      return;
    }
    // A genuinely empty install: mint NOTHING and ask nobody here. The title screen routes off this
    // flag (CS031 P5); until then activeId is the legacy id, so this build stores exactly where the
    // pre-profile build did and an untouched machine cannot tell the difference.
    this.firstBoot = true;
  },

  // --- The runtime switch (CS031 P2, spec §4.3). Returns false for an id the roster does not hold. ---
  // Title-only by design (FORK-I); the SCREEN that calls this enforces that, not this function.
  //
  // ⛔ RESET, THEN LOAD — never load alone. Both loaders are written for a COLD boot and are CORRECT AS
  // THEY STAND; the fix belongs on this side of the call, not in them:
  //   * loadSettings() applies a saved blob OVER the live state with NO else-branch on seven of its
  //     eight fields (spec §2.2) — that is exactly what makes the standing known-value-else-default rule
  //     work, so an unknown or absent key leaves the runtime default in place and a removed field needs
  //     no migration shim. ⛔ Do not add else-branches to it.
  //   * Achievements.init() clears three collections but never `lifetime`, and loadCounters() copies
  //     only the keys a blob HAS (spec §2.3) — shared by the v2 load and the v1 migration by design.
  //     ⛔ Do not restructure it.
  // Without step 3, a switch therefore hands the incoming profile the OUTGOING one's volumes, bindings,
  // music track, voice, captions, auto-shield and debug knobs, plus its entire lifetime progress — and
  // deriveLifetime() then silently re-derives that player's tier badges onto a stranger.
  //
  // ⛔ game.stats IS A THIRD BLEED VECTOR, closed here (CS031 P5, FLAG-CS031-d). It is reset only in
  // startGame(), so at the title after a game it still holds that game's values; two non-tiered lifetime
  // achievements (untouchable, max_haul) read it directly rather than a lifetime counter, so an ungated
  // switch hands the incoming profile THOSE two badges via deriveLifetime() below, earned by a game it
  // never played. Same fix shape as step 3's other resets: a fresh resetGameStats(), no write.
  // ⛔ game.wave RIDES ALONG for the same reason: untouchable's own predicate is `game.wave >= 10 &&
  // !s.everBelowHalf`, and game.wave is a SEPARATE field also reset only in startGame() — a
  // resetGameStats() alone still leaves a post-wave-10 game's wave number sitting on game.wave at the
  // title, which alone satisfies half of that predicate regardless of the stats reset. Safe to zero
  // here: activate() is title-only by construction (FORK-CS031-I), so no live gameplay ever reads it.
  //
  // ⛔ NOTHING IN STEP 3 MAY WRITE. returnToDefaults() ends with saveSettings(), and the Reset-All-Debug
  // menu row calls saveSettings() right after resetAllDebug(). Calling either of those consumers here
  // writes a defaults blob into a store — and WHICH store depends on whether step 2 has already run, so
  // it corrupts either the profile being left or the one being entered. The bindings half is therefore
  // called through restoreDefaultBindings(), the save-free function returnToDefaults() was factored
  // into; resetAllDebug() was already save-free and its menu caller keeps its own save.
  activate(id) {
    if (!this.byId(id)) return false;

    // 1. Flush the OUTGOING profile at the key it still owns — activeId does not move until step 2.
    //    (Achievements.save() is a no-op during a debug run, by its own standing gate. Correct: a debug
    //    run must not persist progress, and abandoning one by switching profiles is no exception.)
    saveSettings();
    Achievements.save();

    // 2. The switch itself, plus the roster write that makes it the next boot's profile.
    this.activeId = id;
    this.lastUsed = id;
    this.save();

    // 3. Reset the runtime to its SHIPPED defaults — every one derived from its single source of truth.
    Object.assign(settings, SETTINGS_DEFAULTS);
    Object.assign(AudioSys.vol, AUDIO_VOL_DEFAULTS);
    restoreDefaultBindings();
    resetAllDebug();
    game.stats = resetGameStats();   // CS031 P5 (FLAG-CS031-d): the outgoing game's per-game flags must
                                      // not survive to be re-read by the incoming profile's deriveLifetime()
    game.wave = 0;                   // ...and neither does the wave number untouchable's predicate reads
    // Every lifetime counter ships at 0, SUM and MAX alike, so the literal's own KEY SET is the source
    // of truth here and no default is retyped.
    for (const k in Achievements.lifetime) Achievements.lifetime[k] = 0;

    // 4-5. Now load the incoming profile OVER those defaults — precisely what both contracts assume.
    loadSettings();
    Achievements.init();

    // 6. Push the result to the two LIVE runtime shadows that neither loader moves, or the incoming
    //    player hears the outgoing player's mix in the outgoing player's voice. The four gain nodes hold
    //    their own value (only setVol writes them) and VOICE_PARAMS is a live binding only setStyle()
    //    re-points. loadSettings() does call setStyle — but ONLY after `if (!raw) return`, so it never
    //    runs for a profile with no saved blob, which is EVERY newly created one. At boot neither shadow
    //    exists yet (no audio graph until the first keypress), which is why the cold path has never
    //    needed this; both calls are inert without an AudioContext, so this stays headless-safe.
    for (const c of Object.keys(AudioSys.vol)) AudioSys.setVol(c, AudioSys.vol[c]);
    VoiceSys.setStyle(settings.voiceStyle);
    return true;
  }
};

// ---------- Save Slots (CS032 P1) ----------
// Three per-profile save slots, routed through Profiles.keyFor() exactly like Achievements'
// per-profile store — its own NEW key, additive, not a bump of any of the four existing ones.
// This module owns STORAGE ONLY: read/write/clear/count. The capture half (buildSaveEntry(), below
// game's declaration) and the restore half (resumeFromSave(), P2) are deliberately separate — this
// object never reads `game` and never reads Achievements/HighScores.
//
// ⛔ LAZY: nothing calls read() at boot. SaveSlots does not participate in Profiles.init()'s boot
// ordering — the slots screen (P3) is the first reader, and Save (P3/P4) is the first writer.
// ⛔ known-value-else-default on the ENVELOPE: absent, unreadable JSON, wrong `v`, a non-array
// `slots`, or a `slots` of the wrong length all resolve to three empty slots rather than throwing or
// partially trusting a bad blob. An individual SLOT's `kind` is NOT interpreted here — FORK-H's "an
// unrecognised kind renders as unreadable" is the slots screen's (P3) job, not the store's; this
// module hands back whatever object sits in a valid envelope's slot array, opaque.
// ⛔ write() returns a BOOLEAN. Every other store in the build swallows a storage failure silently
// (a background write nobody is watching); Save is a player-initiated act with an expectation of
// success (spec §4.4), so this is the one guarded site that reports failure to its caller instead.
const SAVES_KEY = "afd_saves_v1";   // NEW key, owned by CS032 — not one of the four existing ones
const SaveSlots = {
  emptySlots() { return [null, null, null]; },

  read() {
    const ls = storageOK(); if (!ls) return this.emptySlots();
    try {
      const raw = ls.getItem(Profiles.keyFor(SAVES_KEY));
      if (!raw) return this.emptySlots();
      const data = JSON.parse(raw);
      if (!data || data.v !== 1 || !Array.isArray(data.slots) || data.slots.length !== 3) return this.emptySlots();
      return data.slots.slice();
    } catch (e) { return this.emptySlots(); }   // corrupt / unreadable — three empties, don't crash
  },
  // Overwrites slot `i` and rewrites the whole envelope (three slots is small enough that a
  // read-modify-write is simpler than a partial patch, and matches Profiles.save()'s own shape).
  write(i, entry) {
    const ls = storageOK(); if (!ls) return false;
    try {
      const slots = this.read();
      slots[i] = entry;
      ls.setItem(Profiles.keyFor(SAVES_KEY), JSON.stringify({ v: 1, slots }));
      return true;
    } catch (e) { return false; }   // quota / privacy mode / disabled — reportable, not silent
  },
  clear(i) { return this.write(i, null); },
  count() { return this.read().filter(s => s !== null).length; },
};

// ---------- The "nameentry" screen (CS031 P3, spec §4.4 / FORK-CS031-D → b) ----------
// The build's first text field. It RENDERS AND VALIDATES ONLY — it creates nothing, renames nothing
// and touches the roster only to ask nameTaken(). The verbs are P4's, and they live in the onCommit
// closure the caller supplies; this screen's whole output is one validated, trimmed string.
//
// Two input paths reach the same three functions, which is what keeps pad and keyboard identical:
//   * ABSTRACT actions (menuNameEntry, from menuInput) — grid nav, and confirm/back on a cell.
//   * RAW characters (nameEntryKey, from the keydown hook at L2938) — typing.
// ⛔ ENTER and ESC are NOT raw-captured, so gamepad A/B commit and cancel through the very same
//    branches a keyboard player uses.
//
// State lives on game.menu: `row`/`col` are the grid cursor (the Controls-screen precedent), plus
// nameBuf / nameCtx / nameErr — all three declared in BOTH the game literal and resetRun(),
// per the standing CS016 P3 rule.
function nameRowLen(r) { return Math.min(NAME_GRID_COLS, NAME_CELLS.length - r * NAME_GRID_COLS); }
function nameCell() { return NAME_CELLS[game.menu.row * NAME_GRID_COLS + game.menu.col]; }
// A cell's drawn label. The space character would otherwise be an invisible cell, so it gets a word
// like the three verbs do; every other character cell IS its character.
function nameCellLabel(cell) { return cell === " " ? "SPACE" : cell; }

// The validator. Returns "" when clean, else the message that goes on screen. ⛔ THE ONE PLACE THE
// RULES LIVE — the live path and the commit path both call this, so they can never disagree.
// Collision is Profiles.nameTaken()'s job (trimmed + case-insensitive, already shipped in P1); in
// rename mode the profile being renamed is excluded from the comparison, which is what lets "Paul"
// become "PAUL".
function nameEntryError(buf, ctx) {
  const n = (typeof buf === "string" ? buf : "").trim();
  if (!n) return NAME_ERR_EMPTY;
  if (n.length > PROFILE_NAME_MAX) return NAME_ERR_LONG;
  if (Profiles.nameTaken(n, ctx && ctx.mode === "rename" ? ctx.id : undefined)) return NAME_ERR_TAKEN;
  return "";
}
// Live re-validation after every buffer edit. An EMPTY buffer shows nothing rather than "Enter a name":
// a field nobody has typed into yet is not a mistake, and the message is still raised the moment DONE is
// pressed on it. Every other state (whitespace-only included) reports immediately.
function nameEntryRevalidate() {
  const m = game.menu;
  m.nameErr = m.nameBuf.length === 0 ? "" : nameEntryError(m.nameBuf, m.nameCtx);
}
// One character in or out, whichever path asked. The cap DROPS the keystroke rather than truncating,
// and an empty-buffer Backspace is inert — both are debugEntryKey()'s conventions, blip included.
function nameEntryKey(key) {
  const m = game.menu;
  if (key === "Backspace") {
    if (!m.nameBuf.length) return;
    m.nameBuf = m.nameBuf.slice(0, -1);
  } else {
    if (m.nameBuf.length >= PROFILE_NAME_MAX) return;
    m.nameBuf += key;
  }
  nameEntryRevalidate();
  AudioSys.ui(false);
}

// P4 supplies ctx: `mode` ("add" / "rename") and, for a rename, the `id`; `back`/`backIndex` name the
// screen that raised this one (gotoScreen's own two arguments); `onCommit(name)` receives the validated
// string. onCommit is openModal's onConfirm closure precedent — a caller wires the screen in one call
// with no per-screen state, and the roster op stays entirely on the caller's side.
// ⛔ THIS IS THE ONLY WAY IN, and it re-initialises all three fields — which is why no other menu
// teardown has to clear them. They are inert unless game.menu.screen === "nameentry", and both the
// literal and resetRun() seed them, so they are never `undefined` for a handler to trip on.
function openNameEntry(ctx, initial) {
  const m = game.menu;
  m.nameCtx = ctx || { mode: "add" };
  m.nameBuf = typeof initial === "string" ? initial.slice(0, PROFILE_NAME_MAX) : "";
  m.nameErr = "";
  gotoScreen("nameentry");   // resets row/col/scroll/modal and plays the open blip
}
// Leave without committing — CANCEL, `back` on an empty buffer, or a successful commit's own exit.
// Defaults to the title menu, which is where the screen's only caller can be reached from (FORK-I).
function closeNameEntry() {
  const c = game.menu.nameCtx || {};
  const back = c.back || "titlemenu", backIndex = c.backIndex || 0;
  game.menu.nameBuf = ""; game.menu.nameCtx = null; game.menu.nameErr = "";
  gotoScreen(back, backIndex);
}
function nameEntryCommit() {
  const m = game.menu;
  // ⛔ RE-VALIDATED HERE, never trusted from nameErr: nameCtx is supplied from outside and nameBuf can
  // be prefilled (a rename opens on the current name), so the live path may never have run at all.
  const err = nameEntryError(m.nameBuf, m.nameCtx);
  if (err) { m.nameErr = err; AudioSys.ui(false); return; }
  const run = m.nameCtx && m.nameCtx.onCommit;
  const name = m.nameBuf.trim();
  // CLEAR BEFORE INVOKING — menuModal's rule, and for its reason: onCommit is free to navigate, and a
  // teardown running after it would clobber the screen the callback just set.
  closeNameEntry();
  if (run) run(name);
}
function menuNameEntry(a) {
  const m = game.menu;
  if (a === "up" || a === "down") {
    m.row = (m.row + NAME_GRID_ROWS + (a === "down" ? 1 : -1)) % NAME_GRID_ROWS;
    m.col = Math.min(m.col, nameRowLen(m.row) - 1);   // a partial last row must not strand the cursor
    AudioSys.ui(false);
  }
  else if (a === "left" || a === "right") {
    const len = nameRowLen(m.row);
    m.col = (m.col + len + (a === "right" ? 1 : -1)) % len;
    AudioSys.ui(false);
  }
  else if (a === "confirm") {
    const cell = nameCell();
    if (cell === NAME_CELL_DONE) nameEntryCommit();
    else if (cell === NAME_CELL_CANCEL) closeNameEntry();
    else if (cell === NAME_CELL_DEL) nameEntryKey("Backspace");
    else nameEntryKey(cell);
  }
  // ⛔ `back` IS BACKSPACE WHILE ANYTHING IS TYPED, and only aborts on an empty buffer. The pad's B must
  // not force a trip across the grid to CANCEL for every typo; the DEL cell stays for players who want it.
  else if (a === "back") {
    if (m.nameBuf.length) nameEntryKey("Backspace");
    else closeNameEntry();
  }
  else if (a === "pause") closePause();   // Start/ESC out of the whole menu — closePause lands on the title menu
}

// ---------- The "profiles" screen (CS031 P4, spec §4.4/§4.5) ----------
// The roster list: switch / add / rename / delete. Confirm on a profile with the default verb
// (SWITCH) reproduces the plain spec text verbatim — "confirm on a profile calls Profiles.activate(id)
// and returns to the title menu" — with Rename/Delete reached by cycling game.menu.col first.
function profilesRowCount() { return Profiles.roster.length + 1; }   // +1 = the trailing Add Profile row
function onAddProfileRow(m) { return m.index >= Profiles.roster.length; }

function menuProfiles(a) {
  const m = game.menu, N = profilesRowCount();
  if (a === "up")   { m.index = (m.index + N - 1) % N; m.col = 0; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % N; m.col = 0; AudioSys.ui(false); }
  else if (a === "left" || a === "right") {
    if (!onAddProfileRow(m)) {
      m.col = (m.col + PROFILE_VERBS.length + (a === "right" ? 1 : -1)) % PROFILE_VERBS.length;
      AudioSys.ui(false);
    }
  }
  else if (a === "confirm") {
    if (onAddProfileRow(m)) {
      // ⛔ The CANONICAL example of the shared unavailable-row idiom (repointed here by CS032 P4,
      // which made the paused root's old example — a save row with nothing behind it — live and so
      // retired it): the row stays PRESENT and focusable, renders COLOR.dim (drawProfiles), and
      // confirm returns without firing anything. The silence is the point — no state change and no
      // AudioSys.ui blip reads as "this row does nothing" rather than "nothing happened". Label,
      // dispatch and render are three pieces and they move together, all or none.
      if (Profiles.roster.length >= PROFILE_MAX) return;
      openNameEntry({ mode: "add", back: "profiles", onCommit: name => Profiles.add(name) });
      return;
    }
    const p = Profiles.roster[m.index], verb = PROFILE_VERBS[m.col];
    if (verb === "SWITCH") { Profiles.activate(p.id); returnToTitleMenu(); }
    else if (verb === "RENAME") {
      openNameEntry({ mode: "rename", id: p.id, back: "profiles", onCommit: name => Profiles.rename(p.id, name) }, p.name);
    } else if (verb === "DELETE") {
      if (Profiles.roster.length <= 1) return;   // ⛔ refuse the LAST remaining profile (spec §4.5)
      openModal('Delete "' + p.name + '"? All of its progress will be lost.', "DELETE", () => {
        profileDelete(p.id);
        m.index = Math.min(m.index, Profiles.roster.length);   // the roster shrank; keep the cursor valid
        m.col = 0;
      });
    }
  }
  // ⛔ FORK-E: a genuinely empty roster (first boot, clean install) has ONLY the Add Profile row, and
  // back/pause must NOT escape it — that would leave the title with no active profile at all.
  else if (a === "back" || a === "pause") {
    if (!Profiles.roster.length) return;
    closePause();
  }
}

// Overwrites the LEGACY profile's frozen stores (afd_settings_v1 / afd_achievements_v2) with the
// shipped-default blob, through the normal guarded save paths — never a raw removeItem, same reasoning
// as resetHighScores()'s own key. Works whether or not p0 is currently active: Profiles.activate
// (PROFILE_LEGACY) always lands the runtime on p0's OWN real data first (a correct, harmless flush of
// whoever was active before), so the reset that follows overwrites p0's data specifically and nothing
// else's. `keepActiveId` is who should be left active once this returns.
function blankLegacyStores(keepActiveId) {
  Profiles.activate(PROFILE_LEGACY);
  Object.assign(settings, SETTINGS_DEFAULTS);
  Object.assign(AudioSys.vol, AUDIO_VOL_DEFAULTS);
  restoreDefaultBindings();
  resetAllDebug();
  for (const k in Achievements.lifetime) Achievements.lifetime[k] = 0;
  Achievements.lifetimeUnlocked = new Set();
  Achievements.weeklyUnlocked = new Set();
  Achievements.lifetimeTiers = {};
  saveSettings();
  Achievements.save();
  for (let i = 0; i < SLOT_COUNT; i++) SaveSlots.clear(i);   // still activated as p0 — through keyFor(), never removeItem
  Profiles.activate(keepActiveId);
}
// Non-legacy profiles' keys are NOT frozen — remove them, or an abandoned profile's stores accumulate
// in localStorage forever. `id` is never PROFILE_LEGACY here (callers branch on that first).
function removeProfileStores(id) {
  const ls = storageOK(); if (!ls) return;
  try {
    ls.removeItem(STORAGE_KEY + ":" + id);
    ls.removeItem(Achievements.STORAGE_KEY + ":" + id);
    ls.removeItem(SAVES_KEY + ":" + id);
  } catch (e) { /* quota / privacy mode / disabled — ignore, same as every other guarded store op */ }
}
// The roster-shrinking half of Delete (spec §4.5). Order matters: the active profile is switched away
// from BEFORE Profiles.remove() drops it from the roster, or activeId is left dangling at a profile
// the roster no longer names (FLAG-CS031-e). The last-remaining guard is re-checked here too, so the
// store-clearing work below never runs for a refusal.
function profileDelete(id) {
  if (Profiles.roster.length <= 1 || !Profiles.byId(id)) return false;
  const keepActive = Profiles.activeId === id
    ? Profiles.roster.find(p => p.id !== id).id
    : Profiles.activeId;
  if (id === PROFILE_LEGACY) blankLegacyStores(keepActive);
  else {
    if (Profiles.activeId === id) Profiles.activate(keepActive);
    removeProfileStores(id);
  }
  return Profiles.remove(id);
}

// ---------- The "slots" screen (CS032 P3, spec FORK-CS032-E) ----------
// One screen serving both Save (write) and Load Saved Game (read); game.menu.slotMode is set by the
// caller before gotoScreen("slots"), exactly the "one screen, caller sets what commit does" precedent
// openNameEntry's ctx already established for "nameentry". CS032 P4 wired the two real callers: the
// paused root's "Save" row (menuRoot) and the title's "Load Saved Game" row (menuTitle).
// Because those are the ONLY two callers the spec allows (§0.2 — Save only from state==="playing";
// §4.3 — Load only from the title), slotMode alone tells Back where to land: no separate return-screen
// field is needed, unlike nameCtx's back/backIndex, which serves screens reachable from more than one
// place.
//
// FORK-H: a slot's `kind` decides readability, not its mere presence. "wave" is the only kind this
// changeset writes or restores; anything else (a future `kind: "snapshot"`, or corrupt/hand-edited
// data) renders as UNREADABLE rather than being guessed at.
function slotRowState(entry) {
  if (entry === null || entry === undefined) return "empty";
  if (typeof entry === "object" && entry.kind === "wave") return "occupied";
  return "unreadable";
}
// The occupied row's copy is a literal readout of buildSaveEntry()'s own save-moment capture (spec
// FORK-A) — nothing here is re-derived or estimated.
function timeAgo(ts) {
  const s = Math.max(0, Math.floor((Date.now() - (typeof ts === "number" ? ts : 0)) / 1000));
  if (s < 60) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.floor(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}
function slotLabel(entry, state) {
  if (state === "empty") return SLOT_EMPTY_LABEL;
  if (state === "unreadable") return SLOT_UNREADABLE_LABEL;
  return "LEVEL " + entry.wave + " · " + fmtCommas(entry.score) + " · " + timeAgo(entry.saved);
}
// Overwrite copy names what is LOST — the existing slot's own level, never the incoming run's (spec
// "Copy names what is lost: the existing slot's level, not the incoming one"). An unreadable slot's
// own fields aren't trustworthy, so its copy stays generic rather than asserting a level it can't
// honestly read.
function slotOverwriteText(i, state, entry) {
  if (state === "occupied") return "Overwrite Slot " + (i + 1) + "? Level " + entry.wave + " progress will be lost.";
  return "Overwrite Slot " + (i + 1) + "? The existing save will be lost.";
}
// ⛔ A failed write must not report success (spec §4.4) — on failure the screen stays put with
// slotMsg set; the caller (menuSlots' confirm branch) never navigates away in that case.
function slotWrite(i) {
  if (SaveSlots.write(i, buildSaveEntry())) gotoScreen("root", rootItems().indexOf("Save"));
  else game.menu.slotMsg = SLOT_SAVE_FAIL_MSG;
}
function menuSlots(a) {
  const m = game.menu, mode = m.slotMode;
  if (a === "up")   { m.index = (m.index + SLOT_COUNT - 1) % SLOT_COUNT; AudioSys.ui(false); }
  else if (a === "down") { m.index = (m.index + 1) % SLOT_COUNT; AudioSys.ui(false); }
  else if (a === "confirm") {
    const entry = SaveSlots.read()[m.index], state = slotRowState(entry);
    if (mode === "load") {
      if (state !== "occupied") return;   // empty/unreadable rows are dim and inert in load mode
      resumeFromSave(entry);              // sets game.state = "playing" and clears the menu itself (resetRun())
    } else if (state === "empty") {
      slotWrite(m.index);                 // nothing to lose — writes straight through, no modal
    } else {
      openModal(slotOverwriteText(m.index, state, entry), "OVERWRITE", () => slotWrite(m.index));
    }
  }
  // Back steps up to whichever screen this mode is only ever reachable from; pause fully closes the
  // menu, matching every sibling screen's own back-vs-pause split (menuOptions/menuSound et al.).
  else if (a === "back") {
    if (mode === "save") gotoScreen("root", rootItems().indexOf("Save"));
    else returnToTitleMenu();
  }
  else if (a === "pause") closePause();
}

// --- Persistence (localStorage, guarded). Note: unavailable in the claude.ai artifact sandbox but
// works as a real local file; a storage failure must never crash the game, so everything is wrapped. ---
// v3.3 P1 rename (Orbital Overhaul): the "afd_" prefix is FROZEN. Renaming this key wipes every
// player's saved settings/bindings on their next load — do not "tidy" it to match the new name.
// CS031 P1: the key is now routed through Profiles.keyFor() at both sites below — VERBATIM for the
// legacy profile, suffixed for every other. The string itself is untouched and stays frozen.
const STORAGE_KEY = "afd_settings_v1";
function storageOK() {
  try { return typeof localStorage !== "undefined" ? localStorage : null; } catch (e) { return null; }
}
function saveSettings() {
  const ls = storageOK(); if (!ls) return;
  try {
    // CS024 P6: shotPowerupMode / magnetMode / chainGuardMode STOPPED BEING WRITTEN HERE with the
    // settings fields behind them. A store written by an earlier build still holds them; this save
    // simply stops re-emitting them, and the next write drops them from the blob. Nothing reads them.
    const data = { vol: { ...AudioSys.vol }, bindings: {},
      musicTrack: settings.musicTrack,                                            // v3.4 P6 (additive)
      shipTurnScale: settings.shipTurnScale,                                      // CS010 §10b (additive)
      voiceStyle: settings.voiceStyle, captions: settings.captions,               // CS011 P3 (additive)
      autoShield: settings.autoShield,                                            // CS012 P5 (additive)
      debug: { ...debugShown } };                                                 // CS015 P4 (additive sub-object, display units)
    for (const name of REBINDABLE) {
      const b = bindings[name];
      data.bindings[name] = { keys: b.keys, buttons: b.buttons || [], axis: b.axis || null };
    }
    ls.setItem(Profiles.keyFor(STORAGE_KEY), JSON.stringify(data));
  } catch (e) { /* quota / privacy mode / disabled — ignore */ }
}
function loadSettings() {
  const ls = storageOK(); if (!ls) return;
  try {
    const raw = ls.getItem(Profiles.keyFor(STORAGE_KEY));
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.vol) {
      // CS010 P9: derive the categories from vol's own keys (now incl. "voice") so a newly-added bus
      // persists automatically — a hardcoded list would silently drop voice volume on every load.
      for (const c of Object.keys(AudioSys.vol))
        if (typeof data.vol[c] === "number") AudioSys.vol[c] = clamp01(data.vol[c]);
    }
    if (data.bindings) {
      for (const name of REBINDABLE) {
        const b = data.bindings[name];
        if (!b) continue;
        if (Array.isArray(b.keys)) bindings[name].keys = b.keys.slice();
        if (Array.isArray(b.buttons)) bindings[name].buttons = b.buttons.slice();
        if ("axis" in b) bindings[name].axis = b.axis ? { index: b.axis.index, dir: b.axis.dir } : null;
      }
    }
    // CS024 P6 (spec §3.7): the three expiry-mode reads (shotPowerupMode / magnetMode / chainGuardMode)
    // STOOD HERE. They are gone with the settings fields, and the keys an older save still carries are
    // now simply UNKNOWN keys on afd_settings_v1 — ignored, exactly as the standing known-value-else-
    // default rule already ignores every unknown key. That rule is why this needs NO schema bump, NO
    // rename of the frozen key, and NO migration shim: a pre-CS024-P6 settings blob loads cleanly and
    // every field this build DOES understand comes back untouched.
    // v3.4 P6: only accept a known track name, so a corrupt/unknown value falls back to the default.
    if (MUSIC_TRACK_VALUES.includes(data.musicTrack)) settings.musicTrack = data.musicTrack;
    // CS010 §10b: rotation-speed preference is additive — tolerate a missing key (older saves) and
    // accept only a finite in-range number; anything else (string / NaN-as-null / 99 / 0) snaps to the
    // 1.0 default rather than sticking. Snap to the 0.10 grid so a hand-edited save can't desync the slider.
    if (typeof data.shipTurnScale === "number" && isFinite(data.shipTurnScale) &&
        data.shipTurnScale >= SHIP_TURN_SCALE_MIN && data.shipTurnScale <= SHIP_TURN_SCALE_MAX) {
      settings.shipTurnScale = Math.round(data.shipTurnScale * 10) / 10;
    } else {
      settings.shipTurnScale = SHIP_TURN_SCALE_DEFAULT;
    }
    // CS011 P3: voice style + captions are additive fields — tolerate a missing/corrupt value by
    // leaving the runtime default in place rather than snapping to a wrong fallback. Captions in
    // particular must stay true (the default) unless a real boolean was saved — no else-branch.
    if (VOICE_STYLE_VALUES.includes(data.voiceStyle)) settings.voiceStyle = data.voiceStyle;
    VoiceSys.setStyle(settings.voiceStyle);
    if (typeof data.captions === "boolean") settings.captions = data.captions;
    // CS012 P5: auto-shield is an additive boolean — missing/non-boolean leaves the runtime default (false) in place.
    if (typeof data.autoShield === "boolean") settings.autoShield = data.autoShield;
    // CS015 P4: debug variables persist as an additive sub-object (display units; no new frozen key). Each
    // registry entry is validated independently — a finite in-[min,max] stored value applies via applyDebug,
    // anything else (missing / NaN / out of range / hand-edited garbage) leaves the seeded default in place.
    // CS018 P2: iterate DEBUG_ENTRIES, not DEBUG_VARS — the registry now also holds non-selectable section
    // header entries, which have no id/min/max and nothing to restore.
    if (data.debug) {
      for (const e of DEBUG_ENTRIES) {
        const dv = data.debug[e.id];
        if (Number.isFinite(dv) && dv >= e.min && dv <= e.max) applyDebug(e.id, dv);
      }
    }
  } catch (e) { /* corrupt / unreadable — fall back to defaults, don't crash */ }
}
Profiles.init(); // CS031 P1: resolve the active profile FIRST — loadSettings() asks keyFor() for its key
loadSettings(); // apply saved settings (if any) over the shipped defaults, once at startup

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randSign = () => Math.random() < 0.5 ? -1 : 1;

// THE MUSIC-INTENSITY CURVE (F10; RETAINED by CS018 P4 per FLAG-l, RENAMED by CS024 P4 per spec §1.6).
// Returns 0 at wave 1 and climbs asymptotically toward 1 over many waves. Its ONLY caller is
// MusicSys.setIntensity() in nextWave(), and has been since CS018 P4 — the rename is the code finally
// saying so. THE CURVE IS BYTE-IDENTICAL to difficultyFactor()'s: same expression, same constant (8),
// same value at every level; only the two names changed (difficultyFactor -> musicIntensity,
// RAMP_WAVES -> MUSIC_INTENSITY_WAVES). Difficulty comes from leverState() and nothing else; do NOT
// re-derive music intensity from the odometer, and do NOT hang a difficulty lever off this curve.
function musicIntensity(wave) {
  return 1 - Math.exp(-(wave - 1) / MUSIC_INTENSITY_WAVES);
}
// CS024 P4 (spec §1.6): ramp(floor, ceil, wave) — the floor->ceiling interpolator that composed the
// curve above — STOOD HERE and is DELETED. CS018 P6/P7 moved the saucer gap, fire rate and aim off it
// onto level-table tiers, leaving the small-saucer chance as its only lever; this phase retires that
// too (a flat 20% roll, §2.4), so ramp() had no callers left at all. Note the identically-named local
// arrow inside AudioSys.setLowHp() — `const ramp = (param, target) => ...`, an AudioParam ramp helper
// — which is a different function in a different scope and is untouched.
// RETIRED (CS018 P7): the time-in-level pressure axis (CS017 P4, FORK-CS017-B -> (b) COMPOSE) is gone —
// its two consumers (the saucer gap in P6, the saucer aim above) both moved onto the level table's
// tiers, which read game.wave rather than time-in-level (and, from CS024 P4, onto the odometer). game.waveTime itself is KEPT (FLAG-k) —
// nextWave() still captures it into prevLevelSecs for the difficulty log — but wavePressure() had no
// other reader and is deleted outright rather than left retired-in-place, per the phase prompt.

// ---------- CS018 P4: the LARGE-HUNTER CAP (PLANNED-FEATURES-CS018 §4.1) ----------
// The cap counts SPAWN SLOTS, not objects. Only size 3 is counted and only size 3 is capped: a split
// (large -> 3 mediums) therefore FREES a slot rather than consuming three, middle/small hunters are
// never counted and never capped, and destroying a large frees its slot immediately (dead-but-not-yet
// -filtered hunters are excluded, so the slot is free within the same frame).
// CS024 P6f: largeHunterCap() is BACK below this function, in a deliberately different shape from the
// per-level lookup CS024 P3 deleted (see the deleted LARGE_HUNTER_MAX's comment in the constants block
// for why the flat ceiling had to go). This counter itself is unchanged, and is still the only thing
// that decides what "a slot" means.
function largeHunterCount() {
  let n = 0;
  for (const h of game.hunters) if (h.size === 3 && !h.dead) n++;
  return n;
}
// CS024 P6f (spec §2.5): THE SCALING LARGE-HUNTER CEILING. Two knobs and one ceil — NOT a lever, NOT a
// breakpoint table, and NOT to be grown into either (the constants-block comment where LARGE_HUNTER_MAX
// used to stand carries the full reasoning). At the shipped defaults (hunterCapLevelsPerStep 2,
// hunterCapMax 6):
//     levels 1–2 -> 1 · 3–4 -> 2 · 5–6 -> 3 · 7–8 -> 4 · 9–10 -> 5 · 11+ -> 6, plateau.
// Read live at both of its call sites (the coalescence conversion and drainHeldClumps), never cached, so
// a panel retune applies from the very next frame. `wave` is a parameter rather than a read of game.wave
