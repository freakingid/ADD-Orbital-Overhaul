// for the same reason leverState takes one: it makes the curve testable at every level without staging a
// run. game.wave is 0 for the instant between startGame() and its nextWave(), which yields a cap of 0 —
// correct by construction (no field, no garbage, nothing to convert), not a special case worth writing.
function largeHunterCap(wave) {
  return Math.min(Math.ceil(wave / DEBUG.hunterCapLevelsPerStep), DEBUG.hunterCapMax);
}
// CS018 P4 (FLAG-i): Hunter's Bane counts kills within ONE lineage, and the shipped reset — "every
// ambient spawnCore()" — breaks the moment lineages can coexist (the cap allows more than one): a
// second lineage arriving mid-fight would zero a counter the player was part-way through filling.
// Reset on the 0 -> 1 transition instead: when the board goes from NO large Hunters to one, whichever
// producer caused it. Call this IMMEDIATELY BEFORE pushing a new large, so the count read here is the
// pre-spawn count. Accepted consequence (recorded in the GDD): the achievement loosens — a lineage's
// tally now survives later lineages arriving, and a coalesced core onto an empty board resets it
// where before it did not.
// CS024 P3 (spec §4.3): this function STAYS, but "whichever producer caused it" is now rhetorical —
// coalescence is the ONLY producer, so this has exactly one call site. It still arms the achievement
// on the 0 -> 1 transition, and it must NOT be called on the cap-overflow path (a destroyed clump
// spawns nothing, so there is no transition to note).
function noteLargeHunterSpawn() {
  if (largeHunterCount() === 0) game.stats.hunterLineageKills = 0;
}

// CS024 P5 (spec §2.4/§4.5): junkSpeedMul() STOOD HERE — the ONE shared debris speedMul derivation
// (px / 70, the shipped DEBRIS_SPEEDS[3] base) that nextWave() and destroyDebris()'s split branch both
// called, preserving the 70/110/160 ratio across all three sizes from one lever. That is a DELETION,
// not a repoint: the three junk sizes are now fully independent levers (junkSpeedLarge/Medium/Small),
// so there is no shared ratio left to derive — each call site reads its own size's lever from
// liveLevers(game.wave) directly and passes the resulting px/s straight into DebrisSatellite's ctor.

// CS024 P3 (spec §1.2/§4.2): CS018 P3's bonusSpawnChance() STOOD HERE — the bonus canister's
// easing-off per-wave spawn probability, and the one lever in CS017/CS018 that got easier as the game
// went on. Deleted with the canister itself. It was the last reader of BONUS_SPAWN_CHANCE_EARLY/_LATE;
// JUNK_CYCLE and levelDef's `rel` column, which it also read, outlived it by one phase and are gone
// too as of CS024 P4, with the rest of the level table.

// CS018 P6: the ONE shared jitter helper for every frequency-shaped lever (§3.2) — UFO appearance and
// UFO direction-change here; UFO firing frequency joins in P7, reusing this same helper rather than a
// second implementation. A PERCENTAGE, not an absolute offset, so the spread scales down as a tier
// centre itself shortens: rand(c*(1-j), c*(1+j)) with j = FREQ_JITTER (frozen at 0.25, CS024 P2 —
// was a live debug knob; removed with the rest of the pre-CS024 registry, spec §1.8/§5).
const FREQ_JITTER = 0.25;
function jitteredInterval(center) {
  return rand(center * (1 - FREQ_JITTER), center * (1 + FREQ_JITTER));
}

// THE SIX UFO DERIVATION HELPERS (CS018 P6/P7), WIRED TO THE UFO CHAIN'S TEN LEVERS BY CS024 P5
// (spec §2.4/§4.6). Each reads liveLevers(game.wave) at the point of use — its own call — so a
// floor/ceil/steps slider re-derives the whole ramp the instant it is touched (CS024 P6c; P5's
// `DEBUG.<leverId> ?? lv.<leverId>` per-value override went with the flat rows).
// PER-SIZE INDEPENDENCE (§4.6): the four that used to derive "big" from "small" (or vice versa) by a
// fixed ratio now take the `small` flag seriously and read two fully independent levers instead.
//
// UFO flight speed: ufoFlightSpeedPx(small)'s shipped 100/150 ratio derivation is GONE — ufoFlightSpeedBig
// and ufoFlightSpeedSmall are independent levers, one per saucer size.
function ufoFlightSpeedPx(small) {
  const lv = liveLevers(game.wave);
  return small ? lv.ufoFlightSpeedSmall : lv.ufoFlightSpeedBig;
}

// UFO appearance frequency — INVERTED (the number goes DOWN as difficulty rises), jittered around the
// centre by jitteredInterval(). There is exactly ONE timer for both sizes (resolved, §2.4) — this stays
// size-less.
function ufoAppearInterval() {
  return jitteredInterval(liveLevers(game.wave).ufoAppearFreq);
}

// UFO direction-change frequency — INVERTED, jittered the same way, now SPLIT per size (ufoDirChangeBig/
// Small) — read at both Saucer sites (ctor + update()), both of which know `this.small`.
function ufoZigInterval(small) {
  const lv = liveLevers(game.wave);
  return jitteredInterval(small ? lv.ufoDirChangeSmall : lv.ufoDirChangeBig);
}

// UFO firing frequency — INVERTED, and a straight MULTIPLIER on the shipped SAUCER_FIRE_BIG/
// SAUCER_FIRE_SMALL per-size ranges (FLAG-d), NOT a jittered interval: rollFireTimer() already draws
// its own rand(range[0], range[1]), and a second draw here would double-randomize one quantity. Now
// SPLIT per size (ufoFireFreqBig/Small) — rollFireTimer() passes its own `this.small`.
function ufoFireMult(small) {
  const lv = liveLevers(game.wave);
  return small ? lv.ufoFireFreqSmall : lv.ufoFireFreqBig;
}

// Small-saucer shot accuracy — INVERTED. Entered as DEGREES (0 = perfectly accurate) and converted to
// radians here, so every caller gets the unit Saucer.update()'s angleTo() aim math already expects.
// BIG SAUCERS NEVER CALL THIS: they fire rand(0, TAU), genuinely unaimed, by design (FLAG-d), and
// ufoAccuracySmall stays small-only — it deliberately takes no size parameter.
function ufoAccuracyRad() {
  return liveLevers(game.wave).ufoAccuracySmall * Math.PI / 180;
}

// UFO shot (Bullet) speed. Not a frequency lever, so no jitter. Now SPLIT per size (ufoShotSpeedBig/
// Small) — the shipped 380 literal was never size-split either, so this is a genuine behaviour change,
// scoped exactly by spec §4.6.
function ufoShotSpeedPx(small) {
  const lv = liveLevers(game.wave);
  return small ? lv.ufoShotSpeedSmall : lv.ufoShotSpeedBig;
}

function wrap(obj) {
  if (obj.x < -60) obj.x += WORLD_W;
  if (obj.x > WORLD_W + 60) obj.x -= WORLD_W;
  if (obj.y < -60) obj.y += WORLD_H;
  if (obj.y > WORLD_H + 60) obj.y -= WORLD_H;
}

function dist2(a, b) {
  // shortest distance squared on a wrapping field
  let dx = Math.abs(a.x - b.x); if (dx > WORLD_W / 2) dx = WORLD_W - dx;
  let dy = Math.abs(a.y - b.y); if (dy > WORLD_H / 2) dy = WORLD_H - dy;
  return dx * dx + dy * dy;
}

function angleTo(from, to) {
  let dx = to.x - from.x, dy = to.y - from.y;
  if (dx > WORLD_W / 2) dx -= WORLD_W; if (dx < -WORLD_W / 2) dx += WORLD_W;
  if (dy > WORLD_H / 2) dy -= WORLD_H; if (dy < -WORLD_H / 2) dy += WORLD_H;
  return Math.atan2(dy, dx);
}

function shortDelta(ax, ay, bx, by) {
  // shortest vector from a to b on the wrapping field
  let dx = bx - ax, dy = by - ay;
  if (dx > WORLD_W / 2) dx -= WORLD_W; if (dx < -WORLD_W / 2) dx += WORLD_W;
  if (dy > WORLD_H / 2) dy -= WORLD_H; if (dy < -WORLD_H / 2) dy += WORLD_H;
  return [dx, dy];
}

// Nearest wrapped image offset of a world coord relative to a reference (camera).
function wrapOffset(coord, refCoord, size) {
  const d = coord - refCoord;
  if (d > size / 2) return -size;
  if (d < -size / 2) return size;
  return 0;
}

// Fold a world position into [0,WORLD) — used when placing freshly spawned entities.
function wrapPos(p) {
  p.x = ((p.x % WORLD_W) + WORLD_W) % WORLD_W;
  p.y = ((p.y % WORLD_H) + WORLD_H) % WORLD_H;
  return p;
}

// Vector-glow stroke
function glowStroke(color, width = 1.6, blur = 10) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// CS025 P3 gave this two trailing width/blur params, forwarded to glowStroke, for the magnet-pull
// scoop tell. CS025 P5 backed that tell out (gate Q4) and the params went with it — they had exactly
// two callers, both in the deleted branch, and an unused optional param on the shared render
// primitive is cruft that invites a literal default. Signature is byte-identical to pre-P3 again:
// every caller takes glowStroke's own defaults (1.6, 10), which stays the ONE place those live.
function drawPoly(points, x, y, angle, color, closed = true) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  if (closed) ctx.closePath();
  glowStroke(color);
  ctx.restore();
}

// Achievement celebration emblem (CS030 P3). tierIdx is a number (0-5, Bronze..Diamond) for a
// tiered unlock, or absent/null for an untiered one, in which case `pool` ("weekly" | "lifetime")
// picks the mark. tierIdx 0 is Bronze, a VALID tier — must test `typeof tierIdx === "number"`,
// never truthiness, or every Bronze unlock misroutes to the untiered emblem.
function drawEmblem(cx, cy, r, tierIdx, pool) {
  const tiered = typeof tierIdx === "number";
  const color = tiered ? TIER_COLOR[tierIdx] : COLOR.ach;
  const polys = tiered ? ACH_EMBLEM.tier[tierIdx] : ACH_EMBLEM[pool];
  for (const pl of polys) drawPoly(pl.pts.map(p => [p[0] * r, p[1] * r]), cx, cy, 0, color, pl.closed);
}

// A HUD ring arc: from 12 o'clock, clockwise, sweeping `frac` of a full turn. `frac` is NOT clamped
// here — callers clamp (banking can exceed 1.0, see the overcharge arc). Track-only when frac <= 0.
function drawRingArc(x, y, r, frac, color, width = HUD_RING_W, blur = HUD_RING_BLUR) {
  if (frac <= 0) return;
  ctx.beginPath();
  ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * frac);
  glowStroke(color, width, blur);   // never closePath() — an arc, not a poly
}

// A segmented HUD ring: `segs` equal wedges from 12 o'clock, clockwise, each separated by
// HUD_RING_SEG_GAP radians of empty space. Wedges 0..filled-1 are lit (glowStroke, like every
// other ring arc); the rest are a dim, glow-less stroke — same track idiom as the powerup rows'
// full-circle track. STROKE ONLY, no fills — never closePath() — arcs, not polys.
function drawRingSegments(x, y, r, segs, filled, litColor, dimColor) {
  const step = TAU / segs;
  for (let i = 0; i < segs; i++) {
    const start = -Math.PI / 2 + i * step + HUD_RING_SEG_GAP / 2;
    const end = -Math.PI / 2 + (i + 1) * step - HUD_RING_SEG_GAP / 2;
    ctx.beginPath();
    ctx.arc(x, y, r, start, end);
    if (i < filled) {
      glowStroke(litColor, HUD_RING_W, HUD_RING_BLUR);
    } else {
      ctx.strokeStyle = dimColor; ctx.lineWidth = HUD_RING_TRACK_W; ctx.stroke();
    }
  }
}

// ---------- Entities ----------
class Ship {
  constructor() { this.reset(); }
  reset() {
    this.x = WORLD_W / 2; this.y = WORLD_H / 2;
    this.vx = 0; this.vy = 0;
    this.angle = -Math.PI / 2;
    this.cooldown = 0;
    this.dead = false;
    this.hp = SHIP_MAX_HP;  // one hull pool for the whole run (F2)
    this.invuln = 0;        // hit-stun i-frames; set on each non-lethal hit (drives the blink)
    this.shieldOn = false;
    this.energy = 1;        // 0..1
    this.autoShieldRegenLock = 0; // CS013 P4: passive-regen freeze window after an auto-save. Runtime only, no persistence.
    this.thrusting = false;
  }
  update(dt) {
    if (this.dead) return;
    const turn = shipTurnRate() * dt;   // player rotation scale (§10b) + optional cargo-turn penalty (§3), one source
    if (input.left())  this.angle -= turn;
    if (input.right()) this.angle += turn;

    this.thrusting = input.thrust();
    // towed cargo makes the ship heavier: weaker thrust, lower top speed. Scales with
    // the chain's total mass, not its node count (F5) — all-mass-1.0 cargo behaves
    // exactly as the old length-based penalty did.
    const cargo = chainMass();
    const thrustMul = 1 / (1 + cargo * CARGO_THRUST);
    const maxSp = SHIP_MAX_SPEED / (1 + cargo * CARGO_MAXSPD);
    if (this.thrusting) {
      this.vx += Math.cos(this.angle) * SHIP_THRUST * thrustMul * dt;
      this.vy += Math.sin(this.angle) * SHIP_THRUST * thrustMul * dt;
      const sp = Math.hypot(this.vx, this.vy);
      if (sp > maxSp) {
        this.vx *= maxSp / sp;
        this.vy *= maxSp / sp;
      }
      // CS024 P6 (spec §3.4/§4.7) — ENGINE IS FUEL, AND THIS IS THE ONLY PLACE IT BURNS. The decrement
      // lives INSIDE the thrust branch, deliberately NOT in update()'s per-frame timer block: the tank
      // measures seconds of FORWARD THRUST, so rotating, coasting, firing and sitting still must all
      // cost nothing. (There is no reverse/brake action in this build — `thrust` is the only
      // acceleration binding — so "reverse burns nothing" holds structurally, not by a second check.)
      // Read AFTER the thrust it paid for, so the frame that empties the tank still got its thrust,
      // and clamped at 0 so a large dt can never drive the budget negative and read as "active".
      game.powerBudget.engine = Math.max(0, game.powerBudget.engine - dt);
    }
    AudioSys.thrust(this.thrusting && game.state === "playing" && !game.paused);

    const drag = Math.pow(1 - SHIP_DRAG, dt);
    this.vx *= drag; this.vy *= drag;
    this.x += this.vx * dt; this.y += this.vy * dt;
    wrap(this);

    // Shield
    if (input.shield() && this.energy > 0.02) {
      this.shieldOn = true;
      this.energy = Math.max(0, this.energy - SHIELD_DRAIN * dt);
      if (this.energy <= 0.02) this.shieldOn = false;
    } else {
      this.shieldOn = false;
      // FLAG-3b: gate ONLY this passive recharge — manual shield-drain above is untouched.
      if (this.autoShieldRegenLock <= 0) this.energy = Math.min(1, this.energy + SHIELD_RECHARGE * dt);
    }

    // Fire. The bullet cap flexes with the weapon powerups (F6): Rapid Fire raises it to
    // RAPID_MAX_BULLETS, Triple Shot to TRIPLE_MAX_BULLETS and fires a 3-bullet spread; both
    // active uses the higher (Triple) cap, not the product (see maxBullets()). Rapid Fire also
    // speeds up cadence via RAPID_FIRE_COOLDOWN (B-6) — Triple stays on the base cadence, so
    // Rapid+Triple together is the strongest combo (fires fast AND wide, FLAG B-6-a).
    this.cooldown -= dt;
    if (input.fire() && this.cooldown <= 0 &&
        game.bullets.filter(b => !b.hostile).length < maxBullets()) {
      const shoot = a => game.bullets.push(new Bullet(
        this.x + Math.cos(a) * SHIP_RADIUS, this.y + Math.sin(a) * SHIP_RADIUS,
        this.vx + Math.cos(a) * BULLET_SPEED, this.vy + Math.sin(a) * BULLET_SPEED, false));
      if (powerActive("triple")) {
        shoot(this.angle - TRIPLE_SPREAD); shoot(this.angle); shoot(this.angle + TRIPLE_SPREAD);
      } else {
        shoot(this.angle);
      }
      this.cooldown = powerActive("rapid") ? RAPID_FIRE_COOLDOWN : FIRE_COOLDOWN;
      // Count-based shot expiry (B-4): one trigger-pull spends one from each active shot budget. A
      // Triple 3-fan is ONE pull; with both active, both budgets tick once and end independently
      // (FLAG B-4-b). Decrement AFTER the fan/cadence reads so this pull is fully a "rapid/triple" pull.
      // CS024 P6: the `settings.shotPowerupMode === "shots"` gate is GONE — this is the only expiry
      // rule now, so it runs on every pull. The per-budget `> 0` guards stay: they are what keep an
      // inactive type at exactly 0 rather than walking negative on every shot of the whole run.
      if (game.powerBudget.rapid  > 0) game.powerBudget.rapid--;
      if (game.powerBudget.triple > 0) game.powerBudget.triple--;
      game.stats.pacifistStreak = 0; // firing breaks the no-fire delivery streak (Pacifist Tow, F9)
      AudioSys.fire();
    }

    if (this.invuln > 0) this.invuln -= dt;
    if (this.autoShieldRegenLock > 0) this.autoShieldRegenLock -= dt;
  }
  draw() {
    if (this.dead) return;
    const blink = this.invuln > 0 && Math.floor(this.invuln * 10) % 2 === 0;
    if (!blink) {
      // Scoop mouth (v3.3 P3; prong-V render restored CS010 P1 — see GDD §2.14.1 for the box-render
      // supersession history). Drawn BEFORE the hull in COLOR.dock green so it reads as a collector's
      // throat: an open V from the ship's nose (16,0) flaring forward to +/-SCOOP_WIDTH[lvl]/2 at
      // SCOOP_DEPTH[lvl]. This is a TELL for inScoopBox()'s capture region, not a literal outline of
      // it — the box's rear edge at forward=-SHIP_RADIUS isn't shown. Corners derived, never
      // hardcoded. No fill. Hidden at level 0.
      // ⛔ CS025 P5 — DO NOT RE-ADD A MAGNET-PULL RECOLOUR HERE. CS025 P3 made this stroke go
      // POWERUP_COLOR.magnet at SCOOP_MAGNET_W/_BLUR while magnetPulling(), plus a fixed nose-V at
      // scoopLevel 0, as the player-facing tell for §1's full-cargo suppression. The CS025 playtest
      // gate (Q4) BACKED IT OUT: magnet-blue #8ab6ff sits too close to COLOR.ship #9fd8ff to read as
      // "charged" at all, so the tell informed nobody while adding a second thing moving on the hull.
      // Paul's call, on the record — the ship does not need another visual channel. The suppression
      // itself SHIPS and is unaffected; it simply has no on-ship tell. See GDD §2.14.1.
      if (game.scoopLevel > 0) {
        const lvl = game.scoopLevel, hw = SCOOP_WIDTH[lvl] / 2, d = SCOOP_DEPTH[lvl];
        drawPoly([[d, -hw], [16, 0], [d, hw]], this.x, this.y, this.angle, COLOR.dock, false);
      }
      const pts = [[16, 0], [-11, -9], [-6, 0], [-11, 9]];
      drawPoly(pts, this.x, this.y, this.angle, COLOR.ship);
      if (this.thrusting && Math.random() < 0.8) {
        const flame = [[-7, -4], [-15 - Math.random() * 6, 0], [-7, 4]];
        drawPoly(flame, this.x, this.y, this.angle, "#ffb060", false);
      }
    }
    if (this.shieldOn) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, SHIELD_RADIUS, 0, TAU);
      ctx.globalAlpha = 0.5 + Math.random() * 0.4;
      glowStroke(COLOR.shield, 2, 14);
      ctx.globalAlpha = 1;
    }
  }
}

class Bullet {
  constructor(x, y, vx, vy, hostile) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = hostile ? 1.4 : BULLET_LIFE;
    this.hostile = hostile;
    this.dead = false;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    wrap(this);
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, TAU);
    ctx.fillStyle = this.hostile ? "#ff9090" : COLOR.bullet;
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Debris Satellite (F3): the passive main hazard (formerly Asteroid). Drifts randomly
// like the old rocks, but reads as wrecked hardware — an authored satellite silhouette
// (SAT_ART, v3.3 P2) — and splits 3-ways at the large/medium tiers, emitting garbage at
// every tier.
class DebrisSatellite {
  // CS024 P5 (spec §2.4/§4.5): `speed` is now a direct base px/s figure, not a shared multiplier on
  // DEBRIS_SPEEDS — the three junk sizes are fully independent levers with their own floor/ceil, so
  // there is no longer one ratio to scale. Callers read liveLevers(game.wave)'s size-specific lever
  // (junkSpeedLarge/Medium/Small) at their own point of use and pass the result straight in. The default
  // is DEBRIS_SPEEDS[size] — the shipped base table survives as exactly that: the level-less fallback
  // for the one caller that isn't lever-driven (the title-screen decoration, below).
  // CS028 P1: `craft` and `piece` carry IDENTITY across a split (see the art dispatch below). Both are
  // OPTIONAL and default to the -1 "does not apply" sentinel, so the two non-split call sites — the wave
  // spawner and the title decoration, both size 3 — pass nothing and are unchanged. Only destroyDebris
  // supplies them.
  constructor(x, y, size, speed = DEBRIS_SPEEDS[size], craft = -1, piece = -1) {
    this.x = x; this.y = y;
    this.size = size;
    this.radius = DEBRIS_RADII[size];
    this.damage = DEBRIS_DAMAGE[size];   // contact damage to the ship (F2)
    // CS017 P3 (FLAG-CS017-a): clamp the RESULTING speed, never the input — a lever value already IS the
    // size-specific base, so clamping it directly can no longer squash the tier spread the way clamping
    // a shared multiplier once could. GUARD RAIL only: junkSpeedSmall's ceil is 240 px/s, so the fastest
    // roll is ~312 px/s (240 x 1.3) against a 1040 cap — it does not bind at the shipped lever range; it
    // is insurance against a future retune.
    const sp = Math.min(speed * rand(0.7, 1.3), DEBRIS_SPEED_CAP);
    const a = rand(0, TAU);
    this.vx = Math.cos(a) * sp;
    this.vy = Math.sin(a) * sp;
    this.angle = rand(0, TAU);          // random spawn rotation (v3.3 item 5 — preserved by the SAT_ART draw path)
    this.spin = rand(-1.2, 1.2);        // random tumble (ditto)
    this.dead = false;
    // CS019 P1: chain-guard absorb cooldown. A body that gets its break absorbed keeps overlapping the
    // node it hit (nothing was severed), so without this it would re-present the same contact — and pay
    // for it — every frame. Stamped in the guard branch of breakChain, skipped by the hazards-vs-chain
    // scan while it is > 0 AND the guard is up. Bullets deliberately have no equivalent: a hostile round
    // is marked dead before the break, so it can never re-present.
    this.guardT = 0;
    // CS024 P1: NO OPTIONAL MOTION-STATE FIELDS ARE DECLARED OR IMPLIED HERE ANY MORE. Two generations
    // of them stood in this spot: CS021 P1's orbit quartet (orbitCenter / orbitRadius / orbitAngle /
    // orbitAngVel — the rail motion mode) and CS023 P4's `drifting` latch. Both are gone, so a
    // DebrisSatellite now carries exactly the fields this constructor writes and update() is a single
    // unconditional linear-integration path again.
    // Authored satellite silhouette (v3.3 P2; breakup model CS028 P1). ⛔ SPLITS NO LONGER RE-ROLL.
    // A body carries an identity through its own destruction — `this.craft` is which of the twelve
    // real spacecraft it is, `this.piece` is which third of that craft — and destroyDebris hands both
    // down, so a shattered Hubble becomes three pieces of Hubble rather than three unrelated wrecks.
    //   size 3 — fresh spawn: roll a craft, draw its `full` silhouette. piece does not apply (-1).
    //   size 2 — split child: the PARENT'S craft, drawn as pieces[piece]. MODULO, not a clamp: the
    //            split site adds a rotating offset, and junkSplit could exceed 3 under a debug
    //            override; both have to wrap onto the three authored pieces.
    //   size 1 — split-of-split: identity is deliberately abandoned (at r=13 no silhouette survives
    //            the jitter), so it draws a generic SAT_SCRAP shard and BOTH fields stay -1.
    // `this.piece` is never read by the draw path. It exists so the split invariant is assertable on
    // the instance: baked art cannot be reverse-engineered to a piece index, because several craft
    // (Hubble 1/2, Skylab 0/2) have two pieces with the same polyline vertex-count signature.
    let polys;
    if (this.size === 1) {
      this.craft = -1; this.piece = -1;
      polys = SAT_SCRAP[Math.floor(rand(0, SAT_SCRAP.length))];
    } else {
      // An absent or out-of-range craft rolls fresh — that is the size-3 spawn path, and it is also
      // what keeps a hand-built `new DebrisSatellite(x, y, 2)` from indexing off the end of the table.
      this.craft = craft >= 0 && craft < SAT_ART.length
        ? Math.floor(craft) : Math.floor(rand(0, SAT_ART.length));
      const artDef = SAT_ART[this.craft];
      if (this.size === 2) {
        this.piece = piece >= 0 ? Math.floor(piece) % artDef.pieces.length
                                : Math.floor(rand(0, artDef.pieces.length));
        polys = artDef.pieces[this.piece];
      } else {
        this.piece = -1;
        polys = artDef.full;
      }
    }
    // The jitter bake is unchanged (v3.3 P2): one per-instance copy scaled to this.radius with a small
    // random per-vertex wobble — the "wrecked/no two alike" look, applied ONCE here, never per frame.
    // All the draw path does is rotate it by this.angle; nothing anchors art to a fixed "up".
    // CS028 P2 (FLAG-CS028-b, gate-confirmed): a polyline may opt out with `jitter: false` — repeating
    // regular geometry (Telstar's facet/belt lines, Webb's mirror-seam and sunshield-layer lines) reads
    // as sloppy rather than damaged once wobbled. Everything else keeps the bake.
    const jit = this.radius * 0.045;    // per-vertex bend/jitter (px); subtle, keeps silhouettes legible
    this.art = polys.map(pl => {
      const j = pl.jitter === false ? 0 : jit;
      return {
        closed: pl.closed,
        pts: pl.pts.map(([px, py]) => [px * this.radius + rand(-j, j),
                                       py * this.radius + rand(-j, j)])
      };
    });
  }
  update(dt) {
    // CS024 P1 (spec §4.1, consequence 2): FREE-BODY MOTION ONLY. CS021 P1's ORBIT MOTION MODE branched
    // here — with the orbit quartet present the ANGLE was integrated and the position DERIVED from it,
    // making the rail authoritative rather than vx/vy. That branch is gone, and this is the same single
    // linear integration every field-level satellite, every split child and the title-screen decoration
    // already took, so nothing that ever ran on the field path changes. Sprite spin (this.angle /
    // this.spin) is a separate, unchanged thing and always was.
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.angle += this.spin * dt;
    if (this.guardT > 0) this.guardT -= dt;   // CS019 P1: absorb cooldown, see the ctor
    wrap(this);
  }
  draw() {
    for (const pl of this.art) drawPoly(pl.pts, this.x, this.y, this.angle, COLOR.debris, pl.closed);
  }
}

// Hunter Satellite (F4): the reshaped killer-satellite/wedge system. A diamond core drifts
// passively toward the ship (like the old Satellite); when shot it splits 3-ways into
// actively-homing children — medium then small, each faster and more agile than the last
// (like the old Wedge). Every tier emits garbage; the final small tier drops a larger burst
// of LOW-mass scrap. CS018 P4: all speeds/turn rates are FROZEN constants (see the HUNTER_*
// block) — the difficulty ramp no longer touches them, and escalation is carried entirely by
// the large-Hunter CAP. Tiers use the Debris 3/2/1 convention: 3 large, 2 medium, 1 small.
class HunterSatellite {
  constructor(x, y, size, scatterAngle = 0) {
    this.x = x; this.y = y;
    this.size = size;                       // 3 large (core) / 2 medium / 1 small
    this.radius = HUNTER_RADII[size];
    this.damage = HUNTER_DAMAGE[size];      // contact damage to the ship (F2/F4)
    this.dead = false;
    // CS019 P1: chain-guard absorb cooldown — same field, same reason, as DebrisSatellite's (see there).
    // The homing tiers are the pathological case this exists for: a medium/small that loses contact
    // re-acquires and comes straight back, so without a cooldown one attack could bill several times.
    this.guardT = 0;
    // v3.3 P4 (9b, FORK-5): the `bornOfScrap` flag is GONE. Every Hunter of every origin now drops
    // garbage at its tier counts — the v3.2 P3 suppression is reversed. 9a's single-decay is the new
    // governor for the 12-in/66-out amplifier that flag used to close.
    // CS024 P5 (spec §2.4): TURN RATE STAYS FROZEN AT EVERY TIER, ALWAYS — no lever, never will be
    // (0 / 0.928 / 1.508 rad/s for tiers 3 / 2 / 1). SPEED SPLITS BY TIER. The large core does not
    // pursue and has no speed lever — it keeps the CS018 P4 frozen drift, HUNTER_SPEED_CEIL[3] *
    // HUNTER_FLOOR_FRAC = 40.6 px/s, unconditionally. Medium/small speed is now the HUNTER chain's two
    // carried levers (hunterSpeedMedium/hunterSpeedSmall), read at the point of use — a Hunter's own
    // construction — via liveLevers(game.wave), which folds the panel's floor/ceil/steps rows in first.
    // This is what makes escalating Hunter pressure real again post-CS024 P3 (which retired the level
    // table's maxLargeHunters cap in favour of a flat backstop): coalescePause (how fast the pipeline
    // feeds) and hunterSpeedMedium/Small (how fast a homer closes once born) both still climb with wave.
    // CS024 P6f brought a HOW MANY ceiling back as largeHunterCap(wave) — but note it is a CEILING, not a
    // second pressure axis: it only ever limits, never drives, and it is deliberately not a lever.
    this.turnRate = HUNTER_TURN_CEIL[size] * HUNTER_FLOOR_FRAC;
    if (size === 3) {
      this.speed = HUNTER_SPEED_CEIL[3] * HUNTER_FLOOR_FRAC;
    } else {
      const lv = liveLevers(game.wave);
      this.speed = size === 2 ? lv.hunterSpeedMedium : lv.hunterSpeedSmall;
    }
    if (size === 3) {
      // Large core: passive drift toward the ship's position AT SPAWN — no continuous re-aim
      // (confirmed design). Only its drift *speed* scales with difficulty, not its behavior.
      this.homing = false;
      this.heading = angleTo(this, game.ship) + rand(-0.4, 0.4);
      this.angle = rand(0, TAU);
      this.spinRate = rand(0.6, 1.0) * randSign();  // slow visual tumble (reads as "not aiming at you")
    } else {
      // Medium/small: relentless wrap-aware homing after a brief outward scatter.
      this.homing = true;
      this.heading = scatterAngle;
      this.scatter = HUNTER_SCATTER;
    }
    this.vx = Math.cos(this.heading) * this.speed;
    this.vy = Math.sin(this.heading) * this.speed;
    // Diamond silhouette, scaled per tier. The large core is a symmetric diamond that spins
    // in place; homers are a forward-elongated kite-diamond that points along the pursuit
    // heading (reads as "aiming at you"). Inner diamond on the two larger tiers for presence.
    const r = this.radius;
    this.shape = this.homing
      ? [[r * 1.35, 0], [0, -r * 0.8], [-r * 0.75, 0], [0, r * 0.8]]
      : [[r, 0], [0, -r], [-r, 0], [0, r]];
    this.inner = size >= 2
      ? [[r * 0.5, 0], [0, -r * 0.4], [-r * 0.4, 0], [0, r * 0.4]]
      : null;
  }
  // CS024 P3 (spec §1.3/§4.3): `static spawnCore()` STOOD HERE — the AMBIENT producer's factory, which
  // slid a fresh large core in from just beyond a random viewport edge on a rand(20, 32) timer. It is
  // deleted along with game.hunterTimer and update()'s spawn block. HUNTERS NOW ARISE FROM EXACTLY ONE
  // SOURCE: garbage coalescing to HUNTER_COALESCE_COUNT pieces, which constructs the core in place at
  // the clump's own position. That is the game's thesis made mechanical — neglected debris is the only
  // thing that becomes a hunter — and it is only survivable because §1.4 made loose garbage permanent.
  // Children are still created directly at the parent's position in destroyHunter.
  update(dt) {
    if (this.homing) {
      if (this.scatter > 0) {
        this.scatter -= dt;
      } else if (!game.ship.dead) {
        const target = angleTo(this, game.ship);
        let diff = target - this.heading;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const maxTurn = this.turnRate * dt;
        this.heading += Math.max(-maxTurn, Math.min(maxTurn, diff));
      }
      this.vx = Math.cos(this.heading) * this.speed;
      this.vy = Math.sin(this.heading) * this.speed;
    } else {
      this.angle += this.spinRate * dt;   // large core tumbles; keeps its fixed spawn-time drift velocity...
      // ...UNLESS it's the last satellite standing (v3.6 P2b): once Debris is cleared, a large core slowly
      // steers toward the ship — a search-ender for late-wave stalling, not a second homing tier. Do NOT
      // flip this.homing: shape/inner and draw()'s angle-vs-heading pick are baked off it at construction,
      // so that would silently swap the diamond for the kite silhouette and freeze the tumble. Evaluated
      // inline instead of a stored flag — the tumble is the unchanged visual, the steering is the tell.
      // CS024 P3 (spec §3.3) FORMALISES THIS AS A DOCUMENTED EXCEPTION to "the large Hunter does not
      // pursue," and changes exactly one thing: the speed is the live DEBUG.lastStandSpeed knob rather
      // than the hardcoded constant. Everything else is deliberately preserved, including the part that
      // reads like a bug and is not: THE MOMENT DEBRIS REAPPEARS THIS BLOCK SIMPLY STOPS EXECUTING, so
      // the core keeps whatever vx/vy it held at that instant and resumes a straight drift on it. There
      // is no disarm, no restore of the spawn-time vector, and no homing flip. (Gate A question 6 asks
      // whether that reads as intentional in the hands.)
      if (game.debris.length === 0 && !game.ship.dead) {
        const target = angleTo(this, game.ship);          // wrap-aware — a naive angle is ~180° wrong across a seam
        let diff = target - this.heading;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const maxTurn = HUNTER_LAST_STAND_TURN * dt;
        this.heading += Math.max(-maxTurn, Math.min(maxTurn, diff));
        this.vx = Math.cos(this.heading) * DEBUG.lastStandSpeed;
        this.vy = Math.sin(this.heading) * DEBUG.lastStandSpeed;
      }
    }
    if (this.guardT > 0) this.guardT -= dt;   // CS019 P1: absorb cooldown, see the ctor
    this.x += this.vx * dt; this.y += this.vy * dt;
    wrap(this);
  }
  draw() {
    const ang = this.homing ? this.heading : this.angle;
    drawPoly(this.shape, this.x, this.y, ang, COLOR.satellite);
    if (this.inner) {
      // homers: inner tracks the nose; core: counter-rotate for a faceted shimmer
      drawPoly(this.inner, this.x, this.y, this.homing ? ang : -this.angle * 1.5, COLOR.satellite);
    }
  }
}

class Saucer {
  constructor(small) {
    this.small = small;
    this.radius = small ? 12 : 20;
    this.damage = small ? DMG_SMALL : DMG_MEDIUM;   // ramming contact damage to the ship (F2)
    this.fromLeft = Math.random() < 0.5;
    // enter from just beyond the left/right viewport edge, relative to the ship
    const p = wrapPos({
      x: game.ship.x + (this.fromLeft ? -(VIEW_W / 2 + 40) : VIEW_W / 2 + 40),
      y: game.ship.y + rand(-VIEW_H * 0.35, VIEW_H * 0.35)
    });
    this.x = p.x; this.y = p.y;
    this.baseY = this.y;   // vertical zig-zag stays in a band around the entry height
    this.vx = (this.fromLeft ? 1 : -1) * ufoFlightSpeedPx(small); // CS024 P5: ufoFlightSpeedBig/Small levers
    this.vy = 0;
    this.dead = false;
    this.fireTimer = this.rollFireTimer(SAUCER_FIRE_INIT);   // first shot delayed harder at low waves (F10)
    this.zigTimer = ufoZigInterval(small); // CS024 P5: ufoDirChangeBig/Small levers, jittered
    this.travel = 0;
  }
  // Between-shot / first-shot delay for a [min,max] base range, scaled by the CS024 P5 UFO WEAPONS
  // fire-frequency lever: ufoFireFreqBig/Small independently.
  rollFireTimer(range) {
    const mult = ufoFireMult(this.small); // CS024 P5: ufoFireFreqBig/Small levers
    return rand(range[0], range[1]) * mult;
  }
  update(dt) {
    this.zigTimer -= dt;
    if (this.zigTimer <= 0) {
      this.vy = randSign() * rand(40, 110);
      this.zigTimer = ufoZigInterval(this.small); // CS024 P5: ufoDirChangeBig/Small levers, jittered
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // keep the zig-zag within a screen-height band around the entry height
    if (this.y < this.baseY - (VIEW_H / 2 - 30) || this.y > this.baseY + (VIEW_H / 2 - 30)) this.vy *= -1;
    this.travel += Math.abs(this.vx) * dt;
    if (this.travel > VIEW_W + 120) { this.dead = true; return; } // exits, no wrap-x

    this.fireTimer -= dt;
    if (this.fireTimer <= 0 && !game.ship.dead) {
      let a;
      if (this.small) {
        // aimed, error widens toward a barely-aimed spray at the "low" tier. CS018 P7: tiered and
        // converted from degrees to radians at the call site (was ramp()+wavePressure()-driven — see
        // ufoAccuracyRad()). Big saucers never aim (FLAG-d) — only the small (aimed) saucer reads this.
        const err = ufoAccuracyRad();
        a = angleTo(this, game.ship) + rand(-err, err);
      } else {
        a = rand(0, TAU); // random
      }
      const shotSpeed = ufoShotSpeedPx(this.small); // CS024 P5: ufoShotSpeedBig/Small levers
      game.bullets.push(new Bullet(this.x, this.y,
        Math.cos(a) * shotSpeed, Math.sin(a) * shotSpeed, true));
      this.fireTimer = this.rollFireTimer(this.small ? SAUCER_FIRE_SMALL : SAUCER_FIRE_BIG);
    }
  }
  draw() {
    const s = this.small ? 0.62 : 1;
    const body = [[-20*s,4*s],[-9*s,-4*s],[9*s,-4*s],[20*s,4*s],[9*s,11*s],[-9*s,11*s]];
    const dome = [[-9*s,-4*s],[-5*s,-11*s],[5*s,-11*s],[9*s,-4*s]];
    drawPoly(body, this.x, this.y, 0, COLOR.saucer);
    drawPoly(dome, this.x, this.y, 0, COLOR.saucer, false);
    // middle line
    ctx.beginPath();
    ctx.moveTo(this.x - 20*s, this.y + 4*s);
    ctx.lineTo(this.x + 20*s, this.y + 4*s);
    glowStroke(COLOR.saucer);
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    const a = rand(0, TAU), sp = rand(30, 240);
    this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
    this.life = rand(0.3, 0.9);
    this.maxLife = this.life;
    this.color = color;
    this.dead = false;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }
  draw() {
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - 1, this.y - 1, 2, 2);
    ctx.globalAlpha = 1;
  }
}

// Shared renderer for radioactive canisters (free-floating and chained). Low-mass scrap
// (Hunter small-tier drops) renders in a paler tint so it's visibly the easier-to-tow bonus.
// v3.5 P2: trailing `scale` param (default 1, so the two pre-existing call sites — the single
// canister and chain nodes — stay byte-identical) lets a garbage clump draw as one larger canister.
function drawCanister(x, y, angle, alpha, color = COLOR.garbage, scale = 1) {
  ctx.globalAlpha = alpha * (0.75 + Math.random() * 0.25); // radioactive flicker
  const body = [[7 * scale, -5 * scale], [7 * scale, 5 * scale], [-7 * scale, 5 * scale], [-7 * scale, -5 * scale]];
  drawPoly(body, x, y, angle, color);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  ctx.beginPath(); ctx.moveTo(-7 * scale, 0); ctx.lineTo(7 * scale, 0); // hazard stripe
  glowStroke(color, 1, 5);
  ctx.restore();
  ctx.globalAlpha = 1;
}

class Garbage {
  // CS024 P3 (spec §1.4/§4.4): A LOOSE PIECE IS PERMANENT. `decay` (v3.3 P4 9a, CS015 P6 item 10) is
  // gone — no lifetime clock, no expiry, no blink-out. The density governor is now the deterministic
  // cull in cullGarbage(), which orders its victims by `age` below.
  constructor(x, y, vx = 0, vy = 0, mass = 1.0) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.spin = rand(0, TAU);
    this.spinRate = rand(-1.5, 1.5);
    this.mass = mass;   // towing weight (F5): 1.0 for Debris scrap; lighter scrap tows easier
    // CS024 P3: cumulative seconds this piece has existed, ticked in update() and MONOTONICALLY
    // INCREASING — it only ever goes up. Read by exactly ONE thing, the cull's victim ordering; no
    // gameplay rule may read it. It is deliberately NOT the retired decay clock inverted: A MERGE DOES
    // NOT RESET IT (see coalesceGarbage). The decay clock reset on merge so an actively-growing lineage
    // would never age out; the cull wants the opposite — a clump that has been sitting around a long
    // time is exactly what it should prefer to take.
    this.age = 0;
    // Coalescence (v3.2 P1). These constructor defaults are inherited by all three emission sites
    // AND Garbage.fromNode. `coalesceDelay` counts down in update(); a piece is "active" (attracts +
    // can merge) once it hits 0. `pieces` is the 1..11 threat counter (at 12 the clump transforms).
    // v3.2 P1 reverses FORK-2: on merge `mass` now SUMS and `radius` DERIVES from pieces (a clump is
    // a real, heavy, big, un-hookable body — you must shoot it apart first). radius = 7*sqrt(pieces),
    // so a single piece still reads 7 (the base canister radius).
    // CS024 P5 (spec §2.4/§4.5): the retired garbageAttractDelay knob is now the HUNTER chain's driver
    // lever, coalescePause — read at the point of use (this ctor) exactly like every other lever, with
    // the panel's floor/ceil/steps rows folded in first (CS024 P6c) when a slider has been touched.
    this.coalesceDelay = liveLevers(game.wave).coalescePause; // captured per-piece at ctor time
    this.pieces = 1;
    this.radius = 7 * Math.sqrt(this.pieces);
    // CS024 P3: `this.bonus` STOOD HERE (CS017 P5's rare-canister marker). Removed with the bonus
    // canister — no emission site ever set it but nextWave()'s deleted spawn block.
    this.dead = false;
  }
  static fromNode(n) { // chain node knocked loose -> free garbage (v3.2 P3: no decay)
    const a = rand(0, TAU);
    return new Garbage(n.x, n.y,
      Math.cos(a) * rand(20, 60), Math.sin(a) * rand(20, 60), n.mass);
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.spin += this.spinRate * dt;
    wrap(this);
    // CS024 P3: the `decay -= dt` / `if (decay <= 0) dead = true` block STOOD HERE. A piece no longer
    // ages out at all; this clock only ever counts UP, and only the cull reads it. Chain nodes aren't
    // Garbage, so they never reach here — which is why the cull can never touch one. A pickup still
    // sets `dead` externally; coalescence still consumes pieces.
    this.age += dt;
    // `coalesceDelay` still gates attraction/merge (see coalesceGarbage).
    if (this.coalesceDelay > 0) this.coalesceDelay -= dt;
  }
  draw() {
    if (this.pieces === 1) {
      // A single centered canister. CS024 P3: the v3.3 P4 (9a) expiry blink-out and CS017 P5's `bonus`
      // colour override both stood here and are gone — a piece neither expires nor can be a bonus, so
      // this is once again a flat per-piece-mass colour at a constant alpha. The cull is SILENT: there
      // is deliberately NO tell for a culled piece, here or in the clump path below.
      const color = this.mass < 1 ? COLOR.garbageLight : COLOR.garbage;
      drawCanister(this.x, this.y, this.spin, 0.9, color);
      return;
    }
    // v3.5 P2 (reverses v3.3 P1): a clump (pieces > 1) draws as ONE ordinary canister scaled up by
    // sqrt(pieces) (= this.radius / 7) — a larger canister, not a jittered-hull asteroid — so it
    // reads as "a bigger pickup," not "a hazard." Scaling by radius/7 makes the drawn long half-axis
    // exactly equal this.radius, so the visual and the (unchanged) collision radius agree by
    // construction. v3.6 P1a: colour now follows the same per-piece-mass rule as a single (the red
    // proximity-to-Hunter lerp is gone) — size (radius = 7*sqrt(pieces)) is the only remaining tell
    // that a clump is nearing the Hunter transform. CS024 P3: the expiry blink (CS015 P6 item 10) and
    // the bonus colour + halo ring (CS017 P5, with drawBonusRing() below it) all stood here and are
    // gone — size is now the ONLY tell a clump carries, which is what it was before CS017.
    const color = (this.mass / this.pieces) < 1 ? COLOR.garbageLight : COLOR.garbage;
    drawCanister(this.x, this.y, this.spin, 0.9, color, this.radius / 7);
    if (saturatedClump(this)) this.drawHeldRing();
  }
  // CS024 P6f (spec §6): THE HELD TELL. A held clump is a new persistent condition with no precedent —
  // before this phase a clump reaching HUNTER_COALESCE_COUNT either converted or vanished in the same
  // frame, so `pieces >= 12` was never a state anything could DRAW. Now it sits there indefinitely, and
  // the player has to be able to read it as PENDING rather than as ordinary salvage. Two channels, since
  // size is already spoken for (radius = 7*sqrt(pieces) is the nearing-the-transform tell):
  //   · COLOR.satellite — the HUNTER's own hue, on a body drawn in the salvage hue. "This is turning
  //     into one of those."
  //   · A PULSE at the flat HUD_PULSE_HZ non-HP alarm rate — the same expression drawHUD's gold cargo
  //     alarm uses, so the two read as one visual vocabulary. Static rings in this build mean "a
  //     property"; a pulsing one means "a countdown you can still act on."
  // STROKE ONLY, through the shared drawRingArc/glowStroke path (no new fill exception, GDD §3.2;
  // frac 1 = a full turn) — the retired CS017 P5 bonus halo's idiom exactly, which is where the ring
  // pad and the 1.5/8 width/blur come from. DERIVED from saturatedClump(), never from a flag: a partial
  // scoop or a bullet drops the clump below 12 and the ring is simply gone the very next frame, with
  // nothing to clear. drawCanister leaves globalAlpha at 1, so the pulse alpha is applied here.
  drawHeldRing() {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 1000 * TAU * HUD_PULSE_HZ);
    drawRingArc(this.x, this.y, this.radius + HELD_CLUMP_RING_PAD, 1, COLOR.satellite, 1.5, 8);
    ctx.globalAlpha = 1;
  }
}

// Draw a powerup's type glyph centered at (x,y), scaled to icon radius r, in `color`.
// Reused by the field entity (with a housing ring) and the HUD active-effect row (bare glyph),
// so a powerup reads identically in the world and on the HUD. Local-space icons designed at r=12.
function drawPowerupGlyph(type, x, y, r, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(r / 12, r / 12);
  ctx.beginPath();
  switch (type) {
    case "rapid":  // fast-forward: two right-pointing chevrons
      ctx.moveTo(-6, -6); ctx.lineTo(0, 0); ctx.lineTo(-6, 6);
      ctx.moveTo(1, -6);  ctx.lineTo(7, 0); ctx.lineTo(1, 6);
      break;
    case "triple": // a 3-way spread fan from a single origin
      ctx.moveTo(-7, 0); ctx.lineTo(7, -7);
      ctx.moveTo(-7, 0); ctx.lineTo(8, 0);
      ctx.moveTo(-7, 0); ctx.lineTo(7, 7);
      break;
    case "health": // plus / medical cross
      ctx.moveTo(0, -8); ctx.lineTo(0, 8);
      ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
      break;
    case "magnet": // horseshoe magnet opening up, with pole tips
      ctx.arc(0, 1, 5, 0, Math.PI);
      ctx.moveTo(-5, 1); ctx.lineTo(-5, -7);
      ctx.moveTo(5, 1);  ctx.lineTo(5, -7);
      ctx.moveTo(-7, -7); ctx.lineTo(-3, -7);
      ctx.moveTo(3, -7);  ctx.lineTo(7, -7);
      break;
    case "engine": // thruster bell firing exhaust
      ctx.moveTo(-4, -8); ctx.lineTo(4, -8); ctx.lineTo(6, 2); ctx.lineTo(-6, 2); ctx.closePath();
      ctx.moveTo(-4, 3); ctx.lineTo(-3, 8);
      ctx.moveTo(0, 3);  ctx.lineTo(0, 9);
      ctx.moveTo(4, 3);  ctx.lineTo(3, 8);
      break;
    case "scoop":  // a widening funnel / collector mouth (v3.3 P3): narrow throat, flaring open forward
      ctx.moveTo(-8, -7); ctx.lineTo(-3, 4); ctx.lineTo(3, 4); ctx.lineTo(8, -7);
      break;
    case "guard":  // CS017 P6 — a heater shield over a chain link: the payload, armoured. Stroke only
                   // (no fill, GDD §3.2), and no closePath on the link so it reads as a link, not a ring.
      ctx.moveTo(-7, -7); ctx.lineTo(7, -7); ctx.lineTo(7, 0);      // shield: flat top, shoulders...
      ctx.lineTo(0, 8); ctx.lineTo(-7, 0); ctx.closePath();          // ...tapering to a point
      ctx.moveTo(-3, -3); ctx.lineTo(3, -3);                         // the link inside it
      ctx.moveTo(-3, 1);  ctx.lineTo(3, 1);
      break;
  }
  glowStroke(color, 1.6, 8);
  ctx.restore();
}

// Powerup (F6): a free-floating pickup following the standard entity contract. A rotating
// hexagon housing (so every kind reads as one "collect me" family) wraps a distinct per-type
// glyph. Health spawns ambiently and is instant; rapid/triple/magnet/engine are timed drops.
// Uncollected powerups fade after POWERUP_DECAY with the same blink countdown as garbage.
class Powerup {
  constructor(x, y, type, vx = 0, vy = 0) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.type = type;
    this.radius = POWERUP_RADIUS;
    this.spin = rand(0, TAU);
    this.spinRate = rand(-0.8, 0.8);
    this.pulse = rand(0, TAU);
    this.decay = POWERUP_DECAY;
    this.dead = false;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.spin += this.spinRate * dt;
    this.pulse += dt * 4;
    wrap(this);
    this.decay -= dt;
    if (this.decay <= 0) this.dead = true;
  }
  draw() {
    const blink = this.decay < 4 && Math.floor(this.decay * (this.decay < 2 ? 8 : 4)) % 2 === 0;
    if (blink) return;
    const color = POWERUP_COLOR[this.type];
    const r = this.radius;
    const hex = [];
    for (let i = 0; i < 6; i++) { const th = (i / 6) * TAU; hex.push([Math.cos(th) * r, Math.sin(th) * r]); }
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(this.pulse);
    drawPoly(hex, this.x, this.y, this.spin, color);
    ctx.globalAlpha = 1;
    drawPowerupGlyph(this.type, this.x, this.y, r * 0.62, color);
  }
}

class FloatText {
  // CS026 P4 (spec §3.3a): `rise`/`life` are trailing and optional, defaulted to the pre-existing
  // 30/1.1 values — every pre-CS026 call site omits them and stays byte-identical (the CS012 P3
  // `size` precedent). `life0` is the constructed life, which draw()'s alpha divides by instead of
  // the literal 1.1 — a short-lived floater must still reach full opacity.
  // CS029 P4: `pinned` is optional and defaults false — every pre-existing call site never sets it,
  // so update() falls straight through to the original two lines, byte-identical. It exists for the
  // model-C delivery ticker (tools/dock-float-lab.html, gate G1): a pinned floater holds its position
  // and life at birth, unaffected by time, until something un-pins it (releaseDeliveryTicker()).
  constructor(text, x, y, color, size = 16, rise = 30, life = 1.1) {
    this.text = text; this.x = x; this.y = y; this.color = color; this.size = size;
    this.rise = rise; this.life = life; this.life0 = life; this.dead = false;
    this.pinned = false;
  }
  update(dt) {
    if (this.pinned) return;
    this.y -= this.rise * dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life / this.life0);
    drawText(this.text, this.x, this.y, this.size, this.color);
    ctx.globalAlpha = 1;
  }
}

// CS029 P4 (model C, §6.3): un-pins game.deliveryTicker so it ages out and fades like any other
// floater, then drops the reference. The spec names one release trigger — the visit's last canister,
// called at the dock-offload block below — but a ticker can also be orphaned by a visit that never
// reaches one: the chain gets severed mid-offload (breakChain), the ship dies mid-offload
// (scatterChain), the run's one-effort grace window expires (DOCK_COMBO_GRACE), or a fresh haul
// starts before the old one finished (the towed-hook reset). Each of those already zeroes
// game.deliveryCount for the same reason — the effort is over — so each calls this too. Without it a
// ticker abandoned mid-visit would sit pinned at the dock anchor forever, and the NEXT visit's `if
// (!game.deliveryTicker)` check would find it, silently resuming a stale total instead of starting
// fresh (§4.3: "the next visit starts a new ticker").
function releaseDeliveryTicker() {
  if (game.deliveryTicker) game.deliveryTicker.pinned = false;
  game.deliveryTicker = null;
}

class Dock {
  constructor() {
    // place within reach of the ship's current world position, but not on top of it
    const a = rand(0, TAU);
    const d = rand(DOCK_MIN_DIST, DOCK_MAX_DIST);
    const p = wrapPos({ x: game.ship.x + Math.cos(a) * d, y: game.ship.y + Math.sin(a) * d });
    this.x = p.x; this.y = p.y;
    this.radius = DOCK_RADIUS;
    this.spin = 0;
    this.pts = [];
    for (let i = 0; i < 8; i++) {
      const th = (i / 8) * TAU + TAU / 16;
      this.pts.push([Math.cos(th) * this.radius, Math.sin(th) * this.radius]);
    }
  }
  update(dt) { this.spin += dt * 0.7; }
  draw() {
    drawPoly(this.pts, this.x, this.y, 0, COLOR.dock);
    // rotating intake vanes — vane inner radius and label offset were the pre-CS024 14/22 base
    // values scaled 2x by the (now-removed) v3.4 P2 dock-size lever, permanently baked in here
    // as 28/44 to keep the drawn geometry identical (PLANNED-FEATURES-CS024 §1.6).
    for (let i = 0; i < 3; i++) {
      const th = this.spin + (i * TAU) / 3;
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(th) * (this.radius - 10),
                 this.y + Math.sin(th) * (this.radius - 10));
      ctx.lineTo(this.x + Math.cos(th + 0.25) * 28,
                 this.y + Math.sin(th + 0.25) * 28);
      glowStroke(COLOR.dock, 1.4, 8);
    }
    const hot = game.chain.length > 0 && Math.floor(performance.now() / 350) % 2 === 0;
    drawText("RECYCLE", this.x, this.y + this.radius + 44, 14,
      hot ? COLOR.garbage : COLOR.dim);
  }
}

// ---------- Game state ----------
// Fresh per-game achievement stats (F9). One flat bag of counters/flags observed at the points
// events already happen (kills, deliveries, hits, deliveries, powerups). Reset at startGame; the
// weekly (single-game) achievements read off this, lifetime ones read Achievements.lifetime.
function resetGameStats() {
  return {
    gameTime: 0,             // sec since this game started (Speed Recycler's 60s window)
    delivered: 0,            // canisters delivered to the dock this game (Scrap Runner)
    fullChainVisit: false,   // a single dock visit reached 12 deliveries (Heavy Hauler)
    maxChainVisit: false,    // a single dock visit reached CARGO_CAP_MAX (24) deliveries (Maxed Out, CS012 P3)
    bestCombo: 0,            // highest delivery combo reached in one visit (Combo Collector)
    speedRecycler: false,    // first canister delivered within 60s (Speed Recycler)
    pacifistStreak: 0,       // consecutive deliveries with no shot fired between them
    pacifistBest: 0,         // best such streak this game (Pacifist Tow, goal 5)
    debrisKills: 0,          // Debris Satellites the player destroyed (Satellite Buster)
    hunterLineageKills: 0,   // kills in the CURRENT Hunter lineage. CS018 P4 (FLAG-i): reset on the
                             // 0 -> 1 large-Hunter transition (noteLargeHunterSpawn), not on every spawn
    hunterLineComplete: false,// wiped a full 13-member Hunter line from one spawn (Hunter's Bane)
    largeHunterKills: 0,     // large Hunter cores destroyed this game (Diamond Cutter)
    smallSaucerKills: 0,     // small (aimed) saucers destroyed this game (Small Ball)
    deflects: 0,             // hazards/bullets absorbed by the shield this game (Shield Surfer)
    healthPicked: 0,         // Health powerups picked up this game (Glass Cannon)
    powerupsPicked: 0,       // ANY powerups picked up this game (No Powerups Needed)
    powerUsed: { rapid: false, triple: false, magnet: false, engine: false }, // Powered Up (all four)
    dmgThisWave: 0,          // hits taken during the wave in progress (perfect-wave detection)
    noScratchWave3: false,   // completed wave 3 damage-free (No Scratches)
    flawlessLateWave: false, // cleared wave 8+ damage-free (Flawless Run weekly, v3.0 P8)
    closeShave: false,       // survived a Hunter collision under 10 HP (Close Shave)
    everBelowHalf: false,    // HP ever dropped below 50% this game (Untouchable inverts this)
    hunterCoalesced: 0,      // Hunters born this game from neglected scrap coalescing (Waste Not, v3.2 P3)
    gameEnded: false         // set at game over so end-of-game achievements can evaluate
  };
}

const game = {
  state: "title",   // title | playing | dying | gameover  ("dying" = the v3.6 P5 death spectacle)
  paused: false,    // true iff a pause-menu screen is open (F8)
  deathT: 0,        // v3.6 P5: seconds left in the "dying" spectacle (DEATH_DURATION → 0 → "gameover")
  shake: 0,         // v3.6 P5: current screen-shake amplitude (px), decayed in updateDeath()
  entry: null,      // v3.6 P6: { initials:[i,i,i], idx } while the initials-entry UI is live on "gameover"
  lastScoreId: null,// v3.6 P6: id of the just-committed HighScores record, for the table highlight
  stats: resetGameStats(), // per-game achievement counters/flags (F9)
  toasts: [],       // active achievement-unlock toasts { name, life } (F9)
  pendingAch: [],   // CS030 P1: unlocks banked since the last celebration-panel flush
  celebration: null, // CS030 P1: the live celebration panel { items, scroll }, or null
  // Pause-menu state machine (F8): screen = null | "root" | "options" | "controls";
  // index = cursor for root/options; row/col = cursor for the controls grid;
  // rebinding = { action, device } while capturing a new binding, else null.
  // CS016 P2: boots on the title's own menu (state starts "title"), NOT null — the title screen is a
  // navigable menu now, and a null screen there would render cursor-less and read menuActive() false.
  // index 0 = "Start Game", so ENTER / A on a cold boot still starts a run immediately.
  // CS031 P5 (FORK-CS031-E → c): a genuinely empty install (Profiles.firstBoot, set only when init()
  // found neither a roster nor legacy data) boots straight to "profiles" instead — there is no name to
  // show on a "Profile: —" title row and nothing to play as. An upgrading player (legacy data migrated
  // into p0) has firstBoot false and boots normally, exactly as before this phase.
  menu: { screen: Profiles.firstBoot ? "profiles" : "titlemenu", index: 0, row: 0, col: 0, rebinding: null, scroll: 0, modal: null, achTab: ACH_TAB_DEFAULT,
          nameBuf: "", nameCtx: null, nameErr: "", slotMode: null, slotMsg: "" }, // scroll: CS013 P3, Achievements-viewer vertical offset; modal: CS016 P3, the open confirmation dialog (null = none); achTab: CS016 P5, the viewer's active tab id; nameBuf/nameCtx/nameErr: CS031 P3, the name-entry screen (typed buffer / what commit does / inline validation message); slotMode/slotMsg: CS032 P3, the slots screen (caller-set save/load mode / inline write-failure message)
  ship: new Ship(),
  camera: { x: WORLD_W / 2, y: WORLD_H / 2 }, // world point at the center of the viewport
  // CS022 P1: the world size the sim is CURRENTLY running at (WORLD_SIZE_FIELD | WORLD_SIZE_ORBIT).
  // nextWave() compares worldSizeFor(game.wave) against this and resizes only on a real change.
  // Declared in BOTH this literal and resetRun() per the standing CS016 P3 rule (STATUS.md
  // Known issues): a field that lands in only one of the two is `undefined` for a whole run.
  worldSize: WORLD_SIZE_FIELD,
  debris: [], bullets: [], saucers: [], hunters: [], particles: [],
  garbage: [], chain: [], floaters: [], dock: null,
  // CS024 P1: `orbitLayout` STOOD HERE (CS021 P3 — the live orbit-level layout, set unconditionally by
  // every nextWave()). Removed with the archetype. It was never in startGame()'s reset, only in this
  // literal and nextWave()'s own branch, so there is no second declaration site to clean up.
  powerups: [],                                        // free-floating Powerup pickups (F6)
  // CS017 P6: every one of these gains a `guard` key. powerBudget's is the one that matters most —
  // powerActive("guard") reads it, and a missing key would make the guard read as permanently expired.
  // Keep these in step with POWERUP_DROP_TYPES and with startGame()'s resets below.
  // CS024 P6: `powerFx` (remaining seconds per timed effect) IS DELETED — there is no clock left for it
  // to hold. powerBudget gains the `engine` key it never had, for exactly the reason guard needed one:
  // Engine is a budgeted type now (seconds of forward thrust), and a missing key reads as fully spent.
  powerBudget: { rapid: 0, triple: 0, magnet: 0, engine: 0, guard: 0 },   // remaining shots/pieces/thrust-seconds/intercepts
  powerBank: { rapid: 0, triple: 0, magnet: 0, engine: 0, guard: 0 },    // CS009 P5: sec of bank-flash left per type (0 = none)
  powerBankAmt: { rapid: 0, triple: 0, magnet: 0, engine: 0, guard: 0 }, // CS009 P5: the "+Ns" badge amount for the current flash
  hudHull: 1,                                          // CS009 P1: eased HUD hull fraction, chases
                                                        // ship.hp/SHIP_MAX_HP so a hit/heal reads as a
                                                        // drain/fill, not a jump. Advanced in update(),
                                                        // NOT drawHUD() — see the update() call site.
  scoopLevel: 0,                                       // PERSISTENT scoop upgrade level 0..SCOOP_MAX_LEVEL (v3.3 P3; NOT a budgeted effect)
  scoopHits: 0,                                        // running non-lethal-hit tally; every SCOOP_HITS_PER_LEVEL costs a level
  healthTimer: 0,                                      // countdown to the next ambient Health spawn
  sweepPause: 0,                                       // CS018 P9: sec of Super-Mega-Delivery coalescence
                                                        // pause remaining (0 = coalescence live). Set by
                                                        // superMegaDelivery(), ticked+consumed at the
                                                        // coalesceGarbage(dt) call site in update().
  // CS025 P1 (spec §1.3): sec of MAGNET ATTRACTION hold remaining. Sibling of sweepPause above — both
  // are "a system is suppressed for N more seconds" timers written at exactly one site and read
  // nowhere else. This one is re-armed to DEBUG.magnetResumeDelay every frame the tow chain is FULL
  // and counts down once a slot opens; magnetPulling() is the only reader. Its ONE writer is the top
  // of update()'s pickup block — deliberately DERIVED from `game.chain.length >= game.cargoMax` per
  // frame rather than hooked at the five sites that free a slot (chain.pop() at the dock,
  // breakChain(), scatterChain(), startGame(), and nextWave()'s cargoMax GROWTH, which frees a slot
  // with no delivery and no pickup at all and is the one that would have been missed). Ticks on `dt`,
  // so it freezes with a pause like every other in-game timer. Declared in BOTH this literal and
  // resetRun() per the standing CS016 P3 rule.
  magnetHoldT: 0,
  // CS025 P2 (spec §2.3): was the tow chain full on the PREVIOUS pickup-block frame? The rising-edge
  // detector for the repulsion kick, and NOTHING else reads it. A plain stored boolean, deliberately
  // NOT inferred from magnetHoldT — see the ⛔ note at its one writer, at the top of update()'s pickup
  // block, for why the tempting inference re-fires the burst at the playtest gate. Declared in BOTH
  // this literal and resetRun() per the standing CS016 P3 rule.
  cargoWasFull: false,
  cargoMax: CARGO_BASE,                                // runtime tow cap; set from payloadSlots(game.wave) in nextWave() (CS018 P5) — this is only the pre-level-1 default
  cargoFlash: 0,                                       // CS009 P3: >0 for HUD_CAP_FLASH sec after a cap-up —
                                                        // a cap-up SHRINKS the CARGO ring's fraction (same chain,
                                                        // bigger denominator), so without this flash it reads as
                                                        // a bug instead of a promotion. Decayed in update().
  deliveryCount: 0, offloadTimer: 0,
  deliveryTicker: null,                                 // CS029 P4 (model C): the live per-visit
                                                          // accumulating floater, or null between visits.
                                                          // See releaseDeliveryTicker().
  comboGrace: 0,                                       // CS020 P1b: sec of one-effort grace left while the ship is
                                                        // OUTSIDE the dock's neighborhood. Re-armed to
                                                        // DEBUG.dockComboGrace every frame the ship is inside it;
                                                        // when it runs out, game.deliveryCount zeroes.
  score: 0, wave: 0,
  // `wave` is the ABSOLUTE player-facing level counter and the ONE difficulty clock's input — every
  // achievement, the HUD LEVEL readout, high-score records, musicStateFor and leverState() read it.
  // CS018 P4 retired its CS017 companions `cycle`/`cycleWave` outright (FORK-CS018-A).
  // CS024 P6d: true iff this run was started above level 1 via the startLevel debug knob. Set ONCE in
  // startGame() from the knob's value at that instant, never re-read mid-run (see startGame()). Gates
  // the three persistence points (HighScores entry, achievement-unlock save, lifetime-stats save) so a
  // debug jump can never record. Declared in BOTH this literal and resetRun() per the standing
  // CS016 P3 rule — a field in only one of the two reads `undefined` for a whole run.
  debugRun: false,
  // CS032 P2 (spec §2.9 / FORK-F): true iff this run was ever loaded out of a save slot. A SIBLING of
  // debugRun above, deliberately not a reuse of it — resumeFromSave() is the ONE site that sets it, it
  // sets it unconditionally on every call, and nothing re-reads or clears it until the next run starts.
  // It ORs into the same two persistence gates debugRun owns (Achievements.save() and the initials-entry
  // arm) and gets its OWN HUD tell, because printing "DEBUG RUN" at a player who merely loaded a save
  // would be wrong on its face. ⛔ STICKY FOR THE RUN'S LIFETIME — do NOT build a path that gives
  // eligibility back once the player plays past their load point: the banked score from before the load
  // is already inside game.score and cannot be separated out again (spec §4.1, §3 FORK-F). Declared in
  // BOTH this literal and resetRun() (the shared reset both run paths call) per the CS016 P3 rule.
  resumedRun: false,
  waveTime: 0,   // seconds elapsed in the current level; ticked in update(), zeroed by nextWave().
                 // CS018 P4 (FLAG-k): kept as telemetry — nextWave() logs the level just finished.
  nextRepair: REPAIR_MILESTONE,   // next score threshold that repairs the hull (F2)
  saucerTimer: 0,
  // CS024 P3: `hunterTimer` STOOD HERE — the ambient Hunter producer's rand(20, 32) countdown. Gone
  // with the producer; coalescence has no clock of its own, so there is nothing to replace it with.
  beatTimer: 0, beatHigh: false, beatInterval: 1.0,
  waveClearTimer: 0,
  lowHpSiren: false,  // v3.4 P5: edge-detection latch for AudioSys.lowhp — true iff the siren is
                      // currently playing, so update() can fire lowhp(true)/(false) exactly once
                      // per state transition instead of every frame
  // CS010 P9: Dan's OWN low-health latch — answers "has Dan already said 'hull critical' for THIS
  // episode?", a DIFFERENT question from lowHpSiren's "is the tone playing?". It must NOT be torn down
  // by openPause/quitToTitle (which reset lowHpSiren so the rising edge re-fires the SIREN on unpause);
  // otherwise Dan re-announces every single unpause. Cleared ONLY on the genuine falling edge + startGame.
  lowHpVoiced: false,
  // CS010 P9: edge-detect latch for the hull-FULL voice (hp >= max). Starts TRUE (the ship spawns full,
  // so no "brand new ship" line at wave start); flips false when hp drops below max, so a heal back to
  // full — from the Health powerup OR addScore()'s repair milestone — fires the line exactly once.
  hpFullVoice: true,
  // CS010 P9: previous powerActive() state per type, for the powerup-EXPIRED voice's falling edge.
  // Keyed through powerActive() — the standing "did an effect end?" rule (CLAUDE.md), which CS024 P6
  // makes structural rather than a discipline: the alternative it warned against (`powerFx`) no longer
  // exists, and powerActive() is now literally "budget remains", so the latch cannot miss a mode.
  // CS017 P6: `guard` is latched here like every other type so the loop stays fully generic, but
  // it deliberately has NO expire_ line to fire — see the expiry loop in update().
  powerVoiced: { rapid: false, triple: false, magnet: false, engine: false, guard: false },
  // CS010 P3: the low-health pulse PHASE ACCUMULATOR. Advanced by 2π·lowhpPulseRate(t)·dt in update()
  // while engaged; read as Math.sin(game.lowHpPhase) by BOTH the critical-hull ring pulse AND the corner
  // glow, so they lock to each other and (via the shared rate helper) to the siren — one alarm. An
  // ACCUMULATOR, not omega·clock, is mandatory: omega is HP-dependent, and omega·clock would SNAP the
  // phase (~30 rad on a 0.5 rad/s rate delta at t=60s) every time HP changes, visibly stuttering the
  // pulse. Reset to 0 on disengage + startGame; FREEZES while paused (update early-returns), which is
  // correct — openPause tears the siren down anyway, matching CS009's hudHull/cargoFlash placement.
  lowHpPhase: 0,
  // CS010 P3: >0 for LOWHP_RELIEF_FLASH sec after low-health CLEARS with the ship alive — the visual
  // relief cue (§5, FLAG-CS010-a): a geometry-only (radius+width) NON-pulsing "exhale" on the hull ring.
  // Armed on the falling edge ONLY IF !ship.dead (dying ALSO drives the low-health state false, so the
  // guard stops a cheerful pop firing at the moment of death). Decayed in update() beside cargoFlash;
  // zeroed at every direct siren teardown (pause/quit/start/death) so no stale exhale survives.
  hpReliefFlash: 0,
  // CS011 P2: the on-screen caption of Dan's current line — the voice channel's VISIBLE echo. text = the
  // line text; dur = its utterance length (from buildUtterance); life = seconds left to display, set to
  // 0.10 + dur + CAPTION_LINGER by showCaption() and decayed in update()'s playing body. drawCaption()
  // renders it while life > 0 (fading over the last CAPTION_FADE s). Overwritten wholesale per line.
  caption: { text: "", life: 0, dur: 0 },
  // CS025 P5 (gate Q6) — the level banner: the large centre-screen "Level N" shown for LEVEL_BANNER_TIME
  // seconds at every wave change. text = the same "Level N" string sayLevel() speaks; life = seconds left,
  // set by nextWave() and decayed in update()'s playing body beside caption.life. drawLevelBanner() renders
  // it while life > 0. Reassigned wholesale per level, exactly like game.caption.
  // ⛔ INDEPENDENT OF THE VOICE CHANNEL BY DESIGN. It is not a caption: it is not gated by
  // settings.captions, not gated by voiceEnabled(), and never consults VoiceSys's cooldown/priority gate.
  // Paul's gate answer set the minimum bar at "we definitely see a Level 2 on the screen", and routing the
  // visual through the audio gate would put that bar at the mercy of whatever else Dan happened to be
  // saying — the exact failure Q6 was raised about. The two announcements share a string, nothing else.
  levelBanner: { text: "", life: 0 }
};

// ---------- CS022 P1: per-archetype world size (PLANNED-FEATURES-CS022 §4.1/§4.2/§4.3) ----------
// Set the torus period and rebuild the active starfield. IT MOVES NOTHING: every entity keeps the
// world coordinates it already had. That is deliberate — it is the right call at startGame() (the
// field is empty) and the wrong one mid-run, which is exactly why resizeWorld() exists and is the
// only thing nextWave() ever calls.
function applyWorldSize(size) {
  const [w, h] = worldDims(size);
  WORLD_W = w; WORLD_H = h;
  game.worldSize = size;
  rebuildStarsActive();   // §4.3: filter the once-generated max-size sky down to this world
}

// Change the world size UNDER A LIVE FIELD (spec §4.2, FORK-CS022-D). nextWave() clears nothing, so
// garbage, Hunters, saucers, powerups, the tow chain and the ship all cross every level boundary;
// changing the torus period under them is the hard part of this changeset.
//
// THE SIX STEPS ARE ORDERED AND THE ORDER IS LOAD-BEARING. The snapshot measures with the OLD period
// and the placement lands in the NEW one, so steps 1 and 4 straddle the dimension assignment in
// step 2 and cannot be reordered around it. shortDelta/wrapPos both read the live WORLD_W/WORLD_H.
//
// Rejected alternatives, for the record: a bare wrap() re-home (a carried Hunter can materialise
// 200 px from the ship on the shrink) and clearing the field at a transition (that would retire
// CS015 P3's carried-pressure design 42 times a run).
function resizeWorld(newSize) {
  const ship = game.ship;

  // ---- 1. SNAPSHOT, with the OLD period ----------------------------------------------------------
  // Every carried body's wrap-aware offset from the ship. Bullets are deliberately NOT in this list
  // (spec §4.2 enumerates the bodies); they are short-lived, wrap() folds them on the next frame, and
  // nothing measures from them. Noted in STATUS.md rather than silently widened.
  const bodies = [game.debris, game.hunters, game.saucers, game.garbage, game.powerups,
                  game.particles, game.floaters];
  const snap = [];
  for (const arr of bodies) {
    for (const e of arr) {
      const [dx, dy] = shortDelta(ship.x, ship.y, e.x, e.y);
      snap.push({ e, dx, dy });
    }
  }
  // The chain is snapshotted HERE too, for the same old-period reason — a node that straddles the
  // seam has a raw coordinate a whole period away from the ship's, and only shortDelta knows that.
  const chainSnap = game.chain.map(n => {
    const [dx, dy] = shortDelta(ship.x, ship.y, n.x, n.y);
    return { n, dx, dy };
  });

  // ---- 2. APPLY the new dimensions ---------------------------------------------------------------
  applyWorldSize(newSize);

  // ---- 3. CENTRE THE SHIP ------------------------------------------------------------------------
  // Absolute world coordinates are imperceptible — the camera follows the ship, and the only absolute
  // reference, the starfield, was just rebuilt in step 2 — and the centre guarantees maximum clearance
  // in the new world in both directions.
  ship.x = WORLD_W / 2; ship.y = WORLD_H / 2;

  // ---- 4. RE-PLACE each body ---------------------------------------------------------------------
  // BEARING is kept exactly; MAGNITUDE is min(d, dmax). dmax is the same reachable-radius clamp v3.1
  // P1 derived for the spawn rings, for the same reason — 660 at WORLD_SIZE_FIELD, 1020 at
  // WORLD_SIZE_ORBIT. CS023 P1 (spec C7) CORRECTS WHAT THIS COMMENT USED TO CLAIM: at CS022's size-16
  // orbit world dmax was 1,380 px and the note here read "on the GROW almost nothing binds (old max
  // reach 1,468 px against 1,380)". At size 9 the orbit dmax is 1,020, so a carried body's old reach
  // (up to the field world's half-diagonal, 1,468 px) exceeds it over a materially larger band and a
  // real share of the field clamps on the GROW as well as on the shrink. An over-range body is pulled
  // ALONG ITS OWN BEARING to that radius rather than teleported by one period. FLAG-CS022-k: that
  // parks the whole over-range band in a shell at exactly dmax, and it now applies in BOTH directions
  // rather than mostly on the shrink; monotone compression of the band is the fix if it reads badly,
  // and it is a one-expression change at this site.
  const dmax = Math.min(WORLD_W, WORLD_H) / 2 - 60;
  for (const s of snap) {
    const d = Math.hypot(s.dx, s.dy);
    const k = d > dmax ? dmax / d : 1;   // d === 0 can never reach this branch (0 > dmax is false)
    const p = wrapPos({ x: ship.x + s.dx * k, y: ship.y + s.dy * k });
    s.e.x = p.x; s.e.y = p.y;
  }

  // ---- 5. TRANSLATE THE CHAIN --------------------------------------------------------------------
  // Never scaled and never clamped: a tow is RIGID relative to its tug, and the whole chain spans at
  // most CARGO_CAP_MAX * CHAIN_LINK = 480 px, comfortably inside dmax at either size — so keeping the
  // offset verbatim can never place a node outside the new world and no wrapNode() call is needed.
  // Each node's px/py shift by the IDENTICAL delta as its x/y, so the implied verlet velocity
  // (n.x - n.px, which updateChain integrates next frame) survives the move — wrapNode's own contract
  // from v3.1 P2, asserted directly rather than assumed.
  for (const c of chainSnap) {
    const ddx = (ship.x + c.dx) - c.n.x;
    const ddy = (ship.y + c.dy) - c.n.y;
    c.n.x += ddx; c.n.y += ddy;
    c.n.px += ddx; c.n.py += ddy;
  }

  // ---- 6. SYNC THE CAMERA ------------------------------------------------------------------------
  // So a draw() landing between this resize and the next update() can't show a stale view.
  game.camera.x = ship.x; game.camera.y = ship.y;
}

// ---------- Save-moment capture (CS032 P1, spec FORK-A) ----------
// The entire "capture" half of CS032. PURE: reads `game` and Profiles, returns a plain object,
// mutates nothing. No restore logic (P2's resumeFromSave()) and no game.* field additions live here.
//
// ⛔ COPY SEMANTICS ARE LOAD-BEARING. game.stats.powerUsed is a NESTED object — a bare
// `{ ...game.stats }` would leave `powerUsed` ALIASED to the live run, so a "snapshot" would
// silently keep rewriting itself as the player's run continues past the save. powerBudget is flat
// (five numeric keys), so a shallow spread is correct there.
//
// Deliberately absent (spec P1 body): game.checkpoint (does not exist), cargoMax/worldSize (both
// re-derived from `wave` by nextWave() on resume), every entity array (chain/garbage/debris/etc —
// FORK-G), powerBank/powerBankAmt (flash-display state), magnetHoldT/cargoWasFull/comboGrace/
// sweepPause/deliveryCount (all in-flight, meaningless at a wave start), and game.resumedRun (P2's
// field — capturing it would let a resumed-then-resaved run regain eligibility on the next reload).
function buildSaveEntry() {
  return {
    kind: "wave",
    saved: Date.now(),
    profileName: Profiles.nameOf(Profiles.activeId),
    wave: game.wave,
    score: game.score,
    hp: game.ship.hp,
    nextRepair: game.nextRepair,
    scoopLevel: game.scoopLevel,
    scoopHits: game.scoopHits,
    powerBudget: { ...game.powerBudget },
    stats: { ...game.stats, powerUsed: { ...game.stats.powerUsed } },
    debugRun: game.debugRun,
  };
}

// ---------- Starting a run, and resuming one (CS032 P2) ----------
// TWO ENTRY POINTS, ONE RESET LIST. Before this phase the whole reset was startGame()'s own body; the
// body is now resetRun(), verbatim, and startGame() is the thin caller that seeds it from the debug
// knob. resumeFromSave() is the SIBLING entry point, never a branch inside startGame() — it calls the
// same resetRun(), overwrites the loaded fields on top, and only then runs the wave.
//
// ⛔ THE EXTRACTION IS THE POINT (spec Risk 5). A resumed run must not be able to drift away from a
// fresh run at the same level, and the way this project has been bitten before is a second, hand-copied
// reset list that silently falls a field behind. There is exactly one list; both callers get all of it.
//
// The two parameters are the only two values the callers disagree about, and both must be in place
// BEFORE the reset body runs: `wave` because game.saucerTimer's seed reads game.wave through
// ufoAppearInterval(), and `debugRun` because it is set once per run and never recomputed.
//
// CS024 P6d: the startLevel debug knob seeds the wave counter, and the call below is its ONE read site
// — wave 0 lands nextWave() on level 1 exactly as before (startLevel's default is 1). Any value above 1
// sets the STICKY debugRun flag from the knob's value AT THIS INSTANT only; DEBUG.startLevel is never
// re-read for the rest of the run, so dragging the slider mid-run can neither re-arm recording for a
// debug run nor retroactively void a legitimate one. See the registry entry for the fidelity limit this
// knob does NOT paper over.
function startGame() {
