  // general cargo-full effect. With no Magnet running there is no gathered cloud to disperse.
  if (cargoFull && !game.cargoWasFull && powerActive("magnet")) magnetPushBurst();
  if (cargoFull) game.magnetHoldT = DEBUG.magnetResumeDelay;
  else if (game.magnetHoldT > 0) game.magnetHoldT = Math.max(0, game.magnetHoldT - dt);
  game.cargoWasFull = cargoFull;
  // Magnet (F6): while active, pull free garbage within an extended radius toward the ship (a real
  // attraction force reads better than a bigger invisible circle) AND widen the pickup radius.
  //
  // ⛔ TWO NAMES, NOT ONE, AND THE SPLIT IS LOAD-BEARING (CS025 P1, spec §1.4). `magnet` is the RAW
  // powerup predicate and is read by the two BUDGET SPEND sites below and by nothing else. `pulling` is
  // the suppressible one and is read by the attraction force and by pickR — the widened circle comes
  // back WITH the pull, not before it. Repointing either spend site at `pulling` would hand out FREE
  // HOOKS: during the resume window the pull is off but the base GARBAGE_PICKUP circle is still live, so
  // a piece drifting into it is genuinely hooked, and a spend gated on the suppressed flag would cost
  // nothing. Do not collapse these back into one name. Both are captured ONCE, above the loop, exactly
  // as the single `magnet` was: the loop itself spends magnet budget, so a per-piece re-read would let
  // the pull switch off partway through the array and make the frame's behaviour depend on array order.
  const magnet = powerActive("magnet");
  const pulling = magnetPulling();
  const pickR = pulling ? GARBAGE_PICKUP * MAGNET_PICKUP_MULT : GARBAGE_PICKUP;
  for (const g of game.garbage) {
    g.update(dt);
    if (g.dead || game.ship.dead) continue;
    if (pulling) {  // v3.4 P4: pull ALL garbage — singles AND clumps. The old pieces===1 gate is dead: v3.3's
                    // 9c made clumps directly scoopable, so pulling one is no longer "just noise".
      if (dist2(g, game.ship) < MAGNET_RANGE * MAGNET_RANGE) {
        const [dx, dy] = shortDelta(g.x, g.y, game.ship.x, game.ship.y); // vector toward the ship (wrap-aware)
        const d = Math.hypot(dx, dy) || 0.0001;
        const t = 1 - (d / MAGNET_RANGE);                                    // 1 at ship, 0 at max range
        let accel = MAGNET_PULL_MIN + (MAGNET_PULL - MAGNET_PULL_MIN) * Math.pow(t, MAGNET_FALLOFF_POW); // v3.6 P2a: falloff exponent hoisted to a constant (was hardcoded t*t)
        accel /= Math.sqrt(g.mass);     // FORK-6: sqrt, not linear mass. The 0.5 exponent is a PLAYTEST KNOB.
                                        // A mass-1 single is UNAFFECTED (sqrt(1)=1); a mass-11 clump pulls at ~30%.
        const damp = Math.pow(MAGNET_DAMP, dt);   // light in-range damping so the pull glides (not jitters)
        g.vx = g.vx * damp + (dx / d) * accel * dt;
        g.vy = g.vy * damp + (dy / d) * accel * dt;
      }
    }
    // Capture region = the base GARBAGE_PICKUP circle OR the Scoop mouth (v3.3 P3). MAGNET_PICKUP_MULT
    // multiplies the CIRCLE only, and the box is independent, so there's no double-counting; at
    // scoopLevel 0 inScoopBox is always false, so this is byte-identical to the pre-scoop pickup.
    if (game.chain.length < game.cargoMax &&
        (dist2(g, game.ship) < pickR * pickR || inScoopBox(g))) {
      // CS024 P3 (spec §1.2/§4.2): CS017 P5's ONE-SHOT BONUS PAYOUT STOOD HERE — an
      // `if (g.bonus) { g.bonus = false; addScore(BONUS_CANISTER_SCORE); ...float... }` above the
      // single/clump branch, whose flag-clear was what made "paid once per clump" true across a partial
      // scoop. Removed with the canister; the capture gate below is otherwise untouched.
      // CS020: a node is TOWED if it was hooked OUTSIDE the dock's neighborhood, and an INCIDENTAL if
      // it was hooked inside it. Computed HERE — once, at the moment of capture, above the single/clump
      // branch so ONE expression covers both push paths (the same placement idiom as the bonus-canister
      // award directly above). Tagging at capture rather than counting pops at the dock is load-bearing:
      // the chain is LIFO and both push sites append to the tail the offload pops from, so a piece
      // hooked while parked JUMPS THE QUEUE and is delivered first — any count-based scheme would spend
      // the escalation on the in-ring pickups and demote the genuinely towed load. See GDD 2.10.
      const pad = game.dock ? game.dock.radius + DOCK_NEIGHBORHOOD_PAD : 0;
      const inRing = !!game.dock && dist2(game.ship, game.dock) < pad * pad;
      // CS020 P1b: gathering again starts a NEW effort. An INCIDENTAL never does this —
      // it is neutral to the counter in both directions (FORK-CS020-B).
      // THE `!inRing` GUARD IS LOAD-BEARING: resetting on EVERY hook would mean a magnet grab at the
      // dock kills a player's own run mid-offload — the exact unfairness this phase exists to remove.
      // This is also what BOUNDS the counter, and the bound is structural rather than policed:
      // between any two resets only nodes already in the chain can be counted, and the pickup gate
      // above bounds the chain at game.cargoMax, therefore deliveryCount <= cargoMax. That is what
      // makes Maxed Out (=== CARGO_CAP_MAX) a level-12+ achievement BY CONSTRUCTION, and what kills
      // the farmable annulus a grace window alone would open (hover just outside the ring with a
      // 380px magnet, fill, dip in, offload, repeat — every hook out there now resets).
      // CS029 P4: a fresh haul starting mid-offload (chain left the dock non-empty, then hooked
      // something new outside the ring) ends the OLD visit — release its ticker, if any, same as the
      // reset above. A no-op the common way this fires: deliveryCount is already 0 while a chain is
      // still being gathered, so releaseDeliveryTicker() finds nothing to release.
      if (!inRing) { game.deliveryCount = 0; releaseDeliveryTicker(); }
      if (g.pieces === 1) {
        // A single hooks onto the chain as one node (unchanged behavior).
        g.dead = true;
        game.chain.push({
          x: g.x, y: g.y, px: g.x, py: g.y,
          spin: g.spin, spinRate: g.spinRate, mass: g.mass,  // carry towing weight onto the node (F5)
          towed: !inRing                                     // CS020: earns the delivery combo (see above)
        });
        AudioSys.pickup();
        // Count-based Magnet expiry (B-5): spend one budget per canister HOOKED — counted at the hook,
        // not the pull, so a magnet that draws-then-hooks a piece only spends once (FLAG B-5-a).
        // CS024 P6: the `settings.magnetMode === "pieces"` gate is gone; this is the only rule now.
        // CS025 P1: `magnet`, NOT `pulling` — a hook inside the base circle during the full-cargo
        // resume window is a real hook and bills like one. See the split above.
        if (magnet && game.powerBudget.magnet > 0) game.powerBudget.magnet--;
      } else {
        // v3.3 P4 (9c, reverses v3.2 P1's "a clump is un-hookable", FORK-6: UNCONDITIONAL, no scoopLevel
        // gate): scoop as many of the clump's pieces as fit the chain, each becoming its own node at the
        // clump's per-piece mass. Scooping is LOSSY but instant — a chain-full scoop of a big clump throws
        // the overflow away (that's the cost that keeps the lossless shatter tool alive). The Magnet still
        // ignores clumps (its pieces===1 gate above) — the scoop is the clump tool now.
        const room = game.cargoMax - game.chain.length;  // > 0 (checked in the gate)
        const take = Math.min(room, g.pieces);
        const pMass = g.mass / g.pieces;
        for (let k = 0; k < take; k++) {
          game.chain.push({
            x: g.x, y: g.y, px: g.x, py: g.y,
            spin: g.spin, spinRate: g.spinRate, mass: pMass,
            towed: !inRing         // CS020: one scoop is one capture — every `take` node gets the
                                   // SAME tag, from the expression computed once above the branch
          });
        }
        AudioSys.pickup();
        // FLAG-7b (v3.4 P4): a clump scoop under an active Magnet spends `take` budget — else a
        // 6-piece clump would be free where 6 singles cost 6. Clamped at 0. (Singles spend 1 in the
        // branch above.) CS024 P6: same mode-gate removal as the single-hook site. CS025 P1: `magnet`,
        // NOT `pulling` — the same free-hook reasoning as the single-hook site, per `take`.
        if (magnet) game.powerBudget.magnet = Math.max(0, game.powerBudget.magnet - take);
        if (take === g.pieces) {
          g.dead = true;  // whole clump fit — total mass conserved onto the chain
        } else {
          // Leftover floats off: re-derive its size/mass, re-arm the coalesce delay, and kick it
          // directly away from the ship so "the rest of the ball floats away".
          g.pieces -= take;
          g.mass  -= take * pMass;
          g.radius = 7 * Math.sqrt(g.pieces);
          g.coalesceDelay = liveLevers(game.wave).coalescePause; // CS024 P5: coalescePause lever
          const [ax, ay] = shortDelta(game.ship.x, game.ship.y, g.x, g.y); // ship -> leftover (wrap-aware)
          const d = Math.hypot(ax, ay) || 0.0001;
          g.vx += (ax / d) * SCOOP_SPILL_KICK;
          g.vy += (ay / d) * SCOOP_SPILL_KICK;
        }
      }
      // CS010 P9: "Truck is full, let's go." fires on the pickup where the chain BECOMES full — after the
      // single/clump branches so BOTH paths trip it, and inside the capture branch so only a real hook
      // counts. cargoMax is the RUNTIME cap (grows 12→24), so "full" is a moving target; the pickup gate
      // above blocks further hooks once full, so this trips exactly once and re-arms after a delivery.
      if (game.chain.length === game.cargoMax) VoiceSys.say("cargo_full");
    }
  }
  // CS018 P9: a Super Mega Delivery pauses coalescence for DEBUG.sweepCoalescePause sec — without
  // this, N larges splitting at once frees the WHOLE large-Hunter ceiling and fresh larges convert
  // while the player is still in the fragment swarm. The pause holds the ENTIRE pass — conversion,
  // merging AND the attraction that feeds them: pausing only the merge/convert branches while
  // attraction kept pulling would just pile pieces up inside merge range for a mass conversion the
  // frame the pause expires, recreating exactly what the pause exists to prevent. CS024 P3: the old
  // note here — "decay clocks are NOT frozen, so pieces still age out mid-pause" — is retired with
  // decay. Garbage.update() still runs regardless (it ticks `age`), and the density cull still runs
  // in the cleanup block, so a pause suspends coalescence ONLY, never the ceiling.
  if (game.sweepPause > 0) game.sweepPause -= dt;
  else coalesceGarbage(dt); // v3.1 P3: neglected scrap clumps; a 12-piece clump becomes a Hunter
  updateChain(dt);

  // --- Powerups: field pickups + active-effect countdown (F6) ---
  for (const p of game.powerups) {
    p.update(dt);
    if (!p.dead && !game.ship.dead) {
      const r = p.radius + SHIP_RADIUS;
      // CS015 P3 (item 8): scoop mouth also captures powerups — scoop only, no magnet multiplier.
      if (dist2(p, game.ship) < r * r || inScoopBox(p)) { p.dead = true; applyPowerup(p.type); }
    }
  }
  // CS024 P6: the per-frame powerFx countdown STOOD HERE — the last piece of timed expiry, and the
  // reason this block existed at all. Nothing takes its slot: every budget is spent at the EVENT that
  // consumes it (a trigger pull, a hooked canister, an absorbed break, a thrusting frame), never on a
  // clock, so update() has no powerup timer left to tick.
  // CS010 P9: powerup-EXPIRED voice — the falling edge of powerActive(t) per type. Routed through
  // powerActive() (never a raw field) per the standing CLAUDE.md rule. Runs after this frame's budget
  // spends — Ship.update()'s pulls and thrust burn, the pickup pass's hooks — so powerActive() is current.
  // CS017 P6: "guard" joined POWERUP_DROP_TYPES, so it is latched here like every other type — but it has
  // NO expire_ line (its only voice event is the P7 chain_guard intercept), so the say() is skipped for it
  // and the string "expire_guard" is never built. The latch still tracks, so adding a line later stays a
  // one-line data edit plus deleting the `t !== "guard"` clause.
  for (const t of POWERUP_DROP_TYPES) {
    const active = powerActive(t);
    if (!active && game.powerVoiced[t] && t !== "guard") VoiceSys.say("expire_" + t);
    game.powerVoiced[t] = active;
  }
  for (const k in game.powerBank) {
    if (game.powerBank[k] > 0) game.powerBank[k] = Math.max(0, game.powerBank[k] - dt);
  }

  // --- Recycling dock offload ---
  if (game.dock) {
    // CS020 P1b / FORK-CS020-E: one effort = one chain delivered in one go. It survives LEAVING the
    // dock — a skirt-and-return is still one effort — for DEBUG.dockComboGrace seconds. It does NOT
    // survive gathering again; that reset lives at the pickup gate, and it is the reset that BOUNDS
    // the counter (this timer must never be the safety mechanism — see DOCK_COMBO_GRACE).
    // HOISTED to the top of the dock block deliberately: it has to evaluate every frame, independent
    // of the offload branch, or it would not run while the ship is actively delivering. Re-arming
    // happens at the RING (dock.radius + DOCK_NEIGHBORHOOD_PAD), not the +10 offload radius — once
    // back inside the neighborhood the run is safe indefinitely and the player can take their time
    // closing the last 30px. Loitering there is harmless: pickups in here are incidentals, so nothing
    // advances. Ship-dead is excluded from the DECAY arm so a corpse's run can never be timed out
    // mid-death (scatterChain has already zeroed the counter anyway, which is why the dead ship
    // falling into the re-arm branch is a harmless no-op rather than a second rule).
    // Replaces the old distance-based reset that lived in the offload
    // block's else branch, which destroyed a run the instant the ship crossed the ring.
    const npad = game.dock.radius + DOCK_NEIGHBORHOOD_PAD;
    if (!game.ship.dead && dist2(game.ship, game.dock) > npad * npad) {
      game.comboGrace -= dt;
      // CS029 P4: the grace window running out ends the visit, same as every other deliveryCount=0
      // site — release any pinned ticker rather than leave it stranded at the dock.
      if (game.comboGrace <= 0) { game.deliveryCount = 0; releaseDeliveryTicker(); }
    } else {
      game.comboGrace = DEBUG.dockComboGrace;   // inside the ring: the run is safe, window re-armed
    }
    const nearDock = !game.ship.dead &&
      dist2(game.ship, game.dock) < (game.dock.radius + 10) * (game.dock.radius + 10);
    if (nearDock && game.chain.length > 0) {
      game.offloadTimer -= dt;
      if (game.offloadTimer <= 0) {
        const node = game.chain.pop(); // canisters peel off from the tail
        // CS020: TOWED (hooked outside the dock neighborhood, the work of an actual haul) vs INCIDENTAL
        // (hooked while already parked in it). `!== false` is load-bearing, not style: a node with no
        // `towed` field at all — which is every chain node any older test seeds by hand — defaults to
        // TOWED, so absence never silently demotes a delivery. Only an explicit false demotes.
        const towed = node.towed !== false;   // absent => towed
        // CS029 P4 (§6.1): the ONE shared origin expression for both delivery branches below — the
        // dock is static for the whole visit (Dock.update() only advances `spin`), which is the fixed
        // point the gate asked for. Computed once here so the two branches can't drift apart.
        const deliveryAnchorX = game.dock.x, deliveryAnchorY = game.dock.y - DOCK_RADIUS * DELIVERY_FLOAT_ANCHOR_FRAC;
        if (towed) {
          game.deliveryCount++;
          const pts = DOCK_BASE_SCORE + DOCK_BONUS_STEP * (game.deliveryCount - 1);
          addScore(pts);
          // Achievement stats (F9): per-game delivered count (Scrap Runner) + best combo this visit
          // (Combo Collector); a first-canister-within-60s flag (Speed Recycler); a full 12-in-one-visit
          // milestone (Heavy Hauler weekly + The Long Haul lifetime); and lifetime delivered/score.
          game.stats.delivered++;
          game.stats.bestCombo = Math.max(game.stats.bestCombo, game.deliveryCount);
          // CS018 P8 (PLANNED-FEATURES-CS018.md §4.3, replaces the v3.6 P3 single ===10 emitter):
          // four independent "passes through N exactly once per visit" latches — same idiom as the
          // deliveryCount===12 Heavy Hauler / ===CARGO_CAP_MAX Maxed Out latches below — each awarding
          // ONE powerup. Cumulatively: 1 for 8-11, 2 for 12-15, 3 for 16-19, 4 for 20-23 delivered.
          // Each launches from the dock's own position on a fresh random vector, exactly as the old
          // ===10 emitter did. The "SALVAGE BONUS" floater fires only on the first award (8) so the
          // dock doesn't repeat identical text four times in one visit.
          if (game.deliveryCount === 8 || game.deliveryCount === 12 ||
              game.deliveryCount === 16 || game.deliveryCount === 20) {
            const a = rand(0, TAU);
            dropPowerup(game.dock.x, game.dock.y, Math.cos(a) * DOCK_POWERUP_SPEED, Math.sin(a) * DOCK_POWERUP_SPEED);
            if (game.deliveryCount === 8) {
              game.floaters.push(new FloatText("SALVAGE BONUS", game.dock.x, game.dock.y - 22, COLOR.dock));
            }
          }
          // Salvage King (lifetime MAX): best canisters delivered in one game. game.stats.delivered only
          // climbs within a run, so Math.max here tracks the per-game best and keeps the all-time record.
          Achievements.lifetime.bestDeliveredGame = Math.max(Achievements.lifetime.bestDeliveredGame, game.stats.delivered);
          game.stats.pacifistStreak++;
          game.stats.pacifistBest = Math.max(game.stats.pacifistBest, game.stats.pacifistStreak);
          // Zen Master (lifetime, per-EVENT): each haul whose no-fire delivery streak REACHES 5 counts once.
          // pacifistStreak passes through 5 exactly once per haul (firing resets it to 0), so === 5 latches
          // once; a longer haul (6,7,…) doesn't re-fire, and a fresh 5-streak after firing is a new event.
          if (game.stats.pacifistStreak === 5) Achievements.lifetime.pacifistTowEvents++;
          if (game.stats.delivered === 1 && game.stats.gameTime <= 60) game.stats.speedRecycler = true;
          // Heavy Hauler (weekly) + The Long Haul (lifetime fullChains) + Freight Baron (lifetime, per-EVENT):
          // a FIXED >=12-in-one-visit milestone, deliberately decoupled from the growing game.cargoMax
          // (FLAG A-5-a / B-8-b) — deliveryCount passes through 12 exactly once per qualifying visit, so all
          // three latch once per visit.
          if (game.deliveryCount === 12) { game.stats.fullChainVisit = true; Achievements.lifetime.fullChains++; Achievements.lifetime.heavyHaulerEvents++; }
          // Maxed Out (lifetime, CS012 P3): deliveryCount passes through CARGO_CAP_MAX exactly once per
          // qualifying visit (same "passes through" latch idiom as the ===12 check above). Celebration
          // (floater + gold ring pulse) fires at this same instant — no voice line (deferred, FORK-CS012-B b).
          if (game.deliveryCount === CARGO_CAP_MAX) {
            game.stats.maxChainVisit = true;
            game.floaters.push(new FloatText("MAX HAUL", game.dock.x, game.dock.y - 22, COLOR.ach, 24));
            game.cargoFlash = HUD_CAP_FLASH;
          }
          // CS018 P9: a full-cap 24-piece visit ALSO triggers the SUPER MEGA DELIVERY — guaranteed
          // six-type set + the snapshot hunter sweep + the coalescence pause (see superMegaDelivery()).
          // Same "passes through CARGO_CAP_MAX exactly once per visit" latch as Maxed Out above, kept
          // as its OWN block: Maxed Out is an achievement latch, this is a game event — and P10 hooks
          // the dock_24 voice line HERE, not into VoiceSys.dockDelivery's tier chain. SILENT this phase.
          if (game.deliveryCount === CARGO_CAP_MAX) superMegaDelivery();
          Achievements.lifetime.delivered++;
          Achievements.lifetime.deliveryScore += pts;
          // CS026 P4 (spec §3.3a/§3.4): rise/life read from the DELIVERY registry knobs. CS029 P4
          // (model C, gate G1/§6.3): the towed branch no longer spawns a new floater per canister — one
          // ticker lives for the whole visit, pinned at the dock anchor, its text rewritten to the
          // running visit total as each canister lands. It is released (unpinned, becomes an ordinary
          // rising/fading floater) at the visit's last canister, below. The running total is carried on
          // the ticker itself — there is nowhere else that needs it.
          if (!game.deliveryTicker) {
            game.deliveryTicker = new FloatText("+" + pts, deliveryAnchorX, deliveryAnchorY,
              COLOR.dock, 16, DEBUG.deliveryFloatRise, DEBUG.deliveryFloatLife);
            game.deliveryTicker.pinned = true;
            game.deliveryTicker.total = pts;
            game.floaters.push(game.deliveryTicker);
          } else {
            game.deliveryTicker.total += pts;
            game.deliveryTicker.text = "+" + game.deliveryTicker.total;
          }
          AudioSys.deliver(game.deliveryCount);
          // CS010 P9 (FORK-5 = b): Dan sizes up the haul on the pop that EMPTIES the chain — the offload
          // block only runs while chain.length > 0, so the emptying pop happens exactly once (THE GATE IS
          // THE LATCH, no flag needed) and deliveryCount is intact at this instant. 1–4 pieces says nothing.
          // breakChain()/scatterChain() also zero deliveryCount but never reach here, so they stay silent.
          if (game.chain.length === 0) {
            VoiceSys.dockDelivery(game.deliveryCount);
            releaseDeliveryTicker(); // §6.3: released as an ordinary floater at the last canister
          }
        } else {
          // CS020: an incidental. It recycles and it PAYS — a canister is a canister — but it is not part
          // of the haul, so it earns no combo and touches nothing else: not game.deliveryCount, not the
          // delivery stats, not the lifetime counters, and therefore none of the deliveryCount-keyed
          // latches downstream (the 8/12/16/20 reward tiers, Heavy Hauler, Maxed Out, the Super Mega
          // Delivery). Fixing it AT THE COUNTER is what keeps those correct without a second guard.
          // AudioSys.deliver(1) deliberately, not the combo pitch: audible, but flat.
          // CS026 P4 (spec §3.5/FORK-CS026-G): QUIETED, not folded in — same text, but COLOR.dim + size
          // 12 so it never reads as, or shares a tally with, the towed branch's floater. Same rise/life
          // knobs so a Magnet-parked run of incidentals separates too, not just towed hauls.
          // CS026 P6 (gate Q5) / CS029 P4 (§6.1): born at the dock anchor, like the towed branch — ONE
          // shared origin for both, so a Magnet-fed run of incidentals reads in the same place as a real
          // haul. §6.3: this branch stays an ORDINARY floater and must never be folded into the model-C
          // ticker — CS020 separated the two on purpose so an incidental never shares a tally with a
          // towed canister. The quieting is untouched: it was never the position that distinguished
          // them, it is the colour and size.
          addScore(DOCK_BASE_SCORE);
          game.floaters.push(new FloatText("+" + DOCK_BASE_SCORE, deliveryAnchorX, deliveryAnchorY,
            COLOR.dim, 12, DEBUG.deliveryFloatRise, DEBUG.deliveryFloatLife));
          AudioSys.deliver(1);
        }
        game.offloadTimer = DOCK_OFFLOAD_INTERVAL;
      }
    } else {
      game.offloadTimer = 0;
    }
  }

  // --- Spawning ---
  game.saucerTimer -= dt;
  if (game.saucerTimer <= 0 && game.saucers.length === 0) {
    // CS024 P5 (spec §2.4/§4.6): was ramp(SAUCER_SMALL_CHANCE_FLOOR, SAUCER_SMALL_CHANCE_CEIL, game.wave)
    // — the 15% -> 60% wave ramp, and ramp()'s last lever anywhere. Now a FLAT Math.random() <
    // DEBUG.smallUfoChance (def 0.20), constant for the whole game and deliberately NOT a lever — it is
    // a plain debug knob, not part of the odometer, so it reads DEBUG directly with no leverState
    // fallback. There is still exactly ONE appearance timer — this roll only picks the size of the
    // saucer that timer just fired.
    const small = Math.random() < DEBUG.smallUfoChance;
    game.saucers.push(new Saucer(small));
    AudioSys.saucer(true, small);
    // CS018 P6: appearance frequency, by TIER — INVERTED (§3.1), jittered around the tier centre.
    // Replaces the old wave-ramp + time-in-level-pressure derivation; the pressure axis's
    // DEBUG.saucerGapPressure knob retired with this site; the old SAUCER_GAP_* constants it fed
    // were deleted in CS024 P2 (dead-constant sweep).
    game.saucerTimer = ufoAppearInterval();
  }

  // CS024 P3 (spec §1.3/§4.3): THE AMBIENT HUNTER PRODUCER STOOD HERE — a `game.hunterTimer` countdown
  // that pushed HunterSatellite.spawnCore() every rand(20, 32) sec, gated on the level-table cap and on
  // `game.wave >= 2`. The whole block is deleted, gate included, and nothing takes its slot. HUNTERS NOW
  // ARISE FROM EXACTLY ONE SOURCE: garbage coalescing to HUNTER_COALESCE_COUNT pieces, in
  // coalesceGarbage(). Gate A question 1 exists to check that they still arise AT ALL in practice — if
  // the answer is "never," the coalescence numbers need the retune P4 does not currently carry.
  // Ambient Health powerup (F6): drifts into the field on a saucer-like cadence, at most one at a
  // time (its own decay bounds coexistence — like the one-saucer-at-a-time gate).
  game.healthTimer -= dt;
  if (game.healthTimer <= 0) {
    if (!game.powerups.some(p => p.type === "health")) spawnHealthPowerup();
    game.healthTimer = rand(POWERUP_HEALTH_GAP[0], POWERUP_HEALTH_GAP[1]);
  }

  // --- Collisions: player bullets vs targets ---
  for (const b of game.bullets) {
    if (b.dead) continue;
    if (!b.hostile) {
      for (const a of game.debris) {
        if (!a.dead && dist2(b, a) < a.radius * a.radius) {
          b.dead = true; destroyDebris(a); break;
        }
      }
      if (b.dead) continue;
      for (const s of game.saucers) {
        if (!s.dead && dist2(b, s) < s.radius * s.radius) {
          b.dead = true; destroySaucer(s);
          break;
        }
      }
      if (b.dead) continue;
      for (const h of game.hunters) {
        if (!h.dead && dist2(b, h) < (h.radius + 3) * (h.radius + 3)) {
          b.dead = true;
          destroyHunter(h);   // score + boom + garbage + 3-way split, all tiers
          break;
        }
      }
      if (b.dead) continue;
      // v3.2 P2: a clump (pieces>1) is a bullet target — singles are debris, not targets, and
      // still pass straight through (pieces===1 is excluded here on purpose).
      for (const g of game.garbage) {
        if (!g.dead && g.pieces > 1 && dist2(b, g) < g.radius * g.radius) {
          b.dead = true; shatterClump(g); break;
        }
      }
    } else {
      // hostile bullet vs player
      if (!game.ship.dead && game.ship.invuln <= 0) {
        const r = game.ship.shieldOn ? SHIELD_RADIUS : SHIP_RADIUS;
        if (dist2(b, game.ship) < r * r) {
          b.dead = true;
          if (game.ship.shieldOn) {
            game.ship.energy = Math.max(0, game.ship.energy - SHIELD_HIT_COST);
            game.stats.deflects++; // Shield Surfer (F9): a hostile bullet blocked by the shield
            AudioSys.shieldPing();
          } else damageShip(DMG_BULLET, b.x, b.y);
        }
      }
      // hostile bullet vs tow chain
      if (!b.dead && game.chain.length) {
        for (let i = 0; i < game.chain.length; i++) {
          if (dist2(b, game.chain[i]) < 9 * 9) {
            b.dead = true; breakChain(i, b); break;   // CS019 P1: src passed for symmetry; a dead bullet never re-presents
          }
        }
      }
    }
  }

  // --- Collisions: hazards vs ship ---
  if (!game.ship.dead && game.ship.invuln <= 0) {
    const hazards = [...game.debris, ...game.hunters];
    for (const h of hazards) {
      if (h.dead) continue;
      const r = (game.ship.shieldOn ? SHIELD_RADIUS : SHIP_RADIUS) + h.radius;
      if (dist2(h, game.ship) < r * r) {
        if (game.ship.shieldOn) {
          // Homing Hunters (medium/small, the old fragile "wedges") die on shield contact
          // and still split; debris and the large Hunter core bounce off elastically.
          if (h instanceof HunterSatellite && h.size < 3) {
            game.ship.energy = Math.max(0, game.ship.energy - SHIELD_HIT_COST);
            game.stats.deflects++; // Shield Surfer (F9): a homing Hunter killed on the shield
            AudioSys.shieldPing();
            destroyHunter(h);
          } else {
            // CS024 P1 (spec §4.1, consequence 2): CS021 P1b's `else if (h.orbitCenter) shieldBounce(h);`
            // arm STOOD HERE, between these two. It existed because a hazard ON A RAIL could not be
            // pushed — its position was re-derived from its orbit angle every frame, so shieldDeflect's
            // shove was undone before it separated, and the SHIP was bounced instead. It gated on exactly
            // the field the motion mode did, so with no body able to carry orbit state it is unreachable
            // and is removed. Every shielded contact that is not a homing Hunter now takes shieldDeflect,
            // which is what every free-moving hazard already took.
            //   THIS IS THE SHIELDED ARM AND IT IS IN SCOPE. The UNSHIELDED arm below — CS023 P3's mutual
            // collision damage — is NOT this phase's business and is byte-unchanged; test-cs024-p1.js §F
            // pins it, and destroySaucer, against HEAD.
            //   shieldBounce() itself is deliberately LEFT IN PLACE, now with no live caller. Deleting it
            // is a dead-code removal, which is CS024 P2's scope, not P1's — flagged in STATUS.md so P2
            // picks it up rather than it rotting quietly. See STATUS.md, Known issues.
            shieldDeflect(h);
          }
        } else {
          const applied = damageShip(h.damage, h.x, h.y);
          // Close Shave (F9): survived a Hunter collision with under 10 HP left (still alive).
          if (applied && h instanceof HunterSatellite && !game.ship.dead && game.ship.hp < 10)
            game.stats.closeShave = true;
          // CS023 P3 (§1.1/§4.3, FORK-CS023-E): the contact is mutual — the hazard dies too. `false` =
          // no score, no achievement counters (the existing awardScore contract — C13 — so garbage/
          // splits/powerups still drop). NOT gated on `applied` (FLAG-CS023-k): an auto-shield save
          // returns false but the collision still physically happened. damageShip runs FIRST because it
          // reads h.x/h.y for the knockback vector. The i-frame (this whole block's `invuln <= 0` gate)
          // is the rate limiter, capping this to once per HIT_STUN_DURATION.
          if (h instanceof HunterSatellite) destroyHunter(h, false); else destroyDebris(h, false);
        }
      }
    }
    // saucer body contact
    for (const s of game.saucers) {
      if (s.dead) continue;
      const r = (game.ship.shieldOn ? SHIELD_RADIUS : SHIP_RADIUS) + s.radius;
      if (dist2(s, game.ship) < r * r) {
        if (game.ship.shieldOn) {
          game.stats.deflects++;                            // Shield Surfer (F9): saucer rammed into the shield
          destroySaucer(s);
        } else {
          damageShip(s.damage, s.x, s.y);
          // CS023 P3: mutual damage, same rule as the hazards above — no score, drops unchanged.
          destroySaucer(s, false);
        }
      }
    }
  }

  // --- Hazards vs tow chain: a hit destroys that canister and cuts loose
  //     everything behind it (falls back to free garbage) ---
  if (game.chain.length) {
    const chainHazards = [...game.debris, ...game.hunters];
    chainScan:
    for (let i = 0; i < game.chain.length; i++) {
      const n = game.chain[i];
      for (const h of chainHazards) {
        if (h.dead) continue;
        // CS019 P1: a body whose break was just absorbed keeps overlapping (nothing was severed), so it
        // would otherwise bill the identical contact every frame. Skip it while its stamp holds.
        //   The skip lives HERE, not at the choke point, because this scan `break chainScan`s on the
        // FIRST overlapping pair it finds: a stamped hazard sitting on node 0 would consume the scan's
        // one slot every frame and hide a different, UNSTAMPED hazard genuinely hitting node 5 for the
        // whole cooldown window. Skipping in the inner loop lets the scan keep looking.
        //   The powerActive("guard") clause is NOT redundant. If the guard ends mid-contact — the clock
        // runs out, or the budget is spent on another hazard — a stamped body must cut the chain on the
        // very next frame. Without it, a stale stamp would grant free passage through an UNPROTECTED tow.
        if (h.guardT > 0 && powerActive("guard")) continue;
        const r = h.radius + 7;
        if (dist2(n, h) < r * r) { breakChain(i, h); break chainScan; }
      }
    }
  }

  // Saucer bullets can shatter debris satellites too (classic behavior)
  for (const b of game.bullets) {
    if (b.dead || !b.hostile) continue;
    for (const a of game.debris) {
      if (!a.dead && dist2(b, a) < a.radius * a.radius) {
        b.dead = true; destroyDebris(a, false); break;
      }
    }
  }

  // --- Collisions: debris vs debris (CS023 P2, spec §1.2/§4.5) ---
  // Satellites stop passing through each other. Deliberately the SAME pair-walk idiom as
  // coalesceGarbage's — i over the array, j from i + 1 — so every unordered pair is visited exactly once
  // and the frame-budget instrument already knows how to count it. This is the build's SECOND O(n^2)
  // pass, and it is affordable only because CS023 P1 cut the shell ~5x (FLAG-CS023-g).
  //   It iterates the LIVE array rather than a spread copy, unlike the hazards-vs-ship and
  // hazards-vs-chain scans above: nothing here creates or destroys an entity, so there is no
  // children-pushed-mid-iteration hazard for a copy to protect against, and a copy would only cost a
  // per-frame allocation.
  //   PLACEMENT IS LOAD-BEARING IN BOTH DIRECTIONS. It runs AFTER every debris has had its update(dt),
  // so a rail-borne body is tested at THIS frame's derived position rather than last frame's, and after
  // every pass that can mark a body dead; and it runs BEFORE the end-of-frame dead-filter, so `dead` is
  // checked explicitly on both sides.
  //   GARBAGE CANISTERS DO NOT BOUNCE. coalesceGarbage and the whole Garbage system are a different
  // mechanic and are untouched (spec §7) — canisters coalesce, which is their own thing.
  for (let i = 0; i < game.debris.length; i++) {
    const a = game.debris[i];
    if (a.dead) continue;
    for (let j = i + 1; j < game.debris.length; j++) {
      const b = game.debris[j];
      if (b.dead) continue;
      const r = a.radius + b.radius;
      if (dist2(a, b) < r * r) debrisBounce(a, b);
    }
  }

  // --- Collisions: UFO vs debris (CS023 P3, spec §1.1/§4.6) ---
  // A saucer that flies into a satellite destroys the saucer, no score (C13/FORK-CS023-E) — and the
  // satellite bounces off it, disarmed, if it was free; a rail-borne satellite is untouched, exactly the
  // same asymmetry the pass above already gives two satellites. destroySaucer(s, false) runs FIRST — the
  // saucer being dead by then does not matter, debrisBounce only reads its x/y/vx/vy this frame — then
  // debrisBounce(a, s) treats the saucer as a FIXED body (see the comment at debrisBounce's own dispatch):
  // it has no size/mass, and per Paul's resolution it acts as an immovable wall the satellite bounces off,
  // not as a participant in a mass-weighted exchange. `break` out of the inner loop: one saucer dies once.
  for (const s of game.saucers) {
    if (s.dead) continue;
    for (const a of game.debris) {
      if (a.dead) continue;
      const r = s.radius + a.radius;
      if (dist2(s, a) < r * r) { destroySaucer(s, false); debrisBounce(a, s); break; }
    }
  }

  // --- Cleanup ---
  // CS024 P3: the density ceiling runs FIRST in this block and nowhere else. It must be after every
  // pass above that can mark a piece dead (so it counts what is genuinely still in the world) and
  // before the garbage filter below (so its victims are swept by the same one filter as every other
  // death, and none survives a frame to be drawn). Deliberately NOT mirrored into updateDeath()'s
  // filter pass: that sim runs no coalescence — so it pays no O(n²) cost — and the run is over inside
  // DEATH_DURATION, so culling there would only delete salvage during the death spectacle.
  //
  // CS024 P6f: the held-clump queue drains FIRST, and the order is load-bearing in both directions. It
  // must run AFTER every pass that can mark a Hunter dead (a large destroyed this frame frees its slot
  // immediately — largeHunterCount() excludes dead-but-unfiltered hunters, which is exactly what makes
  // that work before the filter below), and BEFORE the cull, so a clump that is converting this frame is
  // already dead and is not counted as live density on its way out. Both passes obey the same
  // entity-lifecycle contract as everything else: mark dead, let the one end-of-frame filter sweep it.
  // Deliberately NOT mirrored into updateDeath() for the same reason the cull isn't.
  drainHeldClumps();
  cullGarbage();
  const hadSaucer = game.saucers.length > 0;
  game.debris = game.debris.filter(a => !a.dead);
  game.bullets = game.bullets.filter(b => !b.dead);
  game.saucers = game.saucers.filter(s => !s.dead);
  game.hunters = game.hunters.filter(h => !h.dead);
  game.particles = game.particles.filter(p => !p.dead);
  game.garbage = game.garbage.filter(g => !g.dead);
  game.floaters = game.floaters.filter(f => !f.dead);
  game.powerups = game.powerups.filter(p => !p.dead);
  if (hadSaucer && game.saucers.length === 0) AudioSys.saucer(false);

  // --- Wave clear --- CS015 P3: clears on debris-empty alone; Hunters and loose garbage
  // carry over by design (not wiped by nextWave()) and can accumulate if neglected.
  if (game.debris.length === 0) {
    game.waveClearTimer += dt;
    if (game.waveClearTimer > 2.5) {
      game.waveClearTimer = 0;
      // Achievements (F9): a wave completed with zero damage taken -> Perfect Wave (lifetime, 10×)
      // and, if it was wave 3, No Scratches (weekly). game.wave is still the completed wave here
      // (nextWave increments it), so read it before advancing.
      if (game.stats.dmgThisWave === 0) {
        Achievements.lifetime.perfectWaves++;
        if (game.wave === 3) game.stats.noScratchWave3 = true;
        // Flawless Run (weekly, P8 / FLAG A-6-b): a damage-free clear of wave 8 or later — a real feat
        // once the Hunter family + saucers + Debris density are all mid-ramp. game.wave is still the
        // completed wave here (nextWave increments it below).
        if (game.wave >= 8) game.stats.flawlessLateWave = true;
      }
      // CS030 P5 (§4.4, FORK-CS030-A = both): the celebration panel at LEVEL END. Everything banked
      // since the last flush is shown BEFORE the next wave starts, so nextWave() — and with it
      // game.levelBanner AND VoiceSys.sayLevel(), which both fire from inside it — is DEFERRED to
      // dismissCelebration(). "Level 8" announces after the celebration, never underneath it.
      // ⛔ THE `return` IS THE DEFERRAL. Do not "tidy" it into an if/else that still falls through.
      // It also drops this frame's remaining passes (Achievements.evaluate(), the heartbeat, the
      // voice drain) — deliberate, and they resume on the first unfrozen frame after dismissal: an
      // unlock raised by THIS clear would otherwise toast on top of the panel (drawToasts() draws
      // last) and still not appear IN it, since evaluate() runs after this flush either way (§0.4).
      // ⛔ `game.state === "playing"` IS NOT REDUNDANT. killShip() flips the state to "dying" MID-FRAME
      // and update() runs on to here regardless, so the player dying on the exact frame the timer
      // crosses could otherwise open a level-end panel over the death spectacle — and its dismissal
      // would then fire nextWave() at GAME OVER. On that frame this falls through to the plain
      // nextWave() below, exactly as the pre-CS030 build does.
      // waveClearTimer was zeroed at the top of this branch and update() freezes on game.celebration
      // from the very next frame, so the branch cannot be re-entered to fire a second panel on one
      // clear. resetMenuNav()/AudioSys.achievement() mirror the game-over seam's open (in
      // updateDeath()) exactly — the nav latch matters MORE here, where the player is mid-flight and
      // may well be holding the stick when the panel arrives.
      if (game.state === "playing" && game.pendingAch.length) {
        game.celebration = { items: game.pendingAch, scroll: 0, resume: "wave" };
        game.pendingAch = [];
        resetMenuNav();
        AudioSys.achievement();
        return;
      }
      nextWave();
    }
  } else {
    game.waveClearTimer = 0;
  }

  // --- Achievements: evaluate every frame (already-unlocked ones short-circuit) ---
  Achievements.evaluate();

  // --- Heartbeat ---
  const density = game.debris.length + game.hunters.length * 2;
  game.beatInterval = Math.max(0.28, 1.05 - game.wave * 0.04 - Math.max(0, (14 - density)) * 0.02);
  game.beatTimer -= dt;
  if (game.beatTimer <= 0 && !game.ship.dead && density > 0) {
    AudioSys.beat(game.beatHigh);
    game.beatHigh = !game.beatHigh;
    game.beatTimer = game.beatInterval;
  }

  // --- Voice queue drain (CS025 P4) --- LAST, deliberately: after every pass that can call say(), so
  // THIS frame's live events get first claim on an idle channel and the queue only fills the gaps they
  // leave. Draining earlier would let a waiting cargo_full take the channel and then be pre-empted by a
  // health_low raised later in the same frame — the same outcome, one wasted line. Living at the end of
  // the PLAYING body (not in loop(), not in updateDeath()) is also what makes the queue's teardown story
  // trivial — see VoiceSys.reset(). Takes no dt; it reads the audio clock.
  VoiceSys.update();
}

// ---------- Draw ----------
function drawText(str, x, y, size, color = COLOR.text, align = "center") {
  ctx.font = `${size}px monospace`;
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

// CS013 P2 (§2.2): the shared control-hint footer look — larger + higher-contrast than the old
// literal size-12/COLOR.dim footers. Centered, like every menu footer.
function drawMenuHint(text, cx, y, size = MENU_HINT_SIZE) {
  drawText(text, cx, y, size, COLOR.menuIdle, "center");
}

// CS011 P2: Dan's on-screen caption — the voice channel's visible echo (settings.captions), centered near
// the viewport bottom. In-play only (never over a menu / gameover / the title). Independent of Capture's H
// HUD toggle by design (accessibility text, not a HUD readout) — a SIBLING of drawHUD() in draw(), not
// inside it. Fades over the last CAPTION_FADE s via ctx.globalAlpha (drawText leaves globalAlpha alone).
function drawCaption() {
  if (game.state === "playing" && !game.paused && game.caption.life > 0) {
    const a = game.caption.life < CAPTION_FADE ? game.caption.life / CAPTION_FADE : 1;
    ctx.globalAlpha = a;
    drawText(game.caption.text, VIEW_W/2, VIEW_H - CAPTION_Y, CAPTION_SIZE, COLOR.text, "center");
    ctx.globalAlpha = 1;
  }
}

// CS025 P5 (gate Q6) — the large centre-screen "Level N", shown for LEVEL_BANNER_TIME at every wave
// change. A SIBLING of drawHUD() in draw(), not inside it, and NOT gated by Capture's H toggle: it is a
// transient announcement, which is the same category as the achievement toast and the game-over text, and
// CLAUDE.md's Capture note already places those outside the H toggle. (It is deliberately not treated as
// a HUD readout — there is no persistent element here for H to hide.)
// Alpha ramps symmetrically: in over the first LEVEL_BANNER_FADE seconds, out over the last, full opacity
// between. Taking the MIN of elapsed and remaining gives both ends from one expression and degenerates
// gracefully if 2*FADE ever exceeds TIME (the banner just peaks below 1 instead of glitching). Uses
// ctx.globalAlpha, which drawText leaves alone — the same mechanism as the caption's fade-out.
// CS026 P5: all four reads are DEBUG.* — levelBannerTime MUST match the value nextWave() seeded
// game.levelBanner.life with, or elapsed goes negative/jumps on a mid-level slider drag (registry comment).
// The Math.max(0, ...) guard is what makes that degrade gracefully rather than glitch.
function drawLevelBanner() {
  if (game.state === "playing" && !game.paused && game.levelBanner.life > 0) {
    const elapsed = DEBUG.levelBannerTime - game.levelBanner.life;
    const a = Math.min(1, Math.max(0, Math.min(elapsed, game.levelBanner.life)) / DEBUG.levelBannerFade);
    ctx.globalAlpha = a;
    drawText(game.levelBanner.text, VIEW_W/2, VIEW_H/2 + DEBUG.levelBannerY, DEBUG.levelBannerSize, COLOR.text, "center");
    ctx.globalAlpha = 1;
  }
}

// ---------- Pause menu / Options / Controls rendering (F8) ----------
// Screen-fixed overlays, drawn after the HUD when game.paused. A dimmed backdrop plus a
// glow-stroked panel keeps the vector aesthetic (Pillar 1). The state lives in game.menu.
function drawMenu() {
  ctx.fillStyle = "rgba(4,10,20,0.88)"; // v3.3 P1: backdrop dim raised 0.74->0.88 (look-call) so the
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);   // world recedes further behind an open menu panel.
  const s = game.menu.screen;
  if (s === "root") drawRootMenu();
  else if (s === "options") drawOptionsMenu();
  else if (s === "sound") drawSound();
  else if (s === "controls") drawControlsMenu();
  else if (s === "difficulty") drawDifficulty();
  else if (s === "achievements") drawAchievements();
  else if (s === "highscores") drawHighScores();
  else if (s === "nameentry") drawNameEntry();   // CS031 P3: the profile name grid
  else if (s === "profiles") drawProfiles();     // CS031 P4: the roster screen
  else if (s === "slots") drawSlots();           // CS032 P3: the save/load slots screen
  else if (s === "debug") drawDebug();   // CS015 P4: hidden, secret-code-only
  drawModal();  // CS016 P3: LAST, unconditionally — it must paint over whichever panel raised it
}

// CS016 P3: the confirmation dialog's render. Self-gating (no-op when no modal is open) so drawMenu()
// can call it unconditionally as its final act — a dialog is always on top of the screen that raised
// it, and ordering it last is what makes that true without a z-index concept.
//
// Width is MEASURED, never fixed (the CS015 P1 self-healing precedent that drawRootMenu set): both the
// per-consumer prompt AND the fixed hint are measured at their real render sizes and the wider one
// wins, so a longer prompt added later widens the box instead of bleeding through the border.
// menuPanel's own fill is opaque enough (0.95) to hide the panel underneath wherever they overlap, so
// no extra backdrop dim is painted here — drawMenu already laid one over the world.
function drawModal() {
  const md = game.menu.modal;
  if (!md) return;
  ctx.font = MODAL_TEXT_SIZE + "px monospace";
  const textW = Math.ceil(ctx.measureText(md.text).width);
  ctx.font = MENU_HINT_SIZE + "px monospace";
  const hintW = Math.ceil(ctx.measureText(MODAL_HINT).width);
  const w = Math.max(MODAL_MIN_W, Math.max(textW, hintW) + 2 * MODAL_MARGIN);
  const { y } = menuPanel(w, MODAL_H, MODAL_TITLE);
  drawText(md.text, VIEW_W / 2, y + MODAL_TEXT_Y, MODAL_TEXT_SIZE, COLOR.text);
  // Two rows, confirm first (index 0) and cancel second (index 1) — the same "▶ " prefix and
  // COLOR.text / COLOR.menuIdle convention every other menu list uses, so the selection reads
  // identically here. Order is fixed; it is the default INDEX (1) that keeps cancel safe.
  [md.confirmLabel, md.cancelLabel].forEach((label, i) => {
    const sel = i === md.index;
    drawText((sel ? "▶ " : "   ") + label, VIEW_W / 2, y + MODAL_ROW_Y + i * MODAL_ROW_STEP,
             MODAL_ROW_SIZE, sel ? COLOR.text : COLOR.menuIdle);
  });
  drawMenuHint(MODAL_HINT, VIEW_W / 2, y + MODAL_HINT_Y);
}

// CS016 P2 (§1.2, FORK-CS016-B → b): the title screen's own menu — the ONE menu that deliberately
// does NOT go through drawMenu(). No backdrop dim, no menuPanel box: the title art and the drifting
// titleDebris field stay fully visible, which is the whole point on the one screen whose job is to
// look good. Called from draw()'s title branch (not drawMenu's dispatch), so it can never pick up that
// function's chrome by accident. Row look reuses the established idioms exactly — the "▶ " selection
// prefix and the COLOR.text (selected) / COLOR.menuIdle (idle) convention from drawRootMenu, and the
// shared drawMenuHint() footer from CS013 P2. Every y here is a TITLE_MENU_* playtest knob.
function drawTitleMenu() {
  // CS032 P4 (spec §4.3): asked once per draw, never cached at boot — a profile switch or a profile
  // delete changes which slots exist, and the row's dim state has to follow. This is the render half
  // of the unavailable-row idiom; menuTitle's confirm branch asks the same question the same way.
  const noSaves = SaveSlots.count() === 0;
  MENU_TITLE.forEach((label, i) => {
    const sel = i === game.menu.index;
    // CS031 P5 (FORK-CS031-H → c): the Profile row IS the current profile's name display — no separate
    // line anywhere else. An empty roster (first boot, before Add Profile is ever confirmed) can't
    // actually reach this screen (see the boot routing below), but the "—" fallback keeps this render
    // honest on its own rather than assuming that invariant holds.
    const text = label === "Profile" ? "Profile: " + (Profiles.nameOf(Profiles.activeId) || "—") : label;
    // Two special-cased rows now, both keyed on the LABEL (never on an index, so reordering
    // MENU_TITLE can't shift either one onto the wrong row): "Profile" above owns the text, and
    // "Load Saved Game" owns the colour.
    const dim = label === "Load Saved Game" && noSaves;
    drawText((sel ? "▶ " : "   ") + text, VIEW_W / 2, TITLE_MENU_Y + i * TITLE_MENU_STEP,
             TITLE_MENU_SIZE, dim ? COLOR.dim : (sel ? COLOR.text : COLOR.menuIdle));
  });
  drawMenuHint(TITLE_MENU_HINT, VIEW_W / 2, TITLE_MENU_HINT_Y);
}

function menuPanel(w, h, title) {
  const x = (VIEW_W - w) / 2, y = (VIEW_H - h) / 2;
  // v3.3 P1: fill the panel before stroking it (look-call alpha) — previously only stroked, so the
  // world showed through and menu text was unreadable over a busy background.
  ctx.fillStyle = "rgba(2,6,14,0.95)";
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = COLOR.satellite; ctx.lineWidth = 2;
  ctx.shadowColor = COLOR.satellite; ctx.shadowBlur = 12;
  ctx.strokeRect(x, y, w, h);
  ctx.shadowBlur = 0;
  drawText(title, VIEW_W / 2, y + 46, 32, COLOR.text);
  return { x, y };
}

// CS013 P1: the "MENU" branch of the title ternary below, dead since CS012 P4 made the root
// play-only, is reachable again — gameover now opens this same root (rootItems() gives it the
// Play Again/Options/Quit to Title layout). Both root layouts are 3 items, so the 360x300 panel's
// row math (fixed 46px step) needs no resize for the gameover case.
function drawRootMenu() {
  const items = rootItems();
  // CS015 P1: measure the control hint at its real render size/font before sizing the panel, so a
  // future hint or font-size change self-heals instead of silently bleeding past the border again.
  ctx.font = MENU_HINT_SIZE + "px monospace";
  const w = Math.max(360, Math.ceil(ctx.measureText(ROOT_MENU_HINT).width) + 2 * ROOT_MENU_HINT_MARGIN);
  // CS016 P4: height DERIVED from items.length (same self-healing principle as the width above) rather
  // than a hardcoded 300, so the 3-row gameover root and the 4-row pause root (Save added) both fit
  // through this one function with no branch. Rows start at y+118 and step 46px apart (unchanged); the
  // hint sits 62px below the last row's baseline (extra breathing room beyond the row step), and the
  // panel keeps 28px of margin below the hint. h = 118 + (N-1)*46 + 62 + 28 reproduces the old fixed
  // 300 exactly at N=3.
  const hintY = 118 + (items.length - 1) * 46 + 62;
  const h = hintY + 28;
  const { y } = menuPanel(w, h, game.state === "playing" ? "PAUSED" : "MENU");
  items.forEach((it, i) => {
    const sel = i === game.menu.index;
    // CS032 P4: no row here is forced dim any more. The `it === "Save" ? COLOR.dim : ...` ternary
    // CS016 P4 put here is DELETED along with the row's inert dispatch — unpicking one without the
    // other is silent (the row would work and still render permanently grey), so both moved together.
    const color = sel ? COLOR.text : COLOR.menuIdle;
    drawText((sel ? "▶ " : "   ") + it, VIEW_W / 2, y + 118 + i * 46, 24, color);
  });
  drawMenuHint(ROOT_MENU_HINT, VIEW_W / 2, y + hintY);
}

// CS010 P4 (§9/§10a): a pure nav list — the value rows (volume sliders + Music Track) moved to
// drawSound() below, so this mirrors drawRootMenu's plain centered-list layout instead of the old split
// value/nav layout. CS016 P2: down to four rows (Sound / Music, Controls, Difficulty, Back) now that
// Achievements + High Scores live on the title menu. The forEach is label-driven, so the shrink needs
// no layout edit; the 600x420 panel is left as-is (it just carries more whitespace) — resizing it is a
// look call for Paul, and drawRootMenu's derived-height work is CS016 P4's scope, not this phase's.
function drawOptionsMenu() {
  const { y } = menuPanel(600, 420, "OPTIONS");
  const m = game.menu;
  MENU_OPTIONS.forEach((label, i) => {
    const sel = m.index === i;
    drawText((sel ? "▶ " : "   ") + label, VIEW_W / 2, y + 118 + i * 42, 22, sel ? COLOR.text : COLOR.menuIdle);
  });
  drawMenuHint("↑↓ move    ENTER / A select    ESC / B back", VIEW_W / 2, y + 400);
}

// Sound / Music sub-screen (CS010 P4, §9) — a relocation of the three volume sliders + Music Track
// cycler off Options, same control style. Follows drawOptionsMenu's pre-CS010-P4 value-row layout
// (left-aligned label + slider/value), dispatched off SOUND_ROWS by label, plus a centered Back row.
function drawSound() {
  const { x, y } = menuPanel(600, 602, "SOUND / MUSIC"); // CS011 P3: +92px for the Voice picker + Captions rows
  const m = game.menu;
  let cy = y + 100;
  SOUND_ROWS.forEach((label, i) => {
    if (label === "Back") return;
    const sel = m.index === i;
    drawText(label, x + 40, cy + 6, 18, sel ? COLOR.text : COLOR.menuIdle, "left");
    const vi = VOL_LABELS.indexOf(label);
    if (vi >= 0) { // volume slider
      const bx = x + 270, bw = 190, bh = 12, by = cy - 3;
      ctx.strokeStyle = sel ? COLOR.shield : COLOR.dim; ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = sel ? COLOR.shield : COLOR.dim;
      ctx.fillRect(bx + 1, by + 1, (bw - 2) * AudioSys.vol[VOL_CATS[vi]], bh - 2);
      drawText(Math.round(AudioSys.vol[VOL_CATS[vi]] * 100) + "%", bx + bw + 44, cy + 6, 16, sel ? COLOR.text : COLOR.menuIdle, "right");
      if (sel) { drawText("◄", bx - 16, cy + 7, 16, COLOR.text); drawText("►", bx + bw + 16, cy + 7, 16, COLOR.text); }
    } else { // value-column rows — a single dispatch mirroring drawDifficulty's toggle layout
      const ox = x + 270;
      let val;
      if (label === "Music Track")   val = MUSIC_TRACK_LABELS[settings.musicTrack];
      else if (label === "Voice")    val = VOICE_STYLE_LABELS[settings.voiceStyle];
      else if (label === "Captions") val = settings.captions ? "On" : "Off";
      drawText(val, ox, cy + 6, 18, sel ? COLOR.text : COLOR.menuIdle, "left");
      if (sel) { drawText("◄", ox - 20, cy + 7, 16, COLOR.text); drawText("►", ox + 150, cy + 7, 16, COLOR.text); }
    }
    cy += 46;
  });
  cy += 14;
  const backSel = m.index === SOUND_ROWS.indexOf("Back");
  drawText((backSel ? "▶ " : "   ") + "Back", VIEW_W / 2, cy + 6, 22, backSel ? COLOR.text : COLOR.menuIdle);
  drawMenuHint("↑↓ move    ◄► adjust    ENTER / A select    ESC / B back", VIEW_W / 2, y + 582);
}

// Difficulty screen renderer (v3.0 P5): two-option toggle rows + Back. The active side of each
// toggle is lit (COLOR.text), the other dim; the selected row shows the ◄► adjust chevrons. Mirrors
// the tested drawOptionsMenu pattern so it inherits the same vector-panel look.
function drawDifficulty() {
  // Panel height tracks the value-row count at 58 px per row, and the three anchors below the rows
  // (Back / help / hint) shift with it — CS012 P5 grew it 360 -> 418 for the third row, CS017 P6
  // 418 -> 476 for the fourth. CS024 P6 (spec §3.7) takes it the other way for the first time,
  // FOUR ROWS DOWN TO ONE: 476 -> 302, and Back 378 -> 204, help 422 -> 248, hint 452 -> 278 — the
  // same 58 per row, three rows' worth, applied to every anchor rather than re-eyeballed.
  const { x, y } = menuPanel(620, 302, "DIFFICULTY");
  const m = game.menu;
  // CS016 P4 (§5): mid-run, the value row renders dim regardless of focus — the shared
  // unavailable-row idiom — so a player who lands on it can still read it but sees plainly that it
  // won't respond. "back" is excluded; it stays fully live at every game.state.
  const locked = game.state === "playing";
  // Each row draws as "left | right" with the ACTIVE side lit. rightActive=true lights the right label.
  const rows = [
    { label: "Auto-shield",          left: "Off",  right: "On",     rightActive: settings.autoShield },
  ];
  rows.forEach((r, i) => {
    const sel = m.index === i, cy = y + 122 + i * 58;
    drawText(r.label, x + 40, cy + 6, 18, locked ? COLOR.dim : (sel ? COLOR.text : COLOR.menuIdle), "left");
    const ox = x + 360;
    drawText(r.left,  ox,       cy + 6, 18, locked ? COLOR.dim : (r.rightActive ? COLOR.dim : COLOR.text), "left");
    drawText("|",     ox + 74,  cy + 6, 18, COLOR.dim, "left");
    drawText(r.right, ox + 92,  cy + 6, 18, locked ? COLOR.dim : (r.rightActive ? COLOR.text : COLOR.dim), "left");
    if (sel) { drawText("◄", ox - 24, cy + 7, 16, locked ? COLOR.dim : COLOR.text); drawText("►", ox + 178, cy + 7, 16, locked ? COLOR.dim : COLOR.text); }
  });
  // Per-row help line under the rows — describes the FOCUSED row only (Back has no help line). CS016 P4:
  // while locked it's replaced by DIFFICULTY_LOCK_HELP for every value row — routed through the
  // SAME line (drawMenuHint at the same y) rather than a second help mechanism.
  // CS024 P6: the three expiry-mode help lines went with their rows, including the one INTERPOLATED
  // line (chain guard's, which read DEBUG.chainGuardTime — a knob that no longer exists).
  const HELP = [
    "Auto-raises shield at critical hull. -500 points per blocked hit.",
  ];
  // Back is the row AFTER the value rows — derived from rows.length, never a literal, so the next
  // difficulty knob is a one-line push to `rows` + `HELP` (CS015 P5's derive-the-index lesson).
  const backSel = m.index === rows.length;
  drawText((backSel ? "▶ " : "   ") + "Back", VIEW_W / 2, y + 204, 22, backSel ? COLOR.text : COLOR.menuIdle);
  if (m.index < HELP.length) drawMenuHint(locked ? DIFFICULTY_LOCK_HELP : HELP[m.index], VIEW_W / 2, y + 248);
  drawMenuHint("↑↓ move    ◄► toggle    ENTER / A select    ESC / B back", VIEW_W / 2, y + 278);
}

// Hidden Debug Options panel renderer (CS015 P4) — generic over DEBUG_ROWS, following drawSound's value-row
// layout (left-aligned label + value + ◄► chevrons on the focused row) plus a centered Back row. CS017 P2
// added one more row between the values and Back: "Dump difficulty log" — an ACTION row, rendered like Back
// (centered, ▶ marker, no value, no chevrons even when selected) rather than like a value row.
//
// CS018 P2 rebuilt the layout. The panel used to size itself to the registry (`h = 220 + (N + 1) * 46`) and
// already overflowed the viewport at 12 entries; it is now a FIXED DEBUG_PANEL_H with a SCROLLING WINDOW of
// DEBUG_ROWS_VISIBLE rows, so growing the registry never touches layout. Rows come straight off DEBUG_ROWS —
// section headers, value rows, the Dump action and Back are all just rows and all scroll together, which is
// what keeps the last row reachable at any size. A position indicator below the band shows the cursor's place
// in the whole list, with ▲/▼ when there is more above/below.
function drawDebug() {
  // CS024 P6e (spec §3): the panel must show when overrides are OFF — a title marker (visible even
  // scrolled away from the toggle row) plus, below, every non-toggle value row's readout dimmed.
  const on = overridesOn();
  const { x, y } = menuPanel(DEBUG_PANEL_W, DEBUG_PANEL_H, "DEBUG OPTIONS" + (on ? "" : "  —  OVERRIDES OFF"));
  const m = game.menu, total = DEBUG_ROWS.length;
  const top = debugScrollTop(), end = Math.min(total, top + DEBUG_ROWS_VISIBLE);
  let cy = y + DEBUG_ROWS_Y;
  for (let i = top; i < end; i++) {
    const r = DEBUG_ROWS[i], sel = m.index === i;
    if (r.kind === "header") {
      drawText("— " + r.label + " —", x + 40, cy + 6, 15, COLOR.dim, "left");   // never selectable, never a cursor
    } else if (r.kind === "var") {
      const e = r.e, ox = x + DEBUG_VALUE_X, typing = sel && debugEntryActive();
      drawText(e.label, x + 40, cy + 6, 18, sel ? COLOR.text : COLOR.menuIdle, "left");
      // While typing, the pending digits REPLACE the live value (with a caret, in the "uncommitted" tint) so
      // it is unambiguous that nothing has been written yet — and the ◄► chevrons drop, because arrows don't
      // step while an entry is pending. CS024 P6c: P5's `== null ? "auto"` branch went with the null lever
      // sentinel — every row shows a real number now, because every row's default IS one.
      // CS024 P6e: `boolLabels` is a display-only hook (currently just the override toggle) — a var
      // with it renders its shown value through the array instead of as a bare number + unit.
      const val = typing ? DebugPanel.entry + "_"
        : e.boolLabels ? e.boolLabels[debugShown[e.id]]
        : debugShown[e.id] + (e.unit ? " " + e.unit : "");
      // Every OTHER row dims its value when overrides are off — its edit is stored but not in effect.
      const dimmed = !on && e.id !== DEBUG_OVERRIDE_ID;
      drawText(val, ox, cy + 6, 18, typing ? COLOR.garbageBonus : dimmed ? COLOR.dim : sel ? COLOR.text : COLOR.menuIdle, "left");
      if (sel && !typing) { drawText("◄", ox - 24, cy + 7, 16, COLOR.text); drawText("►", ox + 120, cy + 7, 16, COLOR.text); }
    } else {   // the Dump action row and Back — centered, ▶ marker, no value, no chevrons
      drawText((sel ? "▶ " : "   ") + r.label, VIEW_W / 2, cy + 6,
               r.kind === "back" ? 22 : 18, sel ? COLOR.text : COLOR.menuIdle);
    }
    cy += DEBUG_ROW_STEP;
  }
  const more = (top > 0 ? "▲  " : "    ") + (m.index + 1) + " / " + total + (end < total ? "  ▼" : "    ");
  drawText(more, VIEW_W / 2, y + DEBUG_PANEL_H - 58, 15, COLOR.dim);
  // CS024 P1: the conditional "R reroll orbit start angles" tail is gone with the keybind it documented
  // (CS021 P3 / FLAG-CS021-c). The hint is now unconditional in the not-typing case.
  drawMenuHint(debugEntryActive()
    ? "type value    ENTER / A commit    ESC / B cancel    BKSP delete"
    : "↑↓ move    ◄► adjust    0-9 type    ENTER / A select    ESC / B back",
    VIEW_W / 2, y + DEBUG_PANEL_H - 30);
}

function drawControlsMenu() {
  const { x, y } = menuPanel(760, 512, "CONTROLS");   // +42px vs. pre-CS010 to seat the Ship Rotation slider row
  const m = game.menu;
  drawText("ACTION", x + 36, y + 88, 13, COLOR.dim, "left");
  drawText("KEYBOARD", x + 250, y + 88, 13, COLOR.dim, "left");
  drawText("GAMEPAD", x + 490, y + 88, 13, COLOR.dim, "left");
  REBINDABLE.forEach((name, r) => {
    const ry = y + 122 + r * 42;
    const rowSel = m.row === r;
    drawText(bindings[name].label, x + 36, ry, 17, rowSel ? COLOR.text : COLOR.menuIdle, "left");
    const capKb = m.rebinding && m.rebinding.action === name && m.rebinding.device === "key";
    const capGp = m.rebinding && m.rebinding.action === name && m.rebinding.device === "pad";
    drawBindCell(x + 250, ry, keyLabel(bindings[name]), rowSel && m.col === 0, capKb);
    drawBindCell(x + 490, ry, padLabel(bindings[name]), rowSel && m.col === 1, capGp);
  });
  // Ship Rotation slider (§10b): a ◄/► value row below the rebind rows. Row index derived from
  // REBINDABLE.length so it stays in lockstep with menuControls' turnRow (never hardcode it).
  const turnRow = REBINDABLE.length;
  drawTurnScaleRow(x, y + 122 + turnRow * 42, m.row === turnRow);
  const dRow = REBINDABLE.length + 1, bRow = dRow + 1;
  drawText((m.row === dRow ? "▶ " : "   ") + "Return to Defaults", VIEW_W / 2, y + 122 + dRow * 42 + 26, 20, m.row === dRow ? COLOR.text : COLOR.menuIdle);
  drawText((m.row === bRow ? "▶ " : "   ") + "Back", VIEW_W / 2, y + 122 + bRow * 42 + 26, 20, m.row === bRow ? COLOR.text : COLOR.menuIdle);
  drawMenuHint("↑↓ row    ◄► column / rotation    ENTER / A rebind    ESC / B back", VIEW_W / 2, y + 494);
}

// CS031 P3: the name-entry screen. Panel title names the mode, so a player can never be unsure whether
// they are creating or renaming. Layout is the Controls-grid family — a stroked box marks the cursor,
// selected text goes COLOR.text and everything else COLOR.menuIdle.
// Cell geometry is DERIVED from the cell list (NAME_GRID_COLS / nameRowLen), never from a typed table,
// so this render and menuNameEntry's cursor cannot disagree about which cells exist.
// Menu rects are exempt from the HUD no-fills rule (drawTurnScaleRow's precedent); these are all
// strokes anyway. The caret is a plain trailing "_" — no blink, so nothing here needs a clock.
function drawNameEntry() {
  const m = game.menu;
  const mode = m.nameCtx && m.nameCtx.mode;
  const { y } = menuPanel(NAME_PANEL_W, NAME_PANEL_H, mode === "rename" ? NAME_TITLE_RENAME : NAME_TITLE_ADD);
  const fx = VIEW_W / 2 - NAME_FIELD_W / 2, fy = y + NAME_FIELD_Y;
  ctx.strokeStyle = COLOR.shield; ctx.lineWidth = 1;
  ctx.strokeRect(fx, fy - NAME_FIELD_H + 10, NAME_FIELD_W, NAME_FIELD_H);
  drawText(m.nameBuf + "_", VIEW_W / 2, fy, NAME_FIELD_SIZE, COLOR.text);
  drawText(m.nameBuf.length + " / " + PROFILE_NAME_MAX, fx + NAME_FIELD_W + 16, fy, 14,
           m.nameBuf.length >= PROFILE_NAME_MAX ? COLOR.garbage : COLOR.dim, "left");
  if (m.nameErr) drawText(m.nameErr, VIEW_W / 2, y + NAME_ERR_Y, NAME_ERR_SIZE, COLOR.lowhp);
  const gx = VIEW_W / 2 - (NAME_GRID_COLS * NAME_CELL_W) / 2;
  NAME_CELLS.forEach((cell, i) => {
    const r = Math.floor(i / NAME_GRID_COLS), c = i % NAME_GRID_COLS;
    const cx = gx + c * NAME_CELL_W + NAME_CELL_W / 2, cy = y + NAME_GRID_Y + r * NAME_CELL_H;
    const sel = m.row === r && m.col === c;
    if (sel) {
      ctx.strokeStyle = COLOR.shield; ctx.lineWidth = 1;
      ctx.strokeRect(cx - NAME_CELL_W / 2 + 4, cy - NAME_CELL_H + 14, NAME_CELL_W - 8, NAME_CELL_H - 8);
    }
    const word = cell.length > 1 || cell === " ";   // the three verbs, plus SPACE
    drawText(nameCellLabel(cell), cx, cy, word ? NAME_VERB_SIZE : NAME_CHAR_SIZE,
             sel ? COLOR.text : COLOR.menuIdle);
  });
  drawMenuHint(NAME_HINT, VIEW_W / 2, y + NAME_PANEL_H - 34);
}

// CS031 P4: the "profiles" screen. Panel height is DERIVED from the row count (drawRootMenu's own
// shape at L9682) so PROFILE_MAX's 9 possible rows (8 profiles + Add) never need a fixed panel resize.
function drawProfiles() {
  const roster = Profiles.roster, N = profilesRowCount();
  const hintY = PROFILES_ROW_Y + (N - 1) * PROFILES_ROW_STEP + 62;
  const h = hintY + 28;
  const { y } = menuPanel(PROFILES_PANEL_W, h, PROFILES_TITLE);
  const m = game.menu;
  roster.forEach((p, i) => {
    const sel = m.index === i;
    let label = p.name + (p.id === Profiles.activeId ? "  (active)" : "");
    if (sel) label += "   ◄ " + PROFILE_VERBS[m.col] + " ►";
    drawText((sel ? "▶ " : "   ") + label, VIEW_W / 2, y + PROFILES_ROW_Y + i * PROFILES_ROW_STEP, 22,
             sel ? COLOR.text : COLOR.menuIdle);
  });
  // The render half of the shared unavailable-row idiom's canonical example (menuProfiles' cap above,
  // repointed by CS032 P4): always COLOR.dim at the cap, focused or not, so silence at confirm reads
  // as "this row does nothing" rather than "nothing happened".
  const addSel = onAddProfileRow(m);
  const addColor = roster.length >= PROFILE_MAX ? COLOR.dim : (addSel ? COLOR.text : COLOR.menuIdle);
  drawText((addSel ? "▶ " : "   ") + PROFILE_ADD_LABEL, VIEW_W / 2, y + PROFILES_ROW_Y + roster.length * PROFILES_ROW_STEP, 22, addColor);
  drawMenuHint(PROFILES_HINT, VIEW_W / 2, y + hintY);
}

// CS032 P3: the "slots" screen. Follows drawProfiles() exactly — same panel/row-step/prefix/footer
// idiom, fixed at SLOT_COUNT rows (three never scrolls, so no row-count derivation is needed here).
function drawSlots() {
  const m = game.menu, mode = m.slotMode;
  const hintY = SLOTS_ROW_Y + (SLOT_COUNT - 1) * SLOTS_ROW_STEP + 62;
  const h = hintY + 28;
  const { y } = menuPanel(SLOTS_PANEL_W, h, mode === "load" ? SLOTS_TITLE_LOAD : SLOTS_TITLE_SAVE);
  const slots = SaveSlots.read();
  slots.forEach((entry, i) => {
    const state = slotRowState(entry);
    const sel = m.index === i;
    // Unavailable-row idiom (drawProfiles' "Add Profile" at the cap): dim and inert only
    // where the row-state table (spec P3) says so — an empty or unreadable row in LOAD mode. Every row
    // is live in SAVE mode; there is no cap here.
    const dim = mode === "load" && state !== "occupied";
    const color = dim ? COLOR.dim : (sel ? COLOR.text : COLOR.menuIdle);
    drawText((sel ? "▶ " : "   ") + (i + 1) + ".  " + slotLabel(entry, state),
             VIEW_W / 2, y + SLOTS_ROW_Y + i * SLOTS_ROW_STEP, 22, color);
  });
  if (m.slotMsg) drawText(m.slotMsg, VIEW_W / 2, y + hintY - 30, 16, COLOR.lowhp);
  drawMenuHint(SLOTS_HINT, VIEW_W / 2, y + hintY);
}

// One slider row for the ship-rotation preference on the Controls screen (§10b). Readout is a
// PERCENTAGE (the raw rad/s means nothing to a player). A gold tick marks the 100% default so "home"
// is visible WITHOUT moving the slider; the fill + readout also go gold and gain a "(default)" tag
// when the value sits exactly on 100%. Menu rects are exempt from the HUD no-fills rule — this mirrors
// the volume slider in drawOptionsMenu.
function drawTurnScaleRow(x, ry, sel) {
  drawText("Ship Rotation", x + 36, ry, 17, sel ? COLOR.text : COLOR.menuIdle, "left");
  const bx = x + 250, bw = 200, bh = 12, by = ry - 11;
  const span = SHIP_TURN_SCALE_MAX - SHIP_TURN_SCALE_MIN;
  const frac = (settings.shipTurnScale - SHIP_TURN_SCALE_MIN) / span;
  const atDefault = Math.abs(settings.shipTurnScale - SHIP_TURN_SCALE_DEFAULT) < 1e-6;
  ctx.strokeStyle = sel ? COLOR.shield : COLOR.dim; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = atDefault ? COLOR.ach : (sel ? COLOR.shield : COLOR.dim);
  ctx.fillRect(bx + 1, by + 1, (bw - 2) * frac, bh - 2);
  const tx = bx + bw * ((SHIP_TURN_SCALE_DEFAULT - SHIP_TURN_SCALE_MIN) / span);  // 100% tick — always drawn
  ctx.strokeStyle = COLOR.ach; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(tx, by - 4); ctx.lineTo(tx, by + bh + 4); ctx.stroke();
  const pct = Math.round(settings.shipTurnScale * 100) + "%";
  drawText(atDefault ? pct + "  (default)" : pct, bx + bw + 30, ry, 16, atDefault ? COLOR.ach : (sel ? COLOR.text : COLOR.menuIdle), "left");
  if (sel) { drawText("◄", bx - 20, ry + 1, 16, COLOR.text); drawText("►", bx + bw + 8, ry + 1, 16, COLOR.text); }
}

// One binding cell on the Controls screen. Highlights when selected; shows "press…" while capturing.
function drawBindCell(cx, cy, text, sel, capturing) {
  if (sel) {
    ctx.strokeStyle = capturing ? COLOR.garbage : COLOR.shield; ctx.lineWidth = 1;
    ctx.strokeRect(cx - 6, cy - 15, 200, 24);
  }
  const label = capturing ? "press…" : (text || "—");
  drawText(label, cx, cy, 15, capturing ? COLOR.garbage : (sel ? COLOR.text : COLOR.menuIdle), "left");
}

// Format the current bindings for display.
function keyLabel(b) {
  return (b.keys && b.keys.length ? b.keys.map(prettyKey).join(" / ") : "—");
}
function prettyKey(k) {
  const map = { "arrowleft": "←", "arrowright": "→", "arrowup": "↑", "arrowdown": "↓", " ": "SPACE", "shift": "SHIFT", "enter": "ENTER", "escape": "ESC" };
  return map[k] || k.toUpperCase();
}
function padLabel(b) {
  const parts = (b.buttons || []).map(i => GP_NAME[i] || ("BTN" + i));
  if (b.axis) parts.push(axisLabel(b.axis));
  return parts.length ? parts.join(" / ") : "—";
}
function axisLabel(a) {
  if (a.index === GP.AXIS_LX) return a.dir < 0 ? "L-Stick ←" : "L-Stick →";
  if (a.index === GP.AXIS_LY) return a.dir < 0 ? "L-Stick ↑" : "L-Stick ↓";
  return "Axis " + a.index;
}

// ---------- Achievements viewer + unlock toasts (F9; ×1.5 + scroll CS013 P3; 2-tab since CS016 P5) ----------
// Read-only list reachable from the title menu -> Achievements. CS016 P5 replaced the old three
// 350px-wide columns (weekly | lifetime | lifetime-cont.) with TWO TABS — Weekly and Lifetime —
// showing one pool at a time down a SINGLE full-width column, each row with unlock status + a
// progress readout. That resolves CS013 P3's own complaint that colW=350 was marginal for a long
// description at ACH_SCALE 1.5: the column is now ACH_COL_W (1140) wide, better than 3x the room.
// Screen-fixed, drawn by drawMenu.
//
// CS013 P3: geometry hoisted to top-level consts (rather than locals inside drawAchievements) so
// achMaxScroll() — called from menuAchievements(), which has no drawing context — derives the exact
// same numbers drawAchievements() renders with. Panel position is deterministic (VIEW_W/H and the
// panel's own w/h are fixed), so this is safe without re-invoking menuPanel() (which has fill/stroke/
// text side effects and can't be called twice per frame).
const ACH_PANEL_W = 1200, ACH_PANEL_H = 660;
const ACH_PANEL_X = (VIEW_W - ACH_PANEL_W) / 2;      // CS016 P5: the x sibling of ACH_PANEL_Y (menuPanel's own maths)
const ACH_PANEL_Y = (VIEW_H - ACH_PANEL_H) / 2;
const ACH_COL_X = ACH_PANEL_X + 30;                  // CS016 P5: the single column's left edge (the old xL)
const ACH_COL_W = ACH_PANEL_W - 60;                  // CS016 P5: full panel width less a 30px gutter each side
const ACH_TAB_Y = 108;                               // tab-header baseline, relative to the panel top (the old column-header y)
const ACH_TAB_STEP = 260;                            // px between tab labels — playtest knob
// CS026 P6 (gate Q8.1): the selected tab wears a mark as well as the lit colour. Paul's report was that
// brightness alone did not read as "this one is selected", and named the glyph. ADDITIVE — the existing
// COLOR.text/COLOR.menuIdle split is untouched, so the mark is a second cue, not a replacement.
const ACH_TAB_MARK = " ▼";
// CS026 P6 (gate Q8.2): +130 -> +152. Row 0's name baseline sat 22px under the tab baseline, which at
// 15*ACH_SCALE (22.5px) type is roughly zero air — Paul's "there is no whitespace above the title".
const ACH_ROW0_Y = ACH_PANEL_Y + 152;                // first row baseline
// CS026 P6 (gate Q8.4): 24 -> 0. The status rejoins the NAME's baseline, which is what lets the leader
// run below connect the two horizontally. CS015 P2 split them onto separate lines to stop a long name
// and a long status colliding in the middle at ACH_SCALE 1.5; the leader restores that protection
// differently — the run is what's squeezed as the pair widens, and it vanishes entirely before they
// touch (see achLeader's ACH_LEADER_MIN bail).
const ACH_STATUS_DY = 0;                             // status sits on the row's name baseline
// CS026 P6 (gate Q8.3): 46 -> 30. Paul's "too much vertical space beneath the name and the description".
const ACH_DESC_DY = 30;                              // description line's y-offset below the row's name baseline
const ACH_ROW_STEP = 48 * ACH_SCALE;                 // row-to-row baseline spacing (was 40*ACH_SCALE pre-CS015-P2; three stacked lines need more headroom)
const ACH_ROW_CLIP_TOP = ACH_ROW0_Y - 16;             // headroom above row 0, below the tab header (baseline y+ACH_TAB_Y)
const ACH_ROW_CLIP_BOTTOM = ACH_PANEL_Y + 620;        // headroom above the footer (drawn at ACH_PANEL_Y+644)
const ACH_ROW_VISIBLE_H = ACH_ROW_CLIP_BOTTOM - ACH_ROW_CLIP_TOP;
// CS026 P6 (gate Q8.4): the dotted leader run that ties a row's name (left) to its status (right).
// Paul's report was that ACH_COL_W's 1140px of clear air between the two made it hard to tell which
// status belonged to which achievement, and he first suggested an alternating row background. That
// would have been a FILL, i.e. a THIRD named GDD §3.2 exception; shown the trade, he chose the leader.
// ⛔ THE LEADER IS drawText — the already-sanctioned fillText path — so the exception count stays at
// TWO (the death flash and the low-health corner glow). Do not "improve" this into a rule/rect.
const ACH_LEADER_DOT  = "·";                         // the run's glyph
const ACH_LEADER_SIZE = 10 * ACH_SCALE;              // smaller than the name: a connector, not a column
const ACH_LEADER_PAD  = 12;                          // px of clear air at each end, off name and status
const ACH_LEADER_MIN  = 24;                          // px: a span shorter than this draws nothing at all
const ACH_LEADER_MAX  = 200;                         // hard cap on dots — see the guard in achLeader()

// CS016 P5: the two tabs are DATA. `rows` is a thunk, not a snapshot — activeWeekly() re-derives from
// the live weekly rotation every frame, and a test that swaps Achievements.LIFETIME still sees the swap.
// achTabIndex()/achRows()/achMaxScroll()/drawAchievements() all read this one table, so a third tab
// would be one more entry here and no new branch anywhere.
const ACH_TABS = [
  { id: ACH_TAB_DEFAULT, label: "WEEKLY",   rows: () => Achievements.activeWeekly() },
  { id: "lifetime",      label: "LIFETIME", rows: () => Achievements.LIFETIME }
];
// Resolves game.menu.achTab to a table position, defaulting to tab 0 for any unknown/undefined id —
// so a stale or missing field degrades to "show Weekly", never to a crash or a blank screen.
function achTabIndex() {
  const i = ACH_TABS.findIndex(t => t.id === game.menu.achTab);
  return i < 0 ? 0 : i;
}
function achRows() { return ACH_TABS[achTabIndex()].rows(); }
// Switching tabs ALWAYS zeroes the scroll: the two tabs are very different heights (5 weekly rows vs.
// 20 lifetime ones), so carrying a Lifetime offset onto the Weekly tab would open it scrolled into
// empty space. `i` wraps in both directions (see menuAchievements).
function setAchTab(i) {
  const n = ACH_TABS.length;
  game.menu.achTab = ACH_TABS[((i % n) + n) % n].id;
  game.menu.scroll = 0;
  AudioSys.ui(false);
}

// Derives maxScroll from the ACTIVE TAB's ACTUAL row count (not a hardcoded pixel total), so a future
// LIFETIME/weekly resize — or a third tab — keeps working. CS016 P5 made this tab-aware: pre-P5 it took
// the tallest of three columns (max(weekly, ceil(LIFETIME/2))); now each tab is its own single column,
