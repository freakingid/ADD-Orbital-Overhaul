      harmLevel.gain.value = LOWHP_GAIN_MIN * LOWHP_HARMONIC_GAIN_FRAC;
      lfo.type = "sine"; lfo.frequency.value = LOWHP_PULSE_RATE_MIN;
      lfoGain.gain.value = LOWHP_PULSE_DEPTH;
      pulseGain.gain.value = LOWHP_PULSE_DEPTH;      // DC offset; lfo swings it ~0..2*depth (~0..1)
      lfo.connect(lfoGain).connect(pulseGain.gain);
      root.connect(rootLevel).connect(pulseGain);
      harm.connect(harmLevel).connect(pulseGain);
      pulseGain.connect(this.sfx);
      root.start(); harm.start(); lfo.start();
      this.lowhpOsc = { root, harm, lfo };
      this.lowhpGain = { rootLevel, harmLevel, pulseGain, lfoGain };
      this.lowhpT = null;   // forces lowhpSet's next call to actually ramp (idempotency guard)
    } else if (!on && this.lowhpOsc) {
      this.lowhpOsc.root.stop(); this.lowhpOsc.harm.stop(); this.lowhpOsc.lfo.stop();
      this.lowhpOsc = null; this.lowhpGain = null; this.lowhpT = null;
    }
  },

  // v3.5 P3: per-frame HP-urgency scaling for the live low-health voice. t = 1 - hp/LOW_HP_THRESHOLD
  // (0 at the threshold, ~1 near death) — called every frame the state is engaged from update()'s
  // single edge-detect site, right alongside the lowhp(true)/(false) calls. Safe no-op when the
  // voice isn't live or ctx is null. Idempotent on t (same idiom as MusicSys.setDuck/setIntensity)
  // so a steady-HP frame doesn't reschedule a ramp. Moves params via linearRampToValueAtTime, never
  // a bare per-frame .value set — that zippers.
  lowhpSet(t) {
    if (!this.ctx || !this.lowhpOsc) return;
    t = Math.max(0, Math.min(1, t || 0));
    if (t === this.lowhpT) return;
    this.lowhpT = t;
    const now = this.now();
    const rate = lowhpPulseRate(t);   // CS010 P3: the shared rate formula — same one game.lowHpPhase reads, so siren + hull ring + glow can't drift
    const gain = LOWHP_GAIN_MIN + (LOWHP_GAIN_MAX - LOWHP_GAIN_MIN) * t;
    const ramp = (param, target) => {
      param.cancelScheduledValues(now);
      param.setValueAtTime(param.value, now);
      param.linearRampToValueAtTime(target, now + LOWHP_PARAM_RAMP);
    };
    ramp(this.lowhpOsc.lfo.frequency, rate);
    ramp(this.lowhpGain.rootLevel.gain, gain);
    ramp(this.lowhpGain.harmLevel.gain, gain * LOWHP_HARMONIC_GAIN_FRAC);
  },

  pickup() {
    if (!this.ctx) return;
    const t = this.now();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(620, t + 0.08);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g).connect(this.sfx);
    o.start(t); o.stop(t + 0.13);
  },

  deliver(count) { // pitch climbs with each canister in a delivery run
    if (!this.ctx) return;
    const t = this.now();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.value = 440 * Math.pow(1.06, Math.min(count, 20));
    g.gain.setValueAtTime(0.13, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g).connect(this.sfx);
    o.start(t); o.stop(t + 0.16);
  },

  hit() { // ship takes hull damage — a low, heavy descending thud (distinct from fire)
    if (!this.ctx) return;
    const t = this.now();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(200, t);
    o.frequency.exponentialRampToValueAtTime(55, t + 0.18);
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g).connect(this.sfx);
    o.start(t); o.stop(t + 0.23);
  },

  powerup() { // collected a powerup — a bright two-note rising "power on" chime (distinct from pickup)
    if (!this.ctx) return;
    const t = this.now();
    [660, 990].forEach((f, i) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(f, t + i * 0.07);
      const g0 = 0.12;
      g.gain.setValueAtTime(g0, t + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.07 + 0.14);
      o.connect(g).connect(this.sfx);
      o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.15);
    });
  },

  ui(up) { // short menu blip (F8): up=true = confirm/select (higher), false = move/back/adjust (lower)
    if (!this.ctx) return;
    const t = this.now();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "square";
    o.frequency.value = up ? 560 : 320;
    g.gain.setValueAtTime(0.07, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g).connect(this.sfx);
    o.start(t); o.stop(t + 0.07);
  },

  achievement() { // an achievement unlocked — a short rising three-note fanfare (distinct from powerup)
    if (!this.ctx) return;
    const t = this.now();
    [523, 659, 784].forEach((f, i) => { // C5 - E5 - G5 major triad
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(f, t + i * 0.09);
      g.gain.setValueAtTime(0.11, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.2);
      o.connect(g).connect(this.sfx);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.22);
    });
  },

  hunterborn() { // a Hunter coalesced from neglected scrap — a low, ominous descending two-tone with
    if (!this.ctx) return;                      // slight dissonance (~a tritone), darker/longer than explosion
    const t = this.now();
    [[196, 138], [139, 98]].forEach(([f0, f1]) => { // two sawtooth voices a dissonant ~√2 apart, both falling
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + 0.4);
      g.gain.setValueAtTime(0.13, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
      o.connect(g).connect(this.sfx);
      o.start(t); o.stop(t + 0.43);
    });
  },

  scooploss() { // a scoop level lost to damage — a short, deflating downward blip (distinct from hit/pickup)
    if (!this.ctx) return;
    const t = this.now();
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.18);
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g).connect(this.sfx);
    o.start(t); o.stop(t + 0.21);
  },

  secretArm() { // CS015 P4: the debug secret code armed a capture window — 3 quick ASCENDING blips
    if (!this.ctx) return;
    const t = this.now();
    [440, 587, 784].forEach((f, i) => { // A4 - D5 - G5, rising
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(f, t + i * 0.06);
      g.gain.setValueAtTime(0.05, t + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.05);
      o.connect(g).connect(this.sfx);
      o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.06);
    });
  },

  secretDisarm() { // CS015 P4: the debug secret-code window timed out / was cancelled — the same 3 blips DESCENDING
    if (!this.ctx) return;
    const t = this.now();
    [784, 587, 440].forEach((f, i) => { // G5 - D5 - A4, falling
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(f, t + i * 0.06);
      g.gain.setValueAtTime(0.05, t + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.05);
      o.connect(g).connect(this.sfx);
      o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.06);
    });
  }
};

// ---------- Music (Web Audio synth, lookahead scheduler) ----------
// MusicSys lives ALONGSIDE AudioSys, not inside it: AudioSys is a flat bag of one-shot voices; music
// needs a per-frame lookahead scheduler and a track graph, which would pollute that bag. All music
// output routes into AudioSys.music (the GainNode AudioSys.init() already built and wired to master),
// so the existing Options "Music Volume" slider governs the whole system with no new plumbing.
//
// Signal path:  note gain envelopes -> [per-state trackGain, crossfaded] -> MusicSys.duck -> AudioSys.music
//
// Tracks are DATA (step-sequencer tables — see buildBeaconTitle / MUSIC_TRACKS), never code. The
// scheduler consumes a generic { stepDur, steps, layers:[{type,gain,steps:[cell|null]}] } shape, so
// v3.4 P7 can add the three gameplay tracks as more tables without touching a line of the scheduler.
const MUSIC_LOOKAHEAD = 0.2;   // s — each frame, schedule any note starting within this window
const MUSIC_CROSSFADE = 0.6;   // s — track-to-track fade on setState()
const MUSIC_FADE_OUT  = 1.0;   // s — fade to silence at game over (§9c look-call: quiet beat)
const MUSIC_DUCK_GAIN = 0.5;   // menu-open music level (§9 ducking spec: 50%)
const MUSIC_DUCK_RAMP = 0.15;  // s — click-free duck ramp (linearRampToValueAtTime, not a bare set)

// v3.4 P7: intensity layer gating. Layer 1 (foundation) is tier-less — always on. Layers 2-4 gate
// on the SHIPPED musicIntensity(game.wave) curve (§9b; difficultyFactor before CS024 P4's rename) —
// no second curve invented. Each gate is a
// persistent per-layer GainNode (built in MusicSys.setState, ramped in MusicSys.setIntensity), so a
// layer thickens the SAME loop rather than swapping to a different one.
const MUSIC_LAYER_THRESHOLD = { 2: 0.20, 3: 0.45, 4: 0.70 };
const MUSIC_LAYER_CROSSFADE = 1.5; // s — layer thicken/thin ramp when intensity crosses a threshold

const MUSIC_A4 = 440;
const mfreq = m => MUSIC_A4 * Math.pow(2, (m - 69) / 12); // equal-tempered MIDI note -> Hz

// v3.5: the five shipping tracks, ported verbatim from tools/music-lab.html's PORT-ME BLOCK B — the
// design instrument where they were composed and auditioned. Do not re-tune here; music-lab is the
// source of truth for the note data. Shared step-table helpers (mk/put/hit) also come from BLOCK B.
// THE FREEZE (v3.5): no track carries a `tier` field. Every setState() gate is therefore built at
// (layer.tier || 1) === 1 (always on), and setIntensity() skips every tier-1 gate — so the
// difficulty-gated intensity layering shipped in v3.4 P7 goes DORMANT with no code change. This is
// deliberate: the composed tiers 2-4 were auditioned and rejected. The machinery stays in place —
// re-arming it later means adding tier fields to track data and nothing else.
const mk  = n => new Array(n).fill(null);
const put = (a, s, m, d, g) => { if (s < a.length) a[s] = { f: mfreq(m), dur: d, g: g == null ? 1 : g }; };
const hit = (a, s, d, g) => { if (s < a.length) a[s] = { f: 0, dur: d, g: g == null ? 1 : g }; };

/* --- TITLE: BEACON — Drift's engine, turned hopeful. C major, and the melody itself
       lands the Lydian #4 (F♯5) over a C pedal in bar 6 — the "departure" lift, with no fanfare
       and no drums. 4 layers. 88 BPM, 21.8 s. */
function buildBeaconTitle() {
  const BARS = 8, SPB = 16, STEPS = BARS * SPB, stepDur = 0.17;
  const sub = mk(STEPS), pad = mk(STEPS), org = mk(STEPS), lead = mk(STEPS);
  const CH  = [[48,64],[43,59],[45,60],[41,57],[48,64],[48,66],[41,57],[43,59]];  // C G Am F C D/C F G
  const ARP = [[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69],
               [60,64,67,72],[62,66,69,74],[57,60,65,69],[59,62,67,71]];
  for (let b = 0; b < BARS; b++) {
    const s0 = b * SPB, r = CH[b][0], t3 = CH[b][1], a = ARP[b];
    put(sub, s0, r - 12, 16, 1.0);
    put(pad, s0, t3, 16, 0.9);
    for (let i = 0; i < SPB; i++) put(org, s0 + i, a[i % 4], 1, i % 4 === 0 ? 0.95 : 0.6);
  }
  for (const [s, m, d] of [[0,72,10],[16,74,10],[32,76,10],[48,77,12],[64,79,10],[80,78,12],[96,76,10],[112,72,14]])
    put(lead, s, m, d, 0.95);
  return { stepDur, steps: STEPS, layers: [
    { name:"arp",  type:"square",   cutoff:800, cutoffTo:2800, cutoffTime:0.09, q:4, gain:0.042, atk:0.006, rel:0.09, steps:org },
    { name:"sub",  type:"sawtooth", cutoff:300, gain:0.066, atk:0.6, rel:1.2, steps:sub },
    { name:"pad",  type:"sawtooth", cutoff:900, cutoffTo:1900, detune:10, gain:0.050, atk:1.0, rel:1.4, steps:pad },
    { name:"lead", type:"triangle", detune:6, gain:0.074, atk:0.30, rel:0.9, steps:lead },
  ]};
}

/* --- ZEN (approved @w1) — the old title track's A-aeolian arc at 0.25 s resolution, with the
       subdued percussion. Shimmer / counter / sparkle deleted. 48 s. */
function buildZenTrack() {
  const BLOCKS = 6, SPB = 32, STEPS = BLOCKS * SPB, stepDur = 0.25;
  const bass = mk(STEPS), padLo = mk(STEPS), padMid = mk(STEPS),
        kick = mk(STEPS), shk = mk(STEPS), lead = mk(STEPS);
  const roots = [45, 41, 48, 43, 50, 40];
  roots.forEach((r, b) => {
    const s0 = b * SPB;
    put(bass, s0, r - 12, 32, 1.0);
    put(padLo, s0, r, 16, 1.0); put(padLo, s0 + 16, r, 16, 0.8);
    put(padMid, s0, r + 7, 32, 0.9);
    for (let bar = 0; bar < 4; bar++) {
      const t0 = s0 + bar * 8;
      put(kick, t0, 38, 2, bar % 2 === 0 ? 0.9 : 0.65);
      hit(shk, t0 + 4, 1, 0.5);
      for (const s of [2, 6]) hit(shk, t0 + s, 1, b < 3 ? 0.26 : 0.38);
    }
  });
  for (const [s, m, d] of [[104,76,10],[120,72,10],[132,81,14],[164,79,10],[180,84,12]]) put(lead, s, m, d, 1.0);
  return { stepDur, steps: STEPS, layers: [
    { name:"bass",   type:"sine",     cutoff:220, gain:0.090, atk:1.2, rel:2.0, steps:bass },
    { name:"padLo",  type:"triangle", cutoff:900, detune:7, gain:0.050, atk:0.6, rel:1.6, steps:padLo },
    { name:"padMid", type:"triangle", cutoff:900, detune:7, gain:0.045, atk:0.8, rel:1.8, steps:padMid },
    { name:"kick",   type:"triangle", drop:10, dropTime:0.07, gain:0.055, atk:0.004, rel:0.30, steps:kick },
    { name:"shaker", noise:true, hp:5200, gain:0.011, atk:0.002, rel:0.07, steps:shk },
    { name:"lead",   type:"triangle", gain:0.055, atk:0.4, rel:1.2, steps:lead },
  ]};
}

/* --- DERELICT (approved @w1) — hum, two chromatic-mediant pads, a distant ping. No beat, no
       noise bed. Am → Fm → D♭m → Am. 24 s. */
function buildDerelictTrack() {
  const BLOCKS = 4, SPB = 15, STEPS = BLOCKS * SPB, stepDur = 0.4;
  const hum = mk(STEPS), pR = mk(STEPS), p3 = mk(STEPS), ping = mk(STEPS);
  const CH = [[45,48],[41,44],[37,40],[45,48]];
  CH.forEach((c, b) => {
    const s0 = b * SPB, r = c[0], t3 = c[1];
    put(hum, s0, r - 24, 15, 1.0);
    put(pR, s0, r, 10, 1.0);  put(pR, s0 + 8, r, 9, 0.8);
    put(p3, s0 + 2, t3, 10, 0.85); put(p3, s0 + 9, t3, 8, 0.7);
  });
  for (const [s, m] of [[4,84],[12,79],[19,88],[28,81],[37,86],[46,79],[52,91],[58,84]]) put(ping, s, m, 4, 0.75);
  return { stepDur, steps: STEPS, layers: [
    { name:"hum",      type:"sawtooth", cutoff:240, cutoffTo:340, detune:13, gain:0.070, atk:1.6, rel:2.2, steps:hum },
    { name:"padRoot",  type:"sawtooth", cutoff:700, cutoffTo:1500, detune:12, gain:0.052, atk:1.6, rel:2.2, steps:pR },
    { name:"padThird", type:"sawtooth", cutoff:700, cutoffTo:1500, detune:12, gain:0.044, atk:1.8, rel:2.2, steps:p3 },
    { name:"ping",     type:"triangle", gain:0.048, atk:0.02, rel:1.6, steps:ping },
  ]};
}

/* --- DRIFT (approved @w2; B-section added CS010 P6) — organ pulse, sub, pad, hymn lead. No
       percussion. 88 BPM. 16 bars now, A→B: bars 0-7 are the original Am F C G Am F Dm E; bars
       8-15 are a brighter C-major turn (C G Am Em F C Dm E) with the arp an octave up and a fuller
       lead — the chorus lift, resolving on E back into the A section. 43.5 s. */
function buildDriftTrack() {
  const BARS = 16, SPB = 16, STEPS = BARS * SPB, stepDur = 0.17;
  const sub = mk(STEPS), pad = mk(STEPS), org = mk(STEPS), lead = mk(STEPS);
  const CH  = [[45,60],[41,57],[48,55],[43,59],[45,60],[41,57],[38,57],[40,56],   // A: Am F C G Am F Dm E
               [48,64],[43,62],[45,64],[40,59],[41,60],[48,64],[38,57],[40,56]];  // B: C G Am Em F C Dm E
  const ARP = [[57,60,64,69],[53,57,60,65],[55,60,64,67],[55,59,62,67],           // A arp
               [57,60,64,69],[53,57,60,65],[57,62,65,69],[56,59,64,68],
               [60,64,67,72],[55,59,62,67],[57,60,64,69],[52,55,59,64],           // B arp — an octave up
               [53,57,60,65],[60,64,67,72],[50,53,57,62],[52,56,59,64]];
  for (let b = 0; b < BARS; b++) {
    const s0 = b * SPB, r = CH[b][0], t3 = CH[b][1], a = ARP[b];
    put(sub, s0, r - 12, 16, 1.0);
    put(pad, s0, t3, 16, 0.9);
    for (let i = 0; i < SPB; i++) put(org, s0 + i, a[i % 4], 1, i % 4 === 0 ? 0.95 : 0.62);
  }
  // A: the original hymn (bars 0-7). B: a fuller melodic hook rising to C6 in bar 13, then resolving.
  for (const [s, m, d] of [[0,69,10],[16,77,10],[32,76,10],[48,74,12],[64,81,10],[80,84,10],[96,83,10],[112,79,14],
                           [128,72,8],[136,76,8],[144,79,10],[160,81,8],[168,79,8],[176,76,10],
                           [192,77,8],[200,81,8],[208,84,12],[224,81,10],[240,80,8],[248,76,10]])
    put(lead, s, m, d, 0.95);
  return { stepDur, steps: STEPS, layers: [
    { name:"organ", type:"square",   cutoff:600, cutoffTo:2200, cutoffTime:0.09, q:5, gain:0.045, atk:0.006, rel:0.09, steps:org },
    { name:"sub",   type:"sawtooth", cutoff:280, gain:0.070, atk:0.6, rel:1.2, steps:sub },
    { name:"pad",   type:"sawtooth", cutoff:800, cutoffTo:1600, detune:11, gain:0.048, atk:1.0, rel:1.4, steps:pad },
    { name:"lead",  type:"triangle", detune:6, gain:0.072, atk:0.35, rel:0.9, steps:lead },
  ]};
}

/* --- WAREHOUSE (approved @w2; B-section added CS010 P6) — kick, melodic bass, 16th hat, two
       7th-chord stabs, and now a HOOK. 125 BPM. 16 bars, an 8-bar Am7 Dm7 Fmaj7 G vamp played
       twice: bars 0-7 are groove only (A), bars 8-15 add the sawtooth-pluck hook riff (B). The hook
       was cut from the round-2 track for being too present as a *constant* element — which is exactly
       what makes it a chorus payload. It sits on the offbeats (steps 2/6/10/14) so it never collides
       with kick/bass/hat/stabs and never lifts the per-step node count. 30.7 s. */
function buildWarehouseTrack() {
  const BARS = 16, SPB = 16, STEPS = BARS * SPB, stepDur = 0.12;
  const kick = mk(STEPS), hat = mk(STEPS), bass = mk(STEPS), stA = mk(STEPS), stB = mk(STEPS), hook = mk(STEPS);
  const CH = [[45,60,64],[45,60,64],[38,60,65],[38,60,65],[41,60,64],[41,60,64],[43,59,62],[43,59,62]]; // Am7 Dm7 Fmaj7 G
  const WALK = [0, 0, 12, 0, 7, 0, 12, 3];
  for (let b = 0; b < BARS; b++) {
    const s0 = b * SPB, c = CH[b % 8], r = c[0];
    for (const s of [0, 4, 8, 12]) put(kick, s0 + s, 50, 1, 1.0);
    for (let i = 1; i < SPB; i += 2) hit(hat, s0 + i, 1, i % 4 === 3 ? 0.8 : 0.42);
    for (let i = 0; i < 8; i++) put(bass, s0 + i * 2 + 1, r + WALK[i], 1, i % 2 === 0 ? 0.95 : 0.75);
    for (const s of [3, 7, 11, 15]) { put(stA, s0 + s, c[1], 1, 0.9); put(stB, s0 + s, c[2], 1, 0.8); }
  }
  // The restored hook — B section only (bars 8-15). Per-bar offbeat riff, lifting to C6 in bar 12.
  const HOOK_BARS = [
    [[2,69],[6,72],[10,76],[14,72]],   // Am7
    [[2,74],[6,72],[10,69]],           // Am7
    [[2,74],[6,77],[10,81],[14,77]],   // Dm7
    [[2,76],[6,74],[10,69]],           // Dm7
    [[2,72],[6,77],[10,81],[14,84]],   // Fmaj7 — lift
    [[2,81],[6,77],[10,72]],           // Fmaj7
    [[2,74],[6,79],[10,83],[14,79]],   // G
    [[2,74],[6,71],[10,67]],           // G — descend, resolve to A
  ];
  for (let b = 0; b < 8; b++) {
    const s0 = (8 + b) * SPB;
    for (const [s, m] of HOOK_BARS[b]) put(hook, s0 + s, m, 2, 0.85);
  }
  return { stepDur, steps: STEPS, layers: [
    { name:"kick",  type:"triangle", drop:14, dropTime:0.05, gain:0.125, atk:0.002, rel:0.16, steps:kick },
    { name:"bass",  type:"sawtooth", cutoff:480, cutoffTo:850, cutoffTime:0.06, q:3, gain:0.075, atk:0.006, rel:0.10, steps:bass },
    { name:"hat",   noise:true, hp:8500, gain:0.018, atk:0.001, rel:0.03, steps:hat },
    { name:"stabA", type:"sawtooth", cutoff:2600, cutoffTo:900, cutoffTime:0.10, q:5, gain:0.042, atk:0.004, rel:0.13, steps:stA },
    { name:"stabB", type:"sawtooth", cutoff:2600, cutoffTo:900, cutoffTime:0.10, q:5, gain:0.038, atk:0.004, rel:0.13, steps:stB },
    { name:"hook",  type:"sawtooth", cutoff:1200, cutoffTo:2800, cutoffTime:0.05, q:4, gain:0.052, atk:0.004, rel:0.13, steps:hook },
  ]};
}

/* --- HIGH SCORE: FANFARE (CS010 P7) — the celebration cue for the High Scores screen. Bright C
       major, an anthemic I–V–vi–IV lifted upward: a 16th bell arpeggio, a soft four-on-the-floor
       kick, a light shaker, and a triumphant triangle lead that climbs to E6 at the peak and
       resolves back into C. Plays ONLY while the High Scores screen is open — musicStateFor()
       returns "highscore" there; it is CONTEXTUAL like `title`, not a value of settings.musicTrack,
       so it is absent from MUSIC_TRACK_VALUES. 100 BPM. 8 bars, 19.2 s. */
function buildHighScoreTrack() {
  const BARS = 8, SPB = 16, STEPS = BARS * SPB, stepDur = 0.15;
  const sub = mk(STEPS), pad = mk(STEPS), bell = mk(STEPS), lead = mk(STEPS), kick = mk(STEPS), shk = mk(STEPS);
  const CH  = [[48,64],[43,59],[45,60],[41,57],[48,64],[43,62],[41,57],[43,59]]; // C G Am F C G F G
  const ARP = [[60,64,67,72],[59,62,67,71],[57,60,64,69],[60,65,69,72],
               [60,64,67,72],[62,67,71,74],[60,65,69,72],[59,62,67,71]];
  for (let b = 0; b < BARS; b++) {
    const s0 = b * SPB, r = CH[b][0], t3 = CH[b][1], a = ARP[b];
    put(sub, s0, r - 12, 16, 1.0);
    put(pad, s0, t3, 16, 0.9);
    for (let i = 0; i < SPB; i++) put(bell, s0 + i, a[i % 4], 1, i % 4 === 0 ? 0.95 : 0.6);
    for (const s of [0, 4, 8, 12]) put(kick, s0 + s, 48, 1, s === 0 ? 1.0 : 0.8);
    for (const s of [2, 6, 10, 14]) hit(shk, s0 + s, 1, 0.4);
  }
  // The fanfare lead — every onset sits OFF the bar downbeat (steps ≡ 2 or 10 mod 16), so it never
  // stacks with sub+pad+kick; the loop's worst-case per-step node count stays on the downbeat (12).
  for (const [s, m, d] of [[2,76,6],[10,79,6],[18,81,8],[26,79,6],[34,84,10],[50,81,8],
                           [66,79,8],[74,83,8],[82,88,12],[98,84,8],[106,81,8],[114,79,8],[122,76,10]])
    put(lead, s, m, d, 0.95);
  return { stepDur, steps: STEPS, layers: [
    { name:"bell", type:"square",   cutoff:900, cutoffTo:3200, cutoffTime:0.08, q:4, gain:0.040, atk:0.005, rel:0.10, steps:bell },
    { name:"sub",  type:"sawtooth", cutoff:320, gain:0.068, atk:0.4, rel:1.0, steps:sub },
    { name:"pad",  type:"sawtooth", cutoff:1000, cutoffTo:2000, detune:11, gain:0.048, atk:0.5, rel:1.2, steps:pad },
    { name:"lead", type:"triangle", detune:7, gain:0.078, atk:0.02, rel:0.8, steps:lead },
    { name:"kick", type:"triangle", drop:12, dropTime:0.06, gain:0.070, atk:0.003, rel:0.22, steps:kick },
    { name:"shk",  noise:true, hp:6000, gain:0.014, atk:0.002, rel:0.06, steps:shk },
  ]};
}

// State -> track. "off" (game over) is silence. No track carries tiers (v3.5 freeze — every layer is
// always on). The four gameplay tracks are keyed by NAME (not "play") so musicStateFor() can route
// settings.musicTrack straight through, and switching tracks becomes a normal setState() crossfade
// for free — no separate track-switch code path. `title` and `highscore` are CONTEXTUAL — what
// musicStateFor() returns on the title / High Scores screens respectively — not values of
// settings.musicTrack; the four gameplay names in between are.
const MUSIC_TRACKS = {
  title:     buildBeaconTitle(),
  zen:       buildZenTrack(),
  derelict:  buildDerelictTrack(),
  drift:     buildDriftTrack(),
  warehouse: buildWarehouseTrack(),
  highscore: buildHighScoreTrack(),   // CS010 P7: celebration cue, High Scores screen only (contextual)
  off:       null,   // game over / silence
};

const MusicSys = {
  duck: null,          // GainNode: track graph -> AudioSys.music; menu ducking rides on its .gain
  trackGain: null,     // GainNode for the currently-scheduled track; replaced (crossfaded) on setState
  state: "off",        // current logical state: "title" | "play" | "off"
  track: null,         // the active step table (MUSIC_TRACKS[state]) or null for silent states
  step: 0,             // scheduler cursor into track.steps
  nextStepTime: 0,     // absolute ctx time of the next step to schedule (never in the past)
  ducked: false,       // last duck target applied — makes setDuck() idempotent under per-frame calls
  intensity: 0,        // 0..1 — musicIntensity(game.wave), recomputed only on wave change (v3.4 P7)
  layerGates: null,    // v3.4 P7: [{node, tier, target}] parallel to this.track.layers, or null
  noiseBuf: null,      // v3.5: lazily-built 2s mono white-noise buffer, cached for the `noise:true` layer field

  // Lazily build the duck node once the audio graph exists (first user gesture). AudioSys.music is
  // created in AudioSys.init(); until then every entry point below no-ops via the ctx guard.
  ensureGraph() {
    if (this.duck || !AudioSys.ctx || !AudioSys.music) return;
    this.duck = AudioSys.ctx.createGain();
    this.duck.gain.value = this.ducked ? MUSIC_DUCK_GAIN : 1.0; // honour a duck requested before the graph existed
    this.duck.connect(AudioSys.music);
  },

  // Menu ducking (§9): 0.5 while any pause-menu screen is open, 1.0 otherwise. Called every frame
  // with menuActive(), so it must be idempotent — only ramp when the target actually flips.
  setDuck(on) {
    on = !!on;
    if (on === this.ducked) return;
    if (!AudioSys.ctx) { this.ducked = on; return; } // no graph yet — remember it; ensureGraph honours it later
    this.ensureGraph();          // build the duck node at the CURRENT level first, so the change below is a ramp
    this.ducked = on;
    if (!this.duck) return;
    const t = AudioSys.ctx.currentTime, target = on ? MUSIC_DUCK_GAIN : 1.0;
    this.duck.gain.cancelScheduledValues(t);
    this.duck.gain.setValueAtTime(this.duck.gain.value, t);
    this.duck.gain.linearRampToValueAtTime(target, t + MUSIC_DUCK_RAMP); // RAMP, never a bare .value set
  },

  // v3.4 P7: gameplay-track intensity 0..1 (musicIntensity(game.wave)). Called ONLY from nextWave()
  // — never per-frame, so this stays cheap and the per-frame update() path stays clean. Layer 1
  // (tier-less / foundation) is always on and skipped here. Layers 2-4 compare f against their
  // MUSIC_LAYER_THRESHOLD and ramp their persistent gate node toward 0/1 over MUSIC_LAYER_CROSSFADE
  // — a RAMP, never a bare set, so a threshold crossing never pops. Idempotent: a gate only ramps
  // when its target actually flips, same idiom as setDuck().
  setIntensity(f) {
    f = Math.max(0, Math.min(1, f || 0));
    this.intensity = f;
    if (!AudioSys.ctx || !this.layerGates) return;
    const t = AudioSys.ctx.currentTime;
    for (const lg of this.layerGates) {
      if (lg.tier === 1) continue;
      const target = f >= MUSIC_LAYER_THRESHOLD[lg.tier] ? 1 : 0;
      if (target === lg.target) continue;
      lg.target = target;
      lg.node.gain.cancelScheduledValues(t);
      lg.node.gain.setValueAtTime(lg.node.gain.value, t);
      lg.node.gain.linearRampToValueAtTime(target, t + MUSIC_LAYER_CROSSFADE);
    }
  },

  // Crossfade to a new state's track. Fades out + retires the previous track's gain (so already-
  // scheduled notes ring out and nothing new feeds it), and starts a fresh gain ramping up for the
  // new track. "off" (game over) leaves trackGain null so the scheduler idles.
  setState(s) {
    if (!AudioSys.ctx) return;
    this.ensureGraph();
    if (s === this.state) return;
    const ctx = AudioSys.ctx, t = ctx.currentTime;
    if (this.trackGain) {                         // fade out and abandon the old track
      const g = this.trackGain, fade = (s === "off") ? MUSIC_FADE_OUT : MUSIC_CROSSFADE;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + fade);
      this.trackGain = null;
    }
    this.state = s;
    this.track = MUSIC_TRACKS[s] || null;
    this.step = 0;
    this.layerGates = null;
    if (this.track && this.duck) {
      this.nextStepTime = t;                      // start scheduling from now — never in the past
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(1, t + MUSIC_CROSSFADE);
      g.connect(this.duck);
      this.trackGain = g;
      // v3.4 P7: one persistent gate GainNode per layer, initialized straight to its target for the
      // CURRENT intensity (no ramp needed here — the track-level crossfade above already handles
      // fading this whole track in). Later intensity changes ramp these individually via setIntensity.
      this.layerGates = this.track.layers.map(layer => {
        const tier = layer.tier || 1;
        const node = ctx.createGain();
        const target = tier === 1 ? 1 : (this.intensity >= MUSIC_LAYER_THRESHOLD[tier] ? 1 : 0);
        node.gain.value = target;
        node.connect(g);
        return { node, tier, target };
      });
    }
  },

  // The lookahead scheduler: once per frame, schedule every step whose start time falls within the
  // next MUSIC_LOOKAHEAD window. Web Audio timing only — never setTimeout/setInterval for notes.
  update() {
    if (!AudioSys.ctx) return;
    this.ensureGraph();
    if (!this.track || !this.trackGain) return;
    const ctx = AudioSys.ctx, horizon = ctx.currentTime + MUSIC_LOOKAHEAD;
    let guard = 1024;                             // bound catch-up after a long stall (never dump the loop)
    while (this.nextStepTime < horizon && guard-- > 0) {
      this.scheduleStep(this.step, this.nextStepTime);
      this.nextStepTime += this.track.stepDur;
      this.step = (this.step + 1) % this.track.steps;
    }
  },

  scheduleStep(step, tStep) {
    const t = Math.max(tStep, AudioSys.ctx.currentTime); // clamp: a stalled frame must not schedule into the past
    const layers = this.track.layers;
    // Every layer is scheduled unconditionally, regardless of intensity — gating is a downstream
    // GAIN gate (this.layerGates), not a scheduling omission. This is what keeps a layer's note
    // timing/pitch identical across the whole intensity range (§9b: the track thickens, never swaps).
    for (let i = 0; i < layers.length; i++) {
      const cell = layers[i].steps[step];
      if (cell) this.playNote(layers[i], cell, t, i);
    }
  },

  // Lazily build a cached 2s mono white-noise buffer, the same idiom as ensureGraph() lazily
  // building the duck node. Only touched by the `noise:true` layer field (v3.5 — no shipped
  // layer sets it yet, so this branch is currently unreachable in the live tracks).
  ensureNoiseBuf() {
    if (this.noiseBuf || !AudioSys.ctx) return;
    const ctx = AudioSys.ctx, n = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
  },

  playNote(layer, cell, t, layerIndex) {
    const ctx = AudioSys.ctx, dur = cell.dur * this.track.stepDur;
    const peak = (cell.g == null ? 1 : cell.g) * layer.gain;
    const atk = Math.min(layer.atk == null ? 0.4 : layer.atk, dur * 0.5);
    const rel = Math.min(layer.rel == null ? 0.5 : layer.rel, dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + atk);
    g.gain.setValueAtTime(peak, t + Math.max(atk, dur - rel));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let sink = g;
    if (layer.cutoff) {
      const f = ctx.createBiquadFilter();
      f.type = "lowpass";
      f.Q.value = layer.q || 1;
      f.frequency.setValueAtTime(layer.cutoff, t);
      if (layer.cutoffTo)
        f.frequency.exponentialRampToValueAtTime(layer.cutoffTo, t + Math.min(layer.cutoffTime || dur, dur));
      f.connect(sink); sink = f;
    }
    if (layer.hp) {
      const f = ctx.createBiquadFilter();
      f.type = "highpass"; f.frequency.value = layer.hp;
      f.connect(sink); sink = f;
    }
    if (layer.noise) {
      this.ensureNoiseBuf();
      const s = ctx.createBufferSource();
      s.buffer = this.noiseBuf; s.connect(sink);
      s.start(t); s.stop(t + dur + 0.05);
    } else {
      const freqs = layer.detune ? [cell.f, cell.f * Math.pow(2, layer.detune / 1200)] : [cell.f];
      for (const fr of freqs) {
        const o = ctx.createOscillator();
        o.type = layer.type; o.frequency.setValueAtTime(fr, t);
        if (layer.drop)
          o.frequency.exponentialRampToValueAtTime(Math.max(24, fr * Math.pow(2, -layer.drop / 12)),
                                                   t + (layer.dropTime || 0.06));
        o.connect(sink); o.start(t); o.stop(t + dur + 0.1);
      }
    }
    g.connect(this.layerGates[layerIndex].node); // v3.4 P7: through this layer's intensity gate
  },
};

// ---------- Voice (Dan — Klatt-style formant synth, CS010 P9) ----------
// Ported from tools/voice-lab.html (FLAG-11a signed off). The ACOUSTIC ENGINE below (PH table,
// parsePhonTokens / buildUtterance / buildPitch, and VoiceSys._schedule's scheduler) is PORT-ME BLOCK A,
// VERBATIM — same standing rule as MusicSys/music-lab: audition in the lab, port the engine unchanged.
// The lab's g2p text→ARPAbet authoring layer (WORDS dictionary + rule guesser) is DELIBERATELY not
// ported: it only derives phon strings from typed text, and every shipping line's phon is already
// baked into VOICE_LINES below — so g2p is dead code here. It stays in the lab, which is where a NEW
// line's phon is composed before its {text,phon} pair is pasted into VOICE_LINES (a one-line data edit).
//
// PH — ARPAbet phoneme table. Classes: v vowel, g glide/liquid, n nasal, f fricative, p stop,
//   a affricate, h aspirate. f:[F1,F2,F3] Hz; stops/frics carry LOCUS targets (the b/d/g cue).

  R:{c:"g",f:[420,1300,1600],d:75}, L:{c:"g",f:[360,1300,2700],d:70},
  M:{c:"n",f:[250,950,2200],d:70},  N:{c:"n",f:[250,1650,2600],d:70},
  NG:{c:"n",f:[250,2000,2600],d:85},
  S:{c:"f",f:[320,1700,2600],fric:{cf:5800,q:0.9,g:0.55},d:110},

  F:{c:"f",f:[340,1100,2400],fric:{cf:1400,q:0.25,g:0.13},d:95},

// Utterance compiler — PURE (no Web Audio): phoneme string -> {segs, frics, asps, pitch, dur}.
function parsePhonTokens(str) {
  const toks = [], errs = [];
  for (const t of String(str).trim().split(/\s+/)) {
    if (!t || t === "/") continue;
    if (t === "," || t === ".") { toks.push({ pause: t }); continue; }
    const m = t.match(/^([A-Z]+)([012])?$/);
    const ph = m && PH[m[1]];
    if (!ph) { errs.push(t); continue; }
    toks.push({ base: m[1], ph, stress: m[2] === "1" });
  }
  return { toks, errs };
}

function buildUtterance(phonStr, P) {
  const { toks, errs } = parsePhonTokens(phonStr);
  const segs = [], frics = [], asps = [];
  const rate = P.rate, cd = P.consDur;
  const scaleF = f => [f[0] * P.f1Scale, f[1] * P.f2Scale, f[2] * P.f3Scale];
  // lookahead: next token with formant targets — for HH borrowing and the velar F2 locus
  const nextF = i => {
    for (let k = i + 1; k < toks.length; k++) {
      const p = toks[k].ph;
      if (p && p.f && "vgn".includes(p.c)) return p.f;
    }
    return [500, 1500, 2500];
  };
  let t = 0.06, voiceDelay = 0;
  for (let i = 0; i < toks.length; i++) {
    const tk = toks[i];
    if (tk.pause) {
      const d = (tk.pause === "," ? 0.16 : 0.30) / rate;
      segs.push({ t0: t, dur: d, label: tk.pause, F: null, amp: 0 });
      t += d; voiceDelay = 0; continue;
    }
    const ph = tk.ph, cls = ph.c;
    if (cls === "v" || cls === "g" || cls === "n") {
      let d = ph.d / 1000 * (tk.stress ? 1.28 : 1) / rate;
      if (cls === "v") {          // phrase-final lengthening
        let fin = true;
        for (let k = i + 1; k < toks.length; k++) {
          if (toks[k].pause) break;
          if (toks[k].ph && toks[k].ph.c === "v") { fin = false; break; }
        }
        if (fin) d *= 1.18;
      }
      segs.push({ t0: t, dur: d, label: tk.base + (tk.stress ? "1" : ""),
        F: scaleF(ph.f), F2nd: ph.f2nd ? scaleF(ph.f2nd) : null,
        amp: cls === "v" ? 1 : cls === "g" ? 0.85 : 0.6,
        hiDamp: cls === "n" ? 0.35 : 1, trans: 0.05,
        voiceDelay, stress: !!tk.stress, vowel: cls === "v" });
      t += d; voiceDelay = 0;
    } else if (cls === "f") {
      const d = ph.d / 1000 * cd / rate;
      segs.push({ t0: t, dur: d, label: tk.base, F: scaleF(ph.f), amp: ph.v || 0, trans: 0.04, voiceDelay });
      frics.push({ t, dur: d, cf: ph.fric.cf, q: ph.fric.q, g: ph.fric.g * P.fricGain, burst: false });
      t += d; voiceDelay = 0;
    } else if (cls === "h") {
      const d = ph.d / 1000 * cd / rate;
      segs.push({ t0: t, dur: d, label: tk.base, F: scaleF(nextF(i)), amp: 0, trans: 0.05 });
      asps.push({ t, dur: d, g: 0.5 });
      t += d; voiceDelay = 0;
    } else if (cls === "p") {
      const clo = ph.clo / 1000 * cd / rate;
      const F = ph.f.slice();
      if (ph.velar) F[1] = nextF(i)[1] > 1400 ? 2300 : 1300;   // front vs back velar locus
      segs.push({ t0: t, dur: clo, label: tk.base, F: scaleF(F), amp: ph.v || 0, trans: 0.035, voiceDelay });
      t += clo;
      frics.push({ t, dur: 0.018, cf: ph.burst.cf, q: ph.burst.q, g: ph.burst.g * P.burstGain, burst: true });
      if (ph.asp) {               // VOT: aspiration, and the next vowel's voicing onset waits
        const ad = ph.asp / 1000 * cd / rate;
        asps.push({ t: t + 0.008, dur: ad, g: 0.45 });
        voiceDelay = ad * 0.75;
      } else voiceDelay = 0.01;
    } else if (cls === "a") {     // affricate: closure + frication tail
      const clo = ph.clo / 1000 * cd / rate, fd = ph.fdur / 1000 * cd / rate;
      segs.push({ t0: t, dur: clo, label: tk.base, F: scaleF(ph.f), amp: ph.v ? 0.12 : 0, trans: 0.035, voiceDelay });
      t += clo;
      segs.push({ t0: t, dur: fd, label: "", F: scaleF(ph.f), amp: ph.v || 0, trans: 0.03 });
      frics.push({ t, dur: fd, cf: ph.fric.cf, q: ph.fric.q, g: ph.fric.g * P.fricGain, burst: false });
      t += fd; voiceDelay = 0;
    }
  }
  const dur = t + 0.12;
  return { segs, frics, asps, dur, errs, pitch: buildPitch(segs, dur, P) };
}

// F0 contour: declination + accents on stressed vowels + a phrase-final fall.
function buildPitch(segs, dur, P) {
  const base = P.basePitch, pts = [];
  if (P.contour === "flat") return [[0, base], [dur, base]];
  const lively = P.contour === "lively";
  const dS = base * (lively ? 1.06 : 1.10), dE = base * (lively ? 1.00 : 0.92);
  const baseAt = tt => dS + (dE - dS) * (tt / dur);
  const accent = Math.pow(2, (P.pitchRange * (lively ? 1.4 : 1)) / 12);
  pts.push([0, baseAt(0)]);
  for (const s of segs) {
    if (!s.stress || !s.vowel) continue;
    const pk = s.t0 + s.dur * 0.35;
    pts.push([pk - 0.09, baseAt(pk - 0.09)], [pk, baseAt(pk) * accent], [pk + 0.13, baseAt(pk + 0.13)]);
  }
  const fallT = Math.max(0, dur - 0.20);
  pts.push([fallT, baseAt(fallT)], [dur, base * Math.pow(2, -P.finalFall / 12)]);
  pts.sort((a, b) => a[0] - b[0]);
  const out = []; let last = -1;
  for (const p of pts) { if (p[0] - last < 0.03) continue; out.push([Math.max(0, p[0]), Math.max(40, p[1])]); last = p[0]; }
  return out;
}

// Pure: n -> word tokens ("twenty-three" -> ["twenty","three"]). n < 20 is a single ones/teens
// word; otherwise a tens word plus an ones word only if there's a remainder.
function numberToWords(n) {
  if (n < 20) return [numberToWords.ONES[n]];
  const tens = numberToWords.TENS[(n / 10) | 0];
  const ones = n % 10;
  return ones ? [tens, numberToWords.ONES[ones]] : [tens];
}
numberToWords.ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight",
  "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen",
  "eighteen", "nineteen"];
numberToWords.TENS = [null, null, "twenty", "thirty", "forty", "fifty", "sixty", "seventy",
  "eighty", "ninety"];

// Pure: n -> full phon string for "Level n". n <= 99 speaks natural words; n >= 100 falls back
// to digit-by-digit (no "level two hundred" composition — out of scope, see phase doc FLAG).
function levelPhon(n) {
  if (n <= 99) return LEVEL_PHON + " / " + numberToWords(n).map(w => NUM_PHON[w]).join(" / ");
  return LEVEL_PHON + " / " + String(n).split("").map(d => NUM_PHON[DIGIT_WORD[d]]).join(" / ");
}

// a lower one that is currently playing; an equal/lower one is DROPPED (never queued — a queue would have

// post-line VOICE_COOLDOWN gap (an anti-chatter aesthetic these three lines are not subject to).

// CS025 P4 — re-validation at DRAIN time: each predicate is its own trigger's condition RESTATED, so a
